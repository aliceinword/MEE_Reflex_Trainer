    <line x1="-112" y1="-46" x2="-26" y2="-62" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
    <line x1="-112" y1="-14" x2="-26" y2="-30" stroke="#BFDBFE" stroke-width="7" stroke-linecap="round"/>
