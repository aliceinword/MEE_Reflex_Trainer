<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 515 200" width="100%" preserveAspectRatio="xMinYMid meet" style="display:block" role="img" aria-label="Bar Prep">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4E89"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Emblem badge -->
  <rect x="24" y="40" width="120" height="120" rx="26" fill="url(#badge)"/>
  <rect x="24" y="40" width="120" height="120" rx="26" fill="none" stroke="#C9A84C" stroke-width="3"/>

  <!-- Open book -->
  <g transform="translate(84,100)">
    <path d="M0 -24 C 8 -32 30 -32 44 -22 L 44 24 C 30 14 8 14 0 22 C -8 14 -30 14 -44 24 L -44 -22 C -30 -32 -8 -32 0 -24 Z"
          fill="#ffffff" opacity="0.96"/>
    <line x1="0" y1="-24" x2="0" y2="22" stroke="#C9A84C" stroke-width="3"/>
    <line x1="-34" y1="-14" x2="-8" y2="-19" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-34" y1="-4" x2="-8" y2="-9" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-34" y1="6" x2="-8" y2="1" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-19" x2="34" y2="-14" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-9" x2="34" y2="-4" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="1" x2="34" y2="6" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="176" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">
    <tspan fill="url(#ink)">BAR</tspan><tspan fill="#0D9488"> PREP</tspan>
  </text>
  <rect x="178" y="134" width="300" height="5" rx="2.5" fill="#C9A84C"/>
</svg>
