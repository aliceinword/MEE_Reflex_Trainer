disclosure =/= subject-matter waiver. 502(a) needs INTENTIONAL.","options":[{"t":"There was no waiver of the attorney-client privilege, because the disclosure to the woman was inadvertent.","ok":false,"trap":false,"why":""},{"t":"There was a waiver of the attorney-client privilege regarding only the two disclosed documents.","ok":true,"trap":false,"why":"Under Federal Rule Evidence (FRE) 502(a), a waiver of privilege extends to an undisclosed communication or information only if the waiver is intentional; the disclosed or undisclosed communications or information concern the same subject matter; and they ought in fairness be considered together. Here, because the disclosure was inadvertent and not intentional, the waiver does not extend to the undisclosed communications."},{"t":"There was a waiver of the attorney-client privilege regarding the disclosed documents as well as the other 23 documents, because they all relate to the same subject matter.","ok":false,"trap":false,"why":""},{"t":"There was a waiver of the attorney-client privilege for all 25 documents if the state law that supplies the rule of decision would support such a result.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"An accidental disclosure doesn't waive privilege over everything on the topic; only an intentional disclosure triggers broad subject-matter waiver.","source":"adaptibar_import_filled.csv"},{"id":"CSV012","subj":"Real Property","sub":"Rights in Land","title":"Should the court grant the injunction?","scenario":"A mother subdivided vacant land that she owned into three lots. She kept one lot for herself, conveyed another to her daughter, and conveyed the remaining lot to her son. Each conveyance was by a deed of gift containing a covenant specifying that only one single-story home could be constructed on the conveyed lot in order to preserve views of a nearby lake from the mother's lot. The deeds were promptly recorded. The mother then constructed a large threestory house on her lot. Several years later, the son conveyed his vacant lot to a purchaser using a warranty deed that made no mention of the covenant in the previous deed from the mother. The purchaser promptly recorded her deed. When the purchaser later began constructing a three-story house similar to the mother's, the mother sued to enjoin the construction.","q":"Should the court grant the injunction?","ru":"Recorded servitude = constructive notice. Actual notice not required.","options":[{"t":"No, because the mother is estopped from enforcing the covenant, since she herself constructed a three-story house.","ok":false,"trap":false,"why":""},{"t":"No, because there was no consideration given for the covenants in the deeds of gift.","ok":false,"trap":false,"why":""},{"t":"Yes, because the burden of the covenant runs with the land even if the purchaser had no actual notice of the covenant.","ok":true,"trap":false,"why":"An equitable servitude is a promise concerning the use of land that benefits and burdens the original parties to the promise, as well as their successors. The mother created an equitable servitude when she conveyed the third lot to her son. The burden was on the son's lot (to build only a one-story house), and the benefit was on the mother's retained lot (to preserve her view of the lake). Here, the equitable servitude was in writing and was recorded, providing constructive notice; actual notice was not required to bind the purchaser."},{"t":"Yes, because the mother is in privity of contract with the purchaser.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A recorded use-restriction binds later buyers even if they never read it; recording IS the notice.","source":"adaptibar_import_filled.csv"},{"id":"CSV013","subj":"Civil Procedure","sub":"Jurisdiction and Venue","title":"Was removal proper?","scenario":"A plaintiff, a citizen of State A, sued a defendant, a citizen of State B, in a state court in State B. The complaint asserted a $120,000 claim under state law. Fifty days after service of the complaint, the plaintiff amended the complaint, adding a second defendant, a citizen of State C. The amended complaint asserted the $120,000 state-law claim and a related federal-law claim against both defendants. Twenty-five days after service of the amended complaint, the second defendant removed the action to a federal court in State B with the first defendant's consent.","q":"Was removal proper?","ru":"Forum-defendant rule applies to diversity-ONLY cases. Fed Q present -> still removable.","options":[{"t":"No, because the first defendant was a citizen of the forum state.","ok":false,"trap":false,"why":""},{"t":"No, because the notice of removal was untimely.","ok":false,"trap":false,"why":""},{"t":"Yes, because the amended complaint asserted a claim under federal law.","ok":true,"trap":false,"why":"An action is removable if it could originally have been filed in federal court. Here, the amended complaint contained a claim that qualified for federal-question jurisdiction. Although there was also diversity jurisdiction, removal was not barred by the forum-defendant rule, which provides that a suit that is removable solely on the basis of diversity may not be removed if any of the parties in interest, properly joined and served, is a citizen of the state in which such action is brought. That rule bars removal only when diversity is the sole basis for federal jurisdiction, unlike in this case."},{"t":"Yes, because the parties met the requirements for diversity jurisdiction.","ok":false,"trap":true,"why":"Although the parties met the requirements for diversity jurisdiction in this case, the presence of a defendant from the forum state could potentially have prevented removal because the forum-defendant rule applies when federal jurisdiction is based solely on diversity. However, the federal law claim here meant that subject-matter jurisdiction was based on more than just diversity."}],"_b":true,"plain":"A forum defendant only blocks removal when diversity is the ONLY basis; a federal-question claim makes the case removable anyway.","source":"adaptibar_import_filled.csv"},{"id":"CSV014","subj":"Criminal Law","sub":"Other Crimes","title":"Can the woman properly be convicted of attempting to receive stolen property?","scenario":"A woman agreed to purchase 1,000 tablets of a prescription drug from undercover narcotics agents. The agents told the woman that they would steal the drugs from a pharmacy. The next day, the agents met the woman and told her that they had the tablets in a bag. The bag did in fact contain tablets of the drug, but the agents had not stolen the tablets. The woman paid the agents. She told them that she did not want to take possession of the bag and that instead they should deliver it to her friend waiting in a car across the street. The agents, after delivering the bag to the woman's friend, arrested both the woman and her friend.","q":"Can the woman properly be convicted of attempting to receive stolen property?","ru":"Attempt = specific intent + substantial step. Impossibility is no defense.","options":[{"t":"No, because the agents entrapped the woman.","ok":false,"trap":false,"why":""},{"t":"No, because the drugs were not stolen property.","ok":false,"trap":false,"why":""},{"t":"No, because the woman never attempted to possess the drugs.","ok":false,"trap":false,"why":""},{"t":"Yes.","ok":true,"trap":false,"why":"A criminal attempt is an act that, although done with the intention of committing a crime, falls short of completing the crime. An attempt consists of two elements: (1) a specific intent to commit the crime, and (2) an overt act in furtherance of that intent. Based on the facts presented, a reasonable jury could find that the woman intended to possess stolen drugs and that she took substantial steps to complete that offense."}],"_b":true,"plain":"She meant to receive stolen goods and took real steps toward it, so it's attempt even though the deal didn't complete.","source":"adaptibar_import_filled.csv"},{"id":"CSV015","subj":"Contracts","sub":"Defenses to Enforceability","title":"What would be the wife's strongest argument for rescinding the contract?","scenario":"A husband and wife and their four children lived on a farm that the wife had inherited from her father. On numerous occasions, the wife's brother had offered to buy the farm from her, but she had always refused. The husband died suddenly in an accident. The day after the husband's funeral, the brother and his attorney visited the wife at the farm. The brother again told the wife that he wanted to buy the farm and told her that she would need the proceeds of the sale to support her children. The brother also said that his attorney had drafted an offer to purchase the farm and that the wife needed to sign it right away. The attorney confirmed the need to accept quickly. The wife reluctantly signed the offer and sold the farm to the brother for its fair market value. A few days after the sale, the wife learned that her husband had a life insurance policy that would provide her with a substantial payout and that she had not needed to sell the farm to support her children.","q":"What would be the wife's strongest argument for rescinding the contract?","ru":"Confidential relationship + over-persuasion (pressure/odd time/many persuaders) = undue influence.","options":[{"t":"Duress.","ok":false,"trap":false,"why":""},{"t":"Mistake.","ok":false,"trap":false,"why":""},{"t":"Unconscionability.","ok":false,"trap":false,"why":""},{"t":"Undue influence.","ok":true,"trap":false,"why":"Undue influence, or \"over-persuasion,\" often includes factors such as the existence of a confidential relationship, unusual time and place for the persuasion, multiple persuaders, and time pressure. Here, the facts presented demonstrate all of these factors."}],"_b":true,"plain":"A trusted relationship plus high-pressure over-persuasion at an odd time, by multiple people, is undue influence.","source":"adaptibar_import_filled.csv"},{"id":"CSV016","subj":"Constitutional Law","sub":"Judicial Review","title":"How should the court handle this case?","scenario":"A federal agency solicited bids to build a bridge on an interstate highway. In evaluating the bids, the agency took into account the cost of the bridge and other specified factors. A construction company submitted a bid that was lowest in cost, but the agency chose another bidder that offered more advantages on the other factors. The company that submitted the lowest bid sued the federal agency in federal district court. The only relief that the company sought was to enjoin the issuance of a contract to the prevailing bidder. The company was unable to obtain a temporary restraining order or preliminary injunction. The agency awarded the contract to the bidder it had originally selected. Just as the new bridge was completed and opened, the suit came to trial.","q":"How should the court handle this case?","ru":"Requested relief now impossible = MOOT. Screen justiciability before merits.","options":[{"t":"Award the company the amount of its lost profits.","ok":false,"trap":false,"why":""},{"t":"Dismiss the suit, because it is now moot.","ok":true,"trap":false,"why":"The only relief sought by the company was an injunction against awarding the contract to another bidder. During the pretrial period, the contract was awarded to the other bidder and the bridge was completed and opened. Thus, the only relief sought by the company is no longer available and the case is moot. See Alvarez v. Smith, 558 U.S. 87 (2009); De Funis v. Odegaard, 416 U.S. 312 (1974)."},{"t":"Dismiss the suit, because it turns on discretionary decisions of federal officials.","ok":false,"trap":true,"why":"Discretionary decisions of federal officials are not necessarily immune from review by the courts."},{"t":"Hear and determine the case on the merits.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Once the contract was awarded and the bridge built, an injunction can't help anyone, so the case is moot.","source":"adaptibar_import_filled.csv"},{"id":"CSV017","subj":"Evidence","sub":"Relevancy and Excluding Relevant Evidence","title":"Should the court allow the plaintiff's expert to testify at trial?","scenario":"A plaintiff who lives near a factory has sued the company that owns it, alleging that a toxin released from the factory caused the plaintiff to suffer a respiratory disease. The company contends that only a small amount of the toxin was released for a brief period, and that in any event the toxin is not known to cause any respiratory disease. The plaintiff has not disputed the minimal amount and brief length of the exposure. At trial, the plaintiff seeks to call an expert who will testify that in her opinion the toxin released from the factory caused the plaintiff's respiratory disease. The company has objected to the admission of the expert's testimony. At a pretrial hearing to determine the admissibility of the expert's testimony, the expert testified that she based her opinion on several studies provided by the plaintiff's attorney about another substance that is similar to the toxin at issue. These studies show that prolonged exposure to high doses of the similar substance can cause the respiratory disease that the plaintiff suffers from. On cross-examination, the company's attorney elicits from the expert an admission that she did not consider, in forming her opinion, two recent clinical studies, both of which concluded that there was no connection between the toxin at issue and any respiratory disease.","q":"Should the court allow the plaintiff's expert to testify at trial?","ru":"Expert basis must FIT these facts — wrong toxin/dose = unreliable, out under 702.","options":[{"t":"No, because the expert is relying on studies that she read for purposes of preparing her testimony in this litigation.","ok":false,"trap":false,"why":""},{"t":"No, because the plaintiff has failed to show by a preponderance of the evidence that the expert based her opinion on sufficient facts and data and that she employed a reliable methodology.","ok":true,"trap":false,"why":"Under Federal Rule of Evidence (FRE) 702, an expert's opinion must be based on sufficient facts and data, and the expert must employ a reliable methodology. Here, the expert failed to satisfy those standards. The plaintiff was exposed briefly to small doses of the particular toxin in question. The expert, however, relied on studies that showed the effects of prolonged exposure to high doses of a different toxin and failed to consider recent studies about the toxin in question."},{"t":"Yes, because the company has not met its burden of showing that the expert's opinion is unreliable.","ok":false,"trap":false,"why":""},{"t":"Yes, because the sufficiency of an expert's basis for an opinion and the reliability of an expert's methodology are questions of weight for the jury.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The expert leaned on studies about a different toxin at a different dose, so the opinion doesn't fit these facts and is unreliable.","source":"adaptibar_import_filled.csv"},{"id":"CSV018","subj":"Torts","sub":"Negligence","title":"If the friend sues to recover for her injury, who is likely to be found liable to her?","scenario":"A homeowner hired a building contractor to rebuild her front porch. The contractor told her that he planned to first rip out the old floorboards and pile them in the front yard. Because she thought that would look unsightly, the homeowner insisted that the contractor loosen each board individually and leave them all in place until he was ready to start replacing them with new boards. The contractor loosened the boards and left them in place while he went out for lunch. While the contractor was away, a friend of the homeowner's stepped onto the porch to return a borrowed rake. As the friend crossed the porch, the loosened boards shifted and the friend fell, breaking her leg.","q":"If the friend sues to recover for her injury, who is likely to be found liable to her?","ru":"Hire an IC = no vicarious liability, UNLESS you directed the dangerous manner.","options":[{"t":"Both the contractor and the homeowner, because neither posted a warning that the porch boards had been loosened.","ok":true,"trap":false,"why":"A person who hires an independent contractor ordinarily is not liable for injury to a third party caused by the contractor's negligence. However, there is an exception to this rule when the person directly influences the manner in which the contractor performs the work so as to contribute to the creation of the danger that causes the third party's injury. Here, the homeowner instructed the contractor to loosen the boards, which contributed to the danger that caused the friend's injury. Therefore, there is a basis for imposing liability on the homeowner. Meanwhile, the contractor is likely to be held liable for the friend's injury under ordinary negligence principles due to his failure to warn of the hidden danger posed by the seemingly safe porch floor."},{"t":"Neither the homeowner nor the contractor, because the friend was a licensee.","ok":false,"trap":false,"why":""},{"t":"The contractor only, because he was an independent contractor and he loosened the boards in a dangerously deceptive fashion without posting a warning.","ok":false,"trap":false,"why":""},{"t":"The homeowner only, because she insisted on having the old boards removed in a dangerously deceptive fashion and posted no warning.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"You're not liable for an independent contractor's negligence — unless you directed the dangerous method that caused the harm, which the owner did.","source":"adaptibar_import_filled.csv"},{"id":"CSV019","subj":"Real Property","sub":"Contracts","title":"Is the broker owed a commission?","scenario":"A woman listed her house for sale with a real estate broker. The woman and the broker signed a listing agreement, under which the woman agreed that the broker was to be the woman's sole agent during the six-month period of the listing agreement. The listing agreement was not recorded. The list price for the house was $250,000. The broker produced a prospective buyer who offered to purchase the house for $249,000 and who was prequalified to purchase at that price. The woman rejected the offer, giving no reason for her rejection, and the listing agreement expired the next day. Three months later, the woman sold the house to a corporation for $249,000. The broker never had any contact with the corporation.","q":"Is the broker owed a commission?","ru":"No procuring cause + expired listing = no commission.","options":[{"t":"No, because the listing agreement was not recorded.","ok":false,"trap":false,"why":""},{"t":"No, because the woman sold to a buyer found without the broker's help and after the expiration of the listing agreement.","ok":true,"trap":false,"why":"The broker did not help find the corporation and is therefore not owed a commission. Additionally, the woman sold the house after the listing agreement between the woman and the broker had expired. The woman's rejection of the prior offer is irrelevant to the broker's right to a commission because she had a right to reject the prospective buyer's offer to purchase the house, even though she ultimately sold the house for the same price."},{"t":"Yes, because the broker produced a ready, willing, and able buyer during the term of the listing agreement, and the buyer's offer matched the ultimate sale price.","ok":false,"trap":false,"why":""},{"t":"Yes, because the woman gave no reason for rejecting the prospective buyer's offer during the listing period.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The broker didn't find the buyer and the listing had expired, so no commission; rejecting an earlier offer is irrelevant.","source":"adaptibar_import_filled.csv"},{"id":"CSV020","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"If the appeals court finds that the trial court should not have admitted the testimony, does it have the authority to reverse a conviction when the trial attorney raised no objection to the challenged testimony?","scenario":"A defendant was tried in federal court for bank fraud. The defendant had retained private defense counsel. As part of the prosecution's case, a federal agent testified regarding incriminating statements that the defendant's confederate, who by the time of trial was a fugitive, had made during a prior interview. Though this testimony violated the Confrontation Clause, the defense attorney raised no objection. The jury ultimately convicted the defendant. The defendant has now hired new counsel for his appeal and argues that the admission of the federal agent's testimony was erroneous.","q":"If the appeals court finds that the trial court should not have admitted the testimony, does it have the authority to reverse a conviction when the trial attorney raised no objection to the challenged testimony?","ru":"Plain error = obvious + affected substantial rights -> reversible WITHOUT objection.","options":[{"t":"No, because failure to object waives a defendant's rights.","ok":false,"trap":false,"why":""},{"t":"No, because the sole remedy is a claim for ineffective assistance of counsel.","ok":false,"trap":false,"why":""},{"t":"Yes, because a defendant cannot be penalized for an attorney's failure to object.","ok":false,"trap":false,"why":""},{"t":"Yes, because an appeals court may correct plain error affecting substantial rights.","ok":true,"trap":false,"why":"Under the \"plain error\" rule, an appellate court may remedy an error that was plain or obvious if that error affected substantial rights, even if there was no objection raised. Here, the error was obvious, of constitutional dimension, and likely prejudicial. Consequently, the court of appeals has the authority to reverse the conviction."}],"_b":true,"plain":"Even with no objection at trial, an obvious constitutional error that likely changed the result can still be reversed.","source":"adaptibar_import_filled.csv"},{"id":"CSV021","subj":"Contracts","sub":"Formation of Contracts","title":"Do the parties now have an enforceable contract?","scenario":"A consulting firm orally agreed to employ an executive as its president for the executive's lifetime. The parties negotiated and have agreed to all aspects of the employment except for the executive's salary, on which they remain several thousand dollars apart. The executive has sent a signed letter to the firm confirming the terms to which the parties have orally agreed while acknowledging that the salary has yet to be set. The firm has not responded to the confirmation letter.","q":"Do the parties now have an enforceable contract?","ru":"Missing essential term (salary) = too indefinite = no contract.","options":[{"t":"No, because an agreement for lifetime employment is subject to the statute of frauds, and the confirmation letter fails to satisfy the statute.","ok":false,"trap":false,"why":""},{"t":"No, because the agreement is too indefinite to be enforced.","ok":true,"trap":false,"why":"An essential term for an employment contract includes salary for the services or work performed. As an essential term, salary must be agreed upon before the contract can be deemed enforceable. A contract is not enforceable if one or more of the essential terms are left open. Here, the agreement is too indefinite to be enforceable because the parties failed to agree on the executive's salary."},{"t":"Yes, because the agreement is not subject to the statute of frauds, and the parties must negotiate the executive's salary in good faith.","ok":false,"trap":false,"why":""},{"t":"Yes, because the confirmation letter satisfies the statute of frauds and evidences the parties' intent to be bound.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"No agreed salary means an essential term is missing, so there's no enforceable employment contract.","source":"adaptibar_import_filled.csv"},{"id":"CSV022","subj":"Evidence","sub":"Writings, Recordings, and Photographs","title":"Should the court allow the woman's testimony about the statements in the letter?","scenario":"A woman has sued a man for defamation, alleging that he sent a letter to her employer making false and injurious statements about her. At trial, she proposes to testify about the statements in the letter but does not produce the letter itself or show that it is unavailable.","q":"Should the court allow the woman's testimony about the statements in the letter?","ru":"Proving contents of a writing -> original required unless lost (and not in bad faith).","options":[{"t":"No, because the statements were made out of court and are hearsay not within any exception.","ok":false,"trap":false,"why":""},{"t":"No, because the best evidence rule requires an original or duplicate of the letter to prove the letter's contents.","ok":true,"trap":false,"why":"Under the best evidence rule, the woman cannot testify to the contents of the letter unless the original is lost, and she did not lose it in bad faith. See Fed. R. Evid. 1004(a). Here, the woman has not shown that the letter is unavailable, so her testimony is inadmissible."},{"t":"Yes, because the statements are not being offered for their truth and thus are not hearsay.","ok":false,"trap":false,"why":""},{"t":"Yes, because the statements are those of a party-opponent and therefore are admissible under a hearsay exception.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"To prove what a letter said you need the original unless it's truly unavailable; she still has it, so she can't just describe it.","source":"adaptibar_import_filled.csv"},{"id":"CSV023","subj":"Torts","sub":"Other Torts","title":"Should the court grant the motion?","scenario":"An established cemetery sells \"pre-need\" funeral plans, which include funeral services, a casket, and a burial plot, in exchange for advance payment. By state statute, any purchaser of a funeral plan of this sort can cancel the purchase at any time, subject to a penalty imposed by the seller of up to 15% of the purchase price. A former high-level employee of the cemetery, who knew of the limitations specified in the state statute, recently built a new cemetery near the established cemetery. To promote the new cemetery, the former employee sent postcards to local residents asserting that anyone who had already purchased a pre-need funeral plan had \"an unlimited right to cancel that plan at any time, for any reason, without penalty.\" The postcard also offered a $100 rebate on a pre-need funeral plan with the new cemetery to anyone who canceled an existing plan elsewhere. Shortly after the promotion began, several purchasers of funeral plans with the established cemetery canceled their plans and purchased plans from the new cemetery. When the established cemetery withheld penalties from the refund amounts, the purchasers objected and threatened to notify the state consumer protection bureau. The established cemetery has sued the former employee for tortious interference with contract. The former employee has moved for summary judgment, based on the foregoing facts.","q":"Should the court grant the motion?","ru":"A party's right to cancel =/= license for YOU to induce the breach.","options":[{"t":"No, because a reasonable jury could conclude that the former employee bribed purchasers in order to take business from the established cemetery.","ok":false,"trap":false,"why":""},{"t":"No, because the former employee could be found by a jury to have intentionally and improperly interfered with the established cemetery's contracts.","ok":true,"trap":false,"why":"A jury could find that the former employee intentionally and improperly interfered with the established cemetery's contracts. Here, the former employee intentionally misrepresented to the established cemetery's customers that they could cancel their existing contracts without penalty."},{"t":"Yes, because the established cemetery's contracts with purchasers were terminable at the option of the purchasers.","ok":false,"trap":true,"why":"The customers' ability, by state statute, to terminate their contracts does not allow the former employee to intentionally interfere with those contracts."},{"t":"Yes, because the former employee was simply competing with the established cemetery.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Even if customers had a statutory right to cancel, lying to push them into canceling is still improper interference.","source":"adaptibar_import_filled.csv"},{"id":"CSV024","subj":"Constitutional Law","sub":"Judicial Review","title":"Should the court grant the motion?","scenario":"A federal statute bans trade with any foreign country if the United States does not recognize the government of that country. For many years, the United States refused to recognize a particular country's government because it deemed the government repressive. The President recently extended diplomatic recognition to the country, but Congress passed a second statute withdrawing that recognition. A US company has sued the appropriate federal agency, seeking to enjoin enforcement of the second statute. The government has moved to dismiss the action on the ground that it involves a nonjusticiable political question.","q":"Should the court grant the motion?","ru":"Validity of a statute = justiciable, even in foreign affairs (Zivotofsky).","options":[{"t":"No, because the action concerns the validity of a federal statute.","ok":true,"trap":false,"why":"Interbranch disputes involving foreign affairs are not subject to the political question doctrine when they concern the validity of a federal statute. See Zivotofsky v. Clinton, 566 U.S. 189 (2012)."},{"t":"No, because the political question doctrine applies only to litigation between government entities.","ok":false,"trap":false,"why":""},{"t":"Yes, because the action involves sensitive issues of foreign affairs.","ok":false,"trap":false,"why":""},{"t":"Yes, because there is no judicially manageable standard governing diplomatic recognition.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Courts CAN decide whether a foreign-affairs statute is valid; that's a legal question, not a political one.","source":"adaptibar_import_filled.csv"},{"id":"CSV025","subj":"Real Property","sub":"Titles","title":"Is the brother correct?","scenario":"A woman owned land subject to a mortgage held by a bank. She fell behind in her mortgage loan payments, and the bank properly initiated foreclosure proceedings. The land was sold at a foreclosure sale that resulted in surplus proceeds to which the woman was entitled. Before payment of the surplus proceeds to her, she died testate. In her duly probated will, which she had executed before granting the mortgage to the bank, the woman specifically devised the land to a charity. The remainder of the woman's estate was given by the will to her brother, her sole heir. A dispute has arisen in the administration of the woman's estate about the foreclosure sale surplus proceeds. The woman's brother contends that he is now entitled to those proceeds.","q":"Is the brother correct?","ru":"Will speaks at death. No asset owned at death = specific devise ADEEMS (fails).","options":[{"t":"No, because the foreclosure sale was an involuntary act.","ok":false,"trap":false,"why":""},{"t":"No, because the woman's will clearly indicated her intent for the charity to have the land.","ok":false,"trap":true,"why":"The woman's original intent for the land is irrelevant to determining who is entitled to the foreclosure sale proceeds. When a will specifically disposes of land not owned by the testator at death, the bequest to the specific legatee adeems (fails)."},{"t":"Yes, because the foreclosure sale was completed before the woman's death.","ok":true,"trap":false,"why":"A will speaks at the time of the testator's death. Here, before her death the woman lost her interest in the land due to the foreclosure action. Thus, at the time of the woman's death, she only had an interest in the surplus proceeds, which was personal property that passed to the brother, who is the woman's residuary legatee."},{"t":"Yes, because the woman's will was written before the mortgage was granted.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The will speaks at death; she lost the land to foreclosure first, so the specific gift of land failed and only the surplus cash passed to the residuary taker.","source":"adaptibar_import_filled.csv"},{"id":"CSV026","subj":"Contracts","sub":"Remedies","title":"Subject to the man's claim for damages for breach, how much is the contractor likely to recover for the work he performed?","scenario":"A contractor agreed in writing to build a house for a man for $200,000. The contract stated that the man would pay the contractor $60,000 when the foundation was laid, $60,000 when the house was framed, $60,000 when the walls were completed, and $20,000 when the house was finished. After the contractor laid the foundation and expended $50,000, but before the man paid the contractor anything, the contractor quit the project to take a higher-paying job.","q":"Subject to the man's claim for damages for breach, how much is the contractor likely to recover for the work he performed?","ru":"Breaching party still gets restitution for the benefit conferred.","options":[{"t":"$50,000, on a theory of reliance.","ok":false,"trap":false,"why":""},{"t":"$60,000, on a theory of divisible contract.","ok":false,"trap":false,"why":""},{"t":"The value of the benefit conferred, on a theory of restitution.","ok":true,"trap":false,"why":"A party that materially breaches a contract is nevertheless entitled to recover, under a theory of restitution, the value of the benefit that the breaching party's part performance conferred on the victim of the breach. Restatement (Second) of Contracts § 374. Here, the contractor is entitled to receive the benefit conferred on the man for the completed foundation, but in light of the breach of the remaining parts of the contract."},{"t":"Nothing, because the contractor's breach was willful.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Even a builder who breaches can recover the value of the benefit already given (the finished foundation), offset by the owner's damages.","source":"adaptibar_import_filled.csv"},{"id":"CSV027","subj":"Civil Procedure","sub":"Jurisdiction and Venue","title":"Is the court likely to grant the motion?","scenario":"A plaintiff filed a federal diversity action against a corporate defendant and the same day mailed to the defendant's managing agent a notice of the complaint and two copies of a request to waive service. Sixty-one days later, after the defendant had failed to return the signed waiver request, answer, or otherwise plead, the plaintiff moved for entry of default and a default judgment. The plaintiff did not file proof of service. Assume that any relevant state service law is the same as federal law.","q":"Is the court likely to grant the motion?","ru":"No formal service (waiver ignored) = no duty to answer = no default.","options":[{"t":"No, because the plaintiff failed to effect proper service of process.","ok":true,"trap":false,"why":"A plaintiff must formally serve a defendant before the defendant has an obligation to respond. Here, although a request for waiver of service was sent, the defendant was not obligated to and did not respond to the request. The defendant's failure to respond to the waiver request would require the plaintiff to then formally serve the defendant. Since the plaintiff failed to effect proper service of process, an entry of default in their favor would be inappropriate."},{"t":"No, because the plaintiff failed to file proof of service.","ok":false,"trap":false,"why":""},{"t":"Yes, because the defendant should have returned the waiver request within 60 days of service.","ok":false,"trap":false,"why":""},{"t":"Yes, because the plaintiff mailed notice of the complaint as permitted by the Federal Rules of Civil Procedure.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A waiver-of-service request isn't service; ignoring it isn't default — the plaintiff then has to serve formally.","source":"adaptibar_import_filled.csv"},{"id":"CSV028","subj":"Real Property","sub":"Titles","title":"Is the son entitled to indemnification from the title insurance company?","scenario":"A buyer purchased a house for $300,000. The buyer financed the purchase, in part, with a $250,000 loan from a bank, secured by a mortgage on the house. Before the closing, the buyer's attorney advised him to purchase a standardform, $300,000 title insurance policy naming the buyer as the insured. Because the buyer had forgotten to bring his checkbook to the closing, his son, who had accompanied him to the closing, paid the premium for him. One year later, the buyer died. Under his will, the house passed to his son. Two years later, the son was successfully sued by a previous record owner with a superior title to the house. The previous owner's claim had not been excepted in the buyer's title insurance policy through the carelessness of a title company employee. At the time of the lawsuit, the house was still subject to the bank's mortgage. The son immediately sought indemnification for the loss from the title insurance company.","q":"Is the son entitled to indemnification from the title insurance company?","ru":"Title insurance = indemnity; runs to heirs/devisees while they own.","options":[{"t":"No, because the son was not named as an insured on the title policy.","ok":false,"trap":false,"why":""},{"t":"No, because when a mortgage remains outstanding, a title policy protects only the mortgagee from any loss.","ok":false,"trap":false,"why":""},{"t":"Yes, because the house passed to the son under the buyer's will.","ok":true,"trap":false,"why":"A title insurance policy is a contract of indemnity. It insures the individual named in the policy and his heirs and devisees so long as the named insured or his heirs or devisees own the insured property. Here, the buyer's son inherited the house, and thus owned the house/property when the holder of the superior title brought the suit."},{"t":"Yes, because the son paid the policy premium.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A title policy is indemnity that protects the named insured AND heirs who inherit and own the property, so the son is covered.","source":"adaptibar_import_filled.csv"},{"id":"CSV029","subj":"Criminal Law","sub":"Homicide","title":"What lesser-offense instruction should the defense attorney request?","scenario":"A woman became extremely intoxicated after a night of heavy drinking at a party. After the party was over, she got into her car and sped off. While driving 70 mph in a 30-mph zone, she struck and killed a pedestrian. Blood tests revealed that her blood alcohol content had been more than twice the legal limit at the time of the accident. The woman was tried for murder. At the close of the evidence, the court refused to dismiss the murder charge but offered to give a lesser-offense instruction.","q":"What lesser-offense instruction should the defense attorney request?","ru":"Reckless-but-not-depraved death = involuntary manslaughter (request the lesser).","options":[{"t":"Depraved-heart homicide.","ok":false,"trap":false,"why":""},{"t":"Involuntary manslaughter.","ok":true,"trap":false,"why":"Defense counsel should request an involuntary manslaughter instruction. Here, even though the woman was intoxicated and driving in an unlawful manner, a jury could conclude that she did not act with the sort of aggravated recklessness necessary to constitute depraved-heart homicide or extreme-indifference murder."},{"t":"Voluntary intoxication.","ok":false,"trap":false,"why":""},{"t":"Voluntary manslaughter.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Drunk, unlawful driving may not reach depraved-heart murder; a jury could find ordinary recklessness, so ask for involuntary manslaughter.","source":"adaptibar_import_filled.csv"},{"id":"CSV030","subj":"Evidence","sub":"Relevancy and Excluding Relevant Evidence","title":"Is the photograph admissible?","scenario":"A plaintiff has sued a defendant for negligently causing her injury. The plaintiff alleges that the defendant, who was standing on a scaffold while painting a building, dropped a paint can that struck the plaintiff on the head while she was walking under the scaffold. At trial, to prove her injury, the plaintiff offers a photograph for admission into evidence. A witness will testify that he took the photograph with his cell phone and that the photograph accurately portrays what he saw. The photograph shows the plaintiff lying on the sidewalk, bleeding from a gash on her head, with a spilled paint can nearby.","q":"Is the photograph admissible?","ru":"Witness with knowledge authenticates (901). Don't reflex to 403.","options":[{"t":"No, because the unfair prejudicial effect of the photograph outweighs its probative value.","ok":false,"trap":true,"why":"Under FRE 403 the unfair prejudice from the photograph must substantially outweigh its probative value. Here, the probative value of the photograph is considerable, it shows the plaintiff's injury and supports the claim that the defendant dropped the paint can. Additionally, the potential to inflame or distract the jury is low."},{"t":"No, because there is no testimony establishing that cell-phone technology produces accurate photographs.","ok":false,"trap":false,"why":""},{"t":"Yes, because the photograph will be authenticated by the witness's testimony.","ok":true,"trap":false,"why":"Under Federal Rule of Evidence (FRE) 901, the witness's testimony is sufficient to authenticate the photograph. Here, the testimony comes from a witness with knowledge that the photograph is what it is claimed to be."},{"t":"Yes, because the photograph is self-authenticating.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A witness who knows the scene can authenticate the photo, and its probative value isn't substantially outweighed, so 403 doesn't block it.","source":"adaptibar_import_filled.csv"},{"id":"CSV031","subj":"Torts","sub":"Intentional Torts","title":"Who, if anyone, is liable to the landowner's neighbor for conversion?","scenario":"A landowner hired a tree specialist to cut down four trees, which he pointed out to the specialist before the specialist began work. Although the landowner reasonably believed that all the trees were on his property, three of the trees that were cut down were in fact on a neighbor's property.","q":"Who, if anyone, is liable to the landowner's neighbor for conversion?","ru":"Conversion = intent to control the thing. Good-faith mistake = no defense.","options":[{"t":"Both the tree specialist and the landowner.","ok":true,"trap":false,"why":"Conversion occurs when an actor intentionally interacts with an item that is the personal property of another so as to permanently deprive the rightful owner of possession. It is irrelevant whether the actor knows that the item belongs to another individual. Thus, the landowner's reasonable belief that the trees were his does not defeat liability for either the landowner or the tree specialist. The tree specialist is also liable for conversion because he intentionally cut down and so severely interfered with the neighbor's interest in the three trees. The fact that the tree specialist was acting under the orders of the landowner does not relieve him of liability."},{"t":"Neither the tree specialist nor the landowner.","ok":false,"trap":true,"why":"The landowner's reasonable belief that the trees were his does not defeat liability for either the landowner or the tree specialist. The landowner and the tree specialist working in concert committed conversion by permanently depriving the neighbor of three trees."},{"t":"The landowner only.","ok":false,"trap":false,"why":""},{"t":"The tree specialist only.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"An honest belief you own the property is no defense to conversion; intent to deal with the thing is enough, so both actors are liable.","source":"adaptibar_import_filled.csv"},{"id":"CSV032","subj":"Real Property","sub":"Ownership","title":"Is the executor correct?","scenario":"A woman executed and delivered to her unmarried nephew a warranty deed conveying her home to him \"on the date of his marriage.\" The nephew promptly recorded the deed. Several years later, when the nephew was still unmarried, the woman died testate, leaving her entire estate to her sister. The executor of the woman's estate has asserted that the nephew has no interest in the home.","q":"Is the executor correct?","ru":"3rd-party future interest that 'springs' on a future event = springing executory interest.","options":[{"t":"No, because the nephew recorded the deed before the woman's death.","ok":false,"trap":false,"why":""},{"t":"No, because the woman's death did not affect the nephew's future interest in the home.","ok":true,"trap":false,"why":"The woman conveyed a springing executory interest to the nephew and retained a fee simple subject to executory limitation. The woman's death did not affect the nephew's springing executory interest and her estate now holds the fee simple subject to executory limitation. Furthermore, the nephew's executory interest will vest in fee simple if he marries. If he dies unmarried, the sister's interest will swell into a fee simple."},{"t":"Yes, because a deed that does not transfer immediate possession to a grantee is rendered void by the grantor's death.","ok":false,"trap":false,"why":""},{"t":"Yes, because the nephew did not marry before the woman's death.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"'If he marries' gives the nephew a springing executory interest that survives the grantor's death; the estate holds a fee simple subject to that limitation meanwhile.","source":"adaptibar_import_filled.csv"},{"id":"CSV033","subj":"Evidence","sub":"Hearsay and Circumstances of Its Admissibility","title":"What is the correct ruling on the prosecutor's contention that the defendant has forfeited his objections?","scenario":"A defendant was charged with murdering a business rival. Two days before he was killed, the rival visited the police station to communicate his concerns about the defendant, saying to the police, \"I think [the defendant] is going to kill me.\" At the defendant's murder trial, the defendant moved to exclude the rival's statement to the police on both hearsay and confrontation grounds. The prosecutor responded that the defendant had forfeited both his hearsay and his confrontation objections by killing the rival. For purposes of the motion, the parties have agreed that the prosecutor can establish to the court, by a preponderance of the evidence, that the defendant killed the business rival because the rival had stolen a large amount of money from the defendant.","q":"What is the correct ruling on the prosecutor's contention that the defendant has forfeited his objections?","ru":"Forfeiture-by-wrongdoing (804(b)(6)) needs intent to silence, not just any killing.","options":[{"t":"The defendant has forfeited his confrontation objection but not his hearsay objection.","ok":false,"trap":false,"why":""},{"t":"The defendant has forfeited his hearsay objection but not his confrontation objection.","ok":false,"trap":false,"why":""},{"t":"The defendant has forfeited neither objection, because the prosecutor has not shown that the defendant killed the business rival with the intent to keep him from testifying.","ok":true,"trap":false,"why":"Under Federal Rule of Evidence (FRE) 804(b)(6), in order to forfeit a hearsay or confrontation objection, a defendant must have engaged in wrongful conduct for the purpose of preventing the declarant from testifying. Here, the prosecutor has not demonstrated forfeiture of either objection. Furthermore, the defendant's purpose for killing the declarant was revenge for a theft and not a desire to prevent trial testimony. Therefore, the prosecutor cannot make the showing of intent required for forfeiture of either objection."},{"t":"The defendant has forfeited neither objection, because the prosecutor must prove forfeiture by more than a preponderance of the evidence.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Killing the witness only forfeits the hearsay/confrontation objection if the PURPOSE was to silence them; a revenge motive doesn't count.","source":"adaptibar_import_filled.csv"},{"id":"CSV034","subj":"Civil Procedure","sub":"Jurisdiction and Venue","title":"What is the railroad's best argument in support of the motion?","scenario":"A passenger domiciled in State A has brought a federal diversity action in State A against a railroad, seeking damages for injuries suffered when the railroad's train, which the passenger boarded in State A, derailed in State B. The railroad is incorporated and has its principal place of business in State B and operates in States A and B. Several other passengers were also injured and have brought individual actions in State B federal court. The railroad has moved the State A federal court to transfer the action to the State B federal district court. State B has only one federal district.","q":"What is the railroad's best argument in support of the motion?","ru":"1404 transfer = convenience of parties/witnesses + interest of justice.","options":[{"t":"The accident occurred in State B and many witnesses are located there.","ok":true,"trap":false,"why":"Transfers to a different federal court are granted in the interest of justice and for the convenience of the parties and witnesses. Here, because the accident occurred in State B, the railroad is located in State B, and other passengers have brought actions in State B federal court, State B would be the most convenient venue for the action."},{"t":"The action involves common questions of fact with similar actions pending in State B.","ok":false,"trap":false,"why":""},{"t":"The railroad is incorporated and has its principal place of business in State B.","ok":false,"trap":false,"why":""},{"t":"Venue is not proper in State A.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Where the accident happened, the railroad is based, and other suits are pending is the convenient forum, so transfer there.","source":"adaptibar_import_filled.csv"},{"id":"CSV035","subj":"Criminal Law","sub":"Other Crimes","title":"Upon the defense attorney's request, should the trial court instruct the jury on the lesser included offense of simple theft?","scenario":"A defendant was charged in federal court under the Assimilative Crimes Act, which provides that the criminal law of the state in question applies to crimes committed on federal enclaves within the state. Federal prosecutors charged the defendant with aggravated theft for stealing computer equipment from a store on a federal military base. Under the controlling state's criminal law, the crime of aggravated theft, punishable by up to 10 years in prison, requires that the stolen property be worth $1,000 or more. If the stolen property is worth less than $1,000, the crime is simple theft with a maximum punishment of five years in prison. The value of the equipment was disputed. The prosecutor offered evidence that the computer equipment was worth more than $1,000, but an expert witness called by the defense testified that the equipment was worth much less. The defense attorney has requested that the trial court instruct the jury on the lesser included offense of simple theft. The prosecution objects, arguing that the court should only instruct on the charged offense of aggravated theft.","q":"Upon the defense attorney's request, should the trial court instruct the jury on the lesser included offense of simple theft?","ru":"Lesser-included instruction when a disputed element could downgrade the crime.","options":[{"t":"No, because a court cannot instruct on an offense not charged by the prosecution.","ok":false,"trap":false,"why":""},{"t":"No, because the value of the stolen computer equipment is only a sentencing factor and not an offense element.","ok":false,"trap":false,"why":""},{"t":"Yes, because a court must instruct on all lesser included offenses.","ok":false,"trap":false,"why":""},{"t":"Yes, because the jury could rationally find the defendant not guilty of the greater offense but guilty of the lesser included offense.","ok":true,"trap":false,"why":"Upon request, a court should instruct the jury on a lesser included offense if, on the evidence presented, the jury may rationally acquit the defendant of the charged offense but convict of the lesser offense. Here, the element of value is in reasonable dispute; therefore, the jury may rationally find the defendant guilty of the lesser offense."}],"_b":true,"plain":"If the jury could rationally find a lower value (acquit of grand theft, convict of simple theft), the lesser-included instruction is required.","source":"adaptibar_import_filled.csv"},{"id":"CSV036","subj":"Constitutional Law","sub":"Separation of Powers","title":"May the President constitutionally remove the director without the Senate's consent?","scenario":"In response to a nationwide increase in drug-related crime, Congress passed a statute creating a new agency responsible for enforcing federal drug laws. The statute authorizes the President to appoint the agency's director with the advice and consent of the Senate and prohibits the President from removing the director without the Senate's consent. The President appointed a director, and the Senate confirmed the appointment. Recently, the President has become dissatisfied with the director's strict approach to drug-law enforcement and wishes to remove the director. Because a majority of senators favor strict drug-law enforcement, the Senate has refused to consent to the director's removal.","q":"May the President constitutionally remove the director without the Senate's consent?","ru":"Congress gets NO role in removing executive officers (Myers/Bowsher).","options":[{"t":"No, because Congress created the director position and may properly impose conditions for the director's appointment and removal.","ok":false,"trap":false,"why":""},{"t":"No, because the President's removal of principal officers of the United States is subject to the advice and consent of the Senate.","ok":false,"trap":false,"why":""},{"t":"Yes, because congressional participation in the decision to remove a presidential appointee violates the separation of powers.","ok":true,"trap":false,"why":"The Supreme Court has repeatedly held that Congress shall not play any role in the removal of executive officers. Myers v. United States, 272 U.S. 52 (1926); Bowsher v. Synar, 478 U.S. 714 (1986). Therefore, the President may constitutionally remove the director—a presidential appointee—without the consent of the Senate."},{"t":"Yes, because Congress cannot limit the ability of the President to remove any employee of the executive branch.","ok":false,"trap":true,"why":"This is an overbroad statement of the law. Congress has the power to remove certain types of federal officials, such as those serving as members of the governing bodies of regulatory agencies and inferior officers in agencies where the head of the agency may be removed by the President at will. However, under the separation of powers doctrine, Congress may not play any role in the removal of a presidential appointee."}],"_b":true,"plain":"The President can fire his own executive appointee without Senate consent; Congress can't insert itself into removing executive officers.","source":"adaptibar_import_filled.csv"},{"id":"CSV037","subj":"Contracts","sub":"Defenses to Enforceability","title":"If the contractor sues the landowner to recover the additional cost, will the contractor be likely to prevail?","scenario":"A contractor agreed to build a wood-frame house for a landowner for $300,000. The parties agreed that the price would increase by the amount that the cost of lumber for the job exceeded the then-current cost of $30 per 100 board feet. The landowner reduced the agreement to writing but inadvertently failed to include in the written contract the price-escalation clause relating to the cost of lumber. Both parties signed the contract without noticing the omission. When the contractor purchased lumber for the job, the price of the lumber had risen to $60 per 100 board feet. When the contractor submitted a final bill that included the increased price of lumber, the landowner refused to pay the increased price for the lumber on the grounds that the price-escalation clause was missing from the written contract.","q":"If the contractor sues the landowner to recover the additional cost, will the contractor be likely to prevail?","ru":"Both agreed + both thought it was written = reform for mutual mistake.","options":[{"t":"No, because the contractor's remedy for mistake is avoidance of the contract.","ok":false,"trap":false,"why":""},{"t":"No, because the parol evidence rule will bar introduction of evidence of the price-escalation clause.","ok":false,"trap":false,"why":""},{"t":"Yes, because since the parties were both mistaken as to the content of the writing, the court will reform the writing to express their agreement.","ok":true,"trap":false,"why":"When a written contract fails to express the actual agreement between both parties due to a mutual mistake, the court may reform the writing to be an accurate expression of the agreement. Here, the landowner and contractor both agreed to the price-escalation clause, and both parties mistakenly believed that the price-escalation clause was included in the written contract they signed. Thus, the court may reform the contract so that the terms accurately reflect their agreement regarding the price-escalation clause."},{"t":"Yes, because the contract will be construed against the landowner, who drafted it.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Both sides agreed to the escalation clause and both thought it was in the signed writing, so the court reforms the writing to match the real deal.","source":"adaptibar_import_filled.csv"},{"id":"CSV038","subj":"Contracts","sub":"Contract Content and Meaning","title":"The parties have now discovered that they attach different meanings to the term \"summer season.\" How would a court likely resolve the different meanings attached to the term by the parties?","scenario":"In a contract drafted by the owner of a commercial fishing company, the company agreed to provide a specified quantity of fresh tuna to a seafood cannery each week during the \"summer season\" at an agreed-upon rate. The owner of the fishing company honestly understood \"summer season\" to mean June 15 to September 15. The cannery's president honestly understood the term to mean May 15 to September 15, as it is understood according to trade usage in the parties' industry.","q":"The parties have now discovered that they attach different meanings to the term \"summer season.\" How would a court likely resolve the different meanings attached to the term by the parties?","ru":"Trade usage binds trade members — ignorance of the custom is no escape.","options":[{"t":"Because both parties were acting in good faith, they will be excused from performing under the contract.","ok":false,"trap":false,"why":""},{"t":"Because the fishing company drafted the contract, the meaning of the term \"summer season\" will be construed against it, and the cannery's meaning will be used.","ok":false,"trap":false,"why":""},{"t":"Because the fishing company works in the industry, it will be bound by the meaning supplied by trade usage.","ok":true,"trap":false,"why":"The meaning of a term supplied by usage of trade will be observed with respect to a transaction between members of the trade, even if one of the parties is not aware of that usage. Here, the commercial fishing company is a member of the trade and will be bound to provide tuna for the \"summer season\" as defined by trade usage."},{"t":"Because the parties have attached different meanings to a key term of the contract, there is no contract.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A trade term means what the trade says it means; a member of that trade is bound even if personally unaware of the custom.","source":"adaptibar_import_filled.csv"},{"id":"CSV039","subj":"Evidence","sub":"Presentation of Evidence","title":"Has the issue of admissibility been preserved for appeal?","scenario":"A defendant was charged with murder. At trial, the prosecutor called a witness who testified that a friend had told him that there was \"bad blood\" between the defendant and the victim. After the witness was excused, the defense attorney moved to strike the portion of the testimony that included the friend's statement, arguing that the statement was inadmissible.","q":"Has the issue of admissibility been preserved for appeal?","ru":"Preserve error = object NOW + state the specific ground (103).","options":[{"t":"No, because an objection must be made before the evidence is presented to the jury.","ok":false,"trap":false,"why":""},{"t":"No, because the defense failed to make a timely objection stating the specific ground for objection.","ok":true,"trap":false,"why":"Under Federal Rule of Evidence (FRE) 103, an objection raised only after a witness has left the stand is not timely. In this case, the defense attorney should have objected immediately upon hearing the witness relate inadmissible hearsay. In addition, the delayed objection failed to preserve the right to appeal under FRE 103 because the defense attorney did not state a specific basis for the objection."},{"t":"Yes, because admission of the statement affected the defendant's right to confront witnesses.","ok":false,"trap":false,"why":""},{"t":"Yes, because the defense objected to the statement during the trial.","ok":false,"trap":true,"why":"Under FRE 103, an objection must be made at the earliest opportunity, and an objection that is made \"during trial,\" but only after the witness leaves the stand, is not considered timely for purposes of preserving the issue for appeal."}],"_b":true,"plain":"Objecting after the witness left the stand is too late, and a vague objection doesn't preserve appeal; it must be immediate AND specific.","source":"adaptibar_import_filled.csv"},{"id":"CSV040","subj":"Torts","sub":"Negligence","title":"If the jury determines that the man was 25% responsible and that each defendant was also 25% responsible, will the man be able to recover damages, and if so, how much from each defendant?","scenario":"A man who was visiting a shooting range misunderstood a signal that indicated shooting in progress and walked in front of another customer who was shooting toward a target. The man was hit by a bullet and seriously injured. The man sued the customer, the owner of the range, and the manufacturer of the signaling apparatus. The jurisdiction prohibits a plaintiff from recovering against a defendant whose fault is less than or equal to that of the plaintiff.","q":"If the jury determines that the man was 25% responsible and that each defendant was also 25% responsible, will the man be able to recover damages, and if so, how much from each defendant?","ru":"Modified comparative here = compare P's % to EACH D separately, not the sum.","options":[{"t":"The man will be able to recover 25% of his damages from each defendant.","ok":false,"trap":false,"why":""},{"t":"The man will be able to recover 25% of his damages from the customer but nothing from the owner or the manufacturer.","ok":false,"trap":false,"why":""},{"t":"The man will be able to recover 75% of his damages from any defendant.","ok":false,"trap":false,"why":""},{"t":"The man will not be able to recover damages.","ok":true,"trap":false,"why":"Based on the rule provided, if the jury finds the man was 25% responsible, he cannot recover from any defendant. Each defendant's percentage of fault is taken individually, not in the aggregate. Thus, since each defendant was also 25% responsible—a percentage equal to the man's responsibility—the man cannot recover."}],"_b":true,"plain":"The plaintiff's 25% isn't measured against the total; under this rule it's compared to EACH defendant's 25%, so a tie bars recovery from each.","source":"adaptibar_import_filled.csv"},{"id":"CSV041","subj":"Civil Procedure","sub":"Pretrial Procedures","title":"Did the court properly grant the TRO?","scenario":"Members of a political organization protested against US foreign policy by blocking the entrance to a military base. After several members were arrested, the organization's leader called for \"even bigger demonstrations next week to halt operations at the base.\" The US Attorney in the jurisdiction brought a federal civil action against the organization and its leader, seeking an injunction against protests that interfered with the base's operations. With the complaint, the US Attorney moved for a temporary restraining order (TRO) to \"enjoin any blockade of the base's entrance or other disruption of base activity until the court can hear motions for a preliminary and a permanent injunction.\" The US Attorney attached an affidavit certifying the unsuccessful efforts she had made to locate the organization and its leader and to notify them of the motion. The court immediately held a hearing and issued the TRO in a one-sentence order that did not describe the acts to be restrained but instead incorporated by reference the allegations of the complaint and the TRO motion.","q":"Did the court properly grant the TRO?","ru":"TRO must state reasons + describe restrained acts in detail (65(d)).","options":[{"t":"No, because the order did not describe in reasonable detail the acts to be restrained.","ok":true,"trap":false,"why":"Under Federal Rule of Civil Procedure (FRCP) 65(d), every order that grants a TRO must state the reasons why it was issued and must detail the acts restrained. Here, the court failed to state either the reasons for the TRO or the acts it restrained. Even if the US Attorney made an argument that the court incorporated the reasons for the order by reference to the complaint, the order still failed to describe in reasonable detail the acts to be restrained. Thus, the court's grant of the TRO was improper."},{"t":"No, because the organization and its leader did not receive notice of the hearing.","ok":false,"trap":false,"why":""},{"t":"Yes, because damages would be inadequate to address the harm alleged in the complaint.","ok":false,"trap":false,"why":""},{"t":"Yes, because the planned demonstrations threatened imminent irreparable harm.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A TRO is invalid if it doesn't state WHY it issued and exactly WHAT is restrained; this one did neither.","source":"adaptibar_import_filled.csv"},{"id":"CSV042","subj":"Constitutional Law","sub":"Separation of Powers","title":"Are the President's decisions constitutional?","scenario":"A federal statute provides that the President must expend all funds appropriated by Congress, and that appropriated funds must be used only for the purposes named in the relevant appropriations act. An appropriations statute directs that $300 million be spent on planting wildflowers along public highways. Considering the statute to be a waste of money, the President has announced two decisions. First, he will spend half of the money to train troops. Second, he will retain the remaining funds in the federal treasury and not spend them at all.","q":"Are the President's decisions constitutional?","ru":"Appropriated money spent as directed — no impounding, no redirecting (Take Care + Appropriations).","options":[{"t":"Both decisions are constitutional.","ok":false,"trap":false,"why":""},{"t":"Only the decision to spend the funds to train troops is constitutional.","ok":false,"trap":false,"why":""},{"t":"Only the decision to retain the remaining funds is constitutional.","ok":false,"trap":false,"why":""},{"t":"Neither decision is constitutional.","ok":true,"trap":false,"why":"The Take Care Clause requires the President to take care that the laws be faithfully executed. Here, one of those laws is the requirement that all the funds in question be spent on planting wildflowers. To keep the funds in the federal treasury would violate the legal mandate that all the funds be spent. In addition, since the Appropriations Clause of Article I provides that federal spending must be authorized by Congress, and the appropriations statute here directs the money to be spent on wildflowers, the President cannot use the money to train troops. Thus, neither decision is constitutional."}],"_b":true,"plain":"The President must spend appropriated funds as Congress directed; he can't hoard them or redirect them to troops.","source":"adaptibar_import_filled.csv"},{"id":"CSV043","subj":"Evidence","sub":"Relevancy and Excluding Relevant Evidence","title":"Should the stockholder be permitted to testify to his opinion?","scenario":"A stockholder sued a corporation for losses he allegedly suffered when the price of the corporation's publicly traded stock dropped. The price drop occurred shortly after it was publicly revealed that the corporation had released false earnings reports. At trial, the stockholder seeks to testify that, in his opinion, the drop in the corporation's stock price was directly attributable to the public revelation about the false earnings reports. The stockholder has conceded that he has no formal education or training in economics or the stock market.","q":"Should the stockholder be permitted to testify to his opinion?","ru":"Causation opinion = expert territory; lay opinion can't (701 vs 702).","options":[{"t":"No, because he is not qualified to offer opinion testimony based on scientific, technical, or other specialized knowledge relating to stock price changes.","ok":true,"trap":false,"why":"The stockholder is a lay witness who seeks to give testimony on causation, which requires the specialized knowledge of an expert witness. Under Federal Rule of Evidence (FRE) 701, the stockholder's testimony is inadmissible."},{"t":"No, because his personal interest in the outcome of the action renders his opinion insufficiently probative.","ok":false,"trap":false,"why":""},{"t":"Yes, because his opinion is rationally based on his perception as a stockholder and will be helpful to the trier of fact.","ok":false,"trap":false,"why":""},{"t":"Yes, because property owners such as the stockholder are entitled to express an opinion on changes in the value of their property.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A lay witness can't give an opinion on technical causation; that needs an expert.","source":"adaptibar_import_filled.csv"},{"id":"CSV044","subj":"Criminal Law","sub":"Inchoate Crimes","title":"What crime, if any, has the man committed?","scenario":"A man offered to sell illegal drugs to an undercover police officer, who immediately arrested the man. The officer searched the man but found no drugs in his possession. The jurisdiction follows the common law of conspiracy and solicitation, and uses the dangerous-proximity test for attempt.","q":"What crime, if any, has the man committed?","ru":"Ask someone to do the crime = solicitation. No proximity = not attempt.","options":[{"t":"Conspiracy to distribute controlled substances.","ok":false,"trap":false,"why":""},{"t":"Attempted distribution of controlled substances.","ok":false,"trap":true,"why":"The man is not guilty of attempt because the jurisdiction in this case uses the dangerous-proximity test, and the facts do not show the man was in dangerously close proximity to a completed offense. Importantly, the man did not have drugs in his possession."},{"t":"Solicitation.","ok":true,"trap":false,"why":"Solicitation consists of counseling, advising, or commanding another to commit a crime with the specific intent that the person commit the crime. The man committed criminal solicitation when he attempted to cause the undercover officer to commit the crime of possessing a controlled substance."},{"t":"No crime.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Asking someone to commit the crime is solicitation; without dangerous proximity (and no drugs on him), it isn't attempt.","source":"adaptibar_import_filled.csv"},{"id":"CSV045","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"May the defendant properly be retried on the original charge of first-degree murder?","scenario":"A defendant was tried on a charge of first-degree premeditated murder. At the end of trial, the court granted the defendant's request to have the jury also instructed on the lesser included offense of second-degree murder. After being instructed on the elements of both first- and second-degree murder, the jury found the defendant guilty of second-degree murder. The defendant appealed. The appellate court reversed the conviction based on an erroneous evidentiary ruling.","q":"May the defendant properly be retried on the original charge of first-degree murder?","ru":"Conviction on lesser = implied acquittal of greater = no retrial up.","options":[{"t":"No, because the jury effectively acquitted the defendant of first-degree murder.","ok":true,"trap":false,"why":"A jury's conviction on a lesser charge constitutes an implied acquittal of a greater charge, thus barring retrial on that greater charge. Here, the defendant may not be retried for first-degree murder because the jury's conviction on the second-degree murder charge functions as an implied acquittal of the first-degree murder charge."},{"t":"No, because the vindictive-prosecution doctrine precludes punishing the defendant for taking the appeal.","ok":false,"trap":false,"why":""},{"t":"Yes, because the defendant was the one who sought a lesser included offense instruction.","ok":false,"trap":false,"why":""},{"t":"Yes, because the jury never returned a verdict on the first-degree murder charge.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Convicting on the lesser charge (2nd-degree) is an implied acquittal of the greater (1st-degree), so double jeopardy bars retrying 1st-degree.","source":"adaptibar_import_filled.csv"},{"id":"CSV046","subj":"Torts","sub":"Negligence","title":"Is the radiologist likely to have the punitive damages award vacated on appeal?","scenario":"A doctor ordered chest X-rays for a patient who smoked cigarettes. After the consulting radiologist told the doctor that the X-rays looked normal, the doctor told the patient that he was in good health. In fact, the radiologist had missed signs of cancer on the X-rays that a trained radiologist, acting competently, would have detected. After another X-ray of the patient's chest, performed one year later, showed advanced lung cancer, the doctor discovered that the radiologist had misinterpreted the patient's earlier X-rays. The patient died within four months of the later X-ray, because by then his cancer had become untreatable. In a wrongful death suit against the radiologist based on only the facts set out above, a jury found the radiologist negligent and awarded $3 million in compensatory damages and $21 million in punitive damages.","q":"Is the radiologist likely to have the punitive damages award vacated on appeal?","ru":"Punitives need willful/wanton — plain negligence won't do it.","options":[{"t":"No, because a 7 to 1 ratio of punitive to compensatory damages is constitutionally permissible.","ok":false,"trap":false,"why":""},{"t":"No, because an award of punitive damages is appropriate for medical malpractice that results in death or serious injury.","ok":false,"trap":false,"why":""},{"t":"Yes, because punitive damages awards are not authorized unless there is proof of willful or wanton misconduct on the defendant's part.","ok":true,"trap":false,"why":"Punitive damages may be awarded where there is proof of the defendant's willful or wanton misconduct. Although the radiologist was negligent, nothing in the facts provided suggests that the radiologist acted with willful or wanton misconduct. Thus, the radiologist is likely to have the punitive damages award vacated on appeal."},{"t":"Yes, because the patient smoked cigarettes and therefore was contributorily negligent.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Ordinary negligence doesn't support punitive damages; you need willful or wanton conduct, which isn't here.","source":"adaptibar_import_filled.csv"},{"id":"CSV047","subj":"Real Property","sub":"Mortgages","title":"Is the woman's proposal a viable foreclosure substitute under these facts?","scenario":"A woman purchased a house, financing the purchase with a 30-year mortgage granted to a local bank, which the bank promptly recorded. Five years later, the woman lost her job, had difficulty making her mortgage payments, and defaulted on several payments. The bank notified the woman that it would accelerate the mortgage debt as permitted by the mortgage. The woman tried to sell the house but could not find a buyer. The woman wants to avoid the publicity of a foreclosure sale and protect her credit rating. The house is not encumbered by any other liens. The woman has asked the bank if it would accept a deed to the house and relieve her from any further liability on the loan. The bank is receptive to the woman's proposal.","q":"Is the woman's proposal a viable foreclosure substitute under these facts?","ru":"Deed in lieu works when voluntary + no junior liens to wipe out.","options":[{"t":"No, because such a transaction would be a clog on the woman's equitable right of redemption.","ok":false,"trap":false,"why":""},{"t":"No, because this is residential property for which a foreclosure sale is required.","ok":false,"trap":false,"why":""},{"t":"Yes, because the proposal is voluntary and the bank would receive unencumbered title from the woman.","ok":true,"trap":false,"why":"As there are no other liens against the property, the bank's acceptance of the deed in lieu of foreclosure gives the bank a free and clear title to the property. Since the woman's proposal is also voluntary, it serves as a viable foreclosure substitute under the facts presented."},{"t":"Yes, because the transaction would constitute a valid short sale by the woman.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"With no other liens and a voluntary deal, a deed in lieu gives the bank clean title, so it's a valid foreclosure substitute.","source":"adaptibar_import_filled.csv"},{"id":"CSV048","subj":"Civil Procedure","sub":"Pretrial Procedures","title":"Is the court likely to grant the motion?","scenario":"A day before the applicable statutory limitations period expired, a worker filed a federal diversity action for defamation against her former employer, alleging that the employer had falsely and publicly accused her of stealing trade secrets. In describing the events that led to the false accusations, the complaint quoted a statement of a competitor made to the employer about the worker's alleged theft. During discovery, the worker deposed the competitor. One week after discovery closed, the worker moved to amend the complaint to add the competitor as a defendant. The competitor opposed the motion on the ground that the statutory limitations period had expired.","q":"Is the court likely to grant the motion?","ru":"Relation back for a new party = MISTAKE of identity, not a strategic add (15(c)).","options":[{"t":"No, because discovery has closed, and the competitor will be prejudiced.","ok":false,"trap":fa
