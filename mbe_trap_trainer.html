,"why":"The nephew and the niece inherited the vacant land as tenants in common. While neither is personally liable on the mortgage, their failure to pay could result in foreclosure. To avoid foreclosure, payment must be made to the bank, and as co-tenants, each is responsible for his or her share of the mortgage payment. The nephew paid more than his pro rata share and may recover the amount owed by the niece in a contribution action."},{"t":"The niece, because any such payment is not due until a partition proceeding is held.","ok":false,"trap":false,"why":""},{"t":"The niece, because the nephew did not seek or obtain her consent before he made the payments.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Co-tenants each owe their pro-rata share of a mortgage; a cotenant who overpaid to avoid foreclosure can get contribution.","source":"adaptibar_import_filled.csv"},{"id":"CSV083","subj":"Civil Procedure","sub":"Law Applied by Federal Courts","title":"Which of the following submissions on the instructions is correct?","scenario":"A real estate brokerage firm, which is incorporated and headquartered in State A, has brought a federal diversity action in State A against one of its former employees for theft of trade secrets. The former employee had worked at the firm's headquarters throughout her employment but is now a citizen of State B. The firm seeks compensatory and punitive damages. The court has asked the parties to submit proposed jury instructions on punitive damages and the relevant authority to support those instructions. State A's choice-of-law rules select State A law, which limits punitive damages to five times the amount of compensatory damages. Assume that the US Supreme Court has held that the Constitution limits punitive damages to 10 times the amount of compensatory damages.","q":"Which of the following submissions on the instructions is correct?","ru":"Diversity court uses the FORUM state's choice-of-law rules (Klaxon under Erie).","options":[{"t":"Punitive damages are limited to five times the amount of compensatory damages, because State A's choice-of-law rules select State A law.","ok":true,"trap":false,"why":"In Klaxon Co. v. Stentor Elec. Mfg. Co., 313 U.S. 498 (1941), the Supreme Court ruled that in cases governed by Erie R. Co. v. Tompkins, 304 U.S. 64 (1938), the court shall apply whatever law would be applied by the courts of the state in which the district court is sitting. Accordingly, the court should apply State A law on punitive damages because State A's choice-of-law rules select State A law."},{"t":"Punitive damages are limited to five times the amount of compensatory damages, because in a diversity case, the court applies the damages law of the state in which it sits.","ok":false,"trap":false,"why":""},{"t":"Punitive damages are limited to 10 times the amount of compensatory damages, because the action is in federal court.","ok":false,"trap":false,"why":""},{"t":"Punitive damages are limited to 10 times the amount of compensatory damages, because the constitutional limit preempts state-law limits.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A federal court in diversity uses the forum state's choice-of-law rules (Klaxon), so apply that state's law on punitives.","source":"adaptibar_import_filled.csv"},{"id":"CSV084","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"Should the court suppress the DNA sample?","scenario":"A defendant was arrested and charged with burglary. Under state law, police are required to obtain DNA samples from all persons arrested for felonies and to store those samples in a state registry. The police informed the defendant of the state law and said that they would be using a cheek swab to obtain a DNA sample from him. The defendant did not object. The defendant was later acquitted of burglary. A year later, however, authorities matched the defendant's DNA to an unsolved sexual assault crime. The defendant, now charged with sexual assault, has moved to suppress the DNA sample as having been obtained in violation of the Fourth Amendment.","q":"Should the court suppress the DNA sample?","ru":"DNA swab on felony arrest is constitutional (Maryland v. King) — no suppression.","options":[{"t":"No, because the defendant failed to lodge a timely objection to the sample collection.","ok":false,"trap":false,"why":""},{"t":"No, because the statute requiring collection of DNA samples from felony arrestees does not violate the Fourth Amendment.","ok":true,"trap":false,"why":"In Maryland v. King, 569 U.S. 435 (2013), the Supreme Court upheld the constitutionality of a state law that authorized police to take DNA samples from persons arrested for serious offenses. King also affirmed the right of law enforcement to test and store the DNA profiles in a government database and then compare them to unsolved crime scene samples. Here, the defendant was arrested and charged with a felony, and the DNA sample was obtained, stored, and used as authorized by statute. Thus, there was no constitutional violation, and suppression is not justified."},{"t":"No, because the statute violates the Fourth Amendment, but the police acted in good-faith reliance upon it.","ok":false,"trap":false,"why":""},{"t":"Yes, because the statute requiring collection of DNA samples from felony arrestees violates the Fourth Amendment.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Taking a DNA sample from someone arrested for a serious felony, then storing/comparing it, is constitutional (Maryland v. King).","source":"adaptibar_import_filled.csv"},{"id":"CSV085","subj":"Evidence","sub":"Hearsay and Circumstances of Its Admissibility","title":"Is the witness's testimony admissible?","scenario":"A defendant is on trial as one of the armed robbers of a liquor store. The defendant testifies that he robbed the store involuntarily because his fellow gang members threatened to kill him right then if he backed out, as he wanted to do. Thereafter, the defense seeks to call a witness who would testify that six months after the defendant was arrested in connection with the robbery, the defendant told him that he had been threatened when he wanted to pull out of the robbery. The prosecution objects to the witness's testimony.","q":"Is the witness's testimony admissible?","ru":"Defendant's self-serving statement is still hearsay if offered for truth — needs an exception.","options":[{"t":"No, because it includes the defendant's own hearsay statement that is not within any exception.","ok":true,"trap":false,"why":"The witness' testimony contains the defendant's out-of-court statement, and the facts suggest the defense intends to offer that statement for the truth of the matter asserted, that the defendant wanted to pull out of the robbery. Since there is no hearsay exception that applies to admit the statement, the testimony is inadmissible."},{"t":"No, because it includes a self-serving statement offered by a criminal accused.","ok":false,"trap":true,"why":"There is no Federal Rule of Evidence (FRE) that automatically prohibits the admission of a criminal defendant's self-serving statement. If such a statement fits a hearsay exception, it may be admissible, notwithstanding its self-serving nature."},{"t":"Yes, because the defendant's hearsay statement fits the state of mind exception.","ok":false,"trap":false,"why":""},{"t":"Yes, because it includes the prior consistent statement of the defendant, who testified as a witness.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The defendant's own out-of-court statement is offered for its truth with no exception, so it's inadmissible — being self-serving doesn't change the analysis.","source":"adaptibar_import_filled.csv"},{"id":"CSV086","subj":"Constitutional Law","sub":"Individual Rights","title":"Which of the following would be the strongest argument in challenging the constitutionality of the law under the equal protection clause of the Fourteenth Amendment?","scenario":"A state law requires that anyone convicted for the second time of a sex offense serve a specified minimum prison sentence and be sterilized. Statistics show that 50% of those convicted of sex offenses in the state over the past five years are members of racial minority groups, whereas the members of those groups account for only 15% of the state's general population. A significant majority of convicted sex offenders are male.","q":"Which of the following would be the strongest argument in challenging the constitutionality of the law under the equal protection clause of the Fourteenth Amendment?","ru":"Law burdening procreation -> fundamental right -> strict scrutiny (Skinner).","options":[{"t":"The requirement of sterilization deprives a select group of persons of a fundamental right, and it is not necessary to serve a compelling governmental interest.","ok":true,"trap":false,"why":"The Equal Protection Clause has been interpreted to extend to the fundamental right to procreate. See Skinner v. Oklahoma, 316 U.S. 535 (1942). In Skinner, the Court held that a state law that allowed for the sterilization of certain criminals violated the Equal Protection Clause because it denied them the fundamental right to procreate without a compelling state interest. Similarly here, a state law that burdens the fundamental right of procreation must satisfy strict judicial scrutiny, meaning it must be necessary to serve a compelling governmental interest. Therefore, an argument that the law does not pass strict scrutiny would be the strongest argument."},{"t":"The requirement of sterilization has a disproportionate impact on men, and it is not substantially related to an important governmental interest.","ok":false,"trap":false,"why":""},{"t":"The requirement of sterilization has a disproportionate impact on racial minorities, and it is not necessary to serve a compelling governmental interest.","ok":false,"trap":false,"why":""},{"t":"The requirement of sterilization is not rationally related to a legitimate governmental interest.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A sterilization-type law burdens the fundamental right to procreate, so the strongest challenge demands strict scrutiny (Skinner).","source":"adaptibar_import_filled.csv"},{"id":"CSV087","subj":"Contracts","sub":"Remedies","title":"Which of the following best describes the legal relationship between the parties at this point?","scenario":"A company agreed to provide regular facilities-maintenance services for a landlord's apartment buildings for $150 per hour. The parties also orally agreed that if the services required in any given month exceeded 100 hours, the landlord would pay the company a discounted hourly rate of $125 per hour for those extra services. When the parties put their agreement in writing, however, neither party noticed that the contract did not include the discounted-rate provision. In a recent month, because of several snowstorms, the services needed by the landlord exceeded 100 hours. The landlord has reminded the company that services in excess of 100 hours are to be paid at the discounted rate, but the company insists that it be paid at the contract rate of $150 per hour.","q":"Which of the following best describes the legal relationship between the parties at this point?","ru":"Term omitted by mutual mistake = reformation to match the real agreement.","options":[{"t":"The parties' contract is void ab initio because of the indefiniteness of the price term.","ok":false,"trap":false,"why":""},{"t":"The parties have a valid, enforceable contract that will be reformed to reflect the discounted rate of $125 per hour for services in excess of 100 hours.","ok":true,"trap":false,"why":"If a written agreement fails to include a term of the agreement due to a mistake by both parties, the writing may be reformed to express the actual agreement. Restatement (Second) of Contracts § 155. Here, the landlord is entitled to reformation to include the term that was mistakenly omitted by both parties."},{"t":"The parties have a valid, enforceable contract for all services at a rate of $150 per hour.","ok":false,"trap":false,"why":""},{"t":"The parties have no contract, because they were mutually mistaken regarding the hourly rate to be paid for the company's extra services.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Both parties mistakenly left a term out of the writing, so the remedy is reformation to put it back.","source":"adaptibar_import_filled.csv"},{"id":"CSV088","subj":"Real Property","sub":"Rights in Land","title":"Should the seller prevail?","scenario":"A buyer entered into a valid written contract with a seller to purchase vacant land. Unbeknownst to the seller, the buyer planned to construct a gas station on the land. The contract provided that the buyer could rescind the contract if the seller failed to deliver marketable title. After a title search, the buyer discovered that a restrictive covenant prohibited using the land for commercial purposes. The buyer had not had actual knowledge of the restrictive covenant before executing the contract. The buyer refused to close on the contract, and the seller has sued for specific performance.","q":"Should the seller prevail?","ru":"Undisclosed restrictive covenant = title unmarketable (unless excepted in the contract).","options":[{"t":"No, because the restrictive covenant rendered the title unmarketable.","ok":true,"trap":false,"why":"A seller is required to convey a marketable title to a buyer in the absence of a contrary provision in the contract. A restrictive covenant makes title unmarketable unless the covenant is excepted in the contract. Here, there is no exception in the contract; thus, the restrictive covenant makes the title unmarketable."},{"t":"No, because the seller was required to deliver perfect title to the buyer.","ok":false,"trap":false,"why":""},{"t":"Yes, because the restrictive covenant did not render the title unmarketable.","ok":false,"trap":false,"why":""},{"t":"Yes, because the seller was unaware of the buyer's plans to construct a gas station.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A seller must convey marketable title; an undisclosed restrictive covenant makes title unmarketable unless the contract carved it out.","source":"adaptibar_import_filled.csv"},{"id":"CSV089","subj":"Torts","sub":"Strict Liability and Products Liability","title":"Do the injured building occupants have viable strict liability claims against the sand distributor?","scenario":"An experienced construction company purchased sand in bulk from a distributor. The construction company mixed the sand with water and cement to make concrete. The distributor knew that an improper ratio of sand, water, and cement would result in defective concrete, but the distributor played no role in determining the ratio used by the construction company in mixing the concrete. The construction company used the concrete to form supporting columns for a building. A year later, the building collapsed during a minor earthquake, causing injury to the occupants. Although the sand was not defective, the concrete forming the columns was defective because the mixture ratio of the sand, water, and cement was not proper. The defective concrete was a cause in fact of the collapse.","q":"Do the injured building occupants have viable strict liability claims against the sand distributor?","ru":"Non-defective component supplier = no strict liability without substantial design participation.","options":[{"t":"No, because component suppliers are not strictly liable in tort.","ok":false,"trap":false,"why":""},{"t":"No, because the distributor neither advised nor participated with the construction company in determining the mixture of sand, water, and cement.","ok":true,"trap":false,"why":"A commercial seller of a nondefective component part that is incorporated into a finished product by the product's manufacturer is not strictly liable for injuries caused by the product unless the seller substantially participated in the integration of the part into the design of the finished product, and the integration of the component is what rendered the finished product defective. Restatement (Third) of Torts: Products Liability § 5 (1998). Here, the distributor did not substantially participate in the integration of the sand into the defective concrete used in the columns. Therefore, the distributor is not subject to liability under the doctrine of strict products liability."},{"t":"Yes, because the concrete columns were defective.","ok":false,"trap":false,"why":""},{"t":"Yes, because the distributor knew that an improper mixture of sand, water, and cement would result in defective concrete.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A seller of a non-defective component isn't strictly liable unless it substantially helped design the finished product into a defect, which it didn't.","source":"adaptibar_import_filled.csv"},{"id":"CSV090","subj":"Civil Procedure","sub":"Law Applied by Federal Courts","title":"Which law governs how the court should rule on the motion to dismiss?","scenario":"After a fire burned down a house that a tenant was renting, the tenant brought a federal diversity action against the landlord. The complaint alleged that the fire had been caused by the landlord's negligent failure to maintain the house's electrical system in accordance with the applicable housing code. The landlord's own investigation indicated that the fire had been caused by the tenant's leaving a soup pot unattended on a hot stove. The landlord has moved to dismiss the action on the ground that the tenant failed to comply with a state law that requires plaintiffs suing for negligence to plead that they were not contributorily negligent. In opposition to that motion, the tenant argues that under federal law, contributory negligence is an affirmative defense that a defendant who wishes to assert the defense must plead in an answer or other responsive pleading.","q":"Which law governs how the court should rule on the motion to dismiss?","ru":"Valid on-point FRCP beats conflicting state law (Hanna track).","options":[{"t":"Federal law, because the burden of pleading on a motion to dismiss in federal court is substantive, not procedural.","ok":false,"trap":false,"why":""},{"t":"Federal law, because the Federal Rules of Civil Procedure control pleading in federal court.","ok":true,"trap":false,"why":"When a Federal Rule of Civil Procedure (FRCP) is valid and on point, it controls over a conflicting state rule. FRCP 8(c)(1) is on point because it specifically provides that contributory negligence is an affirmative defense that a defending party must assert in its answer to the complaint. Additionally, the Rule is a valid exercise of the US Supreme Court's rulemaking power because the manner of pleading defenses is an issue that can rationally be classified as procedure, and the Rule itself regulates the manner and means to enforce the parties' rights."},{"t":"State law, because the application of federal law would be outcome-determinative.","ok":false,"trap":false,"why":""},{"t":"State law, because the assignment of the burden of pleading is bound up with the definition of the tenant's substantive rights.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A valid, on-point Federal Rule (8(c) on affirmative defenses) controls over conflicting state law (Hanna/REA).","source":"adaptibar_import_filled.csv"},{"id":"CSV091","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"If the court finds a reasonable probability that the mitigating evidence, if presented, would have affected the jury's sentence, should the court grant the petition?","scenario":"Assigned counsel for a capital defendant had heard that his client had an unsavory background and a highly dysfunctional childhood. He was reluctant to delve into the details for fear that they might reflect poorly on his client, and he decided not to investigate. After his client was convicted, counsel presented a penalty phase defense that repeated the denials of the liability phase. The jury returned a death sentence. After exhausting state remedies, the defendant filed a post-conviction petition, arguing that his trial counsel rendered ineffective assistance of counsel by failing to investigate and present mitigating evidence of his sordid upbringing.","q":"If the court finds a reasonable probability that the mitigating evidence, if presented, would have affected the jury's sentence, should the court grant the petition?","ru":"IAC = deficient performance + prejudice (reasonable probability of different result) (Strickland).","options":[{"t":"No, because the decision not to probe into the defendant's background was part of the defense counsel's trial strategy.","ok":false,"trap":false,"why":""},{"t":"No, because defense counsel is required to adhere only to an objective standard of reasonableness in representing a criminal defendant in the penalty phase of a capital murder case.","ok":false,"trap":false,"why":""},{"t":"Yes, because defense counsel's failure to investigate a defendant's life history for mitigating evidence in the penalty phase of a capital murder trial constitutes ineffective assistance of counsel.","ok":true,"trap":false,"why":"To establish a claim of ineffective assistance of counsel, a defendant must show two things: (1) that defense counsel's performance was deficient and (2) that the deficiency was prejudicial. Strickland v. Washington, 466 U.S. 668 (1984). Defense counsel has a duty to conduct a reasonable investigation to determine whether there are mitigating facts for the penalty phase of a capital case. Wiggins v. Smith, 539 U.S. 510 (2003). In Wiggins, the Court held that defense counsel's inadequate investigation was prejudicial because a reasonable investigation would have revealed details that gave rise to a reasonable probability of a different outcome in sentencing; thus, the defendant had been deprived of the effective assistance of counsel. Here, as in Wiggins, defense counsel unreasonably chose not to investigate facts that could have been presented in mitigation, and a reasonable investigation would have revealed facts that gave rise to a reasonable probability of a different outcome during sentencing. Therefore, defense counsel's failure was prejudicial, and the court should grant the petition."},{"t":"Yes, because defense counsel is required to present any known mitigating factors in the penalty phase of a capital murder case.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Ineffective assistance needs deficient performance plus prejudice; a reasonable-probability-of-different-sentence finding satisfies prejudice, so grant the petition (Strickland/Wiggins).","source":"adaptibar_import_filled.csv"},{"id":"CSV092","subj":"Constitutional Law","sub":"Relations Between Federal and State Governments","title":"May the state collect this tax on the lease of office space in the state by the United States Social Security Administration?","scenario":"A state law imposes a tax on all leases of real estate. The tax is calculated on gross rent and is imposed on the lessee at the beginning of each lease term.","q":"May the state collect this tax on the lease of office space in the state by the United States Social Security Administration?","ru":"No direct state tax on the federal government or its agencies (intergovernmental immunity).","options":[{"t":"No, because such a tax on lessees is not rationally related to a legitimate government interest.","ok":false,"trap":false,"why":""},{"t":"No, because the state may not directly tax any agency of the federal government.","ok":true,"trap":false,"why":"A state cannot impose a tax directly on the federal government or any of its agencies. United States v. New Mexico, 455 U.S. 720 (1982). Therefore, the state may not collect the tax on the lease of real estate by the Social Security Administration."},{"t":"Yes, because the Social Security Administration is an independent agency of the federal government.","ok":false,"trap":false,"why":""},{"t":"Yes, because the tax is imposed on all leases of real estate and does not discriminate against the federal government.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A state can't tax the federal government or its agencies directly, so it can't tax the SSA's lease.","source":"adaptibar_import_filled.csv"},{"id":"CSV093","subj":"Contracts","sub":"Formation of Contracts","title":"Is the neighbor likely to prevail?","scenario":"A father whose only living relatives were a daughter and a nephew owned land worth $500,000. In return for his daughter's promise to pay $300,000 to his nephew at the time of the father's death, the father executed and delivered to his daughter a quitclaim deed to the land. The daughter took possession of the land. Two years later, in a signed writing, the father directed his daughter to pay to a neighbor, at the father's death, $50,000 of the $300,000 that was to go to the nephew. The daughter, who had long disliked the neighbor, told her father that she did not plan to honor his request. The father died, and his daughter has since refused to pay anything to either the nephew or the neighbor. The neighbor has sued the daughter for the $50,000.","q":"Is the neighbor likely to prevail?","ru":"Common-law modification = mutual assent + NEW consideration (pre-existing duty fails).","options":[{"t":"No, because the daughter did not consent to any modification of the contract she had made with her father.","ok":true,"trap":false,"why":"Modification of a contract governed by common law requires mutual assent and consideration. Here, the daughter did not agree to the modification and the father provided no consideration. Therefore, there was no modification of the contract, and the neighbor is not likely to prevail in an action against the daughter."},{"t":"No, because the nephew was a third-party beneficiary of the contract between the father and his daughter, and the nephew's interest could not be modified without his express written consent.","ok":false,"trap":false,"why":""},{"t":"Yes, because the father retained a transferable interest in the future proceeds of his daughter's promise.","ok":false,"trap":false,"why":""},{"t":"Yes, because the father's signed modification is enforceable without consideration.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Common-law modification needs mutual assent AND new consideration; the daughter didn't agree and there was no consideration, so no modification.","source":"adaptibar_import_filled.csv"},{"id":"CSV094","subj":"Torts","sub":"Strict Liability and Products Liability","title":"On which of the following theories is the spectator most likely to be able to obtain a summary judgment as to liability?","scenario":"While attending an amusement park's fireworks display, a spectator was struck and injured by a rocket set off as part of the display. The rocket unexpectedly failed to shoot upward but instead followed a trajectory parallel to the ground and struck the spectator. The spectator has sued the amusement park for damages.","q":"On which of the following theories is the spectator most likely to be able to obtain a summary judgment as to liability?","ru":"Fireworks/blasting = abnormally dangerous activity -> strict liability.","options":[{"t":"Abnormally dangerous activity.","ok":true,"trap":false,"why":"Even though the spectator might not obtain summary judgment on a claim of liability for an abnormally dangerous activity, of the choices given, it provides the spectator with the best chance of doing so. Historically, fireworks have been considered to be an abnormally dangerous activity; that is, an activity that poses a high risk of physical harm that cannot be eliminated even when all actors are reasonably careful."},{"t":"Battery.","ok":false,"trap":false,"why":""},{"t":"Nuisance.","ok":false,"trap":false,"why":""},{"t":"Strict products liability.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Fireworks are an abnormally dangerous activity, so strict liability gives the spectator the best shot at summary judgment.","source":"adaptibar_import_filled.csv"},{"id":"CSV095","subj":"Evidence","sub":"Hearsay and Circumstances of Its Admissibility","title":"Is the newspaper story admissible?","scenario":"A plaintiff has sued a defendant in federal court, alleging that the defendant knowingly pursued the plaintiff for payment of debts in violation of an automatic bankruptcy stay. The defendant has moved for summary judgment, arguing that he had no notice of the plaintiff's bankruptcy. In opposing the defendant's motion for summary judgment, the plaintiff offers a copy of the local newspaper that contains a front-page story about the plaintiff's petition for bankruptcy, along with evidence that the defendant is a daily subscriber to the newspaper. The defendant objects to admission of the newspaper story.","q":"Is the newspaper story admissible?","ru":"Newspaper self-authenticates (902(6)); offered for notice = not hearsay.","options":[{"t":"No, because the plaintiff has not offered proper authentication of the story.","ok":false,"trap":false,"why":""},{"t":"No, because the story constitutes hearsay not within any exception.","ok":false,"trap":false,"why":""},{"t":"Yes, because the story satisfies the past recollection recorded exception to the hearsay rule.","ok":false,"trap":false,"why":""},{"t":"Yes, because the newspaper is self-authenticating and the story is not offered for its truth.","ok":true,"trap":false,"why":"The newspaper is self-authenticating under Federal Rule of Evidence (FRE) 902(6), which establishes items of evidence that require no extrinsic evidence of authenticity in order to be admitted. These items include newspapers and periodicals. The newspaper story is not hearsay, because it is not offered for its truth, but rather to show that the defendant was on notice of the plaintiff's bankruptcy."}],"_b":true,"plain":"The newspaper is self-authenticating, and the story is offered to show notice (not its truth), so it isn't hearsay.","source":"adaptibar_import_filled.csv"},{"id":"CSV096","subj":"Real Property","sub":"Mortgages","title":"Does the investor have the right to foreclose?","scenario":"A buyer purchased a commercial building and financed the purchase by executing both a negotiable promissory note and a mortgage to the bank to secure repayment of the loan. The mortgage was promptly recorded. Six months later, the bank assigned only the promissory note to an investor. The assignment made no express reference to the mortgage and was not recorded in the public land records. The bank immediately sent the buyer a notice of the assignment, which provided the address of the investor and explained that the bank was no longer servicing the loan. The buyer made timely payments to the investor for two years but then defaulted on the loan. After the buyer failed to cure the default, the investor accelerated the debt and commenced a foreclosure action. The buyer's defense in the foreclosure action is that the investor is not the mortgagee and therefore has no right to foreclose.","q":"Does the investor have the right to foreclose?","ru":"Mortgage follows the note — assign the note, you get the mortgage.","options":[{"t":"No, because the mortgage did not automatically accompany the assignment of the note to the investor.","ok":false,"trap":false,"why":""},{"t":"No, because the mortgage was extinguished when the bank assigned and transferred only the note to the investor.","ok":false,"trap":false,"why":""},{"t":"Yes, because the investor became the owner of both the note and the mortgage by virtue of the assignment of the note to him.","ok":true,"trap":false,"why":"The assignment of a note automatically transfers the mortgage to the assignee of the note. A separate document assigning the mortgage to the assignee is unnecessary. Here, the assignment of the note to the investor allows the investor to bring the foreclosure as the proper party with all of the rights under the loan documents."},{"t":"Yes, because the public land records continue to show the investor's predecessor in title as the mortgagee.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Assigning the note automatically carries the mortgage with it, so the investor can foreclose (mortgage follows the note).","source":"adaptibar_import_filled.csv"},{"id":"CSV097","subj":"Civil Procedure","sub":"Pretrial Procedures","title":"Can the broker join the contract claim?","scenario":"An investor has sued a broker in federal court for violation of federal securities law, claiming that the broker misrepresented the investments he made on the investor's behalf. The investor and the broker are citizens of State A. The broker would like to assert a breach of contract claim as a counterclaim to the investor's action, alleging that the investor failed to pay the broker for the investments he made on her behalf.","q":"Can the broker join the contract claim?","ru":"Same transaction/occurrence = compulsory counterclaim (13(a)) — raise it or lose it.","options":[{"t":"No, because the contract claim is governed by state law.","ok":false,"trap":false,"why":""},{"t":"No, because the parties are not diverse.","ok":false,"trap":false,"why":""},{"t":"Yes, because the contract claim is a compulsory counterclaim.","ok":true,"trap":false,"why":"The contract claim is a compulsory counterclaim under Federal Rule of Civil Procedure (FRCP) 13(a) because it arises out of the same transaction or occurrence that is the subject matter of the investor's claim. Not only may the broker assert the contract claim, but the claim must be included in the broker's answer, or it will be considered waived."},{"t":"Yes, because the contract claim is a permissive counterclaim.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The contract counterclaim arises from the same transaction as the investor's claim, so it's compulsory and must be raised or it's waived.","source":"adaptibar_import_filled.csv"},{"id":"CSV098","subj":"Torts","sub":"Other Torts","title":"If the homeowner were to sue the farmer for private nuisance, which of the following would be the farmer's best argument against liability?","scenario":"The owner of a home in a rural area had for many years enjoyed unspoiled views of the surrounding countryside from her back deck. Several months ago, a neighboring farmer placed unsightly items, including an old, rusted tractor and some machine parts, entirely on his own property, but in a location visible from the homeowner's deck. The homeowner asked the farmer to move the items to a different area of the farm, out of the homeowner's line of sight. The farmer acknowledged that it was not common for farmers in the area to keep old equipment on their land in locations visible to neighbors, but nonetheless refused to move the items. Concerned that the farmer's placement of the items might adversely affect the resale value of the property, the homeowner paid for an appraisal of her own property. The appraisal determined that the market value of the property had not been diminished by the farmer's actions.","q":"If the homeowner were to sue the farmer for private nuisance, which of the following would be the farmer's best argument against liability?","ru":"Unsightliness alone usually isn't an unreasonable interference for nuisance.","options":[{"t":"The unsightly items have not caused a decrease in the market value of the homeowner's property.","ok":false,"trap":false,"why":""},{"t":"The unsightly items do not physically encroach on the homeowner's property.","ok":false,"trap":false,"why":""},{"t":"It is not common for farmers in the area to keep old equipment on their land in places that are visible to neighbors.","ok":false,"trap":false,"why":""},{"t":"Unsightly conditions ordinarily do not of themselves amount to an unreasonable interference with the use and enjoyment of a neighboring property.","ok":true,"trap":false,"why":"The question asks for the best argument against liability. Courts historically have held that causing a property owner to view unsightly things from their property does not by itself establish the sort of unreasonable interference with the use and enjoyment of property that is necessary for nuisance liability. While there is no guarantee that the farmer would prevail on the basis of this argument, it would be the farmer's best argument against liability."}],"_b":true,"plain":"Merely having to look at ugly stuff usually isn't the unreasonable interference nuisance requires, so that's the farmer's best argument.","source":"adaptibar_import_filled.csv"},{"id":"CSV099","subj":"Real Property","sub":"Titles","title":"In an appropriate action to determine the ownership of the apartment building, who will likely prevail?","scenario":"A woman who owned an apartment building decided to give the building to a man whose wife she did not care for. The woman signed and promptly recorded a deed properly describing the property and identifying the man by name. The deed specified that under no circumstances was the property \"to ever pass to [the man's wife].\" Unbeknownst to the woman, the man had died before she executed and recorded the deed. Under the man's duly probated will, he had devised all of his property to his wife. When the woman learned of the man's death, she said in the presence of several witnesses, \"I must take back that deed, because I don't want [the man's wife] to own the apartment building.\" Before the woman could do anything about the deed, however, she died. By her duly probated will, she left all of her estate to her niece. There are no applicable statutes.","q":"In an appropriate action to determine the ownership of the apartment building, who will likely prevail?","ru":"Deed to a grantee already dead = VOID (no living grantee to take title).","options":[{"t":"The man's wife, because the deed to the man was recorded.","ok":false,"trap":false,"why":""},{"t":"The man's wife, because the man's will was probated.","ok":false,"trap":false,"why":""},{"t":"The niece, because of the woman's clearly stated intent to take back the gift.","ok":false,"trap":false,"why":""},{"t":"The niece, because the deed to the man is void.","ok":true,"trap":false,"why":"Property cannot be conveyed to a grantee that does not exist, and so a deed to a deceased grantee is void. Here, the deed to the man is void as he was deceased at the time of transfer."}],"_b":true,"plain":"You can't convey to a dead grantee, so the deed to the already-deceased man is void and the building passes through the grantor's estate.","source":"adaptibar_import_filled.csv"},{"id":"CSV100","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"Should the court grant the motion to suppress?","scenario":"After reading a description of a person who had committed a rape, a parole officer noted that the description resembled one of his parolees. The officer called the parolee and asked him to drop by his office. The parolee came to the office and, after about 30 minutes of questioning, admitted having committed the rape. At no time did the officer give the parolee Miranda warnings. The parolee was charged with rape and has moved to suppress his statement to the parole officer.","q":"Should the court grant the motion to suppress?","ru":"'In custody' = formal-arrest-level restraint, not just a duty to report/answer (Murphy).","options":[{"t":"No, because a parolee has no privilege against self-incrimination.","ok":false,"trap":false,"why":""},{"t":"No, because the parolee was not in custody.","ok":true,"trap":false,"why":"A Miranda warning is required whenever a suspect is in custody and being subjected to custodial interrogation. The \"in custody\" requirement is not met simply because a probationer or parolee is under a general obligation to appear and answer questions truthfully. Minnesota v. Murphy, 465 U.S. 420 (1984). Instead, a person is \"in custody\" only when under \"formal arrest or restraint on freedom of movement of the degree associated with a formal arrest.\" Id. Therefore, the court should deny the motion to suppress because the parolee was not in custody."},{"t":"Yes, because Miranda warnings are required before interrogation by law enforcement officers.","ok":false,"trap":false,"why":""},{"t":"Yes, because the parolee's statements were compelled, as he could reasonably believe that he was required to answer questions asked by his parole officer.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Being a parolee with a general duty to answer isn't 'in custody'; no formal-arrest-level restraint means no Miranda warnings were required.","source":"adaptibar_import_filled.csv"}];

function normalizeMBESubject(rawSubject) {
  const s = String(rawSubject || "")
    .trim()
    .replace(/\s+/g, " ")
    .toLowerCase();

  const aliases = {
    "civil procedure": "Civil Procedure",
    "civ pro": "Civil Procedure",
    "federal civil procedure": "Civil Procedure",

    "constitutional law": "Constitutional Law",
    "con law": "Constitutional Law",

    "contracts": "Contracts",
    "contract law": "Contracts",

    "criminal law": "Criminal Law and Procedure",
    "criminal procedure": "Criminal Law and Procedure",
    "criminal law and procedure": "Criminal Law and Procedure",
    "crim law": "Criminal Law and Procedure",
    "crim pro": "Criminal Law and Procedure",

    "evidence": "Evidence",

    "real property": "Real Property",
    "property": "Real Property",

    "torts": "Torts"
  };

  return aliases[s] || rawSubject || "Uncategorized";
}

function normalizeMBESubtopic(subject, rawSubtopic) {
  const normalizedSubject = normalizeMBESubject(subject);

  const cleaned = String(rawSubtopic || "")
    .trim()
    .replace(/\s+/g, " ")
    .replace(/\s*\(Simulated\)\s*$/i, "");

  const allowed = ADAPTIBAR_MBE_TAXONOMY[normalizedSubject] || [];

  const exact = allowed.find(
    x => x.toLowerCase() === cleaned.toLowerCase()
  );

  if (exact) return exact;

  const aliases = {
    "jurisdiction & venue": "Jurisdiction and Venue",
    "law applied by federal courts": "Law Applied by Federal Courts",
    "verdicts & judgments": "Verdicts and Judgments",
    "appealability & review": "Appealability and Review",

    "judicial review": "Judicial Review",
    "separation of powers": "Separation of Powers",
    "federalism": "Relations Between Federal and State Governments",
    "individual rights": "Individual Rights",

    "formation": "Formation of Contracts",
    "formation of contracts": "Formation of Contracts",
    "defenses": "Defenses to Enforceability",
    "contract content": "Contract Content and Meaning",
    "performance and breach": "Performance, Breach, and Discharge",
    "performance breach and discharge": "Performance, Breach, and Discharge",
    "third party rights": "Third-Party Rights",
    "third-party rights": "Third-Party Rights",

    "inchoate crimes and parties": "Inchoate Crimes",
    "inchoate crimes; parties": "Inchoate Crimes",
    "constitutional protections of accused persons": "Constitutional Protection of Accused Persons",
    "constitutional protection of accused persons": "Constitutional Protection of Accused Persons",

    "relevancy": "Relevancy and Excluding Relevant Evidence",
    "relevancy and reasons for excluding relevant evidence": "Relevancy and Excluding Relevant Evidence",
    "hearsay": "Hearsay and Circumstances of Its Admissibility",
    "original writings": "Writings, Recordings, and Photographs",

    "ownership of real property": "Ownership",
    "rights in real property": "Rights in Land",
    "real estate contracts": "Contracts",
    "mortgages/security devices": "Mortgages",
    "mortgages and security devices": "Mortgages",

    "strict liability/products liability": "Strict Liability and Products Liability",
    "strict liability and product liability": "Strict Liability and Products Liability"
  };

  const alias = aliases[cleaned.toLowerCase()];

  if (alias && allowed.includes(alias)) return alias;

  return cleaned || "Uncategorized";
}

function isKnownMBESubtopic(subject, subtopic) {
  const normalizedSubject = normalizeMBESubject(subject);
  return (ADAPTIBAR_MBE_TAXONOMY[normalizedSubject] || []).includes(subtopic);
}

function allocateMBECategory(cardOrRaw) {
  const rawSubject = cardOrRaw.subj || cardOrRaw.subject || cardOrRaw.rawSubject || "";
  const rawSubtopic = cardOrRaw.sub || cardOrRaw.subtopic || cardOrRaw.rawSubtopic || "";

  const subject = normalizeMBESubject(rawSubject);
  const subtopic = normalizeMBESubtopic(subject, rawSubtopic);
  const mbeKey = `${subject} / ${subtopic}`;

  return {
    subj: subject,
    sub: subtopic,
    mbeKey,
    rawSubject: String(rawSubject || "").trim(),
    rawSubtopic: String(rawSubtopic || "").trim(),
    needsCategoryReview: !isKnownMBESubtopic(subject, subtopic)
  };
}

function applyCategoryToCard(card) {
  if (!card) return card;
  const migrated = migrateCardCategories([card])[0];
  Object.assign(card, migrated);
  return card;
}

function migrateCardCategories(cards) {
  return cards.map(card => {
    const allocated = allocateMBECategory(card);

    return {
      ...card,
      subj: allocated.subj,
      sub: allocated.sub,
      mbeKey: allocated.mbeKey,
      rawSubject: card.rawSubject || allocated.rawSubject,
      rawSubtopic: card.rawSubtopic || allocated.rawSubtopic,
      needsCategoryReview: allocated.needsCategoryReview
    };
  });
}

function subtopicsFor(subject) {
  return ADAPTIBAR_MBE_TAXONOMY[normalizeMBESubject(subject)] || [];
}

function cardMbeKey(c) {
  return c.mbeKey || `${normalizeMBESubject(c.subj)} / ${normalizeMBESubtopic(c.subj, c.sub)}`;
}

function normalizeSubjectLineTopLevel(label, expectedSubjectIndex = 0, currentSubject = null) {
  const cleaned = String(label || "").trim().toLowerCase();

  if (currentSubject === "Real Property" && cleaned === "contracts") {
    return null;
  }

  const candidate = normalizeMBESubject(label);
  if (!MBE_SUBJECT_SEQUENCE.includes(candidate)) return null;

  const candidateIndex = MBE_SUBJECT_SEQUENCE.indexOf(candidate);

  if (candidate === "Contracts" && expectedSubjectIndex > candidateIndex) {
    return null;
  }

  if (candidateIndex < expectedSubjectIndex) {
    return null;
  }

  return candidate;
}

function parseAdaptibarSubjectPerformance(raw) {
  const text = String(raw || "")
    .replace(/\u00a0/g, " ")
    .replace(/\r/g, "");

  const lines = text
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean);

  const result = {
    questionsAnswered: null,
    overallAccuracy: null,
    dateRange: null,
    subjects: {}
  };

  for (const line of lines) {
    const qa = line.match(/^Questions Answered:\s*(\d+)/i);
    if (qa) {
      result.questionsAnswered = Number(qa[1]);
      continue;
    }

    const acc = line.match(/^Accuracy Rate:\s*(\d+(?:\.\d+)?)%/i);
    if (acc) {
      result.overallAccuracy = Number(acc[1]);
      continue;
    }

    const dr = line.match(/^Date Range:\s*(.+)$/i);
    if (dr) {
      result.dateRange = dr[1].trim();
      continue;
    }
  }

  let currentSubject = null;
  let expectedSubjectIndex = 0;

  for (const line of lines) {
    const m = line.match(SCORE_LINE_RE);
    if (!m) continue;

    const accuracy = Number(m[1]);
    const label = m[2].trim();
    const total = Number(m[3]);

    const normalizedTop = normalizeSubjectLineTopLevel(label, expectedSubjectIndex, currentSubject);

    if (normalizedTop) {
      currentSubject = normalizedTop;
      expectedSubjectIndex = Math.max(
        expectedSubjectIndex,
        MBE_SUBJECT_SEQUENCE.indexOf(normalizedTop) + 1
      );

      if (!result.subjects[currentSubject]) {
        result.subjects[currentSubject] = {
          total,
          accuracy,
          subtopics: {}
        };
      } else {
        result.subjects[currentSubject].total = total;
        result.subjects[currentSubject].accuracy = accuracy;
      }

      continue;
    }

    if (!currentSubject) continue;

    const subtopic = normalizeMBESubtopic(currentSubject, label);
    const mbeKey = `${currentSubject} / ${subtopic}`;

    result.subjects[currentSubject].subtopics[subtopic] = {
      total,
      accuracy,
      mbeKey
    };
  }

  return result;
}

function fullText(value) {
  return String(value || "").trim();
}

function expandPhraseForMatching(phrase) {
  const p = String(phrase || "").trim();
  const aliases = TRIGGER_ALIASES[p] || [];
  return [...new Set([p, ...aliases].filter(Boolean))];
}

function phraseInStem(stem, phrase) {
  return expandPhraseForMatching(phrase).some(v => containsPhrase(stem, v));
}

function cleanRuleFromExplanation(explanation) {
  const text = String(explanation || "").trim();
  if (!text) return "Identify the controlling rule from the correct answer explanation.";
  const sentences = text
    .replace(/\s+/g, " ")
    .split(/(?<=[.!?])\s+/)
    .filter(Boolean);
  const ruleSentences = sentences.filter(s =>
    /\brequires\b|\bmust\b|\bmay\b|\bgenerally\b|\bunless\b|\bnot sufficient\b|\belement\b|\bintent\b|\bsubstantial certainty\b/i.test(s)
  );
  return (ruleSentences.length ? ruleSentences : sentences)
    .slice(0, 3)
    .join(" ");
}

function cleanTakeaway(explanation) {
  const text = String(explanation || "").replace(/\s+/g, " ").trim();
  if (!text) return "Spot the trigger fact, state the rule, and avoid the trap.";
  const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  const best = sentences.find(s =>
    /\bnot\b|\brequires\b|\bmust\b|\bunless\b|\bintent\b|\bsubstantial certainty\b|\btherefore\b/i.test(s)
  ) || sentences[0];
  return best.replace(/^Here,?\s*/i, "").trim();
}

function validateTriggerAnalysis(a) {
  const warnings = [];
  if (!a.doctrine || (a.doctrine.includes(" / ") && !a.doctrine.includes("—"))) {
    warnings.push("Doctrine may be too generic.");
  }
  if (!a.ruleTested || a.ruleTested.length > 700) {
    warnings.push("Rule tested is missing or too long.");
  }
  if (a.oneSentenceTakeaway && !/[.!?]$/.test(a.oneSentenceTakeaway.trim())) {
    warnings.push("Takeaway appears cut off.");
  }
  if (a.thresholdQuestion === "What threshold fact activates this rule?") {
    warnings.push("Threshold question is generic.");
  }
  if ((a.whyEachTriggerMatters || []).some(x =>
    String(x.why || "").includes("Key fact that activates") ||
    String(x.why || "").includes("Key trigger for")
  )) {
    warnings.push("Trigger explanations are generic.");
  }
  return warnings;
}

function recordImportedAttempt(card, parsedAttempt) {
  const stats = { ...defaultCardStats(), ...getCardStats(card) };
  stats.importedAttempts = stats.importedAttempts || [];
  const attempt = {
    dateAnswered: parsedAttempt.dateAnswered || null,
    dateAnsweredRaw: parsedAttempt.dateAnsweredRaw || "",
    selectedLetter: parsedAttempt.selectedLetter || null,
    correctLetter: parsedAttempt.correctLetter || null,
    selectedAnswerText: parsedAttempt.selectedAnswerText || "",
    correctAnswerText: parsedAttempt.correctAnswerText || ""
  };
  const duplicate = stats.importedAttempts.some(a =>
    a.dateAnswered === attempt.dateAnswered &&
    a.selectedLetter === attempt.selectedLetter &&
    a.correctLetter === attempt.correctLetter
  );
  if (!duplicate) stats.importedAttempts.push(attempt);
  setCardStats(card, stats);
}

function containsPhrase(text, phrase) {
  return String(text || "").toLowerCase().includes(String(phrase || "").toLowerCase());
}

function limitTriggerPhrases(phrases, max, doctrine) {
  max = max || ((doctrine || "").includes("Battery Intent") ? 10 : 6);
  return [...new Set((phrases || []).filter(Boolean))]
    .sort((a, b) => b.length - a.length)
    .slice(0, max);
}

function cardTriggerDictKeys(card, doctrine) {
  const subject = normalizeMBESubject(card.subj);
  const subtopic = normalizeMBESubtopic(subject, card.sub);
  const mbeKey = `${subject} / ${subtopic}`;
  const rawSub = String(card.sub || "").trim();
  const title = String(card.title || "").trim();
  return [...new Set([mbeKey, `${subject} / ${rawSub}`, title, doctrine, subject].filter(Boolean))];
}

function cardKey(card) {
  if (!card) return '';
  return card.advId || card.id || `${normalizeMBESubject(card.subj)}|${normalizeMBESubtopic(card.subj, card.sub) || ''}`;
}

// Content-based fingerprint for detecting duplicate cards (used during import)
function getCardFingerprint(c) {
  if (!c) return '';
  // Primary key: AdaptiBar question ID if available
  if (c.advId) return 'adv:' + c.advId;
  // Fallback for manual / imported cards: normalize key fields
  const norm = (str) => (str || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
  const correctOpt = (c.options || []).find(o => o.ok) || {};
  return [
    'manual',
    norm(c.subj),
    norm(c.sub),
    norm(c.title || c.q),
    norm(c.scenario),
    norm(correctOpt.t)
  ].join('||');
}

function builtinQuestionIds() {
  const ids = new Set();
  BUILTIN.forEach(c => {
    if (c.advId) ids.add(String(c.advId));
    if (c.id) ids.add(String(c.id));
  });
  return ids;
}

function isBuiltinQuestion(advIdOrId) {
  return advIdOrId != null && builtinQuestionIds().has(String(advIdOrId));
}

function normalizeRuleText(str) {
  return String(str || '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(the|a|an|is|are|was|were|that|which|may|must|can|will|not|only|when|if|because|also|this|these|those|such|under|into|from|with|for|and|or|but|by|at|on|in|to|of|as|be|has|have|had|does|do|did|should|would|could|generally|however|therefore|thus|where|while|although|even|still|yet|all|any|each|both|other|than|then|so|very|just|about|over|after|before|during|through|between|within|without|against|upon|via|per|including|regarding|concerning)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function getCardRuleProfile(card) {
  const stats = getCardStats(card);
  const ta = stats.triggerAnalysisOverride || stats.triggerAnalysis || card.triggerAnalysis;
  let doctrine = '';
  let ruleTested = '';
  if (ta && ta.doctrine) {
    doctrine = ta.doctrine;
    ruleTested = ta.ruleTested || '';
  } else {
    doctrine = inferDoctrine(card);
    const correct = (card.options || []).find(o => o.ok);
    ruleTested = inferRuleTested(card, correct, doctrine);
  }
  const correct = (card.options || []).find(o => o.ok);
  const correctText = normalizeRuleText(correct && correct.t ? correct.t : '');
  const ruleNorm = normalizeRuleText(ruleTested);
  const doctrineNorm = normalizeRuleText(doctrine);
  const builtinTitleNorm = card._b ? normalizeRuleText(card.title || '') : '';
  let groupKey = '';
  let groupLabel = '';
  let matchBasis = 'doctrine';

  if (builtinTitleNorm.length >= 18) {
    groupKey = 'builtin:' + builtinTitleNorm.slice(0, 140);
    groupLabel = card.title || doctrine;
    matchBasis = 'built-in title';
  } else if (ruleNorm.length >= 28) {
    groupKey = 'rule:' + ruleNorm.slice(0, 140) + (correctText ? '|ans:' + correctText.slice(0, 80) : '');
    groupLabel = ruleTested.length > 140 ? ruleTested.slice(0, 137) + '…' : ruleTested;
    matchBasis = 'rule tested';
  } else if (doctrineNorm.length >= 8) {
    groupKey = 'doctrine:' + doctrineNorm + (correctText ? '|ans:' + correctText.slice(0, 80) : '');
    groupLabel = doctrine;
    matchBasis = 'doctrine + correct answer';
  } else {
    const subj = normalizeMBESubject(card.subj);
    const sub = normalizeMBESubtopic(subj, card.sub);
    groupKey = 'topic:' + normalizeRuleText(subj + ' ' + sub);
    groupLabel = `${subj} / ${sub}`;
    matchBasis = 'subtopic fallback';
  }

  return {
    doctrine,
    ruleTested,
    groupKey,
    groupLabel,
    matchBasis,
    correctText
  };
}

function cardRefLabel(card) {
  if (card.advId) return 'Q#' + card.advId;
  if (card._b) return 'built-in ' + card.id;
  return String(card.id || 'card');
}

function findSameRuleGroups(cards) {
  const map = new Map();
  for (const card of cards) {
    try {
      enrichCardWithTriggerAnalysis(card);
    } catch (e) {}
    const profile = getCardRuleProfile(card);
    if (!map.has(profile.groupKey)) {
      map.set(profile.groupKey, {
        label: profile.groupLabel,
        doctrine: profile.doctrine,
        matchBasis: profile.matchBasis,
        items: []
      });
    }
    map.get(profile.groupKey).items.push({
      id: card.id,
      advId: card.advId || null,
      builtin: !!card._b,
      ref: cardRefLabel(card),
      title: card.title || card.q || '',
      subj: card.subj,
      sub: card.sub,
      mbeKey: cardMbeKey(card)
    });
  }
  const groups = [...map.values()]
    .filter(g => g.items.length > 1)
    .sort((a, b) => b.items.length - a.items.length || a.label.localeCompare(b.label));
  const redundantCount = groups.reduce((n, g) => n + g.items.length - 1, 0);
  return { groups, redundantCount, uniqueRuleCount: cards.length - redundantCount };
}

function runRuleOverlapCheck() {
  return findSameRuleGroups(allCards().map(c => ({ ...c, _b: !!c._b })));
}

function runDupeCheck() {
  const builtin = BUILTIN.map(withCategory);
  const user = userCards.slice();
  const all = allCards();
  const byUserAdv = new Map();
  const byUserId = new Map();
  const byUserFp = new Map();
  const byAllFp = new Map();
  const byAllKey = new Map();
  const byStem = new Map();
  const userAdvIdDupes = [];
  const userIdDupes = [];
  const userFpDupes = [];
  const crossBuiltinUser = [];
  const allFpDupes = [];
  const cardKeyDupes = [];
  const stemDupes = [];

  for (const c of user) {
    if (c.advId) {
      const key = String(c.advId);
      if (byUserAdv.has(key)) userAdvIdDupes.push({ advId: key, ids: [byUserAdv.get(key).id, c.id] });
      else byUserAdv.set(key, c);
      if (isBuiltinQuestion(key)) {
        const bc = builtin.find(b => String(b.id) === key || String(b.advId) === key);
        crossBuiltinUser.push({
          advId: key,
          userId: c.id,
          builtinId: bc ? bc.id : key,
          title: c.title || c.q || ''
        });
      }
    }
    if (c.id) {
      if (byUserId.has(c.id)) userIdDupes.push({ id: c.id });
      else byUserId.set(c.id, c);
    }
    const fp = getCardFingerprint(c);
    if (byUserFp.has(fp)) userFpDupes.push({ fingerprint: fp, ids: [byUserFp.get(fp).id, c.id] });
    else byUserFp.set(fp, c);
  }

  for (const c of all) {
    const fp = getCardFingerprint(c);
    if (!byAllFp.has(fp)) byAllFp.set(fp, []);
    byAllFp.get(fp).push({
      id: c.id,
      advId: c.advId || null,
      builtin: !!c._b,
      title: (c.title || c.q || '').slice(0, 80)
    });
    const ck = cardKey(c);
    if (!byAllKey.has(ck)) byAllKey.set(ck, []);
    byAllKey.get(ck).push(c.id);
    const stem = ((c.scenario || '') + (c.q || '')).toLowerCase().replace(/\s+/g, ' ').trim().slice(0, 180);
    if (!byStem.has(stem)) byStem.set(stem, []);
    byStem.get(stem).push(c.id);
  }

  for (const [fp, items] of byAllFp.entries()) {
    if (items.length > 1) allFpDupes.push({ fingerprint: fp, items });
  }
  for (const [key, ids] of byAllKey.entries()) {
    if (ids.length > 1) cardKeyDupes.push({ cardKey: key, ids });
  }
  for (const [stem, ids] of byStem.entries()) {
    if (ids.length > 1 && stem.length > 40) stemDupes.push({ stem: stem.slice(0, 100) + '…', ids });
  }

  const ruleOverlap = findSameRuleGroups(all.map(c => ({ ...c })));

  return {
    summary: {
      totalCards: all.length,
      builtinCount: builtin.length,
      userCount: user.length,
      userAdvIdDupes: userAdvIdDupes.length,
      userIdDupes: userIdDupes.length,
      userFpDupes: userFpDupes.length,
      crossBuiltinUser: crossBuiltinUser.length,
      allFpDupes: allFpDupes.length,
      cardKeyDupes: cardKeyDupes.length,
      stemDupes: stemDupes.length,
      sameRuleGroups: ruleOverlap.groups.length,
      redundantRuleQuestions: ruleOverlap.redundantCount,
      uniqueRules: ruleOverlap.uniqueRuleCount
    },
    userAdvIdDupes,
    userIdDupes,
    userFpDupes,
    crossBuiltinUser,
    allFpDupes,
    cardKeyDupes,
    stemDupes,
    ruleOverlap
  };
}

      <button class="btn btn-primary" id="dupeBack">← Back</button>
      ${report.crossBuiltinUser.length ? `<button class="btn btn-ghost" id="dupeRemoveBuiltin">Remove ${report.crossBuiltinUser.length} built-in overlap${report.crossBuiltinUser.length !== 1 ? 's' : ''} from My Cards</button>` : ''}
    </div>`;
  document.getElementById('dupeBack').onclick = renderStart;
  const rm = document.getElementById('dupeRemoveBuiltin');
  if (rm) {
    rm.onclick = () => {
      const overlap = new Set(report.crossBuiltinUser.map(d => d.advId));
      const before = userCards.length;
      userCards = userCards.filter(c => !(c.advId && overlap.has(String(c.advId))));
      saveUser();
      alert(`Removed ${before - userCards.length} imported card${before - userCards.length !== 1 ? 's' : ''} that duplicate the built-in deck.`);
      renderDupeCheck();
    };
  }
  console.log('Dupe check report', report);
  return report;
}
window.runDupeCheck = runDupeCheck;
