function getCardStats(card) {
  const id = cardKey(card);
  const all = loadCardStats();
  return all[id] || {};
}

function saveCardStatsForCard(card, patch) {
  const id = cardKey(card);
  const all = loadCardStats();
  all[id] = { ...(all[id] || {}), ...patch };
  saveCardStats(all);
}

function findTriggerSentences(stem, phrases) {
  if (!stem) return [];
  const sents = String(stem).split(/([.!?]+)/).reduce((acc, cur, i, arr) => {
    if (i % 2 === 0) acc.push((cur + (arr[i+1] || '')).trim());
    return acc;
  }, []).filter(Boolean);
  const lowerPhrases = (phrases || []).map(p => String(p).toLowerCase());
  return sents.filter(sent => lowerPhrases.some(p => sent.toLowerCase().includes(p)));
}

function extractRuleWords(text) {
  if (!text) return [];
  const t = String(text);
  const patterns = [
    /\bRule\s+\d+(?:\([a-z0-9]+\))?/gi,
    /\b(?:JMOL|FRCP|FRE|UCC)\s*[\§§]?\s*\d+[-\d]*/gi,
    /\b(?:crossclaim|diversity|erie|habeas|supremacy clause|economic loss|assumption of risk|prior inconsistent statement|business records|anticipatory repudiation|cover damages|void deed|equitable mortgage|bona fide purchaser|minimum contacts|personal jurisdiction|judgment as a matter of law|no reasonable jury|preponderance|manifest injustice|excusable neglect|impeachment only|deadly force|transferred intent|substantial certainty)\b/gi
  ];
  const out = [];
  patterns.forEach(re => {
    const m = t.match(re);
    if (m) out.push(...m);
  });
  return out.map(s => s.trim()).filter(s => s.length >= 3);
}

function explainTriggers(card, phrases, doctrine) {
  const EXPLANATIONS = {
    "Battery Intent — Statistical Risk Is Not Substantial Certainty": {
      "strict products liability theory": "This is the tempting correct theory of recovery, but the question asks whether the plaintiff can also prove battery.",
      "memorandum": "The memo is the plaintiff's evidence of the manufacturer's knowledge.",
      "undetectable defects": "This shows a product-defect risk, but defect knowledge is not automatically battery intent.",
      "ruptures in approximately one out of every 10,000 tires sold": "This is the key statistical-risk fact. It shows some tires may fail, not that the manufacturer was substantially certain this plaintiff would suffer harmful contact.",
      "10 million tires per year": "This makes the risk look numerically large and tempts you toward substantial certainty, but battery intent is not satisfied by aggregate product risk alone.",
      "adding a claim for battery": "This shifts the analysis from product defect to intentional tort intent.",
      "partial summary judgment": "The court asks whether the battery claim can survive on undisputed facts.",
      "undisputed facts": "No extra facts can be assumed to prove intent.",
      "intended or knew to a substantial certainty": "This is the intent element for battery.",
      "harmful or offensive contact": "This is the contact element of battery.",
      "1 in 10,000": "This is the statistical-risk trigger. Statistical risk may support negligence/products liability, but it does not automatically prove battery intent.",
      "one out of every 10,000": "This is the statistical-risk trigger. Statistical risk may support negligence/products liability, but it does not automatically prove battery intent.",
      "substantial certainty": "Battery requires knowledge to a substantial certainty of harmful or offensive contact — not merely statistical product failure.",
      "strict products liability": "Products liability may be viable, but battery requires a separate intent showing."
    }
  };

  const WHY_HINTS = {
    "only asserts": "This is merely a defense, not an independent claim for relief against a co-party.",
    "sole cause of the loss": "Blame-shifting is a defense, not a crossclaim under Rule 13(g).",
    "crossclaims": "Signals Rule 13(g) crossclaim analysis.",
    "minimum contacts": "Personal jurisdiction trigger — not diversity citizenship.",
    "principal place of business": "Diversity citizenship uses nerve center / headquarters.",
    "headquarters": "Corporation's principal place of business for diversity.",
    "won't perform otherwise": "Turns an attempted modification into anticipatory repudiation.",
    "demands a price increase": "Signals attempted modification before repudiation.",
    "covers elsewhere": "Triggers the buyer's UCC cover remedy.",
    "$3,000 more": "Cover damages = cover price minus contract price.",
    "prior inconsistent statement": "Triggers impeachment under FRE 613, not substantive use.",
    "extrinsic proof": "Tests whether extrinsic evidence of inconsistency is admissible.",
    "denies it": "Witness denied the prior statement — extrinsic proof may be needed.",
    "for what purpose": "Forces impeachment-only vs. truth-of-the-matter distinction.",
    "only lost revenue": "Pure economic loss — tort recovery generally barred.",
    "no injury": "No personal injury removes a major tort route.",
    "no other-property damage": "Without other-property damage, economic loss doctrine applies.",
    "15 months after the judgment": "Rule 60(b)(1) has a one-year hard ceiling.",
    "no reasonable jury": "JMOL standard — not preponderance.",
    "preponderance": "Trap answer — JMOL does not weigh evidence.",
    "meritorious defense": "Threshold is void judgment / jurisdiction before merits.",
    "void": "Void judgment beats meritorious defense.",
    "habeas writ": "State courts cannot interfere with federal custody.",
    "federal detention": "Supremacy Clause bars state habeas of federal prisoners."
  };

  const map = EXPLANATIONS[doctrine] || {};

  return (phrases || []).map(phrase => {
    const exact = map[phrase];
    if (exact) return { phrase, why: exact };

    const lower = phrase.toLowerCase();
    if (lower.includes("10,000") || lower.includes("statistical")) {
      return {
        phrase,
        why: "This is the statistical-risk trigger. Statistical risk may support negligence/products liability, but it does not automatically prove battery intent."
      };
    }
    if (lower.includes("battery")) {
      return {
        phrase,
        why: "This triggers intentional tort analysis, especially intent to cause harmful or offensive contact."
      };
    }
    if (lower.includes("summary judgment")) {
      return {
        phrase,
        why: "This asks whether the evidence is legally sufficient for the claim to proceed."
      };
    }

    let why = WHY_HINTS[lower] || WHY_HINTS[Object.keys(WHY_HINTS).find(k => lower.includes(k)) || ""] || "";
    if (!why) why = "This fact matters to the doctrine being tested.";
    return { phrase, why };
  });
}

function buildThresholdQuestion(card, doctrine) {
  const QUESTIONS = {
    "Battery Intent — Statistical Risk Is Not Substantial Certainty":
      "Did the defendant act with purpose or knowledge to a substantial certainty that this plaintiff would suffer harmful or offensive contact?",
    "Battery Requires Intent, Not Mere Recklessness":
      "Did the defendant intend harmful or offensive contact, or only act carelessly/recklessly?",
    "Battery Intent and Assumption of Risk":
      "Can the plaintiff prove intentional harmful or offensive contact despite the risky activity context?",
    "Final Judgment After Voluntary Dismissal Without Prejudice": "Have all claims against all parties become finally resolved (can the dismissed claim still be refiled)?",
    "New Trial Order Is Not Final Appealable Order": "Does the order end the litigation, or does the case continue with a new trial?",
    "New Issue on Appeal / Pure Question of Law Exception": "Is the new appellate issue a pure question of law rather than a fact-dependent argument?",
    "Final Judgment Rule / Unresolved Claims": "Are any claims still pending in the district court?",
    "Seventh Amendment Not Incorporated Against States": "Is the case in federal court or state court?",
    "Erie / Hanna — Valid Federal Rule Controls": "Is there a valid Federal Rule directly on point?",
    "Supplemental Jurisdiction After Federal Claim Dismissed": "Did the state claim and federal claim arise from the same case or controversy?",
    "Judgment as a Matter of Law / Renewed JMOL": "Could a reasonable jury find for the nonmoving party on legally sufficient evidence?",
    "Judgment on the Pleadings": "Are the pleadings actually closed?",
    "Relief from Void Judgment": "Did the court have personal jurisdiction when it entered judgment?",
    "Attorney-Client Privilege / Waiver": "Was the attorney-client communication kept confidential?",
    "Larceny / Burglary / Factual Impossibility": "Was the entry unlawful, and did the defendant actually complete a taking?"
  };
  return QUESTIONS[doctrine] || "What specific threshold fact activates this doctrine?";
}

function buildRuleApplicationSteps(card, doctrine) {
  const STEPS = {
    "Battery Intent — Statistical Risk Is Not Substantial Certainty": [
      "Identify the tort theory being tested: battery, not strict products liability.",
      "State the intent requirement: purpose or knowledge to a substantial certainty of harmful or offensive contact.",
      "Separate product-defect knowledge from intent to cause contact.",
      "Ask whether the manufacturer knew harmful contact would occur to a substantial certainty, not merely that a small percentage of tires might rupture.",
      "If the facts show only a small statistical risk, the battery claim fails even if products liability may remain viable."
    ],
    "Final Judgment After Voluntary Dismissal Without Prejudice": [
      "Check if any claim was dismissed without prejudice.",
      "Determine whether that claim can still be refiled (SOL not expired).",
      "If it can still be refiled → no final judgment.",
      "If SOL has run → finality may have occurred on the date refiling became impossible.",
      "Appeal clock runs from the date finality actually attached."
    ],
    "New Trial Order Is Not Final Appealable Order": [
      "Identify the order being appealed.",
      "Ask: does this order leave anything for the trial court to do?",
      "New trial order = case returns to trial court → not final.",
      "No appellate jurisdiction until a final judgment after the new trial."
    ],
    "Erie / Hanna — Valid Federal Rule Controls": [
      "Is there a direct conflict between state and federal law?",
      "Is there a valid FRCP (or FRE) directly on point?",
      "If yes → apply the federal rule (Hanna).",
      "Only if no on-point federal rule, fall back to Erie outcome-determinative analysis."
    ],
    "Larceny / Burglary / Factual Impossibility": [
      "Was entry lawful (open to public, invitation, no breaking)?",
      "If entry lawful → burglary impossible.",
      "Did defendant actually take and carry away property of another?",
      "Intent to permanently deprive at time of taking?",
      "Factual impossibility (wrong item) does not negate completed larceny."
    ]
  };
  return STEPS[doctrine] || [
    "Identify the precise trigger facts.",
    "State the controlling rule.",
    "Apply the rule to the legally significant facts.",
    "Explain why the tempting wrong answer fails."
  ];
}

function inferWrongAnswerTrap(card, doctrine) {
  const stats = getCardStats(card);
  const attempts = stats.importedAttempts || (card.importedAttemptHistory || []).map(a => ({
    selectedLetter: a.selectedLetter,
    correctLetter: a.correctLetter
  }));

  if (doctrine === "Battery Intent — Statistical Risk Is Not Substantial Certainty") {
    const pickedB = attempts.some(a => a.selectedLetter === "B");
    const pickedC = attempts.some(a => a.selectedLetter === "C");
    if (pickedB && pickedC) {
      return "You fell for two different traps: B treats aggregate statistical risk as substantial certainty, while C incorrectly says battery and products liability cannot be pleaded together. The real issue is narrower: battery intent is missing.";
    }
    if (pickedB) {
      return "Trap B: aggregate statistical risk feels like substantial certainty, but battery requires purpose or knowledge that harmful/offensive contact will occur, not merely that a small fraction of products may fail.";
    }
    if (pickedC) {
      return "Trap C: battery and strict products liability can be pleaded from the same facts. The battery claim fails not because it is inconsistent, but because intent is missing.";
    }
    const trapOpt = (card.options || []).find(o => o.trap);
    if (trapOpt && trapOpt.why) return fullText(trapOpt.why);
    return "The trap is confusing products-liability risk evidence with intentional-tort intent.";
  }

  const text = (card.scenario || '' + ' ' + (card.q || '')).toLowerCase();
  if (doctrine.includes("Final Judgment") && text.includes("summary judgment")) {
    return "Treating the summary judgment date as the appeal deadline instead of waiting for actual finality after the without-prejudice dismissal became irrevocable.";
  }
  if (doctrine.includes("New Trial")) {
    return "Focusing on the merits of the jury poll or evidentiary ruling instead of the threshold appealability problem.";
  }
  if (doctrine.includes("Seventh Amendment")) {
    return "Jumping straight to legal vs. equitable analysis without first checking whether the Seventh Amendment even applies in this court.";
  }
  const trapOpt = (card.options || []).find(o => o.trap);
  if (trapOpt && trapOpt.why) return fullText(trapOpt.why);
  return "Focusing on the sympathetic facts or the detailed rule elements before asking the threshold question that kills most wrong answers.";
}

function buildOneSentenceTakeaway(card, doctrine, correct, wrong) {
  const TAKEAWAYS = {
    "Battery Intent — Statistical Risk Is Not Substantial Certainty":
      "A small statistical risk of product failure may support products liability, but it is not battery intent.",
    "Battery Requires Intent, Not Mere Recklessness":
      "Battery needs intent to cause harmful/offensive contact, not mere recklessness or rule violation.",
    "Battery Intent and Assumption of Risk":
      "For intentional torts, focus first on intent; assumption of risk does not automatically defeat battery."
  };
  if (TAKEAWAYS[doctrine]) return TAKEAWAYS[doctrine];

  if (doctrine.includes("Final Judgment") && doctrine.includes("Without Prejudice")) {
    return "No final judgment until every claim against every party is actually over (SOL expired on a without-prejudice dismissal can create finality).";
  }
  if (doctrine.includes("New Trial Order")) {
    return "An order granting a new trial is never final — the case is still alive in the trial court.";
  }
  if (doctrine.includes("Seventh Amendment")) {
    return "State court? Seventh Amendment stops. Check state law instead.";
  }
  if (doctrine.includes("Larceny") || doctrine.includes("Burglary")) {
    return "Lawful entry kills burglary; actual taking completes larceny even if the object is not what the defendant hoped for.";
  }
  return cleanTakeaway(correct && correct.why ? correct.why : "");
}

function buildNextTimeChecklist(card, doctrine) {
  if (doctrine === "Battery Intent — Statistical Risk Is Not Substantial Certainty") {
    return [
      "Is the claim battery?",
      "What contact is alleged?",
      "Did defendant act with purpose to cause contact?",
      "If not, was defendant substantially certain contact would occur?",
      "Is the evidence only statistical risk?",
      "If yes, think products liability/negligence, not battery."
    ];
  }
  const base = [
    "What are the exact trigger words in the stem?",
    "What is the threshold question?",
    "Does the correct answer turn on that threshold?"
  ];
  if (doctrine.includes("Final Judgment")) {
    return [...base, "Multiple parties/claims?", "Any without-prejudice dismissal?", "Can it still be refiled?", "When did true finality occur?"];
  }
  if (doctrine.includes("New Trial")) {
    return [...base, "Did the trial court order a new trial?", "Does anything remain for the trial court to do?"];
  }
  if (doctrine.includes("Seventh")) {
    return [...base, "Federal court or state court?", "Seventh Amendment invoked?"];
  }
  if (doctrine.includes("Larceny") || doctrine.includes("Burglary")) {
    return [...base, "Was entry lawful?", "Actual taking?", "Factual impossibility?", "Attempt merges?"];
  }
  return base;
}

function inferRuleTested(card, correct, doctrine) {
  doctrine = doctrine || inferDoctrine(card);
  const RULES = {
    "Battery Intent — Statistical Risk Is Not Substantial Certainty":
      "Battery requires intent to cause harmful or offensive contact, meaning purpose or knowledge to a substantial certainty that the contact will occur. Knowledge of a small statistical risk that some products may fail is not enough to establish battery intent. Products liability may be the right theory, but battery requires a higher intent showing.",
    "Battery Requires Intent, Not Mere Recklessness":
      "Battery requires intent to cause harmful or offensive contact, or intent to cause apprehension of such contact under transferred-intent principles. Mere recklessness or violation of safety rules is not enough by itself.",
    "Battery Intent and Assumption of Risk":
      "Assumption of risk is generally not a defense to intentional torts. But the plaintiff still must prove the defendant intended harmful or offensive contact.",
    "Final Judgment After Voluntary Dismissal Without Prejudice": "A federal appeal generally requires a final judgment resolving all claims against all parties. A voluntary dismissal without prejudice does not create finality while the claim can still be refiled; finality may arise once the statute of limitations bars refiling.",
    "New Trial Order Is Not Final Appealable Order": "An order granting a new trial is not a final judgment because litigation remains pending in the trial court. The court of appeals generally lacks jurisdiction over an appeal from that order.",
    "New Issue on Appeal / Pure Question of Law Exception": "Although appellate courts generally do not consider issues raised for the first time on appeal, they have discretion to consider pure questions of law when doing so does not unfairly prejudice the opposing party.",
    "Final Judgment Rule / Unresolved Claims": "A decision is not final if unresolved claims remain in the action. A partial ruling on some claims is generally not immediately appealable unless a valid exception, such as Rule 54(b) certification or statutory interlocutory appeal, applies.",
    "Seventh Amendment Not Incorporated Against States": "The Seventh Amendment civil jury-trial right applies in federal court but has not been incorporated against the states. In state court, state law controls the right to a civil jury trial.",
    "Erie / Hanna — Valid Federal Rule Controls": "When a valid Federal Rule of Civil Procedure is directly on point and conflicts with state law, the federal rule controls in federal court if it regulates procedure and does not abridge, enlarge, or modify substantive rights.",
    "Supplemental Jurisdiction After Federal Claim Dismissed": "A federal court may exercise supplemental jurisdiction over state-law claims that form part of the same case or controversy as a colorable federal claim, even after the federal claim is dismissed; continuing to hear the state claim is discretionary.",
    "Judgment as a Matter of Law / Renewed JMOL": "JMOL is proper only when no reasonable jury could find for the non-moving party on legally sufficient evidence. A renewed JMOL motion after verdict is the vehicle to test sufficiency.",
    "Attorney-Client Privilege / Waiver": "Attorney-client privilege protects confidential communications for the purpose of obtaining legal advice. Voluntary disclosure to a third party (even a family member) waives the privilege as to that communication.",
    "Larceny / Burglary / Factual Impossibility": "Larceny requires taking and carrying away property of another with intent to permanently deprive. Factual impossibility is not a defense to a completed taking. Burglary requires unlawful entry when the statute so defines it."
  };
  if (RULES[doctrine]) return RULES[doctrine];
  // No curated rule for this doctrine - return a CONCISE label instead of the full
  // explanation (which would just repeat the rule text shown elsewhere in the box).
  const subLabel = (card.sub || "").trim();
  if (subLabel) return subLabel;
  const titleLabel = (card.title || "").trim();
  if (titleLabel) return titleLabel.length > 90 ? titleLabel.slice(0, 87) + "\u2026" : titleLabel;
  const cleaned = cleanRuleFromExplanation(correct && correct.why ? correct.why : "");
  const firstSentence = (String(cleaned).split(". ")[0] || cleaned).trim();
  return firstSentence.length > 160 ? firstSentence.slice(0, 157) + "\u2026" : firstSentence;
}

function inferDoctrine(card) {
  const text = [
    card.subj,
    card.sub,
    card.title,
    card.scenario,
    card.q,
    ...(card.options || []).map(o => `${o.t} ${o.why || ""}`)
  ].join(" ").toLowerCase();

  if (
    text.includes("battery") &&
    (
      text.includes("one out of every 10,000") ||
      text.includes("1 in 10,000") ||
      text.includes("statistical") ||
      text.includes("substantial certainty") ||
      text.includes("strict products liability")
    )
  ) {
    return "Battery Intent — Statistical Risk Is Not Substantial Certainty";
  }
  if (text.includes("battery") && text.includes("reckless")) {
    return "Battery Requires Intent, Not Mere Recklessness";
  }
  if (text.includes("battery") && text.includes("assumed the risk")) {
    return "Battery Intent and Assumption of Risk";
  }

  const s = text;

  if (s.includes("rule 60") || s.includes("60(b)")) return "Relief from Judgment";
  if (s.includes("judgment as a matter of law") || s.includes("jmol") || s.includes("rule 50")) return "Judgment as a Matter of Law";
  if (s.includes("crossclaim")) return "Rule 13(g) Crossclaim";
  if (s.includes("erie") || (s.includes("federal rules of civil procedure") && s.includes("class action"))) return "Erie / Hanna";
  if (s.includes("prior inconsistent")) return "Prior Inconsistent Statement / Impeachment";
  if (s.includes("business records") || s.includes("drug ledger")) return "Business Records Exception";
  if (s.includes("economic loss") || (s.includes("only lost revenue") && s.includes("no injury"))) return "Economic Loss Doctrine";
  if (s.includes("assumption of risk") || s.includes("assumption-of-risk")) return "Assumption of Risk";
  if (s.includes("right to travel") || s.includes("durational residency")) return "Right to Travel";
  if (s.includes("building permit") && s.includes("pool")) return "Takings Exaction";
  if (s.includes("public hiking easement") || s.includes("physical occupation")) return "Per Se Physical Taking";
  if (s.includes("repudiation") || (s.includes("won't perform") && s.includes("price increase"))) return "Anticipatory Repudiation / Cover Damages";
  if (s.includes("void deed") || s.includes("fraud in the execution")) return "Void Deed";
  if (s.includes("equitable mortgage")) return "Equitable Mortgage";
  if (s.includes("as is") && s.includes("inspection")) return "As-Is Sale Disclosure";

  const subject = normalizeMBESubject(card.subj);
  const subtopic = normalizeMBESubtopic(subject, card.sub);

  if (subject === "Civil Procedure" && subtopic === "Appealability and Review") {
    if (text.includes("without prejudice") && text.includes("statute of limitations")) {
      return "Final Judgment After Voluntary Dismissal Without Prejudice";
    }
    if (text.includes("ordered a new trial")) {
      return "New Trial Order Is Not Final Appealable Order";
    }
    if (text.includes("for the first time") && text.includes("appeal")) {
      return "New Issue on Appeal / Pure Question of Law Exception";
    }
    if (text.includes("federal claim") && text.includes("state-law claim")) {
      return "Final Judgment Rule / Unresolved Claims";
    }
    return "Final Judgment Rule";
  }

  if (subject === "Civil Procedure" && subtopic === "Jury Trials") {
    if (text.includes("seventh amendment") && text.includes("state court")) {
      return "Seventh Amendment Not Incorporated Against States";
    }
    if (text.includes("jury instruction") || text.includes("plain error")) {
      return "Jury Instruction Objection / Plain Error";
    }
    return "Civil Jury Trial Rules";
  }

  if (subject === "Civil Procedure" && subtopic === "Law Applied by Federal Courts") {
    if (text.includes("federal rules of civil procedure") || text.includes("affirmative defense")) {
      return "Erie / Hanna — Valid Federal Rule Controls";
    }
    return "Erie Doctrine";
  }

  if (subject === "Civil Procedure" && subtopic === "Jurisdiction and Venue") {
    if (text.includes("supplemental jurisdiction")) {
      return "Supplemental Jurisdiction After Federal Claim Dismissed";
    }
    if (text.includes("transfer")) {
      return "Transfer for Convenience / Interest of Justice";
    }
    if (text.includes("personal jurisdiction") || text.includes("minimum contacts")) {
      return "Personal Jurisdiction";
    }
    return "Federal Jurisdiction and Venue";
  }

  if (subject === "Civil Procedure" && subtopic === "Motions") {
    if (text.includes("judgment as a matter of law") || text.includes("jmol")) {
      return "Judgment as a Matter of Law / Renewed JMOL";
    }
    if (text.includes("judgment on the pleadings")) {
      return "Judgment on the Pleadings";
    }
    if (text.includes("new trial")) {
      return "Motion for New Trial";
    }
    if (text.includes("default judgment") && text.includes("void")) {
      return "Relief from Void Judgment";
    }
    return "Civil Motions";
  }

  if (subject === "Evidence" && subtopic.includes("Privileges")) {
    if (text.includes("attorney") && text.includes("privilege")) {
      return "Attorney-Client Privilege / Waiver";
    }
    return "Privilege";
  }

  if (subject === "Criminal Law and Procedure" && subtopic === "Other Crimes") {
    if (text.includes("larceny") || text.includes("burglary") || text.includes("factual impossibility")) {
      return "Larceny / Burglary / Factual Impossibility";
    }
    return "Other Crimes";
  }

  return `${subject} / ${subtopic}`;
}

function buildTriggerAnalysis(card) {
  const subject = normalizeMBESubject(card.subj);
  const subtopic = normalizeMBESubtopic(subject, card.sub);
  const mbeKey = `${subject} / ${subtopic}`;

  const correct = (card.options || []).find(o => o.ok);
  const trap = (card.options || []).find(o => o.trap) || null;

  const stem = [
    card.scenario || "",
    card.q || ""
  ].join("\n\n").trim();

  const doctrine = inferDoctrine(card);
  const ruleTested = inferRuleTested(card, correct, doctrine);
  const triggerPhrases = findTriggerPhrases(card, stem, doctrine, ruleTested);
  const triggerSentences = findTriggerSentences(stem, triggerPhrases);

  return {
    id: card.id,
    advId: card.advId || null,
    subj: subject,
    sub: subtopic,
    subject,
    subtopic,
    mbeKey,

    doctrine,
    ruleTested,

    triggerPhrases,
    triggerSentences,

    questionStemOriginal: stem,
    questionStemHighlighted: boldTriggerPhrases(stem, triggerPhrases),

    whyEachTriggerMatters: explainTriggers(card, triggerPhrases, doctrine),

    thresholdQuestion: buildThresholdQuestion(card, doctrine),
    ruleApplicationSteps: buildRuleApplicationSteps(card, doctrine),

    correctAnswer: correct ? correct.t : "",
    myWrongAnswer: trap ? trap.t : "",
    correctAnswerRule: correct ? fullText(correct.why) : "",
    wrongAnswerTrap: inferWrongAnswerTrap(card, doctrine),

    oneSentenceTakeaway: buildOneSentenceTakeaway(card, doctrine, correct, trap),
    nextTimeChecklist: buildNextTimeChecklist(card, doctrine)
  };
}

function resolveTriggerAnalysis(card) {
  const stats = getCardStats(card);
  const base = stats.triggerAnalysis || card.triggerAnalysis || buildTriggerAnalysis(card);
  const override = stats.triggerAnalysisOverride;
  if (!override) return base;

  const merged = { ...base, ...override };
  if (override.triggerPhrases && override.triggerPhrases.length) {
    merged.triggerPhrases = override.triggerPhrases;
    merged.questionStemHighlighted = boldTriggerPhrases(
      base.questionStemOriginal || merged.questionStemOriginal,
      override.triggerPhrases
    );
    if (!override.whyEachTriggerMatters || !override.whyEachTriggerMatters.length) {
      merged.whyEachTriggerMatters = explainTriggers(card, override.triggerPhrases, merged.doctrine);
    }
  }
  return merged;
}

function extractSharedRuleFactPhrases(ruleText, stem){
  if(!ruleText || !stem) return [];
  const STOP = new Set(("the a an and or of to in for on with without by within into onto as is are was were be been being not no nor any all under over from at this that these those there here their its his her your our which who whom whose when where what how why whether between among after before during including would could should must may shall will than then them they because therefore however thus only also such other another each both either neither some most more less very much many few about upon out off per via court case rule party parties plaintiff defendant defendants claim claims action however because correct incorrect answer question facts here there when").split(/\s+/));
  const ruleWords = new Set(
    String(ruleText).toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w => w.length >= 5 && !STOP.has(w))
  );
  if(!ruleWords.size) return [];
  const words = String(stem).match(/[A-Za-z][A-Za-z'-]*/g) || [];
  const phrases = []; let run = [];
  for(const w of words){
    if(ruleWords.has(w.toLowerCase())) run.push(w);
    else { if(run.length){ phrases.push(run.join(' ')); run = []; } }
  }
  if(run.length) phrases.push(run.join(' '));
  return [...new Set(phrases)].filter(p => p.length >= 4);
}

function findTriggerPhrases(card, stem, doctrine, ruleTested) {
  const correct = (card.options || []).find(o => o.ok);
  const trap = (card.options || []).find(o => o.trap);
  const dictKeys = cardTriggerDictKeys(card, doctrine);

  const sources = [];
  dictKeys.forEach(k => {
    if (TRIGGER_DICTIONARY[k]) sources.push(...TRIGGER_DICTIONARY[k]);
  });
  sources.push(
    ...(extractRuleWords(card.title) || []),
    ...(extractRuleWords(correct && correct.why) || []),
    ...(extractRuleWords(trap && trap.why) || []),
    ...(extractRuleWords(ruleTested) || []),
    ...(extractLegallySignificantPhrases(stem) || []),
    ...(extractSharedRuleFactPhrases(correct && correct.why ? correct.why : "", stem) || []),
    ...(extractSharedRuleFactPhrases(ruleTested || "", stem) || [])
  );

  const unique = [...new Set(
    sources.map(x => String(x || "").trim()).filter(x => x.length >= 2)
  )];

  const matched = unique
    .filter(phrase => phraseInStem(stem, phrase))
    .filter(phrase => !(
      (doctrine || "").includes("Battery Intent") &&
      phrase.toLowerCase() === "summary judgment"
    ));
  let result = limitTriggerPhrases(matched, null, doctrine);
  if (!result || result.length === 0) {
    const fallback = [...new Set(
      (extractGenericSignalPhrases(stem) || []).map(x => String(x || "").trim()).filter(x => x.length >= 2)
    )].filter(phrase => phraseInStem(stem, phrase));
    result = limitTriggerPhrases(fallback, null, doctrine);
  }
  return result;
}

function extractGenericSignalPhrases(text) {
  const patterns = [
    /\brequire[sd]?\b/gi, /\bmandate[sd]?\b/gi, /\bprohibit(?:s|ed)?\b/gi, /\bban(?:s|ned)?\b/gi,
    /\bauthoriz(?:e|es|ed|ing)\b/gi, /\bcompel(?:s|led)?\b/gi, /\bden(?:y|ies|ied|ial)\b/gi,
    /\brefus(?:e|es|ed)\b/gi, /\bcondition(?:s|ed)?\b/gi, /\bimpose[sd]?\b/gi,
    /\bchallenge the constitutionality\b/gi, /\bunconstitutional\b/gi, /\bconstitutionality\b/gi,
    /\bfiled suit\b/gi, /\bbrought suit\b/gi, /\bsue[sd]?\b/gi, /\bmove[sd]? to\b/gi, /\bobject(?:s|ed)?\b/gi, /\bseek[s]?\b/gi,
    /\bfundamental right\b/gi, /\bdue process\b/gi, /\bequal protection\b/gi, /\bstate action\b/gi,
    /\bstrict scrutiny\b/gi, /\bintermediate scrutiny\b/gi, /\brational basis\b/gi, /\bsuspect class(?:ification)?\b/gi,
    /\bFirst Amendment\b/gi, /\bfree exercise\b/gi, /\bestablishment clause\b/gi, /\bfree speech\b/gi,
    /\bcommerce clause\b/gi, /\bsupremacy clause\b/gi, /\btakings?\b/gi, /\bprivileges and immunities\b/gi,
    /\bstatute\b/gi, /\bregulation\b/gi, /\bordinance\b/gi
  ];
  const out = [];
  for (const re of patterns) { const m = String(text || "").match(re); if (m) out.push(...m); }
  return out;
}

function extractLegallySignificantPhrases(text) {
  const patterns = [
    /\bwithout prejudice\b/gi,
    /\bstatute of limitations\b/gi,
    /\bthe day after\b/gi,
    /\bnotice of appeal\b/gi,
    /\bfinal judgment\b/gi,
    /\bordered a new trial\b/gi,
    /\bfor the first time\b/gi,
    /\bpure question of law\b/gi,
    /\bfederal diversity action\b/gi,
    /\bstate court\b/gi,
    /\bSeventh Amendment\b/gi,
    /\binjunction\b/gi,
    /\bsummary judgment\b/gi,
    /\bjudgment as a matter of law\b/gi,
    /\bJMOL\b/gi,
    /\brenewed motion\b/gi,
    /\bcounterclaim\b/gi,
    /\bjudgment on the pleadings\b/gi,
    /\bpersonal jurisdiction\b/gi,
    /\bdefault judgment\b/gi,
    /\bRule 60\(b\)\b/gi,
    /\bsupplemental jurisdiction\b/gi,
    /\bwell-pleaded complaint\b/gi,
    /\bsubject-matter jurisdiction\b/gi,
    /\bFederal Rules of Civil Procedure\b/gi,
    /\baffirmative defense\b/gi,
    /\bcontributory negligence\b/gi,
    /\battorney-client privilege\b/gi,
    /\bconfidential\b/gi,
    /\bplayed .* for .* father\b/gi,
    /\bopen to the public\b/gi,
    /\bintent to steal\b/gi,
    /\bfactual impossibility\b/gi,
    /\blarceny\b/gi,
    /\bburglary\b/gi
  ];

  const out = [];
  for (const re of patterns) {
    const matches = String(text || "").match(re);
    if (matches) out.push(...matches);
  }
  return out;
}

function boldTriggerPhrases(text, phrases) {
  if (!text) return "";
  let escapedText = esc(text);
  const cleanPhrases = [...new Set(
    (phrases || [])
      .map(p => String(p || "").trim())
      .filter(p => p.length >= 3)
  )].sort((a, b) => b.length - a.length);

  for (const phrase of cleanPhrases) {
    const escapedPhrase = esc(phrase);
    const pattern = escapedPhrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(pattern, "gi");
    escapedText = escapedText.replace(re, match => {
      return `<strong class="trigger-bold">${match}</strong>`;
    });
  }
  return escapedText;
}

/* Export / Import for trigger analyses */
function exportTriggerAnalyses() {
  const analyses = allCards().map(c => resolveTriggerAnalysis(c)).filter(Boolean);

  const payload = {
    version: 1,
    type: "triggerAnalysis",
    exportedAt: new Date().toISOString(),
    analyses
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trigger_analysis_export.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importTriggerAnalyses(arr) {
  if (!Array.isArray(arr)) return 0;
  const all = loadCardStats();
  let count = 0;
  arr.forEach(imported => {
    const match = allCards().find(c =>
      (imported.advId && c.advId && String(c.advId) === String(imported.advId)) ||
      (imported.id && String(c.id) === String(imported.id))
    );
    if (match) {
      const k = cardKey(match);
      all[k] = { ...(all[k]||{}), triggerAnalysisOverride: imported };
      count++;
    }
  });
  saveCardStats(all);
  return count;
}

  recentAdaptibar14: "AdaptiBar miss within 14 days"
};

  old_improved: "Old miss — likely improved",

};

function normalizeUSDate(raw) {
  const m = String(raw || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return "";
  const month = String(m[1]).padStart(2, "0");
  const day = String(m[2]).padStart(2, "0");
  const year = m[3];
  return `${year}-${month}-${day}`;
}

function daysSinceISO(isoDate) {
  if (!isoDate) return Infinity;
  const d = new Date(isoDate);
  if (Number.isNaN(d.getTime())) return Infinity;
  const diff = Date.now() - d.getTime();
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

function syncCardDateFields(card) {
  const history = card.importedAttemptHistory || [];
  const dates = history.map(a => a.dateAnswered).filter(Boolean).sort();
  if (dates.length) {
    card.firstMissedAt = dates[0];
    card.mostRecentImportedMissAt = dates[dates.length - 1];
    card.dateAnswered = card.mostRecentImportedMissAt;
    const latest = [...history].reverse().find(a => a.dateAnswered === card.mostRecentImportedMissAt);
    if (latest && latest.dateAnsweredRaw) card.dateAnsweredRaw = latest.dateAnsweredRaw;
  }
  return card;
}

function mergeImportedCard(existing, incoming) {
  existing.importedAttemptHistory = existing.importedAttemptHistory || [];
  const incomingAttempts = incoming.importedAttemptHistory || [];
  for (const attempt of incomingAttempts) {
    const duplicate = existing.importedAttemptHistory.some(a =>
      a.dateAnswered === attempt.dateAnswered &&
      a.selectedLetter === attempt.selectedLetter &&
      a.correctLetter === attempt.correctLetter
    );
    if (!duplicate) {
      existing.importedAttemptHistory.push(attempt);
      recordImportedAttempt(existing, attempt);
    }
  }
  syncCardDateFields(existing);
  existing.importedAt = incoming.importedAt || existing.importedAt || nowISO();
  if (incoming.options) {
    incoming.options.forEach((opt, i) => {
      if (opt.trap && existing.options[i]) existing.options[i].trap = true;
      else if (opt.trap) {
        const match = existing.options.find(o => o.t === opt.t);
        if (match) match.trap = true;
      }
    });
  }
  return existing;
}

function passesDateFilter(card, filter) {
  const stats = getCardStats(card);
  const lastPracticed = stats.lastPracticedAt || null;
  const lastPracticedDays = daysSinceISO(lastPracticed);
  const hasPractice = !!(stats.practiceHistory && stats.practiceHistory.length);
  const adaptibarDate = card.mostRecentImportedMissAt || card.dateAnswered || card.firstMissedAt || "";
  const adaptibarDays = daysSinceISO(adaptibarDate);
  switch (filter) {
    case "notPracticed":
      return !hasPractice;
    case "practicedToday":
      return stats.lastPracticedDate === new Date().toISOString().slice(0, 10);
    case "practicedThisWeek":
      return hasPractice && lastPracticedDays <= 7;
    case "stale14":
      return hasPractice && lastPracticedDays >= 14;
    case "stale30":
      return hasPractice && lastPracticedDays >= 30;
    case "oldAdaptibar30":
      return adaptibarDays >= 30;
    case "recentAdaptibar14":
      return adaptibarDays <= 14;
    case "all":
    default:
      return true;
  }
}

function cardDateMeta(card) {
  const stats = getCardStats(card);
  const missed = card.mostRecentImportedMissAt || card.dateAnswered || card.firstMissedAt || "unknown";
  const practiced = stats.lastPracticedDate || "not yet";
  return `Missed in AdaptiBar: ${missed} · Last practiced: ${practiced}`;
}

function missAgeStatus(card) {
  const stats = getCardStats(card);
  const missedDate = card.mostRecentImportedMissAt || card.dateAnswered || card.firstMissedAt;
  const missedDays = daysSinceISO(missedDate);
  const practicedDays = daysSinceISO(stats.lastPracticedAt);
  if (!missedDate) return "unknown";
  if (missedDays >= 30 && practicedDays === Infinity) return "old_unchecked";
  if (missedDays >= 30 && stats.lastAnsweredCorrect === true) return "old_improved";
  if (missedDays <= 14 && stats.lastAnsweredCorrect !== true) return "recent_active_weakness";
  return "normal";
}

function getDateSummary(cards) {
  cards = cards || allCards();
  let oldUnchecked = 0, recentMisses = 0, practicedToday = 0, stale14 = 0, neverPracticed = 0;
  const today = new Date().toISOString().slice(0, 10);
  for (const card of cards) {
    const stats = getCardStats(card);
    const missedDate = card.mostRecentImportedMissAt || card.dateAnswered || card.firstMissedAt;
    const missedDays = daysSinceISO(missedDate);
    const practicedDays = daysSinceISO(stats.lastPracticedAt);
    const hasPractice = !!(stats.practiceHistory && stats.practiceHistory.length);
    if (missedDays >= 30 && practicedDays === Infinity) oldUnchecked++;
    if (missedDays <= 14) recentMisses++;
    if (stats.lastPracticedDate === today) practicedToday++;
    if (hasPractice && practicedDays >= 14) stale14++;
    if (!hasPractice) neverPracticed++;
  }
  return { oldUnchecked, recentMisses, practicedToday, stale14, neverPracticed };
}

function sortCardsByDate(cards, sortMode) {
  return cards.slice().sort((a, b) => {
    const sa = getCardStats(a);
    const sb = getCardStats(b);
    const aMiss = a.mostRecentImportedMissAt || a.dateAnswered || a.firstMissedAt || "";
    const bMiss = b.mostRecentImportedMissAt || b.dateAnswered || b.firstMissedAt || "";
    const aPractice = sa.lastPracticedAt || "";
    const bPractice = sb.lastPracticedAt || "";
    switch (sortMode) {
      case "missNewest":
        return String(bMiss).localeCompare(String(aMiss));
      case "missOldest":
        return String(aMiss).localeCompare(String(bMiss));
      case "practiceNewest":
        return String(bPractice).localeCompare(String(aPractice));
      case "practiceOldest":
        return String(aPractice || "9999").localeCompare(String(bPractice || "9999"));
      case "neverPracticed":
        return Number(!!aPractice) - Number(!!bPractice);
      case "mostMissed":
        return (b.importedAttemptHistory?.length || sb.timesWrong || 0) - (a.importedAttemptHistory?.length || sa.timesWrong || 0);
      default:
        return 0;
    }
  });
}

function getCardDoctrine(card) {
  try {
    enrichCardWithTriggerAnalysis(card);
    const stats = getCardStats(card);
    const ta = stats.triggerAnalysisOverride || stats.triggerAnalysis || card.triggerAnalysis;
    if (ta && ta.doctrine) return ta.doctrine;
  } catch (e) {}
  return inferDoctrine(card);
}

function isValidRuleSentence(text) {
  const t = String(text || "").trim();
  if (t.length < 20 || t.split(/\s+/).filter(Boolean).length < 4) return false;
  const lower = t.toLowerCase();
  if (/^review\b/.test(lower)) return false;
  if (/^(study|learn|memorize)\b/.test(lower)) return false;
  if (lower.split(/\s+/).length < 6) return false;
  return true;
}

function countsForMastery(correct, quality, confidence) {
  if (!correct) return false;
  if (confidence < 4) return false;
  return quality === "knew_rule" || quality === "recognized_trigger";
}

function updateDoctrineStats(card, correct, meta) {
  const doctrine = getCardDoctrine(card);
  const all = loadCardStatsMap();
  if (!all.__doctrineStats) all.__doctrineStats = {};
  const ds = all.__doctrineStats[doctrine] || { correct: 0, wrong: 0, danger: 0, lucky: 0 };
  if (correct) {
    if (countsForMastery(true, meta.quality, meta.confidence)) ds.correct++;
    else ds.lucky = (ds.lucky || 0) + 1;
  } else {
    ds.wrong = (ds.wrong || 0) + 1;
    if ((meta.confidence || 0) >= 4) ds.danger = (ds.danger || 0) + 1;
  }
  all.__doctrineStats[doctrine] = ds;
  saveCardStatsMap(all);
}

function getDoctrineStatsMap() {
  return loadCardStatsMap().__doctrineStats || {};
}

function getDangerErrorCards() {
  return allCards().filter(c => {
    const s = getCardStats(c);
    return s.dangerError || (s.dangerErrors && s.dangerErrors.length);
  }).sort((a, b) => queuePriorityScore(b) - queuePriorityScore(a));
}

function getConfusionReport() {
  const map = new Map();
  allCards().forEach(card => {
    const s = getCardStats(card);
    (s.confusionHistory || []).concat(s.confusedWith ? [{ with: s.confusedWith, at: s.lastAnsweredAt }] : []).forEach(entry => {
      const key = String(entry.with || entry.confusedWith || "").trim();
      if (!key) return;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push({ card, entry });
    });
  });
  return [...map.entries()].map(([confusedWith, items]) => ({ confusedWith, count: items.length, items }))
    .sort((a, b) => b.count - a.count);
}

function getWorstDoctrines(limit = 8) {
  const ds = getDoctrineStatsMap();
  return Object.entries(ds).map(([doctrine, s]) => {
    const total = (s.correct || 0) + (s.wrong || 0) + (s.lucky || 0);
    const realCorrect = s.correct || 0;
    return {
      doctrine, total, correct: realCorrect, wrong: s.wrong || 0, danger: s.danger || 0, lucky: s.lucky || 0,
      accuracy: total ? Math.round((realCorrect / total) * 100) : null
    };
  }).filter(x => x.total > 0).sort((a, b) => (a.accuracy ?? 100) - (b.accuracy ?? 100) || b.wrong - a.wrong).slice(0, limit);
}

function reviveMasteredForDoctrine(card) {
  const doctrine = getCardDoctrine(card);
  const statsMap = loadCardStatsMap();
  const mastered = loadMasteredCards();
  let revived = 0;
  allCards().forEach(c => {
    if (!getCardStats(c).isMastered) return;
    if (getCardDoctrine(c) !== doctrine) return;
    const key = cardKey(c);
    const stats = { ...defaultCardStats(), ...statsMap[key] };
    stats.isMastered = false;
    stats.masteredAt = null;
    stats.retiredReason = `Revived: missed ${doctrine} again`;
    stats.masteryCorrectCount = 0;
    stats.nextReviewAt = nowISO();
    stats.dueAt = Date.now();
    statsMap[key] = stats;
    const idx = mastered.findIndex(x => x.key === key);
    if (idx >= 0) mastered.splice(idx, 1);
    revived++;
  });
  if (revived) {
    saveCardStatsMap(statsMap);
    saveMasteredCards(mastered);
    if (state.currentSession) state.currentSession.revivedMastered = (state.currentSession.revivedMastered || 0) + revived;
  }
  return revived;
}

function getOverstudyWarning() {
  if (!state.selected || state.selected.size !== 1) return null;
  const subj = [...state.selected][0];
  const scores = loadAdaptibarScores();
  const acc = scores?.subjects?.[subj]?.accuracy;
  if (acc == null || acc < 65) return null;
  const weak = getWorstDoctrines(3);
  return { subj, accuracy: acc, weak };
}

function generateWeeklyErrorReport() {
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const cards = allCards();
  const doctrineMisses = {};
  const danger = getDangerErrorCards();
  const confusion = getConfusionReport().slice(0, 5);
  let oldFixed = 0, persistent = 0, dueNext = 0;
  cards.forEach(card => {
    const s = getCardStats(card);
    (s.practiceHistory || []).forEach(h => {
      if (new Date(h.practicedAt).getTime() < weekAgo) return;
      if (!h.wasCorrect) {
        const d = getCardDoctrine(card);
        doctrineMisses[d] = (doctrineMisses[d] || 0) + 1;
      }
    });
    if (s.oldMissImproved) oldFixed++;
    if (s.persistentWeakness) persistent++;
    if (isDue(s) && !s.isMastered) dueNext++;
  });
  const scores = loadAdaptibarScores();
  const weakSubs = MBE_TOP_SUBJECTS.map(s => {
    const d = scores?.subjects?.[s];
    return d && typeof d.accuracy === "number" ? { name: s, acc: d.accuracy } : null;
  }).filter(Boolean).sort((a, b) => a.acc - b.acc).slice(0, 4);
  return { doctrineMisses, danger, confusion, oldFixed, persistent, dueNext, weakSubs };
}

function exportAnkiTriggerCSV() {
  const rows = [["Front", "Back", "Tags"]];
  allCards().forEach(card => {
    try {
      enrichCardWithTriggerAnalysis(card);
      const ta = resolveTriggerAnalysis(card);
      const triggers = (ta.triggerPhrases || []).slice(0, 3).join(" · ") || (ta.triggerSentences || [])[0] || card.title || "";
      const back = [ta.doctrine, ta.ruleTested, ta.oneSentenceTakeaway].filter(Boolean).join("\n\n");
      const tags = [card.subj, card.sub, ta.doctrine].filter(Boolean).join(" / ");
      if (triggers && back) rows.push([triggers, back, tags]);
      if ((ta.triggerPhrases || []).length > 1) {
        (ta.triggerPhrases || []).slice(0, 3).forEach((phrase, i) => {
          rows.push([phrase, `${ta.doctrine}\n\n${ta.ruleTested || ""}\n\n${ta.oneSentenceTakeaway || ""}`, tags]);
        });
      }
    } catch (e) {}
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell || "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "trap_trainer_anki_triggers.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function setCardStats(card, stats) {
  const id = cardKey(card);
  const all = loadCardStatsMap();
  all[id] = { ...(all[id] || {}), ...(stats || {}) };
  saveCardStatsMap(all);
}

function isDue(stats) {
  if (!stats || stats.isMastered) return false;
  if (isSnoozedStats(stats)) return false;
  if (!stats.lastSeenAt) return true;
  if (!stats.nextReviewAt) return true;
  return new Date(stats.nextReviewAt).getTime() <= Date.now();
}

function isSnoozedStats(stats) {
  if (!stats || !stats.snoozedUntil) return false;
  return new Date(stats.snoozedUntil).getTime() > Date.now();
}

function isSnoozed(card){
  try{ const s = getCardStats(card) || {}; return s.snoozedUntil ? Date.now() < new Date(s.snoozedUntil).getTime() : false; }
  catch(e){ return false; }
}

function isCardSnoozed(card) {
  return isSnoozed(card);
}

function lastAnsweredTime(card){
  try{
    const s = getCardStats(card) || {};
    const t = s.lastAnsweredAt ? Date.parse(s.lastAnsweredAt) : (s.lastShown || 0);
    return Number.isFinite(t) ? t : 0;
  }catch(e){ return 0; }
}

function answeredRecently(card, hours){
  try{
    const s = getCardStats(card) || {};
    const t = s.lastAnsweredAt ? Date.parse(s.lastAnsweredAt) : (s.lastShown || 0);
    if(!t) return false;
    return (Date.now() - t) < hours*3600*1000;
  }catch(e){ return false; }
}

function dedupeCards(cards){
  const seen = new Set();
  return (cards || []).filter(card => {
    const key = cardKey(card);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function staleAnsweredFirst(a, b){
  return (lastAnsweredTime(a) || 0) - (lastAnsweredTime(b) || 0);
}

function finalizeQueue(pool, requestedSize, sorter){
  const max = requestedSize || (pool ? pool.length : 0);
  const unique = dedupeCards(pool || []);
  const available = unique.filter(c => !isSnoozed(c));
  const preferred = available.filter(c => !answeredRecently(c, 12));
  const recent = available.filter(c => answeredRecently(c, 12)).sort(staleAnsweredFirst);
  const orderedPreferred = sorter ? preferred.sort(sorter) : preferred;
  const queue = dedupeCards(orderedPreferred.concat(recent));
  return queue.slice(0, max);
}

function isErrorItemDue(card) {
  const item = loadErrorList().find(x => x.key === cardKey(card) && x.status !== "resolved");
  if (!item) return false;
  if (isCardSnoozed(card)) return false;
  if (!item.nextReviewAt) return true;
  return new Date(item.nextReviewAt).getTime() <= Date.now();
}

function snoozeCardForTwoWeeks(card, btnEl) {
  return snoozeCard(card, 14, btnEl);
}

function snoozeCard(card, days, btnEl){
  const untilMs = Date.now() + days * 24 * 3600 * 1000;
  const until = new Date(untilMs).toISOString();
  try {
    const stats = { ...defaultCardStats(), ...getCardStats(card) };
    stats.snoozedUntil = untilMs;
    stats.snoozedAt = nowISO();
    stats.nextReviewAt = until;
    stats.dueAt = untilMs;
    setCardStats(card, stats);

    const list = loadErrorList();
    const item = list.find(x => x.key === cardKey(card) && x.status !== "resolved");
    if (item) {
      item.nextReviewAt = until;
      item.snoozedUntil = until;
      item.snoozedAt = nowISO();
      saveErrorList(list);
    }
  } catch (e) {}
  if (btnEl) {
    btnEl.textContent = "\u{1F515} Snoozed 2 wks";
    btnEl.disabled = true;
    btnEl.style.opacity = ".75";
  }
}

function scheduleNextReview(stats, correct) {
  if (correct) {
    const idx = Math.min(Math.max((stats.masteryCorrectCount || 1) - 1, 0), REVIEW_INTERVALS_DAYS.length - 1);
    const days = REVIEW_INTERVALS_DAYS[idx];
    stats.nextReviewAt = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
  } else {
    stats.nextReviewAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
  }
  stats.dueAt = new Date(stats.nextReviewAt).getTime();
}

function addToErrorList(card) {
  const list = loadErrorList();
  const key = cardKey(card);
  const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
  let item = list.find(x => x.key === key);
  if (item) {
    item.errorCount = (item.errorCount || 0) + 1;
    item.status = "active";
    item.nextReviewAt = tomorrow;
    item.lastMissedAt = nowISO();
  } else {
    item = {
      key, id: card.id, advId: card.advId || null,
      subj: card.subj, sub: card.sub, title: card.title || card.q,
      status: "active", errorCount: 1,
      nextReviewAt: tomorrow, addedAt: nowISO(), lastMissedAt: nowISO()
    };
    list.push(item);
  }
  saveErrorList(list);
  const stats = { ...defaultCardStats(), ...getCardStats(card) };
  stats.isInErrorList = true;
  stats.errorCount = item.errorCount;
  stats.nextReviewAt = tomorrow;
  stats.dueAt = new Date(tomorrow).getTime();
  setCardStats(card, stats);
  if (state.currentSession) state.currentSession.errorsAdded = (state.currentSession.errorsAdded || 0) + 1;
}

function updateErrorListOnCorrect(card, stats, meta) {
  meta = meta || {};
  if (!countsForMastery(true, meta.quality || stats.lastQuality, meta.confidence || stats.lastConfidence)) return;
  const list = loadErrorList();
  const key = cardKey(card);
  const item = list.find(x => x.key === key && x.status !== "resolved");
  if (!item) return;
  if ((stats.masteryCorrectCount || 0) >= MASTERY_THRESHOLD) {
    item.status = "resolved";
    stats.isInErrorList = false;
  } else {
    item.nextReviewAt = stats.nextReviewAt;
  }
  saveErrorList(list);
}

function masterCard(card, stats) {
  stats.isMastered = true;
  stats.masteredAt = nowISO();
  stats.retiredReason = "5 correct reviews across time";
  stats.isInErrorList = false;
  const mastered = loadMasteredCards();
  const key = cardKey(card);
  if (!mastered.find(x => x.key === key)) {
    mastered.unshift({
      key, id: card.id, advId: card.advId || null,
      subj: card.subj, sub: card.sub, title: card.title || card.q,
      masteredAt: stats.masteredAt
    });
    saveMasteredCards(mastered);
  }
  const list = loadErrorList();
  const item = list.find(x => x.key === key);
  if (item) item.status = "resolved";
  saveErrorList(list);
  if (state.currentSession) state.currentSession.mastered = (state.currentSession.mastered || 0) + 1;
}

function recordCardAnswer(card, correct, chosenOption, meta) {
  meta = meta || {};
  const stats = { ...defaultCardStats(), ...getCardStats(card) };
  stats.timesSeen = (stats.timesSeen || 0) + 1;
  stats.lastAnsweredAt = nowISO();
  stats.lastAnsweredCorrect = !!correct;
  stats.lastShown = Date.now();
  stats.lastQuality = meta.quality || null;
  stats.lastConfidence = meta.confidence || null;

  const now = nowISO();
  const today = now.slice(0, 10);
  stats.practiceHistory = stats.practiceHistory || [];
  stats.practiceHistory.push({
    at: now,
    correct: !!correct,
    practicedAt: now,
    practicedDate: today,
    wasCorrect: !!correct,
    selectedAnswerText: chosenOption?.t || "",
    correctAnswerText: (card.options || []).find(o => o.ok)?.t || "",
    sessionId: state.currentSession?.id || null,
    quality: meta.quality || null,
    confidence: meta.confidence || null,
    autopsy: meta.autopsy || null
  });
  stats.lastPracticedAt = now;
  stats.lastPracticedDate = today;
  if (!stats.firstPracticedAt) stats.firstPracticedAt = now;

  const missedDate = card.mostRecentImportedMissAt || card.dateAnswered || card.firstMissedAt;
  const missedDays = daysSinceISO(missedDate);

  if (correct) {
    stats.timesCorrect = (stats.timesCorrect || 0) + 1;
    stats.correctStreak = (stats.correctStreak || 0) + 1;
    if (countsForMastery(true, meta.quality, meta.confidence)) {
      stats.masteryCorrectCount = (stats.masteryCorrectCount || 0) + 1;
    } else {
      stats.luckyCorrectCount = (stats.luckyCorrectCount || 0) + 1;
    }
    scheduleNextReview(stats, true);
    if (stats.isInErrorList) updateErrorListOnCorrect(card, stats, meta);
    if (stats.masteryCorrectCount >= MASTERY_THRESHOLD && !stats.isMastered && countsForMastery(true, meta.quality, meta.confidence)) {
      masterCard(card, stats);
    }
    if (state.oldMissRecheck && missedDays >= 30 && meta.confidence >= 4 && (meta.quality === "knew_rule" || meta.quality === "recognized_trigger")) {
      stats.oldMissImproved = true;
      stats.persistentWeakness = false;
    }
    stats.activeWeakness = false;
  } else {
    stats.timesWrong = (stats.timesWrong || 0) + 1;
    stats.wrongCount = (stats.wrongCount || 0) + 1;
    stats.correctStreak = 0;
    stats.masteryCorrectCount = 0;
    if ((meta.confidence || 0) >= 4 && !meta.autopsy?.skippedMisclick) {
      stats.dangerError = true;
      stats.dangerErrors = stats.dangerErrors || [];
      stats.dangerErrors.push({ at: now, confidence: meta.confidence, answer: chosenOption?.t || "" });
    }
    if (missedDays <= 14 && !meta.autopsy?.skippedMisclick) stats.activeWeakness = true;
    if (state.oldMissRecheck && missedDays >= 30) stats.persistentWeakness = true;
    if (meta.autopsy) {
      stats.missAutopsies = stats.missAutopsies || [];
      stats.missAutopsies.push({ at: now, ...meta.autopsy });
      if (meta.autopsy.confusedWith) {
        stats.confusedWith = meta.autopsy.confusedWith;
        stats.confusionHistory = stats.confusionHistory || [];
        stats.confusionHistory.push({ at: now, with: meta.autopsy.confusedWith, doctrine: getCardDoctrine(card) });
      }
      if (meta.autopsy.ruleSentence) {
        stats.manualRuleEntries = stats.manualRuleEntries || [];
        stats.manualRuleEntries.push({ at: now, text: meta.autopsy.ruleSentence, sessionId: state.currentSession?.id || null });
        stats.lastManualRule = meta.autopsy.ruleSentence;
      }
    }
    addToErrorList(card);
    scheduleNextReview(stats, false);
  }

  updateDoctrineStats(card, correct, meta);
  setCardStats(card, stats);
  if (state.currentSession) {
    state.currentSession.questionsAnswered = (state.currentSession.questionsAnswered || 0) + 1;
    if (correct) state.currentSession.correct = (state.currentSession.correct || 0) + 1;
    else state.currentSession.wrong = (state.currentSession.wrong || 0) + 1;
    if (!correct && (meta.confidence || 0) >= 4) state.currentSession.dangerErrors = (state.currentSession.dangerErrors || 0) + 1;
    if (correct && !countsForMastery(true, meta.quality, meta.confidence)) state.currentSession.luckyCorrect = (state.currentSession.luckyCorrect || 0) + 1;
  }
}

function buildSessionQueue(pool, opts) {
  opts = opts || {};
  const settings = loadSessionSettings();
  const cfg = opts.reviewOnly
    ? { maxQuestions: pool.length, maxErrorQuestions: 999, maxNewQuestions: 999, maxDue: 999 }
    : (settings.dailyReview || opts.dailyReview)
      ? { maxQuestions: opts.maxQuestions || settings.dailyDue + settings.dailyErrors + settings.dailyNew, maxErrorQuestions: settings.dailyErrors, maxNewQuestions: settings.dailyNew, maxDue: settings.dailyDue }
      : { maxQuestions: opts.maxQuestions || settings.maxQuestions, maxErrorQuestions: settings.maxErrorQuestions, maxNewQuestions: settings.maxNewQuestions, maxDue: opts.maxQuestions || settings.maxQuestions };

  const errorKeys = new Set(loadErrorList().filter(x => x.status !== "resolved").map(x => x.key));
  const lastSessionKeys = new Set(loadLastSessionShownKeys());

  const active = dedupeCards(pool).filter(c => {
    if (getCardStats(c).isMastered) return false;
    if (isSnoozed(c)) return false;
    const key = cardKey(c);
    if (errorKeys.has(key) && !isErrorItemDue(c)) return false;
    return true;
  });
  const notRecent = active.filter(c => !answeredRecently(c, 12));
  const recentFallback = active.filter(c => answeredRecently(c, 12));
  const primary = notRecent.filter(c => !lastSessionKeys.has(cardKey(c)));
  const fallback = notRecent.filter(c => lastSessionKeys.has(cardKey(c)));
  primary.sort((a, b) => queuePriorityScore(b) - queuePriorityScore(a));
  fallback.sort((a, b) => queuePriorityScore(b) - queuePriorityScore(a));
  recentFallback.sort(staleAnsweredFirst);

  const queue = [];
  let newCount = 0, errorCount = 0, dueCount = 0;

  function classify(card) {
    const stats = getCardStats(card);
    const key = cardKey(card);
    const isNew = !stats.lastSeenAt;
    const isErr = errorKeys.has(key) && isErrorItemDue(card);
    const isDueCard = stats.lastSeenAt && isDue(stats) && !isErr;
    return { isNew, isErr, isDueCard };
  }

  function tryAdd(card) {
    if (queue.length >= cfg.maxQuestions) return false;
    const key = cardKey(card);
    if (queue.some(c => cardKey(c) === key)) return false;
    const { isNew, isErr, isDueCard } = classify(card);
    if (isErr && errorCount >= cfg.maxErrorQuestions) return false;
    if (isNew && newCount >= cfg.maxNewQuestions) return false;
    if (isDueCard && dueCount >= cfg.maxDue) return false;
    queue.push(card);
    if (isNew) newCount++;
    if (isErr) errorCount++;
    if (isDueCard) dueCount++;
    return true;
  }

  for (const c of primary) tryAdd(c);
  for (const c of fallback) tryAdd(c);
  for (const c of recentFallback) tryAdd(c);

  if (!queue.length && active.length) {
    return dedupeCards(active.sort(staleAnsweredFirst)).slice(0, cfg.maxQuestions);
  }
  return queue;
}

function baselineWeaknessScore(card){
  const scores=loadAdaptibarScores();
  const subject=normalizeMBESubject(card.subj);
  const subtopic=normalizeMBESubtopic(subject,card.sub);
  const subjectData=scores?.subjects?.[subject];
  const subtopicData=subjectData?.subtopics?.[subtopic];
  let score=0;
  if(subjectData&&typeof subjectData.accuracy==="number") score+=Math.max(0,70-subjectData.accuracy);
  if(subtopicData&&typeof subtopicData.accuracy==="number") score+=Math.max(0,70-subtopicData.accuracy)*1.5;
  return score;
}
function queuePriorityScore(card){
  const stats = { ...defaultCardStats(), ...getCardStats(card) };
  const key = cardKey(card);
  const lastSessionKeys = loadLastSessionShownKeys();
  let score = 0;
  if (stats.isMastered) return -999999;
  if (!stats.lastSeenAt) score += 5000;
  if (isDue(stats)) score += 3000;
  if (stats.isInErrorList && isErrorItemDue(card)) score += 2500;
  if (stats.dangerError) score += 4000;
  if (stats.activeWeakness) score += 3200;
  if (stats.persistentWeakness) score += 2800;
  score += baselineWeaknessScore(card);
  score += (stats.wrongCount || stats.timesWrong || 0) * 50;
  if (card.needsCategoryReview) score += 200;
  if (lastSessionKeys.includes(key)) score -= 2000;
  if (stats.lastSeenAt && new Date(stats.lastSeenAt).getTime() >= startOfToday()) score -= 1500;

  const missedDate = card.mostRecentImportedMissAt || card.dateAnswered || card.firstMissedAt;
  const missedDays = daysSinceISO(missedDate);
  const practicedDays = daysSinceISO(stats.lastPracticedAt);

  if (!stats.practiceHistory || stats.practiceHistory.length === 0) score += 60;
  if (missedDays >= 30 && practicedDays >= 14) score += 25;
  if (missedDays <= 14) score += 35;
  if (stats.lastAnsweredCorrect === true && practicedDays <= 7) score -= 50;
  if (stats.lastAnsweredCorrect === false && practicedDays <= 1) score -= 30;

  return score;
}
function subjectCorrect(o){return o.correct!=null?o.correct:Math.round(o.total*(o.accuracy||0)/100);}

const BULK_HEADERS = ["Subject","Subtopic","Scenario","Question","Option A","Option B","Option C","Option D","Correct (A-D)","Trap (A-D)","Why Correct","Why Trap Is Wrong","Plain English","Shortcut"];
const BULK_HEADER_ALIASES = {
  subject:["subject"],
  subtopic:["subtopic","sub","topic"],
  scenario:["scenario","facts","fact pattern","stem","question stem"],
  question:["question","call","call of the question","prompt"],
  optA:["option a","a","answer a","choice a","opt a"],
  optB:["option b","b","answer b","choice b","opt b"],
  optC:["option c","c","answer c","choice c","opt c"],
  optD:["option d","d","answer d","choice d","opt d"],
  correct:["correct","correct answer","answer","right answer"],
  trap:["trap","my wrong answer","tempting wrong","tempting answer"],
  whyCorrect:["why correct","correct explanation","explanation","why right","rule","why correct is right"],
  whyTrap:["why trap is wrong","why trap","trap explanation","why wrong"],
  plain:["plain english","plain","takeaway","one liner","one-liner"],
  shortcut:["shortcut","memory shortcut","hook","mnemonic"]
};
const BULK_LABELS = {subject:"Subject",scenario:"Scenario",optA:"Option A",optB:"Option B",correct:"Correct (A-D)"};
let bulkParsed = null;

function csvParseRows(text){
  text=String(text||"").replace(/^\uFEFF/,"");
  const rows=[]; let row=[], field="", i=0, inQ=false;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=c;i++;
  }
  if(field!==""||row.length){row.push(field);rows.push(row);}
  return rows;
}
function csvCell(v){ v=String(v==null?"":v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function normHeader(h){ return String(h||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[._\-]/g," ").replace(/\s+/g," ").trim(); }
function mapHeaders(headers){
  const idx={};
  headers.forEach((h,col)=>{ const n=normHeader(h);
    for(const field in BULK_HEADER_ALIASES){ if(idx[field]==null && BULK_HEADER_ALIASES[field].includes(n)){ idx[field]=col; break; } }
  });
  return idx;
}
function letterToIdx(v){
  v=String(v||"").trim().toUpperCase();
  if(!v) return null;
  if(/^[1-4]$/.test(v)) return +v-1;
  if(/^[A-D]$/.test(v)) return "ABCD".indexOf(v);
  let m=v.match(/\b([A-D])\b/); if(m) return "ABCD".indexOf(m[1]);
  m=v.match(/([A-D])\s*$/); if(m) return "ABCD".indexOf(m[1]);
  return null;
}
function bulkRowsToCards(rows){
  const errors=[], cards=[];
  if(!rows||!rows.length) return {cards, errors:["The file is empty."]};
  const headers=(rows[0]||[]).map(h=>String(h||"").trim());
  const idx=mapHeaders(headers);
  const need=["subject","scenario","optA","optB","correct"];
  const missing=need.filter(k=>idx[k]==null);
  if(missing.length) return {cards, errors:["Missing required column(s): "+missing.map(k=>BULK_LABELS[k]).join(", ")+". Download the template to copy the exact headers."]};
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.join("").trim()) continue;
    const get=k=> idx[k]!=null ? String(row[idx[k]]==null?"":row[idx[k]]).trim() : "";
    const rowNo=r+1;
    const subject=get("subject"), scenario=get("scenario");
    const opt=[get("optA"),get("optB"),get("optC"),get("optD")];
    const correct=letterToIdx(get("correct"));
    if(!subject){errors.push("Row "+rowNo+": missing Subject.");continue;}
    if(!scenario){errors.push("Row "+rowNo+": missing Scenario.");continue;}
    if(!opt[0]||!opt[1]){errors.push("Row "+rowNo+": need at least Option A and Option B.");continue;}
    if(correct==null){errors.push("Row "+rowNo+": Correct must be A, B, C, or D.");continue;}
    if(!opt[correct]){errors.push("Row "+rowNo+": Correct points to an empty option ("+"ABCD"[correct]+").");continue;}
    let trap=letterToIdx(get("trap"));
    if(trap!=null && !opt[trap]) trap=null;
    if(trap===correct) trap=null;
    const whyCorrect=get("whyCorrect"), whyTrap=get("whyTrap"), question=get("question");
    const options=[];
    opt.forEach((t,i2)=>{ if(t) options.push({t, ok:i2===correct, trap:i2===trap, why: i2===correct?whyCorrect:(i2===trap?whyTrap:"")}); });
    const cat=allocateMBECategory({rawSubject:subject, rawSubtopic:get("subtopic")});
    cards.push({ id:"U"+Date.now().toString(36)+"_"+r+Math.floor(Math.random()*1e4),
      ...cat, title:(question||get("subtopic")||scenario.slice(0,60)), scenario, q:question,
      ru:get("shortcut"), plain:get("plain"), options, _b:false });
  }
  return {cards, errors};
}
function buildTemplateCSV(){

function weaknessByMbeKey(cards){
  const scores=loadAdaptibarScores();
  const miss={};
  cards.forEach(c=>{const k=cardMbeKey(c);miss[k]=(miss[k]||0)+1;});
  const keys=new Set([...Object.keys(miss),...userCards.map(cardMbeKey)]);
  return [...keys].map(k=>{
    const subj=k.split(' / ')[0];
    const subPerf=scores.subjects&&scores.subjects[subj]&&scores.subjects[subj].subtopics;
    const sub=k.includes(' / ')?k.slice(k.indexOf(' / ')+3):'';
    const acc=subPerf&&subPerf[sub]?subPerf[sub].accuracy:null;
    return {mbeKey:k,misses:miss[k]||0,accuracy:acc};
  }).sort((a,b)=>(b.misses-a.misses)||((a.accuracy??100)-(b.accuracy??100)));

function parseAdaptiBar(raw){
  let t=raw.replace(/\u00a0/g,' ').replace(/\r/g,'');
  t=t.replace(/\u00a9\s*Copyright[^\n]*/g,'');
  const byId=new Map();
  let skippedCorrect=0;
  const re=/Question #(\d+)\s*-\s*([^\n/]+?)\s*\/\s*([^\n]+?)\s*\n/g;
  let m,idxs=[];
  while((m=re.exec(t))!==null){idxs.push({id:m[1],subj:m[2].trim(),sub:m[3].trim().replace(/\s*\(Simulated\)\s*$/i,''),start:m.index,hstart:re.lastIndex});}
  for(let i=0;i<idxs.length;i++){
    const cur=idxs[i],end=(i+1<idxs.length)?idxs[i+1].start:t.length;
    const body=t.slice(cur.hstart,end);
    const dateMatch=body.match(/Date\s+Answered:\s*([0-9]{1,2}\/[0-9]{1,2}\/[0-9]{4})/i);
    const dateAnsweredRaw=dateMatch?dateMatch[1].trim():"";
    const dateAnswered=normalizeUSDate(dateAnsweredRaw);
    let mr=body.match(/You\s+answered\s+([A-D])\.\s*The correct answer is\s+([A-D])/);
    if(!mr)continue;
    const picked=mr[1],correct=mr[2];
    if(picked===correct){skippedCorrect++;continue;}
    const exm=body.match(/\n\s*(?:Brief\s+)?Explanation\s*\n/);
    const qPart=exm?body.slice(0,exm.index):body;
    const ePart=exm?body.slice(exm.index):body;
    const qm=qPart.match(/\bQuestion\s*\n([\s\S]*?)(?=\n\s*A:\s)/);
    let stem=qm?qm[1].trim().replace(/\s+/g,' '):'';
    const choices={};
    const cre=/\n\s*([A-D]):\s*([\s\S]*?)(?=\n\s*[A-D]:\s|$)/g;
    let cm;while((cm=cre.exec(qPart))!==null){choices[cm[1]]=cm[2].trim().replace(/\s+/g,' ');}
    const expl={};
    const ere=/\b([A-D]) is (?:correct|incorrect)\.\s*([\s\S]*?)(?=\b[A-D] is (?:correct|incorrect)\.|$)/g;
    let em;while((em=ere.exec(ePart))!==null){expl[em[1]]=em[2].trim().replace(/\s+/g,' ');}
    if(Object.keys(choices).length<2)continue;
    let scenario=stem,q='Which answer is correct?';
    const qpos=stem.lastIndexOf('?');
    if(qpos>0){const before=stem.slice(0,qpos+1);const cs=before.lastIndexOf('. ')>=0?before.lastIndexOf('. ')+2:0;
      q=before.slice(cs).trim();scenario=stem.slice(0,cs).trim()||stem;}
    const letters=['A','B','C','D'].filter(L=>choices[L]!==undefined);
    const historyEntry={
      dateAnswered,
      dateAnsweredRaw,
      selectedLetter:picked,
      correctLetter:correct,
      selectedAnswerText:choices[picked]||"",
      correctAnswerText:choices[correct]||""
    };

    if(byId.has(cur.id)){
      const existing=byId.get(cur.id);
      existing.importedAttemptHistory=existing.importedAttemptHistory||[];
      const dup=existing.importedAttemptHistory.some(a=>
        a.dateAnswered===historyEntry.dateAnswered &&
        a.selectedLetter===historyEntry.selectedLetter &&
        a.correctLetter===historyEntry.correctLetter
      );
      if(!dup) existing.importedAttemptHistory.push(historyEntry);
      syncCardDateFields(existing);
      letters.forEach(L=>{
        if(L===picked){
          const opt=existing.options.find(o=>o.t===choices[L]);
          if(opt) opt.trap=true;
        }
      });
      continue;
    }

    const options=letters.map(L=>({t:choices[L],ok:(L===correct),trap:(L===picked),why:expl[L]||''}));
    if(options.filter(o=>o.ok).length!==1)continue;
    const cat=allocateMBECategory({rawSubject:cur.subj,rawSubtopic:cur.sub});
    const card={
      id:'A'+cur.id,
      advId:cur.id,
      ...cat,
      dateAnswered,
      dateAnsweredRaw,
      importedAt:new Date().toISOString(),
      firstMissedAt:dateAnswered,
      mostRecentImportedMissAt:dateAnswered,
      importedAttemptHistory:[historyEntry],
      title:cat.sub||cur.sub,
      scenario,
      q,
      ru:'',
      options,
      _b:false,
      rawSubject:cur.subj,
      rawSubtopic:cur.sub,
      needsCategoryReview:cat.needsCategoryReview
    };
    byId.set(cur.id,card);
  }
  const cards=[];
  for(const card of byId.values()){
    syncCardDateFields(card);
    enrichCardWithTriggerAnalysis(card);
    (card.importedAttemptHistory||[]).forEach(a=>recordImportedAttempt(card,a));
    cards.push(card);
  }
  return { cards, skippedCorrect };
}

async function extractPdfText(arrayBuffer, onProgress){
  if(!window.pdfjsLib) throw new Error('pdfjs-not-loaded');
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const c=await page.getTextContent();
    let lastY=null;
    for(const it of c.items){
      const y=it.transform?it.transform[5]:null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>2) out+='\n';
      out+=it.str; if(it.hasEOL) out+='\n'; lastY=y;
    }
    out+='\n';
    if(onProgress && (p%10===0||p===pdf.numPages)) onProgress(p,pdf.numPages);
  }
  return out;
}

function startErrorReview() {
  const list = loadErrorList();
  const dueKeys = new Set(
    list
      .filter(x => x.status !== "resolved")
      .filter(x => !x.nextReviewAt || new Date(x.nextReviewAt).getTime() <= Date.now())
      .map(x => x.key)
  );

  const cards = allCards().filter(card => dueKeys.has(cardKey(card)) && !isCardSnoozed(card));

  if (cards.length === 0) {
    alert("No due error-list questions today. Good. Do new due questions instead.");
    return;
  }

  state.currentSession = newSession();
  const settings = loadSessionSettings();
  state.queue = finalizeQueue(cards, settings.maxQuestions || cards.length, (a, b) => {
    const sa = getCardStats(a);
    const sb = getCardStats(b);
    return (sb.errorCount || sb.timesWrong || 0) - (sa.errorCount || sa.timesWrong || 0);
  });

  state.i = 0;
  state.locked = false;
  state.correct = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.dodged = 0;
  state.missed = [];
  state.perSubj = {};
  state.perMbeKey = {};

  state.mode = "drill";
  renderDrill();
}

function startRun(opts){
  opts=opts||{};
  state.thresholdMode = !!opts.thresholdGate;
  state.ruleTransferMode = !!opts.ruleTransfer;
  state.oldMissRecheck = !!opts.oldMissRecheck;
  state.focusMode = !!opts.focusMission;
  state.studyLock = !!opts.focusMission;
  const sf=([...state.selected].length===1)?state.subFilter:new Set();
  const matchSub = d => {
    if(state.mbeKeyFilter.size) return state.mbeKeyFilter.has(cardMbeKey(d));
    if(sf.size) return sf.has((d.sub||'').trim());
    return true;
  };
  let pool=allCards().filter(d=>state.selected.has(d.subj) && matchSub(d) && passesDateFilter(d, state.dateFilter || "all") && !isCardSnoozed(d));
  if(opts.reviewOnly) pool=pool.filter(d=>d.needsCategoryReview&&!d._b);
  else if(opts.activeWeakness) pool=pool.filter(d=>getCardStats(d).activeWeakness || missAgeStatus(d)==='recent_active_weakness');
  else if(opts.oldMissRecheck) pool=pool.filter(d=>{
    const s=getCardStats(d);
    const missedDays=daysSinceISO(d.mostRecentImportedMissAt||d.dateAnswered||d.firstMissedAt);
    const practicedDays=daysSinceISO(s.lastPracticedAt);
    return missedDays>=30 && !s.isMastered && practicedDays>=14;
  });
  else if(opts.dangerOnly) pool=pool.filter(d=>getCardStats(d).dangerError);
  else pool=pool.filter(d=>!getCardStats(d).isMastered);

  if(opts.reviewOnly || opts.activeWeakness || opts.oldMissRecheck || opts.dangerOnly) {
    const settings = loadSessionSettings();
    const requested = opts.maxQuestions || (opts.reviewOnly ? pool.length : settings.maxQuestions);
    pool = finalizeQueue(pool, requested, (a,b)=>queuePriorityScore(b)-queuePriorityScore(a));
  } else {
    pool = buildSessionQueue(pool, opts);
  }

  if(pool.length===0){alert(opts.reviewOnly?'No imported cards need category review.':opts.oldMissRecheck?'No old misses need recheck.':opts.dangerOnly?'No danger errors flagged yet.':'No cards match that filter yet. Pick another subject or subtopic.');return;}

  state.currentSession = newSession();
  if (opts.focusMission) state.currentSession.focusMission = true;
  state.queue=pool;state.i=0;state.locked=false;state.correct=0;state.streak=0;
  state.bestStreak=0;state.dodged=0;state.missed=[];state.perSubj={};state.perMbeKey={};
  pool.forEach(d=>{
    state.perSubj[d.subj]=state.perSubj[d.subj]||{c:0,t:0};
    const k=cardMbeKey(d);state.perMbeKey[k]=state.perMbeKey[k]||{c:0,t:0};
  });
  if (state.thresholdMode) renderThresholdGate();
  else if (state.ruleTransferMode) renderRuleTransferDrill();
  else state.mode==='drill'?renderDrill():renderLecture();
}

function getRuleTransferCard(card) {
  const doctrine = getCardDoctrine(card);
  const variant = RULE_TRANSFER_VARIANTS[doctrine];
  if (!variant) return null;
  return {
    ...card,
    _transfer: true,
    scenario: variant.scenario,
    q: "Same doctrine — new fact pattern. Which answer is correct?",
    options: variant.options.map(o => ({ ...o, why: o.ok ? variant.answer : "This applies the wrong threshold or doctrine." })),
    title: "Rule Transfer: " + doctrine
  };
}

function renderRuleTransferDrill() {
  setViewportMode('drill');

  app.innerHTML = `

    </div>`;

    if (ans.length < 8) { alert('Write a short threshold answer first — even one sentence.'); return; }

    setCardStats(d, stats);
    state.thresholdMode = false;
    renderDrill();
  };
