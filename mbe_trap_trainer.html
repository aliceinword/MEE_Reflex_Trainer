function finalizePick(pending) {
  const { d, chosen, opts, correctIdx, confidence, quality, autopsy } = pending;
  const correct = !!chosen.ok;
  const mk = cardMbeKey(d);
  state.perSubj[d.subj] = state.perSubj[d.subj] || { c: 0, t: 0 };
  state.perMbeKey[mk] = state.perMbeKey[mk] || { c: 0, t: 0 };
  if (correct) {
    state.correct++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.perSubj[d.subj].c++;
    state.perMbeKey[mk].c++;
    if (d.options.some(o => o.trap)) state.dodged++;
  } else {
    state.streak = 0;
    state.missed.push(d);
    if (!autopsy?.skippedMisclick) reviveMasteredForDoctrine(d);
  }
  recordCardAnswer(d, correct, chosen, { confidence, quality, autopsy });
  revealDrillFeedback(pending);
}

function revealDrillFeedback(pending) {
  const { d, chosen, opts, correctIdx } = pending;
  const rule = opts[correctIdx];
  const trapOpt = d.options.find(o => o.trap);
  const dodged = chosen.ok && d.options.some(o => o.trap);
  let fb = `<div class="fb"><div class="fb-actions" style="margin-bottom:8px"><span class="verdict ${chosen.ok ? 'ok' : 'no'}">${chosen.ok ? '✓ Correct' : '✗ Not quite'}</span>`;
  if (!chosen.ok && (pending.confidence || 0) >= 4) fb += ` <span class="danger-badge">DANGER ERROR</span>`;
  if (chosen.ok && (pending.quality != null || pending.confidence != null) && !countsForMastery(true, pending.quality, pending.confidence)) fb += ` <span class="active-badge">LUCKY — STAYS ACTIVE</span>`;
  fb += `</div>`;
  if (dodged && trapOpt) fb += `<div class="dodged"><span class="big">🎯</span><span><strong>Trap dodged.</strong> On the real set you picked: “${esc(trapOpt.t)}”.</span></div>`;
  if (!chosen.ok) {
    fb += buildTrapComparisonHTML(chosen, rule, d);
    if (chosen.trap) fb += `<div class="dodged" style="background:var(--no-bg);border-left-color:var(--no);color:#7f1d1d"><span class="big">⚠</span><span>This is the <strong>exact answer you picked on the real test.</strong></span></div>`;
  } else {
    fb += `<div class="fb-box fb-rule"><strong>The rule</strong>${esc(rule.why) || '(the correct answer)'}</div>`;
  }
  const doctrine = getCardDoctrine(d);
  if (MEE_BRIDGE[doctrine]) fb += `<div class="fb-box fb-ru"><strong>MEE/MPT Bridge</strong>${esc(MEE_BRIDGE[doctrine])}</div>`;
  if (d.ru) fb += `<div class="fb-box fb-ru"><strong>Shortcut</strong>${esc(d.ru)}</div>`;
  const flagged = !!getCardStats(d).flaggedForReview;
  fb += `<div class="fb-actions"><button class="btn btn-ghost btn-sm" id="flagLater">${flagged?'🚩 Flagged ✓':'🚩 Flag for later'}</button>
    <button class="btn btn-ghost btn-sm" id="snooze14">&#128277; Don't ask for 2 weeks</button>
    <button class="btn btn-primary" id="next">${state.i + 1 < state.queue.length ? 'Next →' : 'See results →'}</button></div></div>`;
  document.getElementById('fb').innerHTML = fb;
  document.getElementById('next').onclick = nextCard;
  const flagBtn = document.getElementById('flagLater');
  if (flagBtn) flagBtn.onclick = () => flagCardForLater(d, flagBtn);
  const sn = document.getElementById('snooze14');
  if (sn) sn.onclick = () => snoozeCard(d, 14, sn);
  if (!chosen.ok) {
    try {
      document.getElementById('fb').insertAdjacentHTML('beforeend', renderTriggerAnalysisBox(d));
    } catch (e) {}
  }
  state.pendingPick = null;
}

/* Per-subject attack sequence (issue order) — surfaced on each drill question to train threshold-first habits */

  "Evidence": {short:"Relevant? \u2192 purpose \u2192 hearsay? \u2192 exception \u2192 policy/constitutional bar",
    more:"Name the purpose the evidence is offered for before arguing admissibility \u2014 many traps turn on offered-for-truth vs. offered for something else."},
  "Contracts": {short:"Goods (UCC) or common law? \u2192 formation \u2192 defenses \u2192 breach \u2192 remedies",
    more:"Decide UCC vs. common law first \u2014 the rule changes (modification, warranties, perfect tender, etc.)."},

function attackSeqHTML(subj){

}

function pick(opts,k,btns){
  if(state.locked)return;state.locked=true;
  const d=state.queue[state.i];const chosen=opts[k];const correctIdx=opts.findIndex(o=>o.ok);
  btns.forEach((b,j)=>{b.classList.add('locked');
    if(opts[j].ok)b.classList.add('correct');else if(j===k)b.classList.add('wrong');else b.classList.add('dim');});
  state.perSubj[d.subj]=state.perSubj[d.subj]||{c:0,t:0};state.perSubj[d.subj].t++;
  const mk=cardMbeKey(d);state.perMbeKey[mk]=state.perMbeKey[mk]||{c:0,t:0};state.perMbeKey[mk].t++;
  document.querySelector('.bar i').style.width=Math.round((state.i+1)/state.queue.length*100)+'%';

  const pending = { d, chosen, opts, correctIdx, k };
  state.pendingPick = pending;

  // No forced rating/autopsy popup — reveal feedback immediately (use the optional
  // "Flag for later" button in the feedback if you want to revisit a question).
  finalizePick(pending);
}
function flagCardForLater(card, btnEl){
  try{
    const stats = getCardStats(card);
    stats.flaggedForReview = true;
    stats.flaggedAt = nowISO();
    setCardStats(card, stats);
  }catch(e){}
  state.missed = state.missed || [];
  if(!state.missed.some(m=>m.id===card.id)) state.missed.push(card);
  if(btnEl){ btnEl.textContent='🚩 Flagged ✓'; btnEl.disabled=true; btnEl.style.opacity='.7'; }
}
function nextCard(){
  state.i++;
  if(state.i>=state.queue.length){
    if(state.focusMode){state.studyLock=false;state.focusMode=false;}
    renderEnd();
  } else if(state.ruleTransferMode) renderRuleTransferDrill();
  else renderDrill();
}

/* ============================ COVERAGE REPORT ============================ */
const COV_STOP = new Set(("the a an and or of to in for on with without by within into onto as is are was were be been being not no nor any all under over from at this that these those there here their its his her your our which who whom whose when where what how why whether between among after before during including include includes etc ie eg type types kind kinds general other others special problem problems issue issues rule rules law laws case cases court courts party parties claim claims action actions matter related involving against upon out off per via amp nbsp may must shall will would could should").split(/\s+/));
function covTokens(str){
  return [...new Set(String(str || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(w => w.length >= 4 && !COV_STOP.has(w)))];
}
function renderCoverageReport(){
  const cards = allCards();
  const subjects = Object.keys(MBE_OUTLINE);
  let totalCats = 0, coveredCats = 0;
  const totalCards = cards.length;
  let sections = "";
  subjects.forEach(subject => {
    const cats = MBE_OUTLINE[subject] || [];
    const subjCards = cards.filter(c => normalizeMBESubject(c.subj) === subject);
    const cardToks = subjCards.map(c => new Set([...covTokens(c.sub), ...covTokens(c.title)]));
    let catLines = "", subjCovered = 0;
    cats.forEach(cat => {
      totalCats++;
      const bag = new Set([...covTokens(cat.c), ...cat.t.flatMap(t => covTokens(t))]);
      let n = 0;
      cardToks.forEach(tok => { for (const t of tok) { if (bag.has(t)) { n++; break; } } });
      const ok = n > 0;
      if (ok) { coveredCats++; subjCovered++; }
      const topics = cat.t.map(t => `<span class="cov-topic">${esc(t)}</span>`).join("");
      catLines += `<div class="cov-cat ${ok ? 'cov-ok' : 'cov-gap'}">
        <div class="cov-cat-head"><span class="cov-mark">${ok ? '\u2713' : '\u26A0'}</span><span class="cov-cat-name">${esc(cat.c)}</span><span class="cov-count">${ok ? n + ' card' + (n === 1 ? '' : 's') : 'no cards'}</span></div>
        <div class="cov-topics">${topics}</div>
      </div>`;
    });
    const gaps = cats.length - subjCovered;
    sections += `<details class="cov-subj" ${gaps > 0 ? 'open' : ''}>
      <summary><span class="cov-subj-name">${esc(subject)}</span><span class="cov-subj-meta">${subjCovered}/${cats.length} areas \u00B7 ${subjCards.length} cards${gaps > 0 ? ` \u00B7 <b style="color:var(--no,#DC2626)">${gaps} gap${gaps === 1 ? '' : 's'}</b>` : ' \u00B7 \u2713'}</span></summary>
      ${catLines}</details>`;
  });
  const pct = totalCats ? Math.round(coveredCats / totalCats * 100) : 0;
  app.innerHTML = `
    <h2 style="font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;margin-bottom:4px">Coverage Report</h2>
    <p style="color:var(--sec);font-size:12.5px;line-height:1.6;margin-bottom:6px">Across <b>${totalCards}</b> cards (built-in + your imports), you have at least one card in <b>${coveredCats} of ${totalCats}</b> official MBE areas (${pct}%). Areas with <b style="color:var(--no,#DC2626)">no cards</b> are flagged.</p>
    <p style="color:var(--mut);font-size:11px;line-height:1.5;margin-bottom:12px">Approximate: keyword-matches your cards' subject + subtopic labels to the NCBE outline. Treat a flagged gap as a strong lead, not gospel \u2014 sometimes it just means your label is worded differently. The grey chips under each area are the official sub-topics tested there.</p>
    ${sections}
    <div class="lec-nav" style="margin-top:14px"><button class="btn btn-ghost" id="covBack">\u2190 Main menu</button></div>`;
  document.getElementById('covBack').onclick = renderStart;
}

      Paste an AdaptiBar <b>Exam Report</b> (only questions you <b>missed</b> become drill cards) or a <b>Score Report</b> (subject accuracy → badges on the home screen).
      Upload PDF, load <span class="mono">.txt</span>, or paste the text.</div>
    <div class="panel" style="padding:12px 16px">
      <div class="lbl">Easiest: just give it the PDF</div>
      <p style="font-size:12px">Click <b>Upload PDF</b> below and pick your AdaptiBar report file. No copying needed. (If that doesn't work — e.g. you're offline — paste the text instead.)</p>
    </div>
    ${note?`<div class="ok-toast">${esc(note)}</div>`:''}
    <div class="start-actions" style="margin-top:4px;margin-bottom:14px">
      <button class="btn btn-primary" id="advPdfBtn">📄 Upload PDF</button>
      <span id="advStatus" style="font-size:12px;color:var(--mut);align-self:center"></span>
    </div>
    <div class="form-row">
      <label>…or paste the report text</label>
      <textarea class="ta" id="advText" style="min-height:120px" placeholder="Question #2443 - Contracts / Performance...&#10;You answered A. The correct answer is B&#10;Question ..."></textarea>
    </div>
    <div class="start-actions" style="margin-top:4px">
      <button class="btn btn-ghost btn-sm" id="advFileBtn">📄 …or load a .txt file</button>
      <button class="btn btn-primary" id="advParse">Parse report (misses + scores) →</button>
      <button class="btn btn-ghost" id="advBack">← Back</button>
    </div>
    <input type="file" id="advFile" accept=".txt,text/plain" class="hidden">
    <input type="file" id="advPdf" accept="application/pdf,.pdf" class="hidden">
    <div id="advPreview" style="margin-top:16px"></div>`;
  document.getElementById('advBack').onclick=renderStart;
  document.getElementById('advFileBtn').onclick=()=>document.getElementById('advFile').click();
  document.getElementById('advPdfBtn').onclick=()=>document.getElementById('advPdf').click();
  const statusEl=()=>document.getElementById('advStatus');
  document.getElementById('advPdf').onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    if(!window.pdfjsLib){statusEl().innerHTML='<span style="color:var(--orange)">PDF reader didn\u2019t load (no internet?). Paste the text instead.</span>';this.value='';return;}
    statusEl().textContent='Reading PDF…';
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const text=await extractPdfText(r.result,(p,tot)=>{statusEl().textContent='Reading PDF… page '+p+'/'+tot;});
        document.getElementById('advText').value=text;
        statusEl().innerHTML='<span style="color:var(--green)">✓ PDF read. Scanning for misses…</span>';
        doParse();
      }catch(err){statusEl().innerHTML='<span style="color:var(--orange)">Couldn\u2019t read that PDF. Try the paste option.</span>';}
    };
    r.readAsArrayBuffer(f);this.value='';
  };
  document.getElementById('advFile').onchange=function(e){
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{document.getElementById('advText').value=r.result;doParse();};r.readAsText(f);this.value='';};
  document.getElementById('advParse').onclick=doParse;
  function doParse(){
    const raw=document.getElementById('advText').value;
    if(!raw.trim()){document.getElementById('advPreview').innerHTML=`<div class="err">Paste the report text first.</div>`;return;}
    let cards=[], perf=null, skippedCorrect=0;
    try{
      const parsed=parseAdaptiBar(raw);
      if(Array.isArray(parsed)){cards=parsed;}
      else{cards=parsed.cards||[];skippedCorrect=parsed.skippedCorrect||0;}
    }catch(e){cards=[];}
    try{perf=parseAdaptibarSubjectPerformance(raw);}catch(e){perf=null;}
    const hasPerf=perf&&Object.keys(perf.subjects).length>0;
    if(hasPerf) saveAdaptibarScores(perf);
    // Preview: count new vs merge
    let newCount = 0, mergeCount = 0, builtinSkipCount = 0;
    for (const c of cards) {
      if (isBuiltinQuestion(c.advId)) { builtinSkipCount++; continue; }
      if (userCards.find(u => u.advId && u.advId === c.advId)) mergeCount++;
      else newCount++;
    }
    advParsed = cards;
    if(cards.length===0&&!hasPerf){
      const skipNote=skippedCorrect?` Found ${skippedCorrect} question${skippedCorrect!==1?'s':''} you answered correctly — those are skipped.`:'';
      document.getElementById('advPreview').innerHTML=`<div class="err">No missed questions to import.${skipNote} Paste an Exam Report with wrong answers (lines like “You answered A. The correct answer is B”) or a Score Report (lines like “72.5% Civil Procedure (40)”).</div>`;return;}
    let html='';
    if(hasPerf){
      const meta=[perf.dateRange?esc(perf.dateRange):'',perf.overallAccuracy!=null?perf.overallAccuracy+'% overall':'',perf.questionsAnswered!=null?perf.questionsAnswered+' answered':''].filter(Boolean).join(' · ');
      html+=`<div class="ok-toast">✓ Score report parsed${meta?' · '+meta:''}. Subject badges updated on the home screen.</div><div class="subj-bars">${perfSubjectRows(perf)}</div>`;
    }
    if(cards.length){
      const tally={};cards.forEach(c=>{const k=cardMbeKey(c);tally[k]=(tally[k]||0)+1;});
      const rows=Object.keys(tally).sort().map(k=>`<div class="sb"><span class="nm" style="font-size:11.5px">${esc(k)}</span><span class="track"><i style="width:${Math.min(100,tally[k]*9)}%;background:var(--orange)"></i></span><span class="pct">${tally[k]}</span></div>`).join('');
      html+=`<div class="ok-toast" style="margin-top:${hasPerf?'12px':'0'}">Found <b>${cards.length}</b> missed question${cards.length!==1?'s':''}${skippedCorrect?` (${skippedCorrect} correct — skipped)`:''}. <b>${newCount}</b> new · <b>${mergeCount}</b> will merge attempts${builtinSkipCount?` · <b>${builtinSkipCount}</b> already in built-in deck (skipped)`:''}.</div>
      <div class="subj-bars">${rows}</div>
      ${cards.length?`<button class="btn btn-primary" id="advConfirm">Import ${cards.length} card${cards.length!==1?'s':''} into the drill ⚔</button>`:''}`;
    } else if(hasPerf){
      html+=`<div class="start-actions" style="margin-top:12px"><button class="btn btn-primary" id="advHome">← Back — badges updated</button></div>`;
    }
    document.getElementById('advPreview').innerHTML=html;
    const home=document.getElementById('advHome');
    if(home) home.onclick=renderStart;
    const cf=document.getElementById('advConfirm');
    if(cf)cf.onclick=()=>{
      let addedCount=0, mergedCount=0, skippedBuiltin=0;
      for (const incoming of migrateCardCategories(advParsed)) {
        if (isBuiltinQuestion(incoming.advId)) { skippedBuiltin++; continue; }
        enrichCardWithTriggerAnalysis(incoming);
        syncCardDateFields(incoming);
        const existing = userCards.find(c => c.advId && c.advId === incoming.advId);
        if (existing) {
          mergeImportedCard(existing, incoming);
          mergedCount++;
        } else {
          userCards.push(incoming);
          addedCount++;
        }
      }
      const saved=saveUser();
      state.selected=null;state.seen=new Set();
      renderAdaptiImport((saved?'✓ ':'(saved in memory — Export to keep a backup) ')+`Imported ${addedCount} new card${addedCount!==1?'s':''}. Merged ${mergedCount} repeat attempt${mergedCount!==1?'s':''}.${skippedBuiltin?` Skipped ${skippedBuiltin} already in built-in deck.`:''} Paste another report or go Back.`);
    };
  }
}

/* ---------- CATEGORY REVIEW ---------- */
function renderCategoryFix(cardId,returnToDrill){
  const card=userCards.find(c=>c.id===cardId);
  if(!card){returnToDrill?renderDrill():renderMyCards();return;}
  const subOpts=subtopicsFor(card.subj).map(s=>`<option value="${esc(s)}" ${s===card.sub?'selected':''}>${esc(s)}</option>`).join('');
  app.innerHTML=`
    <h2 style="font-size:18px;margin-bottom:4px">Fix category</h2>
    <div class="panel" style="margin-bottom:14px"><div class="lbl">Question</div><p style="font-size:13px">${esc(card.title||card.q)}</p>
      <p style="font-size:12px;color:var(--sec);margin-top:6px">Imported as: <span class="mono">${esc(card.rawSubject||'?')} / ${esc(card.rawSubtopic||'?')}</span></p></div>
    <div class="form-row"><label>MBE Subject</label>
      <select class="sel" id="fixSubj">${MBE_TOP_SUBJECTS.map(s=>`<option value="${esc(s)}" ${s===card.subj?'selected':''}>${esc(s)}</option>`).join('')}</select>
    </div>
    <div class="form-row"><label>AdaptiBar Subtopic</label>
      <select class="sel" id="fixSub">${subOpts}</select>
    </div>
    <div class="start-actions">
      <button class="btn btn-primary" id="fixSave">Save category</button>
      <button class="btn btn-ghost" id="fixCancel">${returnToDrill?'← Back to drill':'← Back'}</button>
    </div>`;
  const fixSubj=document.getElementById('fixSubj');
  const fixSub=document.getElementById('fixSub');
  fixSubj.onchange=()=>{
    fixSub.innerHTML=subtopicsFor(fixSubj.value).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  };
  document.getElementById('fixCancel').onclick=()=>{returnToDrill?renderDrill():renderMyCards();};
  document.getElementById('fixSave').onclick=()=>{
    const subj=fixSubj.value, sub=fixSub.value;
    card.subj=subj;
    card.sub=sub;
    card.mbeKey=`${subj} / ${sub}`;
    card.needsCategoryReview=!isKnownMBESubtopic(subj,sub);
    saveUser();
    returnToDrill?renderDrill():renderMyCards();
  };
}

function renderMyCards(){

  cards = sortCardsByDate(cards, sortMode);
  const sortOptions = [
    ["missNewest", "Most recent AdaptiBar miss"],
    ["missOldest", "Oldest AdaptiBar miss"],
    ["practiceNewest", "Last practiced newest"],

  let list = cards.length? cards.map(c=>{

      <button class="btn btn-ghost" id="dupeCheck">🔍 Dupe & rule check</button>
      <button class="btn btn-ghost" id="back2">← Back</button>

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this card?')){userCards=userCards.filter(c=>c.id!==b.dataset.del);saveUser();renderMyCards();}});
  document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>renderCategoryFix(b.dataset.fix,false));
  document.getElementById('addMore').onclick=()=>renderAdd();
  document.getElementById('exp2').onclick=exportCards;
  document.getElementById('imp2').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('dupeCheck').onclick=renderDupeCheck;
  document.getElementById('back2').onclick=renderStart;
  const myDateFilter = document.getElementById('myDateFilter');
  if (myDateFilter) myDateFilter.onchange = () => { state.dateFilter = myDateFilter.value; renderMyCards(); };
  const mySortMode = document.getElementById('mySortMode');
  if (mySortMode) mySortMode.onchange = () => { state.cardSortMode = mySortMode.value; renderMyCards(); };
}

/* ---------- EXPORT / IMPORT ---------- */
function exportCards(){
  const backup = {
    version: 2,
    exportedAt: nowISO(),
    userCards,
    cardStats: loadCardStatsMap(),
    errorList: loadErrorList(),
    sessionLog: loadSessionLog(),
    masteredCards: loadMasteredCards(),
    schedulerSettings: loadSessionSettings()
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "trap_trainer_full_backup.json";
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('importFile').onchange=function(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const parsed=JSON.parse(r.result);
    if (parsed && (parsed.type === "triggerAnalysisExport" || parsed.type === "triggerAnalysis") && Array.isArray(parsed.analyses)) {
      const n = importTriggerAnalyses(parsed.analyses);
      alert('Imported trigger analyses for ' + n + ' card(s). They will appear on next drill/lecture or refresh.');
      renderStart();
      return;
    }
    if (parsed && parsed.version >= 2) {
      const mode = userCards.length
        ? confirm('OK = MERGE imported cards with yours.\nCancel = REPLACE all your cards with this backup.')
        : false;
      const incoming = migrateCardCategories((parsed.userCards || []).filter(c => c && c.q));
      if (mode) {
        const existingKeys = new Set(userCards.map(getCardFingerprint));
        for (const inc of incoming) {
          const existing = userCards.find(c => c.advId && inc.advId && c.advId === inc.advId);
          if (existing) mergeImportedCard(existing, inc);
          else if (!existingKeys.has(getCardFingerprint(inc))) {
            userCards.push(inc);
            existingKeys.add(getCardFingerprint(inc));
          }
        }
      } else {
        userCards = incoming;
      }
      localStorage.setItem(CARD_STATS_KEY, JSON.stringify(parsed.cardStats || {}));
      localStorage.setItem(ERROR_LIST_KEY, JSON.stringify(parsed.errorList || []));
      localStorage.setItem(SESSION_LOG_KEY, JSON.stringify(parsed.sessionLog || []));
      localStorage.setItem(MASTERED_KEY, JSON.stringify(parsed.masteredCards || []));
      if (parsed.schedulerSettings) saveSessionSettings(parsed.schedulerSettings);
      saveUser();
      userCards = initUserCards();
      state.selected = null;
      state.seen = new Set();
      alert('Full backup imported — cards and scheduling history restored.');
      renderStart();
      return;
    }
    const arr = Array.isArray(parsed) ? parsed : (parsed.cards || parsed);
    if(!Array.isArray(arr))throw 0;
    const mode=confirm('OK = ADD these to your cards.\nCancel = REPLACE all your cards with this file.');
    const rawClean=arr.filter(c=>c&&c.options&&c.q).map(c=>({
      ...c,
      id:c.id||'U'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      _b:false
    }));
    const clean = migrateCardCategories(rawClean);

    // === Duplicate check for uploaded cards ===
    const existingKeys = new Set(userCards.map(getCardFingerprint));
    const seenInFile = new Set();
    let internalDupCount = 0;
    let existingDupCount = 0;
    const fresh = [];
    for (let c of clean) {
      const key = getCardFingerprint(c);
      if (seenInFile.has(key)) {
        internalDupCount++;
        continue;
      }
      seenInFile.add(key);
      if (existingKeys.has(key)) {
        existingDupCount++;
        continue;
      }
      fresh.push(c);
    }

    userCards = mode ? userCards.concat(fresh) : fresh;
    saveUser();state.selected=null;state.seen=new Set();
    let msg = `Imported ${fresh.length} new card(s).`;
    if (internalDupCount > 0 || existingDupCount > 0) {
      msg += ` Skipped ${internalDupCount} duplicate(s) inside the file`;
      if (existingDupCount > 0) msg += ` and ${existingDupCount} that already existed`;
      msg += '.';
    }
    alert(msg);
    renderStart();
  }catch(err){alert('That file could not be read as Trap Trainer cards or trigger analyses.');}};
  r.readAsText(f);this.value='';
};

/* ---------- END ---------- */
function renderEnd(){
  setViewportMode('start');
  const session = finishCurrentSession();
  const total=state.queue.length,c=state.correct,acc=Math.round(c/total*100);
  let msg;
  if(acc>=85){msg="Exam-ready discrimination. The reflex is rewiring.";}
  else if(acc>=65){msg="Solid. The traps you still hit are named now.";}
  else{msg="Rough round — but that's the point. You found the reflexes to fix.";}
  let bars=MBE_TOP_SUBJECTS.filter(s=>state.perSubj[s]&&state.perSubj[s].t>0).map(s=>{
    const o=state.perSubj[s];const p=Math.round(o.c/o.t*100);
    const col=p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--no)';
    return `<div class="sb"><span class="nm">${esc(fullName(s))}</span><span class="track"><i style="width:${p}%;background:${col}"></i></span><span class="pct">${o.c}/${o.t}</span></div>`;}).join('');
  let mbeBars=Object.keys(state.perMbeKey).filter(k=>state.perMbeKey[k].t>0).sort().map(k=>{
    const o=state.perMbeKey[k];const p=Math.round(o.c/o.t*100);
    const col=p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--no)';
    return `<div class="sb"><span class="nm" style="font-size:11.5px">${esc(k)}</span><span class="track"><i style="width:${p}%;background:${col}"></i></span><span class="pct">${o.c}/${o.t}</span></div>`;
  }).join('');
  let ml=state.missed.length?state.missed.map(d=>`<div class="ml-item"><span class="id">${d._b?'Q#'+d.id:'★'} ${esc(cardMbeKey(d))}</span><span>${esc(d.title||d.q)}</span></div>`).join('')
    :`<div class="ml-item" style="color:var(--green)">Clean sweep — nothing missed. 🔥</div>`;
  const newReviewed = session?.newShown || 0;
  const dueReviewed = session?.dueShown || 0;
  const errorsAdded = session?.errorsAdded || 0;
  const masteredCount = session?.mastered || 0;
  const luckyCount = session?.luckyCorrect || 0;
  const dangerCount = session?.dangerErrors || 0;
  const revivedCount = session?.revivedMastered || 0;
  const nextErrDate = getNextErrorReviewDate();
  const missionDone = session?.focusMission ? `<div class="ok-toast" style="margin-bottom:12px">Mission complete. Done — go take a break.</div>` : '';
  app.innerHTML=`${missionDone}<div class="end"><h2>Round complete</h2>
    <div class="sub">${esc(msg)}</div>
    <div class="score-big">${c}<span class="den">/${total}</span> <span style="font-size:20px;color:var(--orange)">${acc}%</span></div>
    <div class="stat-row">
      <div class="stat"><div class="n">${state.bestStreak}</div><div class="l">best streak</div></div>
      <div class="stat"><div class="n">${state.dodged}</div><div class="l">traps dodged 🎯</div></div>
      <div class="stat"><div class="n">${state.missed.length}</div><div class="l">to revisit</div></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n">${newReviewed}</div><div class="l">new reviewed</div></div>
      <div class="stat"><div class="n">${dueReviewed}</div><div class="l">due reviewed</div></div>
      <div class="stat"><div class="n">${errorsAdded}</div><div class="l">added to error list</div></div>
      <div class="stat"><div class="n">${masteredCount}</div><div class="l">mastered</div></div>
      <div class="stat"><div class="n">${luckyCount}</div><div class="l">lucky correct</div></div>
      <div class="stat"><div class="n">${dangerCount}</div><div class="l">danger errors</div></div>
    </div>
    ${revivedCount ? `<div style="font-size:13px;color:var(--warn);margin:8px 0">Revived ${revivedCount} mastered card${revivedCount!==1?'s':''} in the same doctrine for recheck.</div>` : ''}
    <div style="font-size:13px;color:var(--sec);margin:8px 0 14px">Next error review: <strong>${esc(nextErrDate)}</strong></div>
    <div style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:6px 0">By subject</div>
    <div class="subj-bars">${bars}</div>
    <div style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px">By MBE category</div>
    <div class="subj-bars">${mbeBars}</div>
    <div style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px">Still slipping on</div>
    <div class="missed-list">${ml}</div>
    <div class="start-actions">
      ${state.missed.length?`<button class="btn btn-primary" id="retry">Retry just the ${state.missed.length} I missed ⚔</button>`:''}
      <button class="btn btn-ghost" id="viewErrors">View Error List</button>
      <button class="btn btn-ghost" id="viewMastered">Review Mastered</button>
      <button class="btn btn-ghost" id="restart">Back to start</button></div></div>`;
  if(state.missed.length){document.getElementById('retry').onclick=()=>{
    const ms=dedupeCards(state.missed.slice());
    state.currentSession = newSession();
    state.queue=ms;state.i=0;state.correct=0;state.streak=0;
    state.bestStreak=0;state.dodged=0;state.missed=[];state.perSubj={};state.perMbeKey={};
    ms.forEach(d=>{state.perSubj[d.subj]={c:0,t:0};state.perMbeKey[cardMbeKey(d)]={c:0,t:0};});renderDrill();};}
  document.getElementById('viewErrors').onclick=renderErrorList;
  document.getElementById('viewMastered').onclick=renderMasteredCards;
  document.getElementById('restart').onclick=renderStart;
}

document.addEventListener('keydown',e=>{
  if(state.ruleRehearsalPending)return;
  if(state.mode!=='drill'||!state.queue.length)return;
  if(!state.locked&&window._btns){const n=parseInt(e.key);if(n>=1&&n<=window._btns.length)window._btns[n-1].click();}
  else if(state.locked&&(e.key==='Enter'||e.key==='ArrowRight')){const nx=document.getElementById('next');if(nx)nx.click();}
});

/* STOPWATCH (replaced the 25min focus timer) */
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;
let swTimer = null;

const pomT = document.getElementById('pomT');
const pomLbl = document.getElementById('pomLbl');
const pomStartBtn = document.getElementById('pomStart');
const pomResetBtn = document.getElementById('pomReset');

function fmt(s) {
  const m = Math.floor(s / 60);
  const x = s % 60;
  return `${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`;
}

function swDraw() {
  const totalSeconds = Math.floor((swElapsed + (swRunning ? Date.now() - swStartTime : 0)) / 1000);
  pomT.textContent = fmt(totalSeconds);
}

function swTick() {
  swDraw();
}

function startStopwatch() {
  if (swRunning) return;
  swRunning = true;
  swStartTime = Date.now() - swElapsed;
  pomStartBtn.textContent = 'Pause';
  swTimer = setInterval(swTick, 1000);
}

function pauseStopwatch() {
  if (!swRunning) return;
  swRunning = false;
  swElapsed = Date.now() - swStartTime;
  clearInterval(swTimer);
  pomStartBtn.textContent = 'Start';
  swDraw();
}

function resetStopwatch() {
  swRunning = false;
  clearInterval(swTimer);
  swElapsed = 0;
  swStartTime = 0;
  pomStartBtn.textContent = 'Start';
  pomT.textContent = '00:00';
}

pomStartBtn.onclick = function () {
  if (swRunning) {
    pauseStopwatch();
  } else {
    startStopwatch();
  }
};

pomResetBtn.onclick = resetStopwatch;

// Initialize
pomLbl.textContent = 'Stopwatch';
pomT.textContent = '00:00';

window.runCategoryDebugTests = runCategoryDebugTests;
try {
  renderStart();
} catch (e) {
  console.error(e);
  app.innerHTML = `<div class="panel" style="border-color:var(--no)"><strong>Trap Trainer failed to start</strong><p>${esc(String(e.message || e))}</p><p class="hint">Open DevTools (F12) → Console for details. Your cards are still in localStorage.</p><button class="btn btn-sm" onclick="location.reload()">Reload</button></div>`;
}
</script>
</body>
</html>
