/* ============================ BULK CSV / EXCEL IMPORT ============================ */
const BULK_HEADERS = ["Subject","Subtopic","Scenario","Question","Option A","Option B","Option C","Option D","Correct (A-D)","Trap (A-D)","Why Correct","Why Trap Is Wrong","Plain English","Shortcut"];
const BULK_HEADER_ALIASES = {
  subject:["subject"],
  subtopic:["subtopic","sub","topic"],
  scenario:["scenario","facts","fact pattern","stem","question stem"],
  question:["question","call","call of the question","prompt"],
  optA:["option a","a","answer a","choice a","opt a"],
  optB:["option b","b","answer b","choice b","opt b"],
  optC:["option c","c","answer c","choice c","opt c"],
  optD:["option d","d","answer d","choice d","opt d"],
  correct:["correct","correct answer","answer","right answer"],
  trap:["trap","my wrong answer","tempting wrong","tempting answer"],
  whyCorrect:["why correct","correct explanation","explanation","why right","rule","why correct is right"],
  whyTrap:["why trap is wrong","why trap","trap explanation","why wrong"],
  plain:["plain english","plain","takeaway","one liner","one-liner"],
  shortcut:["shortcut","memory shortcut","hook","mnemonic"]
};
const BULK_LABELS = {subject:"Subject",scenario:"Scenario",optA:"Option A",optB:"Option B",correct:"Correct (A-D)"};
let bulkParsed = null;

function csvParseRows(text){
  text=String(text||"").replace(/^\uFEFF/,"");
  const rows=[]; let row=[], field="", i=0, inQ=false;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=c;i++;
  }
  if(field!==""||row.length){row.push(field);rows.push(row);}
  return rows;
}
function csvCell(v){ v=String(v==null?"":v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function normHeader(h){ return String(h||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[._\-]/g," ").replace(/\s+/g," ").trim(); }
function mapHeaders(headers){
  const idx={};
  headers.forEach((h,col)=>{ const n=normHeader(h);
    for(const field in BULK_HEADER_ALIASES){ if(idx[field]==null && BULK_HEADER_ALIASES[field].includes(n)){ idx[field]=col; break; } }
  });
  return idx;
}
function letterToIdx(v){
  v=String(v||"").trim().toUpperCase();
  if(!v) return null;
  if(/^[1-4]$/.test(v)) return +v-1;
  if(/^[A-D]$/.test(v)) return "ABCD".indexOf(v);
  let m=v.match(/\b([A-D])\b/); if(m) return "ABCD".indexOf(m[1]);
  m=v.match(/([A-D])\s*$/); if(m) return "ABCD".indexOf(m[1]);
  return null;
}
function bulkRowsToCards(rows){
  const errors=[], cards=[];
  if(!rows||!rows.length) return {cards, errors:["The file is empty."]};
  const headers=(rows[0]||[]).map(h=>String(h||"").trim());
  const idx=mapHeaders(headers);
  const need=["subject","scenario","optA","optB","correct"];
  const missing=need.filter(k=>idx[k]==null);
  if(missing.length) return {cards, errors:["Missing required column(s): "+missing.map(k=>BULK_LABELS[k]).join(", ")+". Download the template to copy the exact headers."]};
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.join("").trim()) continue;
    const get=k=> idx[k]!=null ? String(row[idx[k]]==null?"":row[idx[k]]).trim() : "";
    const rowNo=r+1;
    const subject=get("subject"), scenario=get("scenario");
    const opt=[get("optA"),get("optB"),get("optC"),get("optD")];
    const correct=letterToIdx(get("correct"));
    if(!subject){errors.push("Row "+rowNo+": missing Subject.");continue;}
    if(!scenario){errors.push("Row "+rowNo+": missing Scenario.");continue;}
    if(!opt[0]||!opt[1]){errors.push("Row "+rowNo+": need at least Option A and Option B.");continue;}
    if(correct==null){errors.push("Row "+rowNo+": Correct must be A, B, C, or D.");continue;}
    if(!opt[correct]){errors.push("Row "+rowNo+": Correct points to an empty option ("+"ABCD"[correct]+").");continue;}
    let trap=letterToIdx(get("trap"));
    if(trap!=null && !opt[trap]) trap=null;
    if(trap===correct) trap=null;
    const whyCorrect=get("whyCorrect"), whyTrap=get("whyTrap"), question=get("question");
    const options=[];
    opt.forEach((t,i2)=>{ if(t) options.push({t, ok:i2===correct, trap:i2===trap, why: i2===correct?whyCorrect:(i2===trap?whyTrap:"")}); });
    const cat=allocateMBECategory({rawSubject:subject, rawSubtopic:get("subtopic")});
    cards.push({ id:"U"+Date.now().toString(36)+"_"+r+Math.floor(Math.random()*1e4),
      ...cat, title:(question||get("subtopic")||scenario.slice(0,60)), scenario, q:question,
      ru:get("shortcut"), plain:get("plain"), options, _b:false });
  }
  return {cards, errors};
}
function buildTemplateCSV(){
  const ex1=["Civil Procedure","Personal Jurisdiction",
    "A plaintiff from State A sues a defendant from State B in State A federal court. The defendant's only contact with State A is one yearly vacation. The defendant timely moves to dismiss for lack of personal jurisdiction.",
    "Should the court dismiss?","Yes — the defendant lacks claim-related minimum contacts.","No — the defendant was served properly.","No — the plaintiff resides in State A.","",
    "A","B","An unrelated yearly vacation isn't purposeful, claim-related contact, so there is no specific jurisdiction.","Proper service does not create personal jurisdiction without minimum contacts.","A court needs real, claim-related ties to the state — one vacation isn't enough.","Contacts before service."];
  const ex2=["Evidence","Hearsay",
    "At a criminal trial, a witness testifies that a bystander shouted 'the blue car ran the red light!' right as the crash happened. The defense objects on hearsay grounds.",
    "Is the statement admissible?","Yes — it is an excited utterance.","No — it is hearsay with no exception.","Yes — it is a present recollection recorded.","No — it lacks personal knowledge.",
    "A","B","A statement made under the stress of a startling event qualifies as an excited utterance.","It is hearsay, but the excited-utterance exception applies, so 'no exception' is wrong.","Spontaneous statements made in the heat of a shocking moment come in as excited utterances.","Stress = excited utterance."];
  return [BULK_HEADERS, ex1, ex2].map(r=>r.map(csvCell).join(",")).join("\r\n")+"\r\n";
}
function triggerDownload(filename, content, mime){
  try{
    const blob=new Blob([content],{type:mime||"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){ alert("Download blocked by the browser. "+(e.message||"")); }
}

let _sheetjsPromise=null;
function loadSheetJS(){
  if(typeof window!=="undefined" && window.XLSX) return Promise.resolve(window.XLSX);
  if(_sheetjsPromise) return _sheetjsPromise;
  _sheetjsPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=> window.XLSX ? res(window.XLSX) : rej(new Error("reader missing"));
    s.onerror=()=> rej(new Error("load failed"));
    document.head.appendChild(s);
  });
  return _sheetjsPromise;
}
function handleBulkFile(file){
  if(!file) return;
  const name=(file.name||"").toLowerCase();
  const isCSV = name.endsWith(".csv") || file.type==="text/csv";
  const setStatus=t=>{ const el=document.getElementById("bulkStatus"); if(el) el.textContent=t; };
  if(isCSV){
    const reader=new FileReader();
    reader.onload=()=>{ try{ finishBulkParse(csvParseRows(reader.result)); }catch(e){ renderBulkImport("Couldn't read that CSV: "+(e.message||"")); } };
    reader.onerror=()=> renderBulkImport("Couldn't read that file.");
    reader.readAsText(file);
  } else {
    setStatus("Loading the Excel reader (needs internet once)…");
    loadSheetJS().then(XLSX=>{
      const reader=new FileReader();
      reader.onload=()=>{ try{
        const wb=XLSX.read(new Uint8Array(reader.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        finishBulkParse(XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:""}));
      }catch(e){ renderBulkImport("Couldn't read that Excel file: "+(e.message||"")); } };
      reader.onerror=()=> renderBulkImport("Couldn't read that file.");
      reader.readAsArrayBuffer(file);
    }).catch(()=> renderBulkImport("Couldn't load the Excel reader (it needs internet the first time). In Excel or Google Sheets choose File → Save As / Download → CSV, then upload that — CSV works offline."));
  }
}
function finishBulkParse(rows){ bulkParsed=bulkRowsToCards(rows); renderBulkImport(); }

function fullName(s){return s;}

function weaknessByMbeKey(cards){
  const scores=loadAdaptibarScores();
  const miss={};
  cards.forEach(c=>{const k=cardMbeKey(c);miss[k]=(miss[k]||0)+1;});
  const keys=new Set([...Object.keys(miss),...userCards.map(cardMbeKey)]);
  return [...keys].map(k=>{
    const subj=k.split(' / ')[0];
    const subPerf=scores.subjects&&scores.subjects[subj]&&scores.subjects[subj].subtopics;
    const sub=k.includes(' / ')?k.slice(k.indexOf(' / ')+3):'';
    const acc=subPerf&&subPerf[sub]?subPerf[sub].accuracy:null;
    return {mbeKey:k,misses:miss[k]||0,accuracy:acc};
  }).sort((a,b)=>(b.misses-a.misses)||((a.accuracy??100)-(b.accuracy??100)));
}

function parseAdaptiBar(raw){
  let t=raw.replace(/\u00a0/g,' ').replace(/\r/g,'');
  t=t.replace(/\u00a9\s*Copyright[^\n]*/g,'');
  const byId=new Map();
  let skippedCorrect=0;
  const re=/Question #(\d+)\s*-\s*([^\n/]+?)\s*\/\s*([^\n]+?)\s*\n/g;
  let m,idxs=[];
  while((m=re.exec(t))!==null){idxs.push({id:m[1],subj:m[2].trim(),sub:m[3].trim().replace(/\s*\(Simulated\)\s*$/i,''),start:m.index,hstart:re.lastIndex});}
  for(let i=0;i<idxs.length;i++){
    const cur=idxs[i],end=(i+1<idxs.length)?idxs[i+1].start:t.length;
    const body=t.slice(cur.hstart,end);
    const dateMatch=body.match(/Date\s+Answered:\s*([0-9]{1,2}\/[0-9]{1,2}\/[0-9]{4})/i);
    const dateAnsweredRaw=dateMatch?dateMatch[1].trim():"";
    const dateAnswered=normalizeUSDate(dateAnsweredRaw);
    let mr=body.match(/You\s+answered\s+([A-D])\.\s*The correct answer is\s+([A-D])/);
    if(!mr)continue;
    const picked=mr[1],correct=mr[2];
    if(picked===correct){skippedCorrect++;continue;}
    const exm=body.match(/\n\s*(?:Brief\s+)?Explanation\s*\n/);
    const qPart=exm?body.slice(0,exm.index):body;
    const ePart=exm?body.slice(exm.index):body;
    const qm=qPart.match(/\bQuestion\s*\n([\s\S]*?)(?=\n\s*A:\s)/);
    let stem=qm?qm[1].trim().replace(/\s+/g,' '):'';
    const choices={};
    const cre=/\n\s*([A-D]):\s*([\s\S]*?)(?=\n\s*[A-D]:\s|$)/g;
    let cm;while((cm=cre.exec(qPart))!==null){choices[cm[1]]=cm[2].trim().replace(/\s+/g,' ');}
    const expl={};
    const ere=/\b([A-D]) is (?:correct|incorrect)\.\s*([\s\S]*?)(?=\b[A-D] is (?:correct|incorrect)\.|$)/g;
    let em;while((em=ere.exec(ePart))!==null){expl[em[1]]=em[2].trim().replace(/\s+/g,' ');}
    if(Object.keys(choices).length<2)continue;
    let scenario=stem,q='Which answer is correct?';
    const qpos=stem.lastIndexOf('?');
    if(qpos>0){const before=stem.slice(0,qpos+1);const cs=before.lastIndexOf('. ')>=0?before.lastIndexOf('. ')+2:0;
      q=before.slice(cs).trim();scenario=stem.slice(0,cs).trim()||stem;}
    const letters=['A','B','C','D'].filter(L=>choices[L]!==undefined);
    const historyEntry={
      dateAnswered,
      dateAnsweredRaw,
      selectedLetter:picked,
      correctLetter:correct,
      selectedAnswerText:choices[picked]||"",
      correctAnswerText:choices[correct]||""
    };

    if(byId.has(cur.id)){
      const existing=byId.get(cur.id);
      existing.importedAttemptHistory=existing.importedAttemptHistory||[];
      const dup=existing.importedAttemptHistory.some(a=>
        a.dateAnswered===historyEntry.dateAnswered &&
        a.selectedLetter===historyEntry.selectedLetter &&
        a.correctLetter===historyEntry.correctLetter
      );
      if(!dup) existing.importedAttemptHistory.push(historyEntry);
      syncCardDateFields(existing);
      letters.forEach(L=>{
        if(L===picked){
          const opt=existing.options.find(o=>o.t===choices[L]);
          if(opt) opt.trap=true;
        }
      });
      continue;
    }

    const options=letters.map(L=>({t:choices[L],ok:(L===correct),trap:(L===picked),why:expl[L]||''}));
    if(options.filter(o=>o.ok).length!==1)continue;
    const cat=allocateMBECategory({rawSubject:cur.subj,rawSubtopic:cur.sub});
    const card={
      id:'A'+cur.id,
      advId:cur.id,
      ...cat,
      dateAnswered,
      dateAnsweredRaw,
      importedAt:new Date().toISOString(),
      firstMissedAt:dateAnswered,
      mostRecentImportedMissAt:dateAnswered,
      importedAttemptHistory:[historyEntry],
      title:cat.sub||cur.sub,
      scenario,
      q,
      ru:'',
      options,
      _b:false,
      rawSubject:cur.subj,
      rawSubtopic:cur.sub,
      needsCategoryReview:cat.needsCategoryReview
    };
    byId.set(cur.id,card);
  }
  const cards=[];
  for(const card of byId.values()){
    syncCardDateFields(card);
    enrichCardWithTriggerAnalysis(card);
    (card.importedAttemptHistory||[]).forEach(a=>recordImportedAttempt(card,a));
    cards.push(card);
  }
  return { cards, skippedCorrect };
}

if(window.pdfjsLib){try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}}
async function extractPdfText(arrayBuffer, onProgress){
  if(!window.pdfjsLib) throw new Error('pdfjs-not-loaded');
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const c=await page.getTextContent();
    let lastY=null;
    for(const it of c.items){
      const y=it.transform?it.transform[5]:null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>2) out+='\n';
      out+=it.str; if(it.hasEOL) out+='\n'; lastY=y;
    }
    out+='\n';
    if(onProgress && (p%10===0||p===pdf.numPages)) onProgress(p,pdf.numPages);
  }
  return out;
}

  if (!state.expandedSubjects) state.expandedSubjects = new Set();
  if (state.expandedSubjects.has(subj)) {

}

function toggleSubtopicFilter(mbeKey, checked) {
  if (!state.mbeKeyFilter) state.mbeKeyFilter = new Set();
  if (checked) {
    state.mbeKeyFilter.add(mbeKey);
    // Auto-include the parent subject
    const subj = mbeKey.split(' / ')[0];
    if (state.selected && !state.selected.has(subj)) {
      state.selected.add(subj);
    }
  } else {
    state.mbeKeyFilter.delete(mbeKey);
  }
  renderStart();
}

function toggleSubjectSelection(subj, checked) {
  if (!state.selected) state.selected = new Set();
  if (checked) {
    state.selected.add(subj);
  } else {
    state.selected.delete(subj);
    // If deselecting subject, also clear any of its subtopic filters
    if (state.mbeKeyFilter) {
      [...state.mbeKeyFilter].forEach(k => {
        if (k.startsWith(subj + ' / ')) state.mbeKeyFilter.delete(k);
      });
    }
  }
  renderStart();
}

function startErrorReview() {
  const list = loadErrorList();
  const dueKeys = new Set(
    list
      .filter(x => x.status !== "resolved")
      .filter(x => !x.nextReviewAt || new Date(x.nextReviewAt).getTime() <= Date.now())
      .map(x => x.key)
  );

  const cards = allCards().filter(card => dueKeys.has(cardKey(card)) && !isCardSnoozed(card));

  if (cards.length === 0) {
    alert("No due error-list questions today. Good. Do new due questions instead.");
    return;
  }

  state.currentSession = newSession();
  state.queue = cards.sort((a, b) => {
    const sa = getCardStats(a);
    const sb = getCardStats(b);
    return (sb.errorCount || sb.timesWrong || 0) - (sa.errorCount || sa.timesWrong || 0);
  });

  state.i = 0;
  state.locked = false;
  state.correct = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.dodged = 0;
  state.missed = [];
  state.perSubj = {};
  state.perMbeKey = {};

  state.mode = "drill";
  renderDrill();
}

function startRun(opts){
  opts=opts||{};
  state.thresholdMode = !!opts.thresholdGate;
  state.ruleTransferMode = !!opts.ruleTransfer;
  state.oldMissRecheck = !!opts.oldMissRecheck;
  state.focusMode = !!opts.focusMission;
  state.studyLock = !!opts.focusMission;
  const sf=([...state.selected].length===1)?state.subFilter:new Set();
  const matchSub = d => {
    if(state.mbeKeyFilter.size) return state.mbeKeyFilter.has(cardMbeKey(d));
    if(sf.size) return sf.has((d.sub||'').trim());
    return true;
  };
  let pool=allCards().filter(d=>state.selected.has(d.subj) && matchSub(d) && passesDateFilter(d, state.dateFilter || "all") && !isCardSnoozed(d));
  if(opts.reviewOnly) pool=pool.filter(d=>d.needsCategoryReview&&!d._b);
  else if(opts.activeWeakness) pool=pool.filter(d=>getCardStats(d).activeWeakness || missAgeStatus(d)==='recent_active_weakness');
  else if(opts.oldMissRecheck) pool=pool.filter(d=>{
    const s=getCardStats(d);
    const missedDays=daysSinceISO(d.mostRecentImportedMissAt||d.dateAnswered||d.firstMissedAt);
    const practicedDays=daysSinceISO(s.lastPracticedAt);
    return missedDays>=30 && !s.isMastered && practicedDays>=14;
  });
  else if(opts.dangerOnly) pool=pool.filter(d=>getCardStats(d).dangerError);
  else pool=pool.filter(d=>!getCardStats(d).isMastered);

  if(opts.reviewOnly || opts.activeWeakness || opts.oldMissRecheck || opts.dangerOnly) {
    pool.sort((a,b)=>queuePriorityScore(b)-queuePriorityScore(a));
  } else {
    pool = buildSessionQueue(pool, opts);
  }

  if(pool.length===0){alert(opts.reviewOnly?'No imported cards need category review.':opts.oldMissRecheck?'No old misses need recheck.':opts.dangerOnly?'No danger errors flagged yet.':'No cards match that filter yet. Pick another subject or subtopic.');return;}

  state.currentSession = newSession();
  if (opts.focusMission) state.currentSession.focusMission = true;
  state.queue=pool;state.i=0;state.locked=false;state.correct=0;state.streak=0;
  state.bestStreak=0;state.dodged=0;state.missed=[];state.perSubj={};state.perMbeKey={};
  pool.forEach(d=>{
    state.perSubj[d.subj]=state.perSubj[d.subj]||{c:0,t:0};
    const k=cardMbeKey(d);state.perMbeKey[k]=state.perMbeKey[k]||{c:0,t:0};
  });
  if (state.thresholdMode) renderThresholdGate();
  else if (state.ruleTransferMode) renderRuleTransferDrill();
  else state.mode==='drill'?renderDrill():renderLecture();
}

function getRuleTransferCard(card) {
  const doctrine = getCardDoctrine(card);
  const variant = RULE_TRANSFER_VARIANTS[doctrine];
  if (!variant) return null;
  return {
    ...card,
    _transfer: true,
    scenario: variant.scenario,
    q: "Same doctrine — new fact pattern. Which answer is correct?",
    options: variant.options.map(o => ({ ...o, why: o.ok ? variant.answer : "This applies the wrong threshold or doctrine." })),
    title: "Rule Transfer: " + doctrine
  };
}

function renderRuleTransferDrill() {
  setViewportMode('drill');
  clearRuleRehearsalModal();
  const base = state.queue[state.i];
  const d = getRuleTransferCard(base);

    app.innerHTML = `<div class="panel"><p>No rule-transfer variant for this doctrine yet. Skipping…</p><button class="btn btn-primary" id="skipRt">Next</button></div>`;

  setViewportMode('drill');

  const thresholdQ = buildThresholdQuestion(d, doctrine);
  const stem = [d.scenario, d.q].filter(Boolean).join('\n\n');
  app.innerHTML = `
    <div class="prog-wrap"><div class="prog-meta"><span>${esc(doctrine)} · Threshold Gate ${state.i+1}/${state.queue.length}</span>
      <button class="btn btn-ghost btn-sm" onclick="renderStart()">← Main menu</button></div><div class="bar"><i style="width:${Math.round(state.i/state.queue.length*100)}%"></i></div></div>

      <div class="start-actions"><button class="btn btn-primary" id="thresholdContinue">I answered the threshold → show choices</button></div>
    </div>`;

    setCardStats(d, stats);
    state.thresholdMode = false;
    renderDrill();
  };

    <div class="rule-modal-err" id="auErr"></div>
    <div class="rule-modal-actions"><button class="btn btn-primary" id="auSubmit">Unlock explanation →</button></div>
  `, (el) => {
    const misclickType = MISTAKE_TYPES[0];
    const ruleRow = el.querySelector('#auRuleRow');
    const triggerRow = el.querySelector('#auTriggerRow');
    const confusedRow = el.querySelector('#auConfusedRow');
    const mistakeSel = el.querySelector('#auMistake');

    function finishMisclick() {
      clearRuleRehearsalModal();
      onComplete({ mistakeType: misclickType, skippedMisclick: true });
    }

    function isMisclickSelected() {
      return mistakeSel.value === misclickType;
    }

    function syncMisclickFields() {
      const misclick = isMisclickSelected();
      ruleRow.style.display = misclick ? 'none' : '';
      triggerRow.style.display = misclick ? 'none' : '';
      confusedRow.style.display = misclick ? 'none' : '';
    }

    el.querySelector('#auMisclick').onclick = finishMisclick;
    mistakeSel.onchange = syncMisclickFields;
    syncMisclickFields();

    el.querySelector('#auSubmit').onclick = () => {
      const autopsy = {
        mistakeType: mistakeSel.value,
        pickedBecause: el.querySelector('#auPicked').value.trim(),
        wrongBecause: el.querySelector('#auWrong').value.trim(),
        ruleSentence: el.querySelector('#auRule').value.trim(),
        triggerPhrase: el.querySelector('#auTrigger').value.trim(),
        confusedWith: el.querySelector('#auConfused').value.trim(),
        nextTime: el.querySelector('#auNext').value.trim()
      };
      const err = el.querySelector('#auErr');
      if (isMisclickSelected()) {
        clearRuleRehearsalModal();
        onComplete({ ...autopsy, skippedMisclick: true });
        return;
      }
      if (!autopsy.pickedBecause || !autopsy.wrongBecause || !autopsy.nextTime) {
        err.textContent = 'Fill in why you picked it, why it was wrong, and what you will do next time.';
        return;
      }
      if (!isValidRuleSentence(autopsy.ruleSentence)) {
        err.textContent = 'Write one precise rule sentence (not “review Civ Pro”). At least 6 words and 20 characters.';
        return;
      }
      if (!autopsy.triggerPhrase) {
        err.textContent = 'Name the trigger phrase or threshold fact you missed.';
        return;
      }
      clearRuleRehearsalModal();
      onComplete(autopsy);
    };
  });
}

function finalizePick(pending) {
  const { d, chosen, opts, correctIdx, confidence, quality, autopsy } = pending;
  const correct = !!chosen.ok;
  const mk = cardMbeKey(d);
  state.perSubj[d.subj] = state.perSubj[d.subj] || { c: 0, t: 0 };
  state.perMbeKey[mk] = state.perMbeKey[mk] || { c: 0, t: 0 };
  if (correct) {
    state.correct++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.perSubj[d.subj].c++;
    state.perMbeKey[mk].c++;
    if (d.options.some(o => o.trap)) state.dodged++;
  } else {
    state.streak = 0;
    state.missed.push(d);
    if (!autopsy?.skippedMisclick) reviveMasteredForDoctrine(d);
  }
  recordCardAnswer(d, correct, chosen, { confidence, quality, autopsy });
  revealDrillFeedback(pending);
}

function revealDrillFeedback(pending) {
  const { d, chosen, opts, correctIdx } = pending;
  const rule = opts[correctIdx];
  const trapOpt = d.options.find(o => o.trap);
  const dodged = chosen.ok && d.options.some(o => o.trap);
  let fb = `<div class="fb"><div class="fb-actions" style="margin-bottom:8px"><span class="verdict ${chosen.ok ? 'ok' : 'no'}">${chosen.ok ? '✓ Correct' : '✗ Not quite'}</span>`;
  if (!chosen.ok && (pending.confidence || 0) >= 4) fb += ` <span class="danger-badge">DANGER ERROR</span>`;
  if (chosen.ok && (pending.quality != null || pending.confidence != null) && !countsForMastery(true, pending.quality, pending.confidence)) fb += ` <span class="active-badge">LUCKY — STAYS ACTIVE</span>`;
  fb += `</div>`;
  if (dodged && trapOpt) fb += `<div class="dodged"><span class="big">🎯</span><span><strong>Trap dodged.</strong> On the real set you picked: “${esc(trapOpt.t)}”.</span></div>`;
  if (!chosen.ok) {
    fb += buildTrapComparisonHTML(chosen, rule, d);
    if (chosen.trap) fb += `<div class="dodged" style="background:var(--no-bg);border-left-color:var(--no);color:#7f1d1d"><span class="big">⚠</span><span>This is the <strong>exact answer you picked on the real test.</strong></span></div>`;
  } else {
    fb += `<div class="fb-box fb-rule"><strong>The rule</strong>${esc(rule.why) || '(the correct answer)'}</div>`;
  }
  const doctrine = getCardDoctrine(d);
  if (MEE_BRIDGE[doctrine]) fb += `<div class="fb-box fb-ru"><strong>MEE/MPT Bridge</strong>${esc(MEE_BRIDGE[doctrine])}</div>`;
  if (d.ru) fb += `<div class="fb-box fb-ru"><strong>Shortcut</strong>${esc(d.ru)}</div>`;
  const flagged = !!getCardStats(d).flaggedForReview;
  fb += `<div class="fb-actions"><button class="btn btn-ghost btn-sm" id="flagLater">${flagged?'🚩 Flagged ✓':'🚩 Flag for later'}</button>
    <button class="btn btn-ghost btn-sm" id="snoozeTwoWeeks">Don't ask this question again for 2 weeks</button>
    <button class="btn btn-primary" id="next">${state.i + 1 < state.queue.length ? 'Next →' : 'See results →'}</button></div></div>`;
  document.getElementById('fb').innerHTML = fb;
  document.getElementById('next').onclick = nextCard;
  const flagBtn = document.getElementById('flagLater');
  if (flagBtn) flagBtn.onclick = () => flagCardForLater(d, flagBtn);
  const snoozeBtn = document.getElementById('snoozeTwoWeeks');
  if (snoozeBtn) snoozeBtn.onclick = () => snoozeCardForTwoWeeks(d, snoozeBtn);
  try {
    document.getElementById('fb').insertAdjacentHTML('beforeend', renderTriggerAnalysisBox(d));
  } catch (e) {}
  state.pendingPick = null;
}

/* Per-subject attack sequence (issue order) — surfaced on each drill question to train threshold-first habits */
const ATTACK_SEQUENCE = {
  "Civil Procedure": {short:"SMJ \u2192 PJ \u2192 Venue \u2192 Service/Notice \u2192 Removal",
    more:"Diagram first: P(domicile) v D(domicile), and where it was filed. Stuck between two answers? One is usually <b>technical</b> (timing / procedure), the other <b>substantive</b> (the merits) \u2014 confirm the technical gate is actually met before you reach the merits."},
  "Constitutional Law": {short:"State action \u2192 right or power \u2192 level of scrutiny",
    more:"For speech: is the regulation content-based or content-neutral, and what forum? Pick the scrutiny level before you pick a winner."},
  "Evidence": {short:"Relevant? \u2192 purpose \u2192 hearsay? \u2192 exception \u2192 policy/constitutional bar",
    more:"Name the purpose the evidence is offered for before arguing admissibility \u2014 many traps turn on offered-for-truth vs. offered for something else."},
  "Contracts": {short:"Goods (UCC) or common law? \u2192 formation \u2192 defenses \u2192 breach \u2192 remedies",
    more:"Decide UCC vs. common law first \u2014 the rule changes (modification, warranties, perfect tender, etc.)."},
  "Criminal Law and Procedure": {short:"Elements + mens rea \u2192 defenses \u2192 constitutional / procedure gate",
    more:"For procedure questions, find the gateway (was the search, seizure, or interrogation lawful?) before you reach the remedy."},
  "Real Property": {short:"Identify the interest \u2192 rule \u2192 who prevails \u2192 remedy",
    more:"For priority / recording-act questions, classify the buyer (notice / bona fide purchaser) and check the chain before deciding who wins."},
  "Torts": {short:"Tort + its elements \u2192 duty / breach / causation / damages \u2192 defenses",
    more:"Between competing theories, pick the one with the lowest bar to prove on these exact facts."}
};
function attackSeqHTML(subj){
  const a = ATTACK_SEQUENCE[subj];
  if(!a) return '';
  return `<details class="attack"><summary><span class="attack-tag">Attack order</span> ${a.short}</summary><div class="attack-body">${a.more}</div></details>`;
}
function renderDrill(){
  setViewportMode('drill');
  clearRuleRehearsalModal();
  const d=state.queue[state.i];const opts=shuffle(d.options);state.locked=false;
  markCardShown(d);
  const pct=Math.round((state.i)/state.queue.length*100);
  const reviewBtn=d.needsCategoryReview&&!d._b?`<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" id="fixCat">Category needs review — fix</button></div>`:'';
  const missionBanner = state.focusMode ? `<div class="ok-toast" style="margin-bottom:10px">Today's Mission · ${state.i+1}/${state.queue.length} · Answer · Review · Write takeaway · Next</div>` : '';
  const navBtn = state.studyLock
    ? `<button class="btn btn-ghost btn-sm" id="futureChangeBtn">Add A Note to Myself</button>`
    : `<button class="btn btn-ghost btn-sm" onclick="renderStart()" style="margin-left:auto">← Main menu</button>`;
  app.innerHTML=`${missionBanner}
    <div class="prog-wrap"><div class="prog-meta">
      <span>${esc(fullName(d.subj))} · Q ${state.i+1} / ${state.queue.length}</span>
      <span class="streak">${state.streak>0?'🔥 streak '+state.streak:'streak 0'} · score ${state.correct}</span>
      ${navBtn}
    </div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="qcard panel">
      <div class="qmeta">${renderCardMeta(d)}</div>
      ${questionBlockHTML(d)}${attackSeqHTML(d.subj)}${reviewBtn}</div>
    <div class="opts" id="opts">
      ${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(o.t)}</span></button>`).join('')}
    </div><div id="fb"></div>`;
  const btns=[...document.querySelectorAll('#opts .opt')];
  btns.forEach((b,k)=>b.onclick=()=>pick(opts,k,btns));
  const fix=document.getElementById('fixCat');
  if(fix) fix.onclick=()=>renderCategoryFix(d.id,true);
  const fc=document.getElementById('futureChangeBtn');
  if(fc) fc.onclick=()=>{const n=prompt('Note to myself (saved for later):');if(n)saveFutureChange(n);};
  window._opts=opts;window._btns=btns;
}
function pick(opts,k,btns){
  if(state.locked)return;state.locked=true;
  const d=state.queue[state.i];const chosen=opts[k];const correctIdx=opts.findIndex(o=>o.ok);
  btns.forEach((b,j)=>{b.classList.add('locked');
    if(opts[j].ok)b.classList.add('correct');else if(j===k)b.classList.add('wrong');else b.classList.add('dim');});
  state.perSubj[d.subj]=state.perSubj[d.subj]||{c:0,t:0};state.perSubj[d.subj].t++;
  const mk=cardMbeKey(d);state.perMbeKey[mk]=state.perMbeKey[mk]||{c:0,t:0};state.perMbeKey[mk].t++;
  document.querySelector('.bar i').style.width=Math.round((state.i+1)/state.queue.length*100)+'%';

  const pending = { d, chosen, opts, correctIdx, k };
  state.pendingPick = pending;

  // No forced rating/autopsy popup — reveal feedback immediately (use the optional
  // "Flag for later" button in the feedback if you want to revisit a question).
  finalizePick(pending);
}
function flagCardForLater(card, btnEl){
  try{
    const stats = getCardStats(card);
    stats.flaggedForReview = true;
    stats.flaggedAt = nowISO();
    setCardStats(card, stats);
  }catch(e){}
  state.missed = state.missed || [];
  if(!state.missed.some(m=>m.id===card.id)) state.missed.push(card);
  if(btnEl){ btnEl.textContent='🚩 Flagged ✓'; btnEl.disabled=true; btnEl.style.opacity='.7'; }
}
function nextCard(){
  state.i++;
  if(state.i>=state.queue.length){
    if(state.focusMode){state.studyLock=false;state.focusMode=false;}
    renderEnd();
  } else if(state.ruleTransferMode) renderRuleTransferDrill();
  else renderDrill();
}

let advParsed=null;
function renderAdaptiImport(note){
  app.innerHTML=`
    <h2 style="font-size:18px;margin-bottom:4px">Import from AdaptiBar</h2>
    <div style="color:var(--mut);font-size:12.5px;margin-bottom:12px;line-height:1.6">
      Paste an AdaptiBar <b>Exam Report</b> (only questions you <b>missed</b> become drill cards) or a <b>Score Report</b> (subject accuracy → badges on the home screen).
      Upload PDF, load <span class="mono">.txt</span>, or paste the text.</div>
    <div class="panel" style="padding:12px 16px">
      <div class="lbl">Easiest: just give it the PDF</div>
      <p style="font-size:12px">Click <b>Upload PDF</b> below and pick your AdaptiBar report file. No copying needed. (If that doesn't work — e.g. you're offline — paste the text instead.)</p>
    </div>
    ${note?`<div class="ok-toast">${esc(note)}</div>`:''}
    <div class="start-actions" style="margin-top:4px;margin-bottom:14px">
      <button class="btn btn-primary" id="advPdfBtn">📄 Upload PDF</button>
      <span id="advStatus" style="font-size:12px;color:var(--mut);align-self:center"></span>
    </div>
    <div class="form-row">
      <label>…or paste the report text</label>
      <textarea class="ta" id="advText" style="min-height:120px" placeholder="Question #2443 - Contracts / Performance...&#10;You answered A. The correct answer is B&#10;Question ..."></textarea>
    </div>
    <div class="start-actions" style="margin-top:4px">
      <button class="btn btn-ghost btn-sm" id="advFileBtn">📄 …or load a .txt file</button>
      <button class="btn btn-primary" id="advParse">Parse report (misses + scores) →</button>
      <button class="btn btn-ghost" id="advBack">← Back</button>
    </div>
    <input type="file" id="advFile" accept=".txt,text/plain" class="hidden">
    <input type="file" id="advPdf" accept="application/pdf,.pdf" class="hidden">
    <div id="advPreview" style="margin-top:16px"></div>`;
  document.getElementById('advBack').onclick=renderStart;
  document.getElementById('advFileBtn').onclick=()=>document.getElementById('advFile').click();
  document.getElementById('advPdfBtn').onclick=()=>document.getElementById('advPdf').click();
  const statusEl=()=>document.getElementById('advStatus');
  document.getElementById('advPdf').onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    if(!window.pdfjsLib){statusEl().innerHTML='<span style="color:var(--orange)">PDF reader didn\u2019t load (no internet?). Paste the text instead.</span>';this.value='';return;}
    statusEl().textContent='Reading PDF…';
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const text=await extractPdfText(r.result,(p,tot)=>{statusEl().textContent='Reading PDF… page '+p+'/'+tot;});
        document.getElementById('advText').value=text;
        statusEl().innerHTML='<span style="color:var(--green)">✓ PDF read. Scanning for misses…</span>';
        doParse();
      }catch(err){statusEl().innerHTML='<span style="color:var(--orange)">Couldn\u2019t read that PDF. Try the paste option.</span>';}
    };
    r.readAsArrayBuffer(f);this.value='';
  };
  document.getElementById('advFile').onchange=function(e){
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{document.getElementById('advText').value=r.result;doParse();};r.readAsText(f);this.value='';};
  document.getElementById('advParse').onclick=doParse;
  function doParse(){
    const raw=document.getElementById('advText').value;
    if(!raw.trim()){document.getElementById('advPreview').innerHTML=`<div class="err">Paste the report text first.</div>`;return;}
    let cards=[], perf=null, skippedCorrect=0;
    try{
      const parsed=parseAdaptiBar(raw);
      if(Array.isArray(parsed)){cards=parsed;}
      else{cards=parsed.cards||[];skippedCorrect=parsed.skippedCorrect||0;}
    }catch(e){cards=[];}
    try{perf=parseAdaptibarSubjectPerformance(raw);}catch(e){perf=null;}
    const hasPerf=perf&&Object.keys(perf.subjects).length>0;
    if(hasPerf) saveAdaptibarScores(perf);
    // Preview: count new vs merge
    let newCount = 0, mergeCount = 0, builtinSkipCount = 0;
    for (const c of cards) {
      if (isBuiltinQuestion(c.advId)) { builtinSkipCount++; continue; }
      if (userCards.find(u => u.advId && u.advId === c.advId)) mergeCount++;
      else newCount++;
    }
    advParsed = cards;
    if(cards.length===0&&!hasPerf){
      const skipNote=skippedCorrect?` Found ${skippedCorrect} question${skippedCorrect!==1?'s':''} you answered correctly — those are skipped.`:'';
      document.getElementById('advPreview').innerHTML=`<div class="err">No missed questions to import.${skipNote} Paste an Exam Report with wrong answers (lines like “You answered A. The correct answer is B”) or a Score Report (lines like “72.5% Civil Procedure (40)”).</div>`;return;}
    let html='';
    if(hasPerf){
      const meta=[perf.dateRange?esc(perf.dateRange):'',perf.overallAccuracy!=null?perf.overallAccuracy+'% overall':'',perf.questionsAnswered!=null?perf.questionsAnswered+' answered':''].filter(Boolean).join(' · ');
      html+=`<div class="ok-toast">✓ Score report parsed${meta?' · '+meta:''}. Subject badges updated on the home screen.</div><div class="subj-bars">${perfSubjectRows(perf)}</div>`;
    }
    if(cards.length){
      const tally={};cards.forEach(c=>{const k=cardMbeKey(c);tally[k]=(tally[k]||0)+1;});
      const rows=Object.keys(tally).sort().map(k=>`<div class="sb"><span class="nm" style="font-size:11.5px">${esc(k)}</span><span class="track"><i style="width:${Math.min(100,tally[k]*9)}%;background:var(--orange)"></i></span><span class="pct">${tally[k]}</span></div>`).join('');
      html+=`<div class="ok-toast" style="margin-top:${hasPerf?'12px':'0'}">Found <b>${cards.length}</b> missed question${cards.length!==1?'s':''}${skippedCorrect?` (${skippedCorrect} correct — skipped)`:''}. <b>${newCount}</b> new · <b>${mergeCount}</b> will merge attempts${builtinSkipCount?` · <b>${builtinSkipCount}</b> already in built-in deck (skipped)`:''}.</div>
      <div class="subj-bars">${rows}</div>
      ${cards.length?`<button class="btn btn-primary" id="advConfirm">Import ${cards.length} card${cards.length!==1?'s':''} into the drill ⚔</button>`:''}`;
    } else if(hasPerf){
      html+=`<div class="start-actions" style="margin-top:12px"><button class="btn btn-primary" id="advHome">← Back — badges updated</button></div>`;
    }
    document.getElementById('advPreview').innerHTML=html;
    const home=document.getElementById('advHome');
    if(home) home.onclick=renderStart;
    const cf=document.getElementById('advConfirm');
    if(cf)cf.onclick=()=>{
      let addedCount=0, mergedCount=0, skippedBuiltin=0;
      for (const incoming of migrateCardCategories(advParsed)) {
        if (isBuiltinQuestion(incoming.advId)) { skippedBuiltin++; continue; }
        enrichCardWithTriggerAnalysis(incoming);
        syncCardDateFields(incoming);
        const existing = userCards.find(c => c.advId && c.advId === incoming.advId);
        if (existing) {
          mergeImportedCard(existing, incoming);
          mergedCount++;
        } else {
          userCards.push(incoming);
          addedCount++;
        }
      }
      const saved=saveUser();
      state.selected=null;state.seen=new Set();
      renderAdaptiImport((saved?'✓ ':'(saved in memory — Export to keep a backup) ')+`Imported ${addedCount} new card${addedCount!==1?'s':''}. Merged ${mergedCount} repeat attempt${mergedCount!==1?'s':''}.${skippedBuiltin?` Skipped ${skippedBuiltin} already in built-in deck.`:''} Paste another report or go Back.`);
    };
  }
}

    </div>
    <div class="form-row"><label>Short rule title <span class="req">*</span></label><input type="text" class="inp" id="fTitle" placeholder="e.g. A void deed defeats even a BFP"></div>
    <div class="form-row"><label>Scenario / facts <span class="req">*</span></label><textarea class="ta" id="fScn" placeholder="The fact pattern in a sentence or two."></textarea></div>
    <div class="form-row"><label>The question / call <span class="req">*</span></label><input type="text" class="inp" id="fQ" placeholder="e.g. Is the wife entitled to the building?"></div>
    <div class="form-row"><label>Answer options <span class="req">*</span> (mark one correct)</label>
      <div id="optWrap">${optHtml}</div>
      ${formOpts.length<4?`<button class="btn btn-ghost btn-sm" id="addOpt">+ add option</button>`:''}
    </div>
    <div class="form-row"><label>Memory shortcut (optional)</label><input type="text" class="inp" id="fRu" placeholder="e.g. threshold first, then doctrine"></div>
    <div class="start-actions">
      <button class="btn btn-primary" id="saveCard">Save card</button>
      <button class="btn btn-ghost" id="cancelAdd">← Back</button>
    </div>`;
  // wire option editing (preserve typed values into formOpts)
  function readForm(){
    document.querySelectorAll('#optWrap .opt-edit').forEach(el=>{
      const i=+el.dataset.i;
      formOpts[i].t=el.querySelector('.oe-text').value;
      formOpts[i].why=el.querySelector('.oe-why').value;
    });
  }
  document.querySelectorAll('[data-ok]').forEach(r=>r.onclick=()=>{readForm();formOpts.forEach((o,j)=>o.ok=(j===+r.dataset.ok));});
  document.querySelectorAll('[data-trap]').forEach(c=>c.onclick=()=>{readForm();const i=+c.dataset.trap;formOpts[i].trap=c.checked;});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{readForm();const i=+b.dataset.rm;formOpts.splice(i,1);
    if(!formOpts.some(o=>o.ok))formOpts[0].ok=true;renderAdd();});
  const addOpt=document.getElementById('addOpt');
  if(addOpt)addOpt.onclick=()=>{readForm();if(formOpts.length<4)formOpts.push({t:'',ok:false,trap:false,why:''});renderAdd();};
  const sel=document.getElementById('fSubj');
  const subSel=document.getElementById('fSub');
  function refreshSubtopics(){
    const opts=subtopicsFor(sel.value).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
    subSel.innerHTML=opts+'<option value="__custom">Other / type manually…</option>';
    document.getElementById('fSubCustom').classList.add('hidden');
  }
  sel.onchange=refreshSubtopics;
  subSel.onchange=()=>{document.getElementById('fSubCustom').classList.toggle('hidden',subSel.value!=='__custom');};
  document.getElementById('cancelAdd').onclick=()=>{formOpts=[{t:'',ok:true,trap:false,why:''},{t:'',ok:false,trap:false,why:''}];renderStart();};
  document.getElementById('saveCard').onclick=()=>{
    readForm();
    const subj=sel.value;
    let sub=subSel.value;
    if(sub==='__custom') sub=(document.getElementById('fSubCustom').value||'').trim();
    const title=document.getElementById('fTitle').value.trim();
    const scn=document.getElementById('fScn').value.trim();
    const q=document.getElementById('fQ').value.trim();
    const ru=document.getElementById('fRu').value.trim();
    const opts=formOpts.filter(o=>o.t.trim()!=='').map(o=>({t:o.t.trim(),ok:!!o.ok,trap:!!o.trap,why:o.why.trim()}));
    if(!subj){renderAdd('Pick a subject.');return;}
    if(!sub){renderAdd('Pick or type an AdaptiBar subtopic.');return;}
    if(!title){renderAdd('Add a short rule title.');return;}
    if(!scn){renderAdd('Add the scenario/facts.');return;}
    if(!q){renderAdd('Add the question/call.');return;}
    if(opts.length<2){renderAdd('Add at least two answer options with text.');return;}
    const corr=opts.filter(o=>o.ok);
    if(corr.length!==1){renderAdd('Mark exactly ONE option as the correct answer.');return;}
    const cat=allocateMBECategory({rawSubject:subj,rawSubtopic:sub});
    const card={id:'U'+Date.now().toString(36),...cat,title,scenario:scn,q,ru,options:opts,_b:false};
    userCards.push(card);const saved=saveUser();
    formOpts=[{t:'',ok:true,trap:false,why:''},{t:'',ok:false,trap:false,why:''}];
    renderAdd(saved?'':'Saved in memory, but this browser blocked auto-save — use Export to keep a backup.',
      '✓ Card saved as “'+esc(cat.mbeKey)+'”. Add another, or go Back to drill it.');
  };
}

/* ---------- CATEGORY REVIEW ---------- */
function renderCategoryFix(cardId,returnToDrill){
  const card=userCards.find(c=>c.id===cardId);
  if(!card){returnToDrill?renderDrill():renderMyCards();return;}
  const subOpts=subtopicsFor(card.subj).map(s=>`<option value="${esc(s)}" ${s===card.sub?'selected':''}>${esc(s)}</option>`).join('');
  app.innerHTML=`
    <h2 style="font-size:18px;margin-bottom:4px">Fix category</h2>
    <div class="panel" style="margin-bottom:14px"><div class="lbl">Question</div><p style="font-size:13px">${esc(card.title||card.q)}</p>
      <p style="font-size:12px;color:var(--sec);margin-top:6px">Imported as: <span class="mono">${esc(card.rawSubject||'?')} / ${esc(card.rawSubtopic||'?')}</span></p></div>
    <div class="form-row"><label>MBE Subject</label>
      <select class="sel" id="fixSubj">${MBE_TOP_SUBJECTS.map(s=>`<option value="${esc(s)}" ${s===card.subj?'selected':''}>${esc(s)}</option>`).join('')}</select>
    </div>
    <div class="form-row"><label>AdaptiBar Subtopic</label>
      <select class="sel" id="fixSub">${subOpts}</select>
    </div>
    <div class="start-actions">
      <button class="btn btn-primary" id="fixSave">Save category</button>
      <button class="btn btn-ghost" id="fixCancel">${returnToDrill?'← Back to drill':'← Back'}</button>
    </div>`;
  const fixSubj=document.getElementById('fixSubj');
  const fixSub=document.getElementById('fixSub');
  fixSubj.onchange=()=>{
    fixSub.innerHTML=subtopicsFor(fixSubj.value).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  };
  document.getElementById('fixCancel').onclick=()=>{returnToDrill?renderDrill():renderMyCards();};
  document.getElementById('fixSave').onclick=()=>{
    const subj=fixSubj.value, sub=fixSub.value;
    card.subj=subj;
    card.sub=sub;
    card.mbeKey=`${subj} / ${sub}`;
    card.needsCategoryReview=!isKnownMBESubtopic(subj,sub);
    saveUser();
    returnToDrill?renderDrill():renderMyCards();
  };
}

/* ---------- MY CARDS ---------- */
function renderMyCards(){
  const sortMode = state.cardSortMode || "missNewest";
  const dateFilter = state.dateFilter || "all";
  let cards = userCards.filter(c => passesDateFilter(c, dateFilter));
  cards = sortCardsByDate(cards, sortMode);
  const sortOptions = [
    ["missNewest", "Most recent AdaptiBar miss"],
    ["missOldest", "Oldest AdaptiBar miss"],
    ["practiceNewest", "Last practiced newest"],
    ["practiceOldest", "Last practiced oldest"],
    ["neverPracticed", "Never practiced first"],
    ["mostMissed", "Most missed"]
  ].map(([v, l]) => `<option value="${v}" ${sortMode === v ? "selected" : ""}>${esc(l)}</option>`).join("");

  let list = cards.length? cards.map(c=>{
    const attempts = (c.importedAttemptHistory || []).length;
    const status = missAgeStatus(c);
    const badge = MISS_AGE_LABELS[status] ? `<span class="badge old">${esc(MISS_AGE_LABELS[status])}</span> ` : '';
    return `<div class="ml-item">
      <span class="id">${esc(c.advId ? 'Q#'+c.advId : cardMbeKey(c))}${c.needsCategoryReview?' ⚠':''}</span>
      <span>${esc(c.title||c.q)}<br><span class="date-meta">${esc(cardDateMeta(c))}</span>${attempts > 1 ? ` · ${attempts} AdaptiBar attempts` : ''} ${badge}</span>
      ${c.needsCategoryReview?`<button class="x" style="color:var(--btn);border-color:var(--btn)" data-fix="${c.id}">fix</button>`:''}
      <button class="x" data-del="${c.id}">delete</button></div>`;
  }).join('')
    : `<div class="ml-item" style="color:var(--mut)">No cards match this filter.</div>`;
  app.innerHTML=`
    <h2 style="font-size:18px;margin-bottom:4px">My cards (${userCards.length})</h2>
    <div style="color:var(--mut);font-size:12.5px;margin-bottom:12px">Your imported misses with AdaptiBar dates and app practice history.</div>
    <div class="date-filter-row">
      <label style="font-size:12px;color:var(--sec)">Date filter:</label>
      <select id="myDateFilter">${Object.keys(DATE_FILTERS).map(k => `<option value="${k}" ${dateFilter === k ? "selected" : ""}>${esc(DATE_FILTERS[k])}</option>`).join("")}</select>
      <label style="font-size:12px;color:var(--sec)">Sort:</label>
      <select id="mySortMode">${sortOptions}</select>
    </div>
    <div class="cards-list">${list}</div>
    <div class="start-actions">
      <button class="btn btn-primary" id="addMore">➕ Add another</button>
      <button class="btn btn-ghost" id="exp2">⬇ Export backup</button>
      <button class="btn btn-ghost" id="imp2">⬆ Import</button>
      <button class="btn btn-ghost" id="dupeCheck">🔍 Dupe & rule check</button>
      <button class="btn btn-ghost" id="back2">← Back</button>
    </div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this card?')){userCards=userCards.filter(c=>c.id!==b.dataset.del);saveUser();renderMyCards();}});
  document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>renderCategoryFix(b.dataset.fix,false));
  document.getElementById('addMore').onclick=()=>renderAdd();
  document.getElementById('exp2').onclick=exportCards;
  document.getElementById('imp2').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('dupeCheck').onclick=renderDupeCheck;
  document.getElementById('back2').onclick=renderStart;
  const myDateFilter = document.getElementById('myDateFilter');
  if (myDateFilter) myDateFilter.onchange = () => { state.dateFilter = myDateFilter.value; renderMyCards(); };
  const mySortMode = document.getElementById('mySortMode');
  if (mySortMode) mySortMode.onchange = () => { state.cardSortMode = mySortMode.value; renderMyCards(); };
}

/* ---------- EXPORT / IMPORT ---------- */
function exportCards(){
  const backup = {
    version: 2,
    exportedAt: nowISO(),
    userCards,
    cardStats: loadCardStatsMap(),
    errorList: loadErrorList(),
    sessionLog: loadSessionLog(),
    masteredCards: loadMasteredCards(),
    schedulerSettings: loadSessionSettings()
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "trap_trainer_full_backup.json";
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('importFile').onchange=function(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const parsed=JSON.parse(r.result);
    if (parsed && (parsed.type === "triggerAnalysisExport" || parsed.type === "triggerAnalysis") && Array.isArray(parsed.analyses)) {
      const n = importTriggerAnalyses(parsed.analyses);
      alert('Imported trigger analyses for ' + n + ' card(s). They will appear on next drill/lecture or refresh.');
      renderStart();
      return;
    }
    if (parsed && parsed.version >= 2) {
      const mode = userCards.length
        ? confirm('OK = MERGE imported cards with yours.\nCancel = REPLACE all your cards with this backup.')
        : false;
      const incoming = migrateCardCategories((parsed.userCards || []).filter(c => c && c.q));
      if (mode) {
        const existingKeys = new Set(userCards.map(getCardFingerprint));
        for (const inc of incoming) {
          const existing = userCards.find(c => c.advId && inc.advId && c.advId === inc.advId);
          if (existing) mergeImportedCard(existing, inc);
          else if (!existingKeys.has(getCardFingerprint(inc))) {
            userCards.push(inc);
            existingKeys.add(getCardFingerprint(inc));
          }
        }
      } else {
        userCards = incoming;
      }
      localStorage.setItem(CARD_STATS_KEY, JSON.stringify(parsed.cardStats || {}));
      localStorage.setItem(ERROR_LIST_KEY, JSON.stringify(parsed.errorList || []));
      localStorage.setItem(SESSION_LOG_KEY, JSON.stringify(parsed.sessionLog || []));
      localStorage.setItem(MASTERED_KEY, JSON.stringify(parsed.masteredCards || []));
      if (parsed.schedulerSettings) saveSessionSettings(parsed.schedulerSettings);
      saveUser();
      userCards = initUserCards();
      state.selected = null;
      state.seen = new Set();
      alert('Full backup imported — cards and scheduling history restored.');
      renderStart();
      return;
    }
    const arr = Array.isArray(parsed) ? parsed : (parsed.cards || parsed);
    if(!Array.isArray(arr))throw 0;
    const mode=confirm('OK = ADD these to your cards.\nCancel = REPLACE all your cards with this file.');
    const rawClean=arr.filter(c=>c&&c.options&&c.q).map(c=>({
      ...c,
      id:c.id||'U'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      _b:false
    }));
    const clean = migrateCardCategories(rawClean);

    // === Duplicate check for uploaded cards ===
    const existingKeys = new Set(userCards.map(getCardFingerprint));
    const seenInFile = new Set();
    let internalDupCount = 0;
    let existingDupCount = 0;
    const fresh = [];
    for (let c of clean) {
      const key = getCardFingerprint(c);
      if (seenInFile.has(key)) {
        internalDupCount++;
        continue;
      }
      seenInFile.add(key);
      if (existingKeys.has(key)) {
        existingDupCount++;
        continue;
      }
      fresh.push(c);
    }

    userCards = mode ? userCards.concat(fresh) : fresh;
    saveUser();state.selected=null;state.seen=new Set();
    let msg = `Imported ${fresh.length} new card(s).`;
    if (internalDupCount > 0 || existingDupCount > 0) {
      msg += ` Skipped ${internalDupCount} duplicate(s) inside the file`;
      if (existingDupCount > 0) msg += ` and ${existingDupCount} that already existed`;
      msg += '.';
    }
    alert(msg);
    renderStart();
  }catch(err){alert('That file could not be read as Trap Trainer cards or trigger analyses.');}};
  r.readAsText(f);this.value='';
};

/* ---------- END ---------- */
function renderEnd(){
  setViewportMode('start');
  const session = finishCurrentSession();
  const total=state.queue.length,c=state.correct,acc=Math.round(c/total*100);
  let msg;
  if(acc>=85){msg="Exam-ready discrimination. The reflex is rewiring.";}
  else if(acc>=65){msg="Solid. The traps you still hit are named now.";}
  else{msg="Rough round — but that's the point. You found the reflexes to fix.";}
  let bars=MBE_TOP_SUBJECTS.filter(s=>state.perSubj[s]&&state.perSubj[s].t>0).map(s=>{
    const o=state.perSubj[s];const p=Math.round(o.c/o.t*100);
    const col=p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--no)';
    return `<div class="sb"><span class="nm">${esc(fullName(s))}</span><span class="track"><i style="width:${p}%;background:${col}"></i></span><span class="pct">${o.c}/${o.t}</span></div>`;}).join('');
  let mbeBars=Object.keys(state.perMbeKey).filter(k=>state.perMbeKey[k].t>0).sort().map(k=>{
    const o=state.perMbeKey[k];const p=Math.round(o.c/o.t*100);
    const col=p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--no)';
    return `<div class="sb"><span class="nm" style="font-size:11.5px">${esc(k)}</span><span class="track"><i style="width:${p}%;background:${col}"></i></span><span class="pct">${o.c}/${o.t}</span></div>`;
  }).join('');
  let ml=state.missed.length?state.missed.map(d=>`<div class="ml-item"><span class="id">${d._b?'Q#'+d.id:'★'} ${esc(cardMbeKey(d))}</span><span>${esc(d.title||d.q)}</span></div>`).join('')
    :`<div class="ml-item" style="color:var(--green)">Clean sweep — nothing missed. 🔥</div>`;
  const newReviewed = session?.newShown || 0;
  const dueReviewed = session?.dueShown || 0;
  const errorsAdded = session?.errorsAdded || 0;
  const masteredCount = session?.mastered || 0;
  const luckyCount = session?.luckyCorrect || 0;
  const dangerCount = session?.dangerErrors || 0;
  const revivedCount = session?.revivedMastered || 0;
  const nextErrDate = getNextErrorReviewDate();
  const missionDone = session?.focusMission ? `<div class="ok-toast" style="margin-bottom:12px">Mission complete. Done — go take a break.</div>` : '';
  app.innerHTML=`${missionDone}<div class="end"><h2>Round complete</h2>
    <div class="sub">${esc(msg)}</div>
    <div class="score-big">${c}<span class="den">/${total}</span> <span style="font-size:20px;color:var(--orange)">${acc}%</span></div>
    <div class="stat-row">
      <div class="stat"><div class="n">${state.bestStreak}</div><div class="l">best streak</div></div>
      <div class="stat"><div class="n">${state.dodged}</div><div class="l">traps dodged 🎯</div></div>
      <div class="stat"><div class="n">${state.missed.length}</div><div class="l">to revisit</div></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n">${newReviewed}</div><div class="l">new reviewed</div></div>
      <div class="stat"><div class="n">${dueReviewed}</div><div class="l">due reviewed</div></div>
      <div class="stat"><div class="n">${errorsAdded}</div><div class="l">added to error list</div></div>
      <div class="stat"><div class="n">${masteredCount}</div><div class="l">mastered</div></div>
      <div class="stat"><div class="n">${luckyCount}</div><div class="l">lucky correct</div></div>
      <div class="stat"><div class="n">${dangerCount}</div><div class="l">danger errors</div></div>
    </div>
    ${revivedCount ? `<div style="font-size:13px;color:var(--warn);margin:8px 0">Revived ${revivedCount} mastered card${revivedCount!==1?'s':''} in the same doctrine for recheck.</div>` : ''}
    <div style="font-size:13px;color:var(--sec);margin:8px 0 14px">Next error review: <strong>${esc(nextErrDate)}</strong></div>
    <div style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:6px 0">By subject</div>
    <div class="subj-bars">${bars}</div>
    <div style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px">By MBE category</div>
    <div class="subj-bars">${mbeBars}</div>
    <div style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px">Still slipping on</div>
    <div class="missed-list">${ml}</div>
    <div class="start-actions">
      ${state.missed.length?`<button class="btn btn-primary" id="retry">Retry just the ${state.missed.length} I missed ⚔</button>`:''}
      <button class="btn btn-ghost" id="viewErrors">View Error List</button>
      <button class="btn btn-ghost" id="viewMastered">Review Mastered</button>
      <button class="btn btn-ghost" id="restart">Back to start</button></div></div>`;
  if(state.missed.length){document.getElementById('retry').onclick=()=>{
    const ms=state.missed.slice();
    state.currentSession = newSession();
    state.queue=ms;state.i=0;state.correct=0;state.streak=0;
    state.bestStreak=0;state.dodged=0;state.missed=[];state.perSubj={};state.perMbeKey={};
    ms.forEach(d=>{state.perSubj[d.subj]={c:0,t:0};state.perMbeKey[cardMbeKey(d)]={c:0,t:0};});renderDrill();};}
  document.getElementById('viewErrors').onclick=renderErrorList;
  document.getElementById('viewMastered').onclick=renderMasteredCards;
  document.getElementById('restart').onclick=renderStart;
}

document.addEventListener('keydown',e=>{
  if(state.ruleRehearsalPending)return;
  if(state.mode!=='drill'||!state.queue.length)return;
  if(!state.locked&&window._btns){const n=parseInt(e.key);if(n>=1&&n<=window._btns.length)window._btns[n-1].click();}
  else if(state.locked&&(e.key==='Enter'||e.key==='ArrowRight')){const nx=document.getElementById('next');if(nx)nx.click();}
});

/* STOPWATCH (replaced the 25min focus timer) */
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;
let swTimer = null;

const pomT = document.getElementById('pomT');
const pomLbl = document.getElementById('pomLbl');
const pomStartBtn = document.getElementById('pomStart');
const pomResetBtn = document.getElementById('pomReset');

function fmt(s) {
  const m = Math.floor(s / 60);
  const x = s % 60;
  return `${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`;
}

function swDraw() {
  const totalSeconds = Math.floor((swElapsed + (swRunning ? Date.now() - swStartTime : 0)) / 1000);
  pomT.textContent = fmt(totalSeconds);
}

function swTick() {
  swDraw();
}

function startStopwatch() {
  if (swRunning) return;
  swRunning = true;
  swStartTime = Date.now() - swElapsed;
  pomStartBtn.textContent = 'Pause';
  swTimer = setInterval(swTick, 1000);
}

function pauseStopwatch() {
  if (!swRunning) return;
  swRunning = false;
  swElapsed = Date.now() - swStartTime;
  clearInterval(swTimer);
  pomStartBtn.textContent = 'Start';
  swDraw();
}

function resetStopwatch() {
  swRunning = false;
  clearInterval(swTimer);
  swElapsed = 0;
  swStartTime = 0;
  pomStartBtn.textContent = 'Start';
  pomT.textContent = '00:00';
}

pomStartBtn.onclick = function () {
  if (swRunning) {
    pauseStopwatch();
  } else {
    startStopwatch();
  }
};

pomResetBtn.onclick = resetStopwatch;

// Initialize
pomLbl.textContent = 'Stopwatch';
pomT.textContent = '00:00';

window.runCategoryDebugTests = runCategoryDebugTests;
try {
  renderStart();
} catch (e) {
  console.error(e);
  app.innerHTML = `<div class="panel" style="border-color:var(--no)"><strong>Trap Trainer failed to start</strong><p>${esc(String(e.message || e))}</p><p class="hint">Open DevTools (F12) → Console for details. Your cards are still in localStorage.</p><button class="btn btn-sm" onclick="location.reload()">Reload</button></div>`;
}
</script>
