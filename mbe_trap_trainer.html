<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trap Trainer — NY UBE July 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap');
  :root{
    --bg:#FBF9F5; --surface:#FFFFFF; --box:#EFF4FF; --box2:#DCE6FB; --box-bd:rgba(23,37,84,.12);
    --ink:#1A2236; --sec:#4A5365; --line:rgba(23,37,84,.09);
    --btn:#2456E6; --btnh:#1B41B8;
    --ok:#15A34A; --ok-bg:#E8F7ED; --no:#DC2626; --no-bg:#FCEBEB;
    --warn:#E08A1E; --hi:#FFF3D6; --track:#ECE6DA;
    /* backward-compatible aliases used inline by the app */
    --mut:#4A5365; --green:#15A34A; --orange:#2456E6; --paper:#FFFFFF; --dim:#9AA0AD; --purple:#5B5BD6;
    --accent:#E08A1E; --accent2:#5B5BD6; --radius:14px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 2px 6px -2px rgba(16,24,40,.06);
    --shadow-md:0 2px 4px rgba(16,24,40,.04), 0 10px 28px -8px rgba(23,37,84,.14);
    --shadow-lift:0 6px 16px -6px rgba(23,37,84,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);padding:clamp(8px,.8vw,14px);min-height:100vh;line-height:1.5;overflow:hidden}
  .wrap{width:100%;max-width:min(1760px,100%);height:calc(100vh - clamp(16px,1.6vw,28px));margin:0 auto;display:flex;flex-direction:column;min-height:0}
  #app{flex:1;min-height:0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--btn);padding-bottom:10px;margin-bottom:18px}
  .top h1{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  .top .who{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sec)}
  .mono{font-family:'IBM Plex Mono',monospace}
  .pom{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--box2);color:var(--ink);border-radius:10px;padding:12px 14px;border:1px solid var(--box-bd);box-shadow:0 6px 20px rgba(17,24,39,.10);font-family:'IBM Plex Mono',monospace;min-width:140px}
  .pom .t{font-size:26px;font-weight:600;text-align:center;line-height:1;color:var(--ink)}
  .pom .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--btn);text-align:center;margin-bottom:4px}
  .pom .row{display:flex;gap:6px;margin-top:8px;justify-content:center}
  .pom button{font-family:inherit;font-size:10px;background:var(--btn);color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer}
  .pom button:hover{background:var(--btnh)}
  .pom .mode{font-size:9px;color:var(--sec);text-align:center;margin-top:6px;cursor:pointer}
  .panel{background:var(--box2);color:var(--ink);border-radius:10px;padding:18px 20px;border:1px solid var(--box-bd);margin-bottom:16px}
  .panel .lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--btn);margin-bottom:8px}
  .panel p{font-size:13.5px;line-height:1.6;color:var(--ink)}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;border:none;cursor:pointer;border-radius:8px;padding:11px 16px;transition:background .15s,border-color .15s,transform .08s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--btn);color:#fff}
  .btn-primary:hover{background:var(--btnh)}
  .btn-ghost{background:#fff;color:var(--btn);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--btn)}
  .btn-sm{padding:7px 12px;font-size:11.5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .chip{font-family:'IBM Plex Sans',sans-serif;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:pointer;display:flex;gap:7px;align-items:center;color:var(--ink);transition:all .12s}
  .chip:hover{border-color:var(--btn)}
  .chip.sel{background:var(--btn);color:#fff;border-color:var(--btn)}
  .chip .sc{color:var(--btn);font-weight:600;font-family:'IBM Plex Mono',monospace}
  .chip.sel .sc{color:#fff}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0;background:#fff}
  .seg button{font-family:'IBM Plex Sans',sans-serif;font-size:12px;background:#fff;border:none;padding:9px 15px;cursor:pointer;color:var(--sec)}
  .seg button.on{background:var(--btn);color:#fff}
  .start-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .hint{font-size:12px;color:var(--sec);margin-top:14px;line-height:1.6}
  .hint .k{font-family:'IBM Plex Mono',monospace;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;color:var(--ink)}
  .prog-wrap{margin-bottom:14px}
  .prog-meta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sec);margin-bottom:6px}
  .streak{color:var(--btn);font-weight:600}
  .bar{height:8px;background:var(--track);border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--btn);width:0;transition:width .35s ease}
  .qcard{animation:slide .25s ease}
  @keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .qmeta{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--btn);margin-bottom:8px;text-transform:uppercase}
  .qtitle{font-size:16.5px;font-weight:650;line-height:1.55;margin-bottom:10px;color:var(--ink)}
  .qask{font-size:15.5px;font-weight:750;color:var(--btnh);margin-top:12px}
  .opts{margin:16px 0 4px;display:flex;flex-direction:column;gap:10px}
  .opt{font-family:'IBM Plex Sans',sans-serif;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13.5px;line-height:1.5;cursor:pointer;display:flex;gap:11px;align-items:flex-start;color:var(--ink);transition:border-color .12s,background .12s}
  .opt:hover:not(.locked){border-color:var(--btn);background:#F5F9FF}
  .opt .key{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:var(--sec);border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok)}
  .opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.wrong{background:var(--no-bg);border-color:var(--no)}
  .opt.wrong .key{background:var(--no);color:#fff;border-color:var(--no)}
  .opt.locked{cursor:default}
  .opt.dim{opacity:.55}
  .fb{margin-top:14px;animation:slide .25s ease}
  .fb-box{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:10px;color:var(--ink)}
  .fb-rule{background:var(--ok-bg);border-left:4px solid var(--ok)}
  .fb-trap{background:var(--no-bg);border-left:4px solid var(--no)}
  .fb-ru{background:var(--box);border-left:4px solid var(--btn)}
  .fb-box strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
  .fb-rule strong{color:var(--ok)} .fb-trap strong{color:var(--no)} .fb-ru strong{color:var(--btn)}
  .fb-plain{background:var(--hi);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:10px;color:var(--ink)}
  .fb-plain strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;color:#B45309}
  .dodged{background:var(--hi);border-left:4px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:10px;display:flex;gap:9px;align-items:center}
  .dodged .big{font-size:17px}
  .fb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .verdict{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
  .lec-nav{display:flex;justify-content:space-between;margin-top:14px}
  .end h2{font-size:21px;margin-bottom:4px;color:var(--ink)}
  .end .sub{color:var(--sec);font-size:13px;margin-bottom:16px}
  .score-big{font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:700;line-height:1;color:var(--ink)}
  .score-big .den{font-size:22px;color:var(--sec)}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .stat{background:var(--box);border:1px solid var(--box-bd);border-radius:10px;padding:13px 15px;flex:1;min-width:120px}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:var(--ink)}
  .stat .l{font-size:10.5px;color:var(--sec);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .subj-bars{margin:10px 0}
  .sb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px;color:var(--ink)}
  .sb .nm{width:160px;flex-shrink:0;font-weight:500}
  .sb .track{flex:1;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
  .sb .track i{display:block;height:100%;border-radius:7px;background:var(--ok)}
  .sb .pct{width:54px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--sec)}
  .missed-list,.cards-list{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 4px;margin:10px 0}
  .ml-item{padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:baseline;color:var(--ink)}
  .ml-item:last-child{border-bottom:none}
  .ml-item .id{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--btn);flex-shrink:0}
  .ml-item .x{margin-left:auto;color:var(--no);cursor:pointer;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 9px}
  .ml-item .x:hover{background:var(--no);color:#fff;border-color:var(--no)}
  .form-row{margin-bottom:13px}
  .form-row label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sec);margin-bottom:5px}
  .form-row label .req{color:var(--no)}
  .inp,.ta,.sel{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}
  .ta{resize:vertical;min-height:60px;line-height:1.5}
  .inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--btn);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
  .opt-edit{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;background:#fff}
  .opt-edit .oe-top{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  .opt-edit .oe-top input[type=text]{flex:1}
  .oe-flags{display:flex;gap:14px;font-size:11.5px;color:var(--sec);align-items:center;margin-top:6px;flex-wrap:wrap}
  .oe-flags label{display:flex;gap:5px;align-items:center;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;color:var(--sec);margin:0}
  .oe-rm{color:var(--no);cursor:pointer;font-size:16px;line-height:1;border:none;background:none;padding:0 4px}
  .err{background:var(--no-bg);border-left:4px solid var(--no);color:#7f1d1d;padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .ok-toast{background:var(--ok-bg);border-left:4px solid var(--ok);color:#14532d;padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .footer{margin-top:22px;border-top:1px solid var(--line);padding-top:10px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9CA3AF;display:flex;justify-content:space-between}
  .hidden{display:none}

  .rule-modal-overlay{
    position:fixed;inset:0;z-index:200;background:rgba(17,24,39,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .rule-modal{
    width:100%;max-width:560px;background:#fff;border-radius:12px;
    border:1px solid var(--line);box-shadow:0 20px 50px rgba(17,24,39,.18);
    padding:22px 24px;animation:slide .2s ease;
  }
  .rule-modal-title{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--ink)}
  .rule-modal-sub{font-size:13px;color:var(--sec);line-height:1.55;margin-bottom:14px}
  .rule-modal-hint{background:var(--box);border:1px solid var(--box-bd);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.5}
  .rule-modal-hint .lbl{margin-bottom:4px}
  .rule-modal-input{min-height:110px;margin-bottom:8px}
  .rule-modal-err{font-size:12px;color:var(--no);min-height:18px;margin-bottom:8px}
  .rule-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
  .rule-modal-note{font-size:11px;color:var(--mut);margin-top:8px}

  .confidence-grid{display:grid;gap:8px;margin:12px 0}
  .confidence-btn{font-family:'IBM Plex Sans',sans-serif;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;cursor:pointer;line-height:1.45}
  .confidence-btn:hover,.confidence-btn.sel{border-color:var(--btn);background:#F5F9FF}
  .confidence-btn .code{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--btn);margin-right:8px}
  .danger-badge{background:#7f1d1d;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.04em}
  .active-badge{background:var(--no);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700}
  .focus-shell .toolbar,.focus-shell .date-filter-row,.focus-shell .stat-row{display:none!important}
  .ab-compare{display:grid;gap:10px;margin:10px 0}
  .ab-col{border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5}
  .ab-yours{background:var(--no-bg);border-left:4px solid var(--no)}
  .ab-correct{background:var(--ok-bg);border-left:4px solid var(--ok)}
  .ab-diff{background:var(--hi);border-left:4px solid var(--warn);font-weight:600}

  .trigger-bold {
    font-weight: 800;
    background: #FEF3C7;
    color: #111827;
    border-radius: 3px;
    padding: 0 2px;
  }

  .trigger-analysis {
    background: #EAF4FF;
    color: #111827;
    border-left: 4px solid #1D4ED8;
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    max-height: none;
  }

  .trigger-analysis p,
  .trigger-analysis li,
  .trigger-analysis div {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    max-height: none;
  }

  .trigger-analysis p {
    margin: 6px 0 10px;
    line-height: 1.45;
  }

  .trigger-analysis ul,
  .trigger-analysis ol {
    padding-left: 22px;
    margin: 6px 0 10px;
  }

  .trigger-analysis li {
    margin-bottom: 6px;
  }

  .analysis-warning {
    background: #FEF3C7;
    color: #713F12;
    border-left: 4px solid #F59E0B;
    padding: 8px 10px;
    border-radius: 6px;
    margin: 8px 0;
    font-size: 13px;
  }

  .date-meta {
    display: inline-block;
    margin-top: 4px;
    color: #64748B;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .badge.old {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 7px;
    border-radius: 999px;
    background: #FEF3C7;
    color: #92400E;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .date-filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 10px 0 12px;
  }

  .date-filter-row select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }

  .trigger-analysis .mini-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #374151;
    margin-top: 10px;
    margin-bottom: 4px;
    font-weight: 700;
  }
  /* =================== AESTHETIC UPGRADE (refined-warm) =================== */
  body{
    background:
      radial-gradient(1100px 600px at 10% -10%, rgba(91,91,214,.06), transparent 60%),
      radial-gradient(900px 520px at 110% 112%, rgba(224,138,30,.06), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{animation:pageIn .42s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* masthead — editorial wordmark with a soft gradient rule */
  .top{align-items:center;border-bottom:none;position:relative;padding-bottom:14px;margin-bottom:22px}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--btn) 0%, var(--accent2) 42%, rgba(224,138,30,.5) 70%, transparent 92%)}
  .top h1{font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-.01em;
    text-transform:none;color:var(--ink);display:flex;align-items:center;gap:10px}
  .top h1::before{content:"";width:12px;height:12px;border-radius:4px;display:inline-block;
    background:linear-gradient(135deg,var(--btn),var(--accent2));box-shadow:0 0 0 4px rgba(36,86,230,.12)}
  .top .who{font-size:11px;color:var(--sec);letter-spacing:.02em}

  /* panels & cards — depth instead of flat fills */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-md);position:relative;overflow:hidden}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--btn),var(--accent2))}
  .qcard.panel::before{background:linear-gradient(90deg,var(--accent2),var(--btn))}
  .panel .lbl{color:var(--btn)}

  /* buttons — gradient depth + tactile lift */
  .btn{border-radius:11px;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,background .18s ease,border-color .15s,color .15s}
  .btn-primary{background:linear-gradient(135deg,#2E66F2,var(--btn));
    box-shadow:0 1px 2px rgba(23,37,84,.18), 0 8px 18px -8px rgba(36,86,230,.55)}
  .btn-primary:hover{background:linear-gradient(135deg,#2E66F2,var(--btnh));transform:translateY(-1px);
    box-shadow:0 2px 4px rgba(23,37,84,.2), 0 14px 26px -8px rgba(36,86,230,.6)}
  .btn-primary:active{transform:translateY(0)}
  .btn-ghost{background:var(--surface);box-shadow:var(--shadow-sm)}
  .btn-ghost:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift);border-color:var(--btn);color:var(--btn)}

  /* chips */
  .chip{box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s,border-color .12s,background .15s}
  .chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .chip.sel{background:linear-gradient(135deg,var(--btn),#3A6BF0);border-color:transparent;color:#fff;
    box-shadow:0 6px 14px -6px rgba(36,86,230,.6)}

  /* answer options */
  .opt{border-radius:12px;box-shadow:var(--shadow-sm);
    transition:transform .1s,box-shadow .15s,border-color .12s,background .15s}
  .opt:hover:not(.locked){transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .opt.correct{box-shadow:0 0 0 1px var(--ok), 0 8px 20px -10px rgba(21,163,74,.5)}
  .opt.wrong{box-shadow:0 0 0 1px var(--no), 0 8px 20px -10px rgba(220,38,38,.45)}

  /* feedback boxes — soft cards with a clear accent edge */
  .fb-box,.fb-plain,.dodged{border-radius:12px;box-shadow:var(--shadow-sm)}
  .fb-box{border-left-width:4px}

  /* progress */
  .bar{height:9px;background:var(--track);box-shadow:inset 0 1px 2px rgba(23,37,84,.08)}
  .bar i{background:linear-gradient(90deg,var(--btn),var(--accent2));border-radius:6px}
  .streak{color:var(--accent)}

  /* results screen */
  .end h2{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;letter-spacing:-.01em}
  .score-big{background:linear-gradient(135deg,var(--btn),var(--accent2));-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}

  /* Streamlit embed sizing: use the full page, not a narrow phone-like column */

  body.drill-screen .prog-wrap{margin-bottom:2px;flex:0 0 auto}
  body.drill-screen .prog-meta{font-size:12px;align-items:center;gap:8px}
  body.drill-screen .qcard.panel{flex:0 1 auto;padding:clamp(12px,1.15vw,18px) clamp(14px,1.6vw,24px);margin-bottom:0;max-height:34vh;overflow:auto}

  .ube-home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,.85fr);gap:14px;align-items:start;margin-top:10px}

  .topic-row-head{display:flex;align-items:center;padding:8px 10px;cursor:pointer;gap:8px}

  /* trigger-word analysis polish (no-ops if these classes aren't present) */

    color:#8a5a12;border:1px solid rgba(224,138,30,.32);border-radius:20px;padding:3px 10px;margin:4px 5px 0 0}

  .fb-thresh{background:#F1F5FF;border-left:4px solid var(--btn)}

  /* gentle, accessible motion preference */

  /* attack-sequence prompt on drill questions */
  .attack{margin-top:11px;border:1px solid var(--line);border-radius:10px;background:#F6F8FE;overflow:hidden}

  .attack[open] summary::before{transform:rotate(90deg)}
  .attack-tag{font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--btn),var(--accent2));padding:2px 7px;border-radius:20px}
  .attack-body{padding:0 12px 11px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;line-height:1.55;color:var(--sec);border-top:1px solid var(--line);padding-top:9px}
  /* collapsed empty-state for Learning Intelligence */
  .li-empty summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .li-empty summary::-webkit-details-marker{display:none}
  /* bulk import instructions table */
  .bulk-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  .bulk-tbl th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--btn);padding:5px 8px;border-bottom:1px solid var(--line)}
  .bulk-tbl td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--sec);vertical-align:top;line-height:1.45}
  .bulk-tbl td b{color:var(--ink)}
  .bulk-tbl tr:last-child td{border-bottom:none}
  /* call of the question (read first) vs. the facts */
  .call-box{background:linear-gradient(135deg, rgba(36,86,230,.09), rgba(91,91,214,.07));border:1px solid rgba(36,86,230,.22);border-left:4px solid var(--btn);border-radius:12px;padding:12px 15px;margin-bottom:14px}
  .call-tag{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--btn);margin-bottom:5px}
  .call-text{font-size:16px;font-weight:700;color:var(--ink);line-height:1.4}
  .facts-label{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--sec);margin-bottom:5px}
  .facts-text{font-size:14px;line-height:1.62;color:var(--ink);font-weight:400}
  /* larger, more readable question + answers */
  .call-text{font-size:19px !important;line-height:1.45 !important}
  .facts-text{font-size:16.5px !important;line-height:1.7 !important}
  .facts-label, .call-tag{font-size:10px !important}
  .qtitle{font-size:17px !important;line-height:1.6 !important}
  .opts .opt{font-size:16px !important;line-height:1.5 !important;padding:14px 16px !important}
  .opts .opt .key{font-size:14px !important}
  /* ================= END AESTHETIC UPGRADE ================= */

<script>
const BUILTIN = [{"id": "2452", "subj": "Civil Procedure", "sub": "Crossclaim", "title": "A crossclaim must be a CLAIM, not a defense", "scenario": "Owner sues the general contractor and the subcontractor. The general contractor “crossclaims” against the subcontractor — but only asserts that the subcontractor’s bad work was the sole cause of the loss. Owner then settles with the general contractor. The subcontractor moves to dismiss the crossclaim.", "q": "Best argument for dismissing the crossclaim?", "ru": "", "options": [{"t": "It asserts a defense, not a claim for relief", "ok": true, "trap": false, "why": "Rule 13(g) needs an actual claim against a co-party. You can’t dress a defense (“it’s the other defendant’s fault”) as a crossclaim to shift the plaintiff’s damages."}, {"t": "The general contractor is no longer a party after settling", "ok": false, "trap": true, "why": "Red herring. While the crossclaim is alive, both stay in the suit for that claim. The defect is that it was never a valid claim."}, {"t": "They’re opposing parties, not co-parties", "ok": false, "trap": false, "why": "They were both joined as codefendants — co-parties. Wrong."}], "_b": true, "plain": "If you're suing your co-defendant, you have to actually ask them for something. Just saying “it was their fault, not mine” is a defense, not a real claim."}, {"id": "2341", "subj": "Civil Procedure", "sub": "Diversity", "title": "Diversity = principal place of business (headquarters), NOT minimum contacts", "scenario": "A shareholder wants to sue a corporation for breach of fiduciary duty in federal court.", "q": "Besides state of incorporation, what determines whether the parties are diverse?", "ru": "", "options": [{"t": "Its principal place of business — the headquarters", "ok": true, "trap": false, "why": "A corporation is a citizen of its state of incorporation AND its principal place of business / nerve center (Hertz v. Friend)."}, {"t": "Where it has minimum contacts", "ok": false, "trap": true, "why": "Minimum contacts is PERSONAL jurisdiction. Diversity is SUBJECT-MATTER jurisdiction. Different question entirely."}, {"t": "Where it manufactures and distributes", "ok": false, "trap": false, "why": "Relevant to where personal jurisdiction might exist — not to citizenship for diversity."}], "_b": true, "plain": "To sue a company in federal court because you're from different states, what counts is where its headquarters is — not just where it does business."}, {"id": "2361", "subj": "Civil Procedure", "sub": "Personal Juris.", "title": "personal jurisdiction needs minimum contacts; the 100-mile bulge ≠ original D", "scenario": "A plaintiff from State A sues a defendant from State B; the accident happened in State C. The defendant is served at her State B office, 50 miles from the State A courthouse. Her only contact with State A is an annual vacation. She timely raises lack of personal jurisdiction.", "q": "Should the court dismiss for lack of personal jurisdiction?", "ru": "", "options": [{"t": "Yes — the defendant lacks minimum contacts with State A", "ok": true, "trap": false, "why": "An unrelated annual vacation isn’t purposeful contact related to the claim. No personal jurisdiction."}, {"t": "No — she was served within 100 miles of the courthouse", "ok": false, "trap": true, "why": "The 100-mile bulge rule (4(k)(1)(B)) reaches only parties joined under Rule 14 or 19 — NOT the original defendant. Familiar rule, wrong slot."}, {"t": "No — she waived personal jurisdiction by omitting it from her first answer", "ok": false, "trap": false, "why": "She timely added it by amendment — no waiver."}], "_b": true, "plain": "A court can only pull you in if you have real ties to that state. One yearly vacation there isn't enough."}, {"id": "2480", "subj": "Civil Procedure", "sub": "Motions", "title": "No time extension for a Rule 50(b) judgment as a matter of law", "scenario": "A party files a renewed judgment as a matter of law after the 28-day deadline and argues it had good cause for the delay.", "q": "May the court grant the extension?", "ru": "", "options": [{"t": "No — the Rule 50(b) deadline can’t be extended at all", "ok": true, "trap": false, "why": "Rule 6(b)(2) flatly bars extending the deadline for certain motions, including a renewed judgment as a matter of law."}, {"t": "Yes — good cause was shown", "ok": false, "trap": true, "why": "Good cause is irrelevant; the rule prohibits ANY extension for these motions."}], "_b": true, "plain": "Some court deadlines are hard walls. A good excuse doesn't buy you extra time on this one."}, {"id": "2487", "subj": "Civil Procedure", "sub": "Default Judgment", "title": "A VOID judgment (no personal jurisdiction) beats “meritorious defense”", "scenario": "A company sues an attorney in State A where he has no related contacts. Believing he isn’t subject to personal jurisdiction, he ignores the suit → default judgment. He moves for relief.", "q": "His best argument?", "ru": "", "options": [{"t": "The judgment is void — no personal jurisdiction", "ok": true, "trap": false, "why": "Rule 60(b)(4): a judgment entered without personal jurisdiction is void and must be set aside."}, {"t": "He has a meritorious defense to assert", "ok": false, "trap": true, "why": "A meritorious defense gets you nothing unless you first fit a 60(b) ground. The threshold is the void judgment, not the merits."}], "_b": true, "plain": "If the court never had power over you in the first place, the whole judgment is dead on arrival — you don't even need a good defense."}, {"id": "2494", "subj": "Civil Procedure", "sub": "Rule 54(b)", "title": "No partial final judgment when claims overlap", "scenario": "Employees sue under federal + state overtime law (parallel claims). The court grants summary judgment on the federal claims only. They move to certify an immediate appeal (“no just reason for delay”).", "q": "Will the court certify the immediate appeal?", "ru": "", "options": [{"t": "No — the federal claims aren’t separate & distinct from the state claims", "ok": true, "trap": false, "why": "Rule 54(b): overlapping facts/evidence defeat certification — avoids piecemeal appeals."}, {"t": "Yes — they’re entitled to immediate review of the summary judgment", "ok": false, "trap": true, "why": "There’s no automatic right; the overlap with unresolved claims blocks 54(b)."}], "_b": true, "plain": "You usually can't appeal half a case while the other half is still going, especially when the two halves overlap."}, {"id": "2501", "subj": "Civil Procedure", "sub": "Appealability", "title": "Final-judgment rule: one claim resolved ≠ appealable", "scenario": "A scientist sues his ex-employer under federal + state law. The court dismisses ONLY the federal claim; he appeals immediately.", "q": "Is the appeal proper?", "ru": "", "options": [{"t": "No — there’s no final judgment yet", "ok": true, "trap": false, "why": "The state claim is still pending, so the whole action isn’t resolved. Same concept as #2494."}, {"t": "Yes — the decision on the federal claim is final", "ok": false, "trap": true, "why": "Resolving one claim isn’t “final” while others remain. You missed this rule twice in this set."}], "_b": true, "plain": "You generally can't appeal until the whole case is finished. Resolving one piece isn't “done.”"}, {"id": "2508", "subj": "Civil Procedure", "sub": "Erie", "title": "Valid Federal Rules of Civil Procedure on point controls (Hanna), not York", "scenario": "Diversity products case. State law bars the class action; Federal Rules of Civil Procedure 23 allows it.", "q": "Which law governs whether it proceeds as a class action?", "ru": "", "options": [{"t": "Federal — a valid Federal Rules of Civil Procedure on point controls", "ok": true, "trap": false, "why": "Hanna/Sibbach: a valid Federal Rules of Civil Procedure directly on point beats conflicting state law. Rule 23 governs."}, {"t": "State — ignoring it would be outcome-determinative", "ok": false, "trap": true, "why": "The York outcome-determinative test applies only to judge-made federal practice, not when a valid Federal Rules of Civil Procedure is on point. Wrong Erie test."}], "_b": true, "plain": "When a federal court rule directly covers the situation, you follow the federal rule — not the state's."}, {"id": "2515", "subj": "Civil Procedure", "sub": "Pretrial Order", "title": "Amend a final pretrial order ONLY to prevent manifest injustice", "scenario": "A party moves to amend the final pretrial order and argues excusable neglect.", "q": "What’s the governing standard?", "ru": "", "options": [{"t": "Only to prevent manifest injustice", "ok": true, "trap": false, "why": "Rule 16(e) — the high bar for amending a FINAL pretrial order."}, {"t": "Oversight, inadvertence, or excusable neglect", "ok": false, "trap": true, "why": "That’s the Rule 60(b) standard (relief from judgment) — wrong rule imported."}], "_b": true, "plain": "Once the final game plan for trial is locked in, you can only change it to prevent a real injustice — not just because you forgot something."}, {"id": "2522", "subj": "Civil Procedure", "sub": "Rule 50", "title": "Rule 50 standard = no reasonable jury, NOT preponderance", "scenario": "The court rules on a motion for judgment as a matter of law.", "q": "What’s the standard for granting it?", "ru": "", "options": [{"t": "No reasonable jury could find for the non-movant", "ok": true, "trap": false, "why": "The court views evidence in the light most favorable to the non-movant and does NOT weigh it."}, {"t": "The movant wins on a preponderance of the evidence", "ok": false, "trap": true, "why": "Preponderance = weighing evidence, which is exactly what the court may not do on Rule 50."}], "_b": true, "plain": "A judge can take a case from the jury only if no reasonable jury could side with the other person. The judge isn't allowed to just decide who's more convincing."}, {"id": "2533", "subj": "Civil Procedure", "sub": "Rule 60(b)", "title": "60(b)(1) motion: 1-year hard ceiling", "scenario": "An employee files a Rule 60(b)(1) “mistake” motion 15 months after the judgment.", "q": "Will it be granted?", "ru": "", "options": [{"t": "No — untimely; 60(b)(1) has a 1-year limit", "ok": true, "trap": false, "why": "Must be filed within a reasonable time AND no later than 1 year. 15 months is too late."}, {"t": "Yes — mistake/excusable neglect applies", "ok": false, "trap": true, "why": "Even if the ground fits, the motion blew past the 1-year ceiling. Check the timing gate first."}], "_b": true, "plain": "There's a one-year clock to undo a “mistake” judgment. Miss it and the door's shut, even if you were right."}, {"id": "2457", "subj": "Real Property", "sub": "Notice / Chain", "title": "Constructive notice via the DUTY TO SEARCH the chain", "scenario": "O sells the west tract to W with a residential restriction and promises to restrict any future east-tract deed. W records. O later sells the east tract to E with no restriction; E has no actual notice.", "q": "What is dispositive on whether E is bound?", "ru": "", "options": [{"t": "Whether E had a duty to search the grantor’s other (out-of-chain) deeds", "ok": true, "trap": false, "why": "Jurisdictions split; if buyers are charged with notice of all transfers by their grantor, E is bound."}, {"t": "The type of recording act in the jurisdiction", "ok": false, "trap": true, "why": "The recording-act type doesn’t decide bona fide purchaser status here — the constructive-notice/duty-to-search question does."}, {"t": "Whether W built improvements on her land", "ok": false, "trap": false, "why": "Irrelevant to whether the restriction binds E."}], "_b": true, "plain": "Whether the new buyer is stuck with the restriction comes down to whether he was expected to dig deeper into the seller's earlier deals."}, {"id": "2465", "subj": "Real Property", "sub": "“As Is” Sale", "title": "No duty to disclose an UNKNOWN defect in an “as is” sale", "scenario": "An out-of-state buyer buys “as is,” declines an offered inspection, never asks about condition. The seller didn’t know about the termites. Buyer sues after finding termite damage.", "q": "Result of the buyer’s suit?", "ru": "", "options": [{"t": "Buyer loses — “as is” is enforced absent misrepresentation/concealment", "ok": true, "trap": false, "why": "Seller didn’t know, didn’t misrepresent, and offered inspection. No breach."}, {"t": "Buyer wins — the warranty deed covers the defect", "ok": false, "trap": true, "why": "A warranty deed protects TITLE, not physical condition. Wrong category."}], "_b": true, "plain": "If you buy something “as is,” skip the inspection, and the seller didn't know about the problem either, you can't blame them later."}, {"id": "2476", "subj": "Real Property", "sub": "Void Deed", "title": "A VOID deed (fraud in execution) defeats even a bona fide purchaser", "scenario": "A son slips a deed among tax papers; the father signs without reading. The son records and sells to an innocent investor. The father dies; his will left the building to his wife.", "q": "Is the wife entitled to the building?", "ru": "", "options": [{"t": "Yes — fraud in the execution makes the deed void; void passes nothing", "ok": true, "trap": false, "why": "Treated like forgery. A void deed conveys no title — even to a bona fide purchaser."}, {"t": "No — the investor is a bona fide purchaser without notice", "ok": false, "trap": true, "why": "THE trap. The bona fide purchaser shield works only against VOIDABLE deeds. Against a void/forged deed it fails completely."}], "_b": true, "plain": "A deed someone was tricked into signing is worthless paper — so even an innocent later buyer gets nothing from it."}, {"id": "2379", "subj": "Real Property", "sub": "Equitable Mortgage", "title": "Absolute deed given as security = equitable mortgage", "scenario": "A friend loans the full purchase price; the woman deeds the land to him; he’s to reconvey when repaid; she lives there meanwhile. The deed is silent. After repayment he refuses and calls her payments “rent.”", "q": "Will the woman prevail in compelling reconveyance?", "ru": "", "options": [{"t": "Yes — it’s an equitable mortgage; he must reconvey", "ok": true, "trap": false, "why": "A deed given to secure a loan is an equitable mortgage when that’s the parties’ intent."}, {"t": "No — the contract merged into the deed", "ok": false, "trap": true, "why": "Merger covers title-quality promises — not whether the conveyance was really a security device."}], "_b": true, "plain": "If you sign your house over just as security for a loan, it's really a mortgage. The lender has to give it back when you pay — he can't keep it."}, {"id": "2499", "subj": "Real Property", "sub": "Fixtures", "title": "A ceiling fan IS a fixture", "scenario": "A sale contract is silent on what stays. The seller wants to take a garbage disposal, a dining-room ceiling fan, and a power lawn mower.", "q": "Which may the seller remove?", "ru": "", "options": [{"t": "Only the power lawn mower", "ok": true, "trap": false, "why": "The disposal and the mounted ceiling fan are annexed → fixtures (stay). The mower is personal property."}, {"t": "The lawn mower and the ceiling fan", "ok": false, "trap": true, "why": "You let the fan go. A mounted ceiling fan is a fixture — you stopped one item short."}, {"t": "All three", "ok": false, "trap": false, "why": "The disposal and fan are fixtures and must stay."}], "_b": true, "plain": "Stuff attached to the house (like a mounted ceiling fan) stays with the house. The free-standing lawn mower goes with you."}, {"id": "2528", "subj": "Real Property", "sub": "Zoning", "title": "Self-created hardship ≠ variance", "scenario": "An owner builds his home on a 3-acre lot (zoning needs 2 vacant acres around any home). Later, ill, he wants to build his caretaker daughter a small home on the west portion — but no room is left to comply. He seeks a variance.", "q": "Should the variance be granted?", "ru": "", "options": [{"t": "No — he created the hardship himself", "ok": true, "trap": false, "why": "He sited his own home so a second couldn’t comply. A self-created hardship can’t support a variance."}, {"t": "Yes — variances are normally granted when the use is consistent", "ok": false, "trap": true, "why": "The sick father + caretaking daughter pull you to “yes.” Sympathetic, but legally a self-created hardship."}], "_b": true, "plain": "You can't bend the zoning rules to fix a problem you created yourself by how you built — no matter how sympathetic the reason."}, {"id": "2531", "subj": "Real Property", "sub": "Broker Duty", "title": "Broker’s fiduciary duty to disclose", "scenario": "A broker presents a full-price offer without disclosing the buyer is his daughter, who plans to flip for $100k more. The seller sues to recover the commission.", "q": "Who prevails?", "ru": "", "options": [{"t": "The seller — nondisclosure breached the broker’s fiduciary duty", "ok": true, "trap": false, "why": "A broker must fully disclose any interest the broker or family has. Breach → forfeit the commission."}, {"t": "The broker — the daughter, not he, bought it at arm’s length", "ok": false, "trap": true, "why": "A distraction. The broker’s failure to disclose is itself the breach."}], "_b": true, "plain": "Your agent has to tell you if his own daughter is the buyer. Hiding it means he loses his commission."}, {"id": "2534", "subj": "Real Property", "sub": "Mortgage / Waste", "title": "Waste triggers acceleration even if payments are current", "scenario": "A borrower tears down one of two mortgaged warehouses without replacing it. Payments and insurance are current. The bank accelerates; the borrower argues the property’s value still exceeds the balance.", "q": "Is the acceleration valid?", "ru": "", "options": [{"t": "Yes — waste breaches a non-payment covenant", "ok": true, "trap": false, "why": "Acceleration can be triggered by breach of any covenant, here the no-waste term. Demolition impairs the security."}, {"t": "No — the property value still exceeds the loan balance", "ok": false, "trap": true, "why": "The “value still covers it” number is irrelevant; the waste is the breach."}], "_b": true, "plain": "Tearing down the building you put up as collateral breaks the deal, so the bank can call the loan — even if you're paying on time."}, {"id": "2458", "subj": "Torts", "sub": "Battery", "title": "Battery intent ≠ knowledge of a statistical risk", "scenario": "A tire maker’s memo admits ~1 in 10,000 tires has an undetectable defect that ruptures. A driver is injured and sues for BATTERY.", "q": "Does the battery claim succeed?", "ru": "", "options": [{"t": "No — statistical knowledge isn’t intent to harm a person", "ok": true, "trap": false, "why": "Battery needs purpose or substantial certainty a person will be harmed. Knowing some tires fail isn’t that. (Products liability is the right theory.)"}, {"t": "Yes — the maker knew to a substantial certainty harm would occur", "ok": false, "trap": true, "why": "It knew tires would fail — not that any particular person would be injured. Not battery intent."}], "_b": true, "plain": "Knowing a tiny fraction of your products might fail someday isn't the same as intending to hurt a specific person — so it's not battery."}, {"id": "2485", "subj": "Torts", "sub": "Land Status", "title": "Invitee status from store policy + permission", "scenario": "A store gives away empty boxes; an employee lets a customer into the storeroom to look for boxes; she’s injured there.", "q": "What is her status in the storeroom?", "ru": "", "options": [{"t": "Invitee — business-connected purpose + permission", "ok": true, "trap": false, "why": "The store’s box policy plus the employee’s permission make her an invitee → highest duty owed."}, {"t": "Licensee — there for her own purposes", "ok": false, "trap": true, "why": "The business-connected permission elevates her from licensee to invitee."}], "_b": true, "plain": "Because the store invited her in for store business, it owed her the highest level of care."}, {"id": "2492", "subj": "Torts", "sub": "Theory Ranking", "title": "Rank the theories — assault beats intentional infliction of emotional distress here", "scenario": "A father confronts the driver. The question asks for the strongest claim.", "q": "Best theory against the father?", "ru": "", "options": [{"t": "Assault", "ok": true, "trap": false, "why": "Intentionally causing reasonable apprehension of imminent contact — easiest to establish on these facts."}, {"t": "Intentional infliction of emotional distress", "ok": false, "trap": true, "why": "Higher bar: extreme & outrageous conduct + intent to cause severe distress. “Best” means most provable → assault."}], "_b": true, "plain": "Pick the claim with the lowest bar to win. Scaring someone (assault) is easier to prove than “extreme and outrageous” conduct."}, {"id": "2503", "subj": "Torts", "sub": "NIED", "title": "negligent infliction of emotional distress generally requires a physical injury", "scenario": "A dispatcher suffers severe emotional distress, is hospitalized, and misses months of work — but the facts state NO physical injury. The company moves for summary judgment.", "q": "Should the court grant summary judgment for the company?", "ru": "", "options": [{"t": "Yes — negligent infliction of emotional distress generally needs a physical injury", "ok": true, "trap": false, "why": "The facts stipulate no physical injury, so the general negligent infliction of emotional distress bar applies. summary judgment granted."}, {"t": "No — hospitalization shows real harm", "ok": false, "trap": true, "why": "Tempting, but the facts expressly say no physical injury. Don’t override a stipulated fact."}], "_b": true, "plain": "If the facts flatly say there was no physical harm, a pure emotional-distress claim usually can't get off the ground."}, {"id": "2519", "subj": "Torts", "sub": "Economic Loss", "title": "Economic loss doctrine bars products tort for pure $ loss", "scenario": "A defective product causes the farmer only lost revenue — no injury, no other-property damage.", "q": "Can he recover on strict products liability?", "ru": "", "options": [{"t": "No — the economic loss doctrine bars it", "ok": true, "trap": false, "why": "No tort recovery for purely economic loss; you need personal injury or damage to OTHER property."}, {"t": "Yes — the product was defective and caused loss", "ok": false, "trap": true, "why": "Pure economic loss is a contract claim, not a tort claim."}], "_b": true, "plain": "If a bad product only cost you money — no injury, nothing else broken — that's a contract problem, not an injury lawsuit."}, {"id": "2532", "subj": "Torts", "sub": "Economic Loss", "title": "Economic loss: damage to the product ITSELF only", "scenario": "An RV catches fire from a defect; only the RV itself is destroyed — no other property, no injury.", "q": "Can the couple recover on strict products liability?", "ru": "", "options": [{"t": "No — only the product itself was damaged", "ok": true, "trap": false, "why": "Economic loss rule: damage to the product alone → contract remedies only. Same rule as #2519."}, {"t": "Yes — there was clearly a defect", "ok": false, "trap": true, "why": "A defect isn’t enough when only the product itself is harmed. You missed this rule twice."}], "_b": true, "plain": "When the only thing the defect destroyed is the product itself, you're limited to contract remedies, not an injury claim."}, {"id": "2422", "subj": "Torts", "sub": "Assumption of Risk", "title": "TRADITIONAL assumption of risk = complete bar", "scenario": "The jurisdiction uses the TRADITIONAL assumption-of-risk rule. A man knowingly and voluntarily goes down a darkened stair and falls.", "q": "Is the owner liable?", "ru": "", "options": [{"t": "No — it’s a complete defense, no apportionment", "ok": true, "trap": false, "why": "Traditional assumption of risk fully bars recovery if he knowingly and voluntarily encountered the risk."}, {"t": "Partially — assign a percentage of fault", "ok": false, "trap": true, "why": "That’s comparative fault. The question set the TRADITIONAL rule → all-or-nothing. Read the regime."}], "_b": true, "plain": "Under the old all-or-nothing rule, if you knowingly chose to take the risk, you can't recover anything. There's no splitting the blame."}, {"id": "2453", "subj": "Constitutional Law", "sub": "Right to Travel", "title": "Congress can’t authorize a durational residency requirement", "scenario": "A state imposes a durational residency requirement; a federal statute purports to authorize states to do so.", "q": "Is the scheme constitutional?", "ru": "", "options": [{"t": "No — it violates the right to travel; Congress can’t authorize that", "ok": true, "trap": false, "why": "Durational residency requirements violate the right to travel (Privileges and Immunities Clause); Congress can’t authorize a constitutional violation."}, {"t": "No — it unconstitutionally commandeers the states", "ok": false, "trap": true, "why": "It authorizes, it doesn’t compel — so no commandeering. Right result, wrong doctrine."}, {"t": "Yes — Congress has the power to permit it", "ok": false, "trap": false, "why": "Congress can’t bless a violation of a fundamental right."}], "_b": true, "plain": "States can't punish you for being new there, and Congress can't give them permission to violate that right."}, {"id": "2342", "subj": "Constitutional Law", "sub": "Supremacy", "title": "States can’t habeas a federal detention", "scenario": "A state court issues a habeas writ interfering with a federal detention.", "q": "Is the state writ valid?", "ru": "", "options": [{"t": "No — the Supremacy Clause bars it", "ok": true, "trap": false, "why": "Tarble’s Case: state courts can’t interfere with federal custody; federal courts handle it."}, {"t": "Analyze it under the Suspension Clause", "ok": false, "trap": true, "why": "Wrong clause — there’s no suspension problem because federal courts can still issue the writ."}], "_b": true, "plain": "A state court can't free someone the federal government is holding. Federal law wins."}, {"id": "2369", "subj": "Constitutional Law", "sub": "Commerce Clause", "title": "Can’t reach noncommercial intrastate activity", "scenario": "A statute bans mere POSSESSION of tea — a noncommercial activity with no interstate link.", "q": "Is this within the commerce power?", "ru": "", "options": [{"t": "No — noncommercial intrastate activity with no interstate link", "ok": true, "trap": false, "why": "Lopez: Congress can’t aggregate the effects of non-economic activity."}, {"t": "Yes — aggregate the effects on interstate commerce", "ok": false, "trap": true, "why": "Aggregation needs ECONOMIC activity (Raich = a comprehensive economic scheme). Mere possession isn’t economic."}], "_b": true, "plain": "Congress can regulate business that crosses state lines, but simply owning something, with no business angle, is beyond its reach."}, {"id": "2475", "subj": "Constitutional Law", "sub": "Takings", "title": "Physical occupation = per se taking; a fee ≠ just compensation", "scenario": "A state forces a public hiking easement across a farm and lets the owner charge hikers a cost-recovery fee.", "q": "Is the law constitutional?", "ru": "", "options": [{"t": "No — a per se physical taking with no just compensation", "ok": true, "trap": false, "why": "A permanent physical occupation requires just compensation = fair market value."}, {"t": "Yes — the fee compensates the owner", "ok": false, "trap": true, "why": "A cost-recovery fee isn’t the fair market value of an easement — inadequate compensation."}], "_b": true, "plain": "If the government forces a public path across your land, it has to pay you full value. Letting you charge a small fee isn't enough."}, {"id": "2395", "subj": "Constitutional Law", "sub": "Appointments", "title": "Principal officers need Senate confirmation", "scenario": "A commission adopts and enforces regulations and is not subordinate to any other agency.", "q": "How must its members be appointed?", "ru": "", "options": [{"t": "By the President with Senate advice and consent", "ok": true, "trap": false, "why": "Significant authority + not subordinate = principal officers → presidential appointment + Senate confirmation."}, {"t": "By the President alone, no confirmation needed", "ok": false, "trap": true, "why": "That’s how INFERIOR officers can be appointed. These are principal officers — confirmation required."}], "_b": true, "plain": "Officials with real power who answer to no one above them must be picked by the President and approved by the Senate."}, {"id": "2526", "subj": "Constitutional Law", "sub": "Exactions", "title": "Exactions use Nollan/Dolan nexus, not Penn Central", "scenario": "A city conditions a building permit on the owner opening his new swimming pool to neighborhood residents — rationale: the project will increase street traffic.", "q": "Is the condition a taking?", "ru": "", "options": [{"t": "Yes — no nexus between pool access and traffic harm", "ok": true, "trap": false, "why": "Nollan/Dolan: a demand for public access must be related & roughly proportional to the development’s harm. Pool ≠ traffic."}, {"t": "Analyze via reasonable investment-backed expectations", "ok": false, "trap": true, "why": "That’s the Penn Central regulatory-takings test. Exactions use the nexus/proportionality test."}], "_b": true, "plain": "A city can only attach a permit condition that actually relates to the harm your project causes. Making your pool public doesn't fix traffic."}, {"id": "2448", "subj": "Criminal Law and Procedure", "sub": "4th Amendment", "title": "Police-created exigency is OK if police acted lawfully", "scenario": "Police knock and announce (lawfully). Hearing evidence being destroyed, they enter without a warrant.", "q": "Is the warrantless entry valid?", "ru": "", "options": [{"t": "Yes — lawful conduct created the exigency", "ok": true, "trap": false, "why": "Kentucky v. King: police may create the exigency so long as they didn’t do so by violating the 4th Amendment."}, {"t": "No — they could have obtained a warrant", "ok": false, "trap": true, "why": "The doctrine doesn’t ask whether a warrant was obtainable — the exigency is the whole point."}], "_b": true, "plain": "Police can rush in without a warrant when evidence is being destroyed — as long as they didn't break any rules to create that emergency."}, {"id": "2495", "subj": "Criminal Law and Procedure", "sub": "Defense of Property", "title": "No deadly force to defend property", "scenario": "A defendant shoots a man with a shotgun to protect property.", "q": "Is the use of force justified?", "ru": "", "options": [{"t": "No — deadly force can never defend property alone", "ok": true, "trap": false, "why": "Deadly force = force likely to cause death/serious injury. It may not be used solely to protect property."}, {"t": "Justified unless serious injury actually resulted", "ok": false, "trap": true, "why": "Actual harm is irrelevant. Firing a shotgun IS deadly force regardless of the outcome."}], "_b": true, "plain": "You can never use deadly force just to protect property. A life isn't worth a thing."}, {"id": "2504", "subj": "Criminal Law and Procedure", "sub": "Transferred Intent", "title": "Attempt + murder are separate offenses", "scenario": "A woman tries to kill her husband (fails = attempted murder); the same act kills her son (murder via transferred intent).", "q": "Must the two be charged together?", "ru": "", "options": [{"t": "No — separate offenses, different victims", "ok": true, "trap": false, "why": "Attempt (husband) and completed murder (son) are distinct; attempt isn’t a lesser-included of the murder."}, {"t": "Yes — they merge / attempt is lesser-included", "ok": false, "trap": true, "why": "Different victims and independent theories — they don’t merge."}], "_b": true, "plain": "Trying to kill one person and accidentally killing another are two separate crimes, not one."}, {"id": "2414", "subj": "Criminal Law and Procedure", "sub": "Conspiracy", "title": "Conspiracy scope = the agreement actually made", "scenario": "A man agrees with a friend to commit robbery but doesn’t know the friend has a gun. The friend uses it.", "q": "Conspiracy to commit ARMED robbery?", "ru": "", "options": [{"t": "No — he agreed to robbery, not armed robbery", "ok": true, "trap": false, "why": "Conspiracy tracks the agreement. He was unaware of the gun, so it’s outside the agreed scope."}, {"t": "Yes — an armed robbery occurred", "ok": false, "trap": true, "why": "What happened doesn’t expand the agreement. He didn’t agree to a weapon."}], "_b": true, "plain": "You're only on the hook for the crime you actually agreed to. If you didn't know about the gun, you didn't agree to an armed robbery."}, {"id": "2450", "subj": "Evidence", "sub": "Business Records", "title": "Business-records exception covers a criminal ledger", "scenario": "A drug ledger is offered; a codefendant can testify about how the records were kept.", "q": "Admissible under the business-records exception?", "ru": "", "options": [{"t": "Yes — illegal enterprises can keep “business records”", "ok": true, "trap": false, "why": "If the foundation is met (insider knowledge, contemporaneous, routine), criminality doesn’t disqualify it."}, {"t": "No — a criminal operation isn’t a regular business", "ok": false, "trap": true, "why": "Illegal activity can still be “regularly conducted.” The exception applies."}], "_b": true, "plain": "Even a drug dealer's account book can count as a “business record.” Being illegal doesn't make it inadmissible."}, {"id": "2399", "subj": "Evidence", "sub": "Authentication", "title": "Authentication = enough to support a finding (Federal Rules of Evidence 901)", "scenario": "The prosecution authenticates seized items through a witness who saw them in the apartment.", "q": "Is the authentication standard met?", "ru": "", "options": [{"t": "Yes — enough evidence to support a finding it’s what it’s claimed to be", "ok": true, "trap": false, "why": "Federal Rules of Evidence 901’s standard. A witness who saw the items satisfies it."}, {"t": "No — chain of custody is required", "ok": false, "trap": true, "why": "Chain of custody is ONE method, not a requirement. Witness identification suffices."}], "_b": true, "plain": "To prove an item is what you say it is, a witness who saw it is enough. You don't need a perfect paper trail."}, {"id": "2530", "subj": "Evidence", "sub": "Impeachment", "title": "Prior inconsistent statement: extrinsic proof for impeachment ONLY", "scenario": "A girlfriend testifies the defendant was home all morning; she’s confronted with a prior inconsistent statement and denies it; the party offers extrinsic proof of it.", "q": "Admissible — and for what purpose?", "ru": "", "options": [{"t": "Yes — for impeachment only", "ok": true, "trap": false, "why": "Federal Rules of Evidence 613(b): admissible to impeach once she could explain/deny. Not substantive — it’s hearsay if offered for the truth."}, {"t": "Yes — for the truth of the matter asserted", "ok": false, "trap": true, "why": "It comes in to impeach, not as substantive proof of when he left."}], "_b": true, "plain": "You can use someone's earlier contradicting statement to show they're unreliable — but not as proof that the earlier statement was true."}, {"id": "2538", "subj": "Evidence", "sub": "Expert / 704(b)", "title": "Expert can’t opine on the ultimate mental-state defense", "scenario": "A psychiatrist would testify (1) about the defendant’s condition AND (2) that he was legally insane at the time.", "q": "What’s admissible?", "ru": "", "options": [{"t": "Part 1 yes; the legal-insanity conclusion no", "ok": true, "trap": false, "why": "Federal Rules of Evidence 704(b): an expert can’t opine on whether the defendant had the mental state constituting a defense."}, {"t": "All of it / none of it", "ok": false, "trap": true, "why": "It’s split: the condition is admissible; the ultimate legal-insanity opinion is not."}], "_b": true, "plain": "An expert can describe the defendant's mental condition, but can't tell the jury the final verdict like “he was legally insane.”"}, {"id": "2443", "subj": "Contracts", "sub": "UCC 2-501", "title": "Marking/labeling identifies goods to the contract", "scenario": "An outfitter orders 20 kayaks online; the seller later marks specific kayaks with shipping labels in the warehouse.", "q": "When were the goods identified to the contract?", "ru": "", "options": [{"t": "When the seller marked them with shipping labels", "ok": true, "trap": false, "why": "Uniform Commercial Code §2-501: goods are identified when shipped, marked, or otherwise designated — even after formation."}, {"t": "Never — the marking happened after formation", "ok": false, "trap": true, "why": "Identification can occur after formation. Marking is exactly how it’s done."}], "_b": true, "plain": "The goods become tied to your deal the moment the seller tags them for you — even if that happens after you ordered."}, {"id": "2468", "subj": "Contracts", "sub": "Impracticability", "title": "Impracticability discharges — but restitution for work done", "scenario": "An arborist’s job is cut short by vandalism and a fire (a basic-assumption casualty).", "q": "What can he recover?", "ru": "", "options": [{"t": "Restitution for the value of work performed", "ok": true, "trap": false, "why": "Performance is discharged by impracticability, but he recovers the value of what he did before discharge."}, {"t": "Expectation damages", "ok": false, "trap": true, "why": "Expectation is a BREACH remedy — no one breached here. The remedy is restitution."}], "_b": true, "plain": "When a disaster that's nobody's fault ends the job early, the worker gets paid for what he already did — not for the whole job."}, {"id": "2488", "subj": "Contracts", "sub": "Good Faith", "title": "Implied covenant of good faith fills the gap", "scenario": "A lease lets the owner re-let the property but is silent on entering to show the house to prospective lessees.", "q": "May the owner enter to show it?", "ru": "", "options": [{"t": "Yes — implied covenant of good faith infers the right", "ok": true, "trap": false, "why": "The right is inferred to carry out the parties’ clear re-letting intent."}, {"t": "Yes — under the “reasonable expectations” doctrine", "ok": false, "trap": true, "why": "Reasonable expectations is an INSURANCE-law doctrine — wrong tool for a general contract."}], "_b": true, "plain": "Even if the lease doesn't spell it out, the landlord can do what's reasonably needed to carry out what both sides clearly intended."}, {"id": "2505", "subj": "Contracts", "sub": "Repudiation", "title": "“Agree or I won’t perform” = repudiation; buyer covers", "scenario": "A seller demands a price increase and says it won’t perform otherwise. The buyer covers elsewhere at $3,000 more.", "q": "What can the buyer recover?", "ru": "", "options": [{"t": "$3,000 — cover price minus the contract price", "ok": true, "trap": false, "why": "The demand was a repudiation/breach (Uniform Commercial Code §2-610). Buyer covers and recovers the difference (§2-712)."}, {"t": "Nothing — the cover wasn’t a reasonable substitute", "ok": false, "trap": true, "why": "The seller’s “modify-or-I-walk” threat was a breach; cover damages of $3,000 apply."}], "_b": true, "plain": "If a seller says “pay more or I walk,” that's breaking the deal. You can buy elsewhere and charge them the extra cost."}];

function normalizeMBESubject(rawSubject) {
  const s = String(rawSubject || "")
    .trim()
    .replace(/\s+/g, " ")
    .toLowerCase();

  const aliases = {
    "civil procedure": "Civil Procedure",

function normalizeMBESubtopic(subject, rawSubtopic) {
  const normalizedSubject = normalizeMBESubject(subject);

  const cleaned = String(rawSubtopic || "")
    .trim()
    .replace(/\s+/g, " ")
    .replace(/\s*\(Simulated\)\s*$/i, "");

  const allowed = ADAPTIBAR_MBE_TAXONOMY[normalizedSubject] || [];

  const exact = allowed.find(
    x => x.toLowerCase() === cleaned.toLowerCase()
  );

  if (exact) return exact;

  const aliases = {
    "jurisdiction & venue": "Jurisdiction and Venue",
    "law applied by federal courts": "Law Applied by Federal Courts",
    "verdicts & judgments": "Verdicts and Judgments",
    "appealability & review": "Appealability and Review",

    "judicial review": "Judicial Review",
    "separation of powers": "Separation of Powers",
    "federalism": "Relations Between Federal and State Governments",
    "individual rights": "Individual Rights",

    "formation": "Formation of Contracts",
    "formation of contracts": "Formation of Contracts",
    "defenses": "Defenses to Enforceability",
    "contract content": "Contract Content and Meaning",
    "performance and breach": "Performance, Breach, and Discharge",
    "performance breach and discharge": "Performance, Breach, and Discharge",
    "third party rights": "Third-Party Rights",
    "third-party rights": "Third-Party Rights",

    "inchoate crimes and parties": "Inchoate Crimes",
    "inchoate crimes; parties": "Inchoate Crimes",
    "constitutional protections of accused persons": "Constitutional Protection of Accused Persons",
    "constitutional protection of accused persons": "Constitutional Protection of Accused Persons",

    "relevancy": "Relevancy and Excluding Relevant Evidence",
    "relevancy and reasons for excluding relevant evidence": "Relevancy and Excluding Relevant Evidence",
    "hearsay": "Hearsay and Circumstances of Its Admissibility",
    "original writings": "Writings, Recordings, and Photographs",

    "ownership of real property": "Ownership",
    "rights in real property": "Rights in Land",
    "real estate contracts": "Contracts",
    "mortgages/security devices": "Mortgages",
    "mortgages and security devices": "Mortgages",

    "strict liability/products liability": "Strict Liability and Products Liability",
    "strict liability and product liability": "Strict Liability and Products Liability"
  };

  const alias = aliases[cleaned.toLowerCase()];

  if (alias && allowed.includes(alias)) return alias;

  return cleaned || "Uncategorized";
}

function isKnownMBESubtopic(subject, subtopic) {
  const normalizedSubject = normalizeMBESubject(subject);
  return (ADAPTIBAR_MBE_TAXONOMY[normalizedSubject] || []).includes(subtopic);
}

function allocateMBECategory(cardOrRaw) {
  const rawSubject = cardOrRaw.subj || cardOrRaw.subject || cardOrRaw.rawSubject || "";
  const rawSubtopic = cardOrRaw.sub || cardOrRaw.subtopic || cardOrRaw.rawSubtopic || "";

  const subject = normalizeMBESubject(rawSubject);
  const subtopic = normalizeMBESubtopic(subject, rawSubtopic);
  const mbeKey = `${subject} / ${subtopic}`;

  return {
    subj: subject,
    sub: subtopic,
    mbeKey,
    rawSubject: String(rawSubject || "").trim(),
    rawSubtopic: String(rawSubtopic || "").trim(),
    needsCategoryReview: !isKnownMBESubtopic(subject, subtopic)
  };
}

function applyCategoryToCard(card) {
  if (!card) return card;
  const migrated = migrateCardCategories([card])[0];
  Object.assign(card, migrated);
  return card;
}

function migrateCardCategories(cards) {
  return cards.map(card => {
    const allocated = allocateMBECategory(card);

    return {
      ...card,
      subj: allocated.subj,
      sub: allocated.sub,
      mbeKey: allocated.mbeKey,
      rawSubject: card.rawSubject || allocated.rawSubject,
      rawSubtopic: card.rawSubtopic || allocated.rawSubtopic,
      needsCategoryReview: allocated.needsCategoryReview
    };
  });
}

function subtopicsFor(subject) {
  return ADAPTIBAR_MBE_TAXONOMY[normalizeMBESubject(subject)] || [];
}

function cardMbeKey(c) {
  return c.mbeKey || `${normalizeMBESubject(c.subj)} / ${normalizeMBESubtopic(c.subj, c.sub)}`;
}

function normalizeSubjectLineTopLevel(label, expectedSubjectIndex = 0, currentSubject = null) {
  const cleaned = String(label || "").trim().toLowerCase();

  if (currentSubject === "Real Property" && cleaned === "contracts") {
    return null;
  }

  const candidate = normalizeMBESubject(label);
  if (!MBE_SUBJECT_SEQUENCE.includes(candidate)) return null;

  const candidateIndex = MBE_SUBJECT_SEQUENCE.indexOf(candidate);

  if (candidate === "Contracts" && expectedSubjectIndex > candidateIndex) {
    return null;
  }

  if (candidateIndex < expectedSubjectIndex) {
    return null;
  }

  return candidate;
}

function parseAdaptibarSubjectPerformance(raw) {
  const text = String(raw || "")
    .replace(/\u00a0/g, " ")
    .replace(/\r/g, "");

  const lines = text
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean);

  const result = {
    questionsAnswered: null,
    overallAccuracy: null,
    dateRange: null,
    subjects: {}
  };

  for (const line of lines) {
    const qa = line.match(/^Questions Answered:\s*(\d+)/i);
    if (qa) {
      result.questionsAnswered = Number(qa[1]);
      continue;
    }

    const acc = line.match(/^Accuracy Rate:\s*(\d+(?:\.\d+)?)%/i);
    if (acc) {
      result.overallAccuracy = Number(acc[1]);
      continue;
    }

    const dr = line.match(/^Date Range:\s*(.+)$/i);
    if (dr) {
      result.dateRange = dr[1].trim();
      continue;
    }
  }

  let currentSubject = null;
  let expectedSubjectIndex = 0;

  for (const line of lines) {
    const m = line.match(SCORE_LINE_RE);
    if (!m) continue;

    const accuracy = Number(m[1]);
    const label = m[2].trim();
    const total = Number(m[3]);

    const normalizedTop = normalizeSubjectLineTopLevel(label, expectedSubjectIndex, currentSubject);

    if (normalizedTop) {
      currentSubject = normalizedTop;
      expectedSubjectIndex = Math.max(
        expectedSubjectIndex,
        MBE_SUBJECT_SEQUENCE.indexOf(normalizedTop) + 1
      );

      if (!result.subjects[currentSubject]) {
        result.subjects[currentSubject] = {
          total,
          accuracy,
          subtopics: {}
        };
      } else {
        result.subjects[currentSubject].total = total;
        result.subjects[currentSubject].accuracy = accuracy;
      }

      continue;
    }

    if (!currentSubject) continue;

    const subtopic = normalizeMBESubtopic(currentSubject, label);
    const mbeKey = `${currentSubject} / ${subtopic}`;

    result.subjects[currentSubject].subtopics[subtopic] = {
      total,
      accuracy,
      mbeKey
    };
  }

  return result;
}
