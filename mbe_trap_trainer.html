lse,"why":""},{"t":"No, because the amendment would not relate back and thus would be futile.","ok":true,"trap":false,"why":"Courts may deny leave to amend when the claim to be added is futile. Here, the claim is futile on limitations grounds unless relation back applies. Under Federal Rule of Civil Procedure (FRCP) 15, relation back of amendments that add a party will be permitted if the failure to name the party is the result of a mistake in identity. The facts provide that the worker's failure to name the competitor in the original complaint was not due to a mistake of identity, but was instead a strategic choice. The worker did not merely forget or mistake the identity of the competitor as a potential defendant, rather they chose to add the competitor to the suit after their deposition. Thus, the amendment does not relate back and, since the claim against the competitor comes after the applicable limitations period expired, the claim is futile."},{"t":"Yes, because leave to amend should be freely granted when the underlying action was timely.","ok":false,"trap":false,"why":""},{"t":"Yes, because the allegations against the competitor arise out of the same factual circumstances and relate back to the allegations in the original complaint.","ok":false,"trap":true,"why":"Although the fact that the allegations against the competitor arise out of the same factual circumstances outlined in the original complaint is a necessary condition, FRCP 15 permits relation back only when the failure to name the party in the original complaint was the result of a mistake of identity, which was not the case here."}],"_b":true,"plain":"Adding a new defendant relates back only if the omission was a genuine identity mistake; a deliberate strategic choice doesn't, so the claim is time-barred and futile.","source":"adaptibar_import_filled.csv"},{"id":"CSV049","subj":"Criminal Law","sub":"Inchoate Crimes","title":"What is the most serious crime of which the man can properly be convicted?","scenario":"State authorities received information that a man had been making threats against his ex-wife. To determine whether the man was serious, an undercover officer introduced himself to the man at a bar. The officer said that he had previously taken care of problems for angry spouses. After some discussion in which the man expressed his extreme anger at his ex-wife, the man offered the officer $5,000 to kill her. The officer agreed and made arrangements to meet the man at the bar the next day to collect the $5,000 payment. When the man showed up the next day at the bar, authorities immediately arrested him. The jurisdiction defines attempt, solicitation, and misprision of a felony as at common law, and also punishes bilateral conspiracies. The crimes below are listed in descending order of seriousness.","q":"What is the most serious crime of which the man can properly be convicted?","ru":"Undercover's fake 'yes' = no bilateral conspiracy. Most serious here = solicitation.","options":[{"t":"Attempted murder.","ok":false,"trap":false,"why":""},{"t":"Conspiracy to commit murder.","ok":false,"trap":true,"why":"The facts do not show the existence of an agreement or a bilateral conspiracy. The man's offer, which was met by the undercover officer's insincere agreement, established only a unilateral conspiracy."},{"t":"Solicitation of murder.","ok":true,"trap":false,"why":"This question asks for the most serious crime of which the man can properly be convicted. Solicitation requires intent and an act of requesting, encouraging, or convincing someone to commit a crime. The man committed solicitation of murder by attempting to induce the undercover officer to murder the man's ex-wife. Under the facts presented the elements for attempted murder and conspiracy to commit murder were not satisfied."},{"t":"Misprision of a felony.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Trying to hire an undercover cop is solicitation; the cop's fake agreement is no real agreement, so no bilateral conspiracy and no attempt.","source":"adaptibar_import_filled.csv"},{"id":"CSV050","subj":"Contracts","sub":"Performance, Breach, and Discharge","title":"Would the heir be likely to prevail in an action to rescind the contract?","scenario":"An heir hired an appraiser to appraise various items of personal property that she had inherited, including an original oil painting. The appraiser told the heir that he had no expertise in appraising art and recommended that she hire an art appraiser to value the painting. The heir, doubting that the painting was valuable, declined to follow the appraiser's advice and decided to sell the painting at a yard sale. She set the price at $100, assuming that this price reflected the painting's approximate value. A neighbor, who knew nothing about art, purchased the painting from the heir at the asking price. The neighbor and the heir later discovered that the painting was worth over $900,000.","q":"Would the heir be likely to prevail in an action to rescind the contract?","ru":"Knew you were guessing = bore the risk = no mutual-mistake rescission.","options":[{"t":"No, because the heir bore the risk of any mistake as to the true value of the painting.","ok":true,"trap":false,"why":"A person cannot avoid a contract for mutual mistake where that person bears the risk of mistake. Here, the heir bore the risk. She was aware that she had only limited knowledge with respect to the facts, but she treated her limited knowledge as a sufficient basis for determining the value of the painting."},{"t":"No, because the neighbor possessed no specialized knowledge of the true value of the painting.","ok":false,"trap":false,"why":""},{"t":"Yes, because enforcement of the contract would be unconscionable, given its disadvantageous impact on the heir.","ok":false,"trap":false,"why":""},{"t":"Yes, because the parties were mutually mistaken as to the true value of the painting at the time of the sale.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"She knew her information was limited and gambled on value anyway, so she bore the risk and can't rescind for mutual mistake.","source":"adaptibar_import_filled.csv"},{"id":"CSV051","subj":"Torts","sub":"Intentional Torts","title":"Should the trial court grant the buyer's motion?","scenario":"After a car buyer failed to make timely payments on her auto loan and failed to respond to notices of default properly sent to her home address, the loan company hired a collection agency to repossess the car. An employee of the agency went to the buyer's home and knocked on the front door. When the buyer answered, the employee explained that he was there to repossess the car and asked for the car keys. The buyer handed the employee the keys but then asked the employee to allow her to retrieve her laptop computer from the car. The employee declined the request, explaining to the buyer that any possessions in the car could be reclaimed from the company after the car was repossessed. After pleading unsuccessfully with the employee, the buyer shoved the employee away from the door with such force that the employee fell and suffered a broken wrist. The buyer then ran to the car, which was unlocked, and retrieved the laptop. The employee has sued the buyer for battery. The buyer has moved for summary judgment, arguing that she was privileged to act as she did.","q":"Should the trial court grant the buyer's motion?","ru":"Reasonableness of defensive force = jury question -> no summary judgment.","options":[{"t":"No, because a fact-finder could reasonably conclude that the buyer used excessive force in attempting to defend her property.","ok":true,"trap":false,"why":"Summary judgment will be granted if a party shows there is no genuine dispute of material fact and that the party is entitled to judgment as a matter of law. Fed. R. Civ. P. 56. The buyer intentionally shoved the employee, which satisfies the prima facie case for battery. As an affirmative defense, the buyer could claim that she was privileged to use force against the employee in order to maintain possession of her property. However, this defense will be established only if the jury reasonably concludes that the buyer's use of force was reasonable, not excessive, under the circumstances. Thus, the trial court should deny the buyer's motion for summary judgment because there is a dispute as to whether the buyer's use of force was reasonable."},{"t":"No, because after the buyer handed the keys to the employee, the car was no longer her property.","ok":false,"trap":false,"why":""},{"t":"Yes, because a possessor can use nonlethal force to protect his or her property.","ok":false,"trap":false,"why":""},{"t":"Yes, because the buyer complied with the law by returning the car keys and acted reasonably in asking to retrieve the laptop.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Whether her force in defending the property was reasonable is a fact for the jury, so summary judgment is improper.","source":"adaptibar_import_filled.csv"},{"id":"CSV052","subj":"Evidence","sub":"Hearsay and Circumstances of Its Admissibility","title":"Is the woman's statement to the police officer admissible to prove that the defendant sold cocaine?","scenario":"A defendant has been charged with selling cocaine. On the night of the alleged sale, a police officer arrested a woman and found a large package of cocaine in her car. The woman was brought to the police station for questioning. During her interrogation, she admitted to a police officer that she had sold cocaine and said that she had obtained the cocaine from the defendant, who was a local supplier. By the time of the defendant's trial, the woman has left the country. The prosecutor calls the police officer to testify that the woman told him that the defendant was her cocaine supplier. The defendant's attorney objects.","q":"Is the woman's statement to the police officer admissible to prove that the defendant sold cocaine?","ru":"Out-of-court statement for its truth + no exception = inadmissible hearsay.","options":[{"t":"No, because it is hearsay not within any exception.","ok":true,"trap":false,"why":"The woman's statement is hearsay, an out-of-court statement offered to prove the truth of the matter asserted because it is being offered to prove that the defendant sold cocaine. Under the facts presented, there is not a hearsay exception that would apply to admit her statement against the defendant."},{"t":"No, because the prosecutor has not shown that the woman's attendance at trial could not have been procured through process or other reasonable means.","ok":false,"trap":false,"why":""},{"t":"Yes, as the statement of the defendant's coconspirator.","ok":false,"trap":false,"why":""},{"t":"Yes, as the woman's declaration against penal interest.","ok":false,"trap":true,"why":"A statement of a person, now unavailable as a witness, can be admissible if it was against that person's pecuniary, proprietary, or penal interest when made. To be admissible under the statement against interest exception, the statement must have been so against the declarant's pecuniary or proprietary interest or had so great a tendency to invalidate the declarant's claim against someone else or to expose the declarant to civil or criminal liability, that a reasonable person in the declarant's position would have made the statement only if she believed it to be true. Federal Rule of Evidence 804(b)(3). Here, the portion of the woman's statement attributing fault to the defendant and suggesting that he was her drug supplier was not against the woman's penal interest. Rather, her statement was self-serving, shifting the blame to the defendant, and likely garnered her additional leniency regarding her own crimes due to her cooperation with the police."}],"_b":true,"plain":"The woman's statement is offered for its truth and no exception fits, so it's inadmissible hearsay against the defendant.","source":"adaptibar_import_filled.csv"},{"id":"CSV053","subj":"Real Property","sub":"Contracts","title":"Can the buyer still enforce the contract?","scenario":"A seller signed a valid contract with a buyer for the sale of a restaurant building. The contract provided that the closing would occur at the office of the seller's attorney 30 days after the date of the contract. Twenty days later, the buyer asked the seller if the closing could be postponed for 15 days beyond the scheduled closing date. The seller authorized her attorney to email the buyer saying that the closing date would be extended for 15 days but that \"time is now of the essence.\" The buyer emailed back that the change was reasonable and thanked them. On the rescheduled closing date, the buyer was in a car accident on the way to the closing and was hospitalized for a month. When the buyer was released from the hospital, he told the seller and her attorney that he was now ready to close. They responded that the buyer had breached the contract and that there would be no closing.","q":"Can the buyer still enforce the contract?","ru":"Time made 'of the essence' later (with reasonable notice) = miss the date, you breach.","options":[{"t":"No, because it was the buyer who had requested the change in the closing date.","ok":false,"trap":false,"why":""},{"t":"No, because time was made \"of the essence\" as to the rescheduled closing date.","ok":true,"trap":false,"why":"The initial contract did not state that time would be \"of the essence\" for the closing. When the buyer requested a postponement of 15 days, the seller agreed but noted that time was now \"of the essence,\" which the buyer agreed was reasonable. Time may be made of the essence later if there is a reasonable time between the notice and the new date. Since time was made \"of the essence\" and the buyer acknowledged the time as reasonable, the buyer's failure to close on the rescheduled closing date resulted in a breach of contract."},{"t":"Yes, because the buyer's failure to appear at the rescheduled closing was justified.","ok":false,"trap":false,"why":""},{"t":"Yes, because the original contract was silent concerning time being \"of the essence.\"","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The seller later made time of the essence with a reasonable cushion the buyer accepted, so missing the new date breached.","source":"adaptibar_import_filled.csv"},{"id":"CSV054","subj":"Constitutional Law","sub":"Individual Rights","title":"What is the best argument AGAINST the constitutionality of the ordinance?","scenario":"Swimmers were unable to use a city-owned beach for several days because demonstrators protesting city policies had taken over the beach. Immediately after the demonstration ended, the city enacted an ordinance that banned \"all First Amendment activities\" on the beach.","q":"What is the best argument AGAINST the constitutionality of the ordinance?","ru":"Bans 'all' expression = OVERBREADTH attack.","options":[{"t":"The ordinance amounts to a prior restraint on speech.","ok":false,"trap":false,"why":""},{"t":"The ordinance is overly broad.","ok":true,"trap":false,"why":"The ordinance is overly broad because prohibiting all First Amendment activities on the beach would restrict substantially more speech than the First Amendment allows to be restricted."},{"t":"The beach is a public forum.","ok":false,"trap":false,"why":""},{"t":"The city enacted the ordinance to prevent further protests of its policies.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Banning ALL First Amendment activity on the beach sweeps in far too much protected speech, so it's overbroad.","source":"adaptibar_import_filled.csv"},{"id":"CSV055","subj":"Evidence","sub":"Hearsay and Circumstances of Its Admissibility","title":"Is the man's statement to the fiancée admissible?","scenario":"A defendant has been charged with conspiracy to commit arson and insurance fraud after his restaurant burned to the ground late one night. At trial, the prosecutor presents evidence that, two days before the fire, the defendant paid $10,000 to a man who was later seen entering the restaurant shortly before the fire started. The man has invoked his Fifth Amendment privilege and refuses to testify at the defendant's trial. The prosecutor calls the man's fiancée, who testifies that on the day of the fire, she noticed that the man seemed nervous and asked him what was wrong. She says that he told her, \"I'm getting paid $10,000 to burn down a restaurant tonight, and I'm a little nervous about it.\" The defendant objects to the admission of the man's statement to the fiancée, relying on the hearsay rule and the confrontation clause.","q":"Is the man's statement to the fiancée admissible?","ru":"Sign/billboard rule indifferent to message = content-neutral; aesthetics = substantial interest.","options":[{"t":"No, because the man's statement is hearsay not within any exception.","ok":false,"trap":false,"why":""},{"t":"No, because the man's statement is testimonial, so admitting it would violate the defendant's right to confrontation.","ok":false,"trap":false,"why":""},{"t":"Yes, because the man's statement is a nontestimonial declaration against penal interest.","ok":true,"trap":false,"why":"The man's statement is admissible under the hearsay exception for declarations against penal interest. The man is unavailable to testify due to his assertion of his Fifth Amendment privilege. His statement to his fiancée was so contrary to his penal interest that one would not expect him to make it unless it were true. Further, there is corroboration of his statement: the defendant paid him $10,000 and the man was seen entering the restaurant shortly before the fire. Lastly, the man's statement to his fiancée is nontestimonial, so the Sixth Amendment would not block its admission."},{"t":"Yes, because the man's statement is a nontestimonial statement by a coconspirator.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A flat ban on signs regulates without regard to message, so it's content-neutral; aesthetics is a substantial interest that satisfies intermediate scrutiny.","source":"adaptibar_import_filled.csv"},{"id":"CSV056","subj":"Constitutional Law","sub":"Individual Rights","title":"Should the court uphold the ordinance?","scenario":"The number of large billboards along a city's major roadways has increased considerably in recent years. Many political groups have contributed to that increase with their growing use of billboards to display messages that further a variety of political candidates and public causes. The city council has received many complaints from residents claiming that the billboards are ugly and detract from picturesque sights along the roadways. In response to these complaints, the city council has enacted an ordinance that substantially limits the number and the size of billboards that may be erected along designated scenic roadways. A company that owns many of the billboards affected by this ordinance has filed suit, claiming that the ordinance violates the company's freedom of speech.","q":"Should the court uphold the ordinance?","ru":"'Best efforts' = duty to try, not to succeed. Performed = other side must pay.","options":[{"t":"No, because the ordinance burdens political speech and is not necessary to further a compelling government interest.","ok":false,"trap":false,"why":""},{"t":"No, because the ordinance restricts speech in a traditional public forum.","ok":false,"trap":false,"why":""},{"t":"Yes, because the ordinance is narrowly tailored to further the substantial government interest in the city's appearance.","ok":true,"trap":false,"why":"The ordinance is a content-neutral restriction on speech because it regulates without regard to the content of the message expressed on the billboards. Content-neutral speech restrictions receive intermediate judicial scrutiny, which requires the restriction to be narrowly tailored to further a substantial government interest. The Supreme Court has held that the aesthetic interests of a community are sufficiently substantial to justify contentneutral restrictions on public displays of signs. See Metromedia, Inc. v. City of San Diego, 453 U.S. 490 (1981). The ordinance here is narrowly tailored because it applies only to scenic roadways, and it does not completely ban signs."},{"t":"Yes, because the ordinance reasonably regulates the use of public roadways.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"'Best efforts to obtain approval' only required trying, not succeeding; the engineer tried, so the developer breached by not paying.","source":"adaptibar_import_filled.csv"},{"id":"CSV057","subj":"Contracts","sub":"Performance, Breach, and Discharge","title":"In a breach of contract action by the engineer against the developer, which party will likely prevail?","scenario":"An engineer and a real estate developer entered into a written professional-services contract. The contract stated that in return for $10,000, the engineer was to \"complete a feasibility study and a master plan, and use best efforts to obtain county approval of the [developer's planned] project.\" The engineer submitted a completed feasibility study and master plan to the developer. Despite the engineer's best efforts, however, the county did not approve the project. Because of this outcome, the developer refused to pay the engineer for any of the engineer's services.","q":"In a breach of contract action by the engineer against the developer, which party will likely prevail?","ru":"JMOL = legally sufficient evidence for the burden-bearer? Don't weigh, just check sufficiency (50(a)).","options":[{"t":"The developer, because an express condition to the developer's performance obligation failed to occur.","ok":false,"trap":false,"why":""},{"t":"The developer, because the engineer breached the contract by failing to obtain the county's approval of the project.","ok":false,"trap":false,"why":""},{"t":"The engineer, because the developer breached the contract by not paying once the developer's obligation to pay the engineer became due.","ok":true,"trap":false,"why":"The engineer's obligation was to \"use best efforts to obtain county approval,\" not to necessarily succeed in obtaining county approval. The engineer performed all obligations as promised. Therefore, the developer breached the contract by refusing to perform its obligation to pay the engineer. Restatement (Second) of Contracts §§ 225, 235."},{"t":"The engineer, because the failure of an express condition to the developer's obligation to pay the engineer was excused by governmental action.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"On JMOL the court asks if any reasonable jury could find for the party with the burden; circumstantial scraps from a non-eyewitness aren't legally sufficient.","source":"adaptibar_import_filled.csv"},{"id":"CSV058","subj":"Civil Procedure","sub":"Motions","title":"Should the court grant the motion?","scenario":"A decedent's executor has brought a federal diversity action against a man, alleging that while the decedent and the man were riding dirt bikes on a track, the man's bike ran into the decedent's bike, causing the decedent to fall to her death. The man denies fault for the decedent's death. At trial, the executor's only witness testifies that shortly before the accident he was riding 50 feet behind the man and saw the man rapidly approaching the decedent until they were only a few feet apart. This witness briefly looked away, heard an unusual noise, and immediately afterward saw the decedent and the decedent's bike on the ground. The man calls three witnesses, none of whom had met the decedent or the man before. Two riders testify that they were riding parallel to the man and never saw his bike touch the decedent's bike. A track attendant, who was stationed close to the area where the decedent fell, testifies that he was watching the track and never saw any contact between the decedent and the man. The man has moved for judgment as a matter of law.","q":"Should the court grant the motion?","ru":"State tax OK if nondiscriminatory + not levied directly on the federal government.","options":[{"t":"No, because the executor's evidence is sufficient for the jury to find for the executor.","ok":false,"trap":false,"why":""},{"t":"No, because there is a credibility dispute for the jury to resolve.","ok":false,"trap":false,"why":""},{"t":"Yes, because a verdict for the executor would be against the great weight of the evidence.","ok":false,"trap":true,"why":"When a court considers whether to grant judgment as a matter of law, the court is not to weigh the evidence but, rather, determine whether there is legally sufficient evidence to support a verdict for the party who bears the burden of proof at trial. Here, the nonmoving party, the executor, bears that burden but cannot present legally sufficient evidence, so judgment as a matter of law is proper."},{"t":"Yes, because the executor has presented insufficient evidence to support a verdict.","ok":true,"trap":false,"why":"When a court must decide whether to grant judgment as a matter of law, the court must determine, after it considers all the evidence introduced by both parties, whether there is legally sufficient evidence to support a judgment for the nonmoving party. Fed. R. Civ. P. 50(a). Here, the executor, who bears the burden of proof, presented only the testimony of another bike rider who was not a true eyewitness to the decedent's accident, but who instead provided circumstantial evidence about what he saw before and after the accident. In contrast, the man provided three disinterested witnesses who testified that they never saw any contact between the man and the decedent. Because the testimony of the witnesses is not in actual conflict, and because the executor did not present legally sufficient evidence to support a verdict in the estate's favor, the motion should be granted."}],"_b":true,"plain":"A nondiscriminatory state sales tax that hits the contractor (not the federal government directly) is valid.","source":"adaptibar_import_filled.csv"},{"id":"CSV059","subj":"Constitutional Law","sub":"Relations Between Federal and State Governments","title":"Was the state's imposition of the sales tax constitutional in this situation?","scenario":"The federal government hired a private contractor to repair and maintain the roads in a national park located wholly within a state. In a written agreement, the government agreed to pay the contractor an annual fixed fee and to reimburse the contractor for all expenses associated with the work. The agreement provided that the contractor must pay for all materials and expenses from a special bank account into which the government would deposit required payments and reimbursements. The state collected a generally applicable sales tax from the contractor on materials purchased for the work with money from the special bank account.","q":"Was the state's imposition of the sales tax constitutional in this situation?","ru":"Adverse-possession/limitations clock starts at the wrongful use — count from there.","options":[{"t":"No, because the federal government is immune from any taxes levied by a state.","ok":false,"trap":false,"why":""},{"t":"No, because the tax was paid from an account directly funded with federal money and the entire economic cost of the tax was borne by the federal government.","ok":false,"trap":false,"why":""},{"t":"Yes, because payment of the tax did not unduly interfere with the contractor's performance of the work and was not an undue burden on a federal function.","ok":false,"trap":false,"why":""},{"t":"Yes, because the tax did not discriminate against the federal government or its contractors, and the materials were purchased by the contractor rather than by the federal government.","ok":true,"trap":false,"why":"A state tax is valid if it is nondiscriminatory and does not apply directly to the federal government. United States v. California, 507 U.S. 746 (1993). Here, the state tax is nondiscriminatory and did not apply directly to the federal government because the materials were purchased by the contractor."}],"_b":true,"plain":"The 10-year limitations clock started when the city began non-park use 17 years ago and ran out, so she lost title before death and nothing passed to her son.","source":"adaptibar_import_filled.csv"},{"id":"CSV060","subj":"Real Property","sub":"Titles","title":"What is the most likely explanation for the court's decision?","scenario":"Twenty years ago, a woman conveyed land to a city so long as the city used the land \"for park purposes.\" The deed was promptly recorded. Seventeen years ago, the city discontinued using the land as a park. Because the city needed additional parking for nearby city buildings, it paved the land and has used it as a parking lot ever since. The period of time to acquire title by adverse possession in the jurisdiction is 10 years. Last year, the woman died intestate, leaving a son as her only heir. The son sued the city, claiming ownership of the land, but the court found against him.","q":"What is the most likely explanation for the court's decision?","ru":"Nondiscriminatory law = Pike balancing; minimal burden < strong safety interest = valid.","options":[{"t":"The city acquired the land by adverse possession.","ok":true,"trap":false,"why":"The 10-year statute of limitations began to run 17 years ago when the city began using the land for nonpark purposes, a use it continued for more than the statutory 10-year period. The woman failed to sue the city in a timely manner after the city stopped using the land for a park. Thus, when the woman died, she no longer owned the land and no interest passed to her son."},{"t":"The son's interest ended as a result of the changing needs of the city.","ok":false,"trap":false,"why":""},{"t":"The son's interest lapsed on the death of the woman.","ok":false,"trap":false,"why":""},{"t":"The woman retained no interest in the land after she conveyed it to the city.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A nondiscriminatory law can still fail if its burden on interstate commerce clearly outweighs the state interest; here the burden is minimal vs. safety interest, so it's valid.","source":"adaptibar_import_filled.csv"},{"id":"CSV061","subj":"Torts","sub":"Negligence","title":"How should the judge rule?","scenario":"A recently installed elevator suddenly started free-falling down the elevator shaft while carrying passengers. Frightened, a passenger pried the inside doors open and impulsively stuck his arm through them to try to stop the fall. As a result, his arm was broken. The elevator eventually stopped without causing further injuries. In a negligence action brought by the injured passenger against the company that installed and maintained the elevator, the injured passenger has asked the trial judge to instruct the jury that it may find the company negligent on a theory of res ipsa loquitur. In response, the company has argued that the passenger's conduct caused his injuries.","q":"How should the judge rule?","ru":"Plaintiff's negligence affects damages, not the availability of res ipsa.","options":[{"t":"The judge should deny the passenger's request, because it is possible that the company was not negligent.","ok":false,"trap":false,"why":""},{"t":"The judge should deny the passenger's request, because the jury could find that the conduct of the passenger contributed to his injuries.","ok":false,"trap":true,"why":"The passenger's negligence is relevant to the damages awarded, if any, but it is not a bar to a res ipsa instruction."},{"t":"The judge should grant the passenger's request but should also instruct the jurors to consider any carelessness of the passenger in awarding damages if they find the company liable.","ok":true,"trap":false,"why":"The question of the passenger's negligence is relevant to the jury's assessment of damages but is not a bar to a res ipsa loquitur instruction. Under res ipsa, where the facts strongly indicate that the plaintiff's injuries resulted from the defendant's negligence, the trier of fact may be permitted to infer that the defendant was probably negligent. This approach allows the jury to skip over the typical negligence analysis of duty and breach of duty and allows the defendant's negligence to be presumed."},{"t":"The judge should grant the passenger's request, because the passenger acted reasonably considering the stress of the situation.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The passenger's own negligence goes to damages, not to whether res ipsa applies, so the instruction is still proper.","source":"adaptibar_import_filled.csv"},{"id":"CSV062","subj":"Civil Procedure","sub":"Jury Trials","title":"Should the judge consider the objection?","scenario":"A consumer brought a federal diversity action against a manufacturer, seeking damages for products liability claims. In its answer, the manufacturer included the affirmative defense of contributory negligence. Applicable state law had recently abolished contributory negligence as a defense in such actions. Before trial, the judge allowed the parties to submit proposed jury instructions. The manufacturer's attorney proposed an instruction that the jury should not return a verdict for the consumer if it found that the consumer had been contributorily negligent. After the close of the evidence, the judge told the parties that he would give the contributory negligence instruction. The consumer's attorney did not object. The judge instructed the jury. After the jury began their deliberations, the consumer's attorney objected to the contributory negligence instruction.","q":"Should the judge consider the objection?","ru":"Wrong-law jury instruction = plain error; preservation not required.","options":[{"t":"No, because the consumer's attorney did not object before the judge gave the instruction.","ok":false,"trap":false,"why":""},{"t":"No, because the consumer's attorney did not object when the judge gave the instruction.","ok":false,"trap":true,"why":"If the error referenced in the objection is plain error, the attorney's failure to object at the time the judge gave the contributory negligence instruction is not an obstacle to the judge considering the objection. Here, the error is plain and the fact that the claim of error was not properly preserved is irrelevant."},{"t":"Yes, because the fact that the judge gave the inapplicable instruction constituted plain error that affected the consumer's substantial rights.","ok":true,"trap":false,"why":"The applicable state law does not recognize contributory negligence as a defense to this kind of claim, so instructing the jury on contributory negligence and allowing that instruction to stand will affect the consumer's substantive rights by permitting the consumer to lose the case based on an erroneous statement of the law. The inclusion of the instruction thus constitutes plain error. Further, a plain error that affects substantive rights does not require the claim of error to be properly preserved, so the untimely objection is not outcome determinative. Fed. R. Evid. 103(e)."},{"t":"Yes, because the consumer's attorney objected within 28 days after the judge gave the instruction.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A jury charge stating the wrong substantive law is plain error, so the untimely objection can still be considered.","source":"adaptibar_import_filled.csv"},{"id":"CSV063","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"Should the court grant the motion to suppress?","scenario":"Police officers responding to phone calls of complaining neighbors noticed several broken windows in a home, glass on the ground, and a blood-stained shirt on the front porch. Through a window, the officers saw a man, whose hands were bleeding, shouting and throwing things, but no one else appeared to be present in the home. When the officers knocked on the door, the man refused to respond. The officers then asked if he needed medical assistance. The man told them to leave and not come back unless they had a warrant. The officers then entered the home, and the man pointed a shotgun at them. The officers withdrew but later arrested the man for felony assault on a police officer. Alleging that the warrantless entry violated the Fourth Amendment, the man has moved to suppress the officers' testimony at trial.","q":"Should the court grant the motion to suppress?","ru":"Emergency aid exception = reasonable belief someone needs help -> warrantless entry OK.","options":[{"t":"No, because the man lacks standing to complain of an entry under the emergency aid exception to the Fourth Amendment.","ok":false,"trap":false,"why":""},{"t":"No, because the warrantless entry was reasonable under the emergency aid exception to the Fourth Amendment.","ok":true,"trap":false,"why":"The emergency aid exception to the warrant requirement allows officers to enter in order to render emergency assistance to an occupant or to protect an occupant from imminent injury. On these facts, the officers could reasonably believe that a warrantless entry was necessary to keep the man from harming himself or others who may have been in the home. When the officers entered, they did not know whether another person was in the home, nor did they know whose blood was on the shirt. Consequently, the warrantless entry was reasonable. See Michigan v. Fisher, 558 U.S. 45 (2009)."},{"t":"Yes, because officers cannot use the emergency aid exception to justify a warrantless entry when only the suspect himself needs aid.","ok":false,"trap":true,"why":"This answer is incorrect for two reasons. First, the emergency aid exception can justify a warrantless entry when the suspect is the only person who needs aid. Second, the officers could have reasonably believed that the suspect was not the only person who needed aid since they did not know if anyone else was in the home."},{"t":"Yes, because the emergency aid exception does not apply when a homeowner clearly and unambiguously invokes his right to a warrant.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Officers facing blood and an unknown number of occupants could enter without a warrant under the emergency-aid exception.","source":"adaptibar_import_filled.csv"},{"id":"CSV064","subj":"Constitutional Law","sub":"Relations Between Federal and State Governments","title":"Are the state's requirements constitutional when applied to a wholly interstate carrier?","scenario":"A state law requires every motor carrier hauling goods on the state's highways to register with and obtain a permit from the state's transportation commission. The purpose of this requirement is to facilitate application of the state's valid police, welfare, and safety regulations to carriers using the state's highways. The fee for registration is nominal, and the commission has no discretion to deny a permit to a carrier that properly registers and pays the registration fee.","q":"Are the state's requirements constitutional when applied to a wholly interstate carrier?","ru":"Minimal burden + real state safety interest = passes Dormant Commerce Clause.","options":[{"t":"No, because neither a carrier's registration nor its payment of a nominal fee is necessary to facilitate the application of state laws to motor carriers.","ok":false,"trap":false,"why":""},{"t":"No, because the requirements impose an undue burden on interstate commerce.","ok":false,"trap":false,"why":""},{"t":"Yes, because the requirements apply equally to interstate and intrastate carriers and are the only prerequisites to the issuance of the permit.","ok":true,"trap":false,"why":"A nondiscriminatory state law may be unconstitutional if the burden on interstate commerce clearly outweighs the state's interest in regulation. Here, the burden on interstate commerce is minimal compared with the state's interest in applying its police, welfare, and safety regulations. Lloyd A. Fry Roofing Co. v. Wood, 344 U.S. 157 (1952). Therefore, the state law does not discriminate against interstate commerce and is constitutional."},{"t":"Yes, because the requirements are the least restrictive means of serving the state's compelling interest in highway safety.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A nondiscriminatory regulation with only a minimal burden on an interstate carrier survives Dormant Commerce Clause balancing.","source":"adaptibar_import_filled.csv"},{"id":"CSV065","subj":"Contracts","sub":"Remedies","title":"Which of the following statements correctly describes the firm's legal rights, if any, against the first subcontractor?","scenario":"An engineering firm submitted a bid to a municipality for the construction of a new wastewater treatment plant. The firm's bid included a subcontractor's bid to complete the electrical work on the plant for $100,000. The municipality awarded the construction contract to the firm. Later that day, before the firm told the subcontractor of the award, the subcontractor told the firm that it was withdrawing its bid because it had recently undertaken a new project that would absorb all its capacity for the next 18 months. The firm nevertheless accepted the subcontractor's bid and demanded that it perform the electrical work on the plant, but the subcontractor refused. The firm had to hire another subcontractor to perform the electrical work, at a cost of $115,000. The firm completed the construction of the plant at a profit.","q":"Which of the following statements correctly describes the firm's legal rights, if any, against the first subcontractor?","ru":"General relied on sub's bid = bid irrevocable (option by detrimental reliance, Drennan).","options":[{"t":"The firm is entitled to recover nominal damages only, because it completed the construction at a profit.","ok":false,"trap":false,"why":""},{"t":"The firm is entitled to recover reliance damages, because it detrimentally relied on the first subcontractor's bid when it submitted its own bid to the municipality.","ok":false,"trap":true,"why":"The most appropriate measure of recovery for the subcontractor's breach is expectation damages, not reliance damages."},{"t":"The firm is entitled to recover expectation damages, because the first subcontractor's bid was irrevocable for a reasonable time and the firm timely accepted it.","ok":true,"trap":false,"why":"An offeror may generally revoke an offer up until the moment of acceptance, however, detrimental reliance by the offeree can transform an offer into an option contract. When the offeror could reasonably expect that the offeree would rely to their detriment on the offer, and the offeree does so rely, the offer will be held irrevocable as an option for a reasonable length of time. Restatement (Second) of Contracts § 87; Drennan v. Star Paving, 51 Cal. 2d 409, 333 P.2d 757 (1958). Here, the subcontractor knew that the firm would rely on the offer in making a bid for the municipality's project. Additionally, the subcontractor knew that the firm could not accept its offer until the municipality accepted the firm's overall bid on the project. Since the subcontractor could not revoke its bid, its attempt at revocation was ineffective, and the bid was still open at the time the firm accepted it. Therefore, a contract was formed, and the best remedy for the breach is expectation damages."},{"t":"The firm has no rights against the first subcontractor, because the first subcontractor was free to revoke its bid at any time before the firm accepted that bid.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A sub's bid that the general predictably relied on becomes irrevocable as an option for a reasonable time (Drennan).","source":"adaptibar_import_filled.csv"},{"id":"CSV066","subj":"Real Property","sub":"Mortgages","title":"Who is correct?","scenario":"A man borrowed money from a bank to finance the purchase of a commercial building. The man signed a promissory note, which was secured by a mortgage on the building. Because the man had few other unencumbered assets, the bank required additional security. The man's mother granted the bank a mortgage on a motel that she owned, but she did not sign a promissory note. Both mortgages were promptly recorded. Five years later, after real estate values had dropped considerably, the man defaulted on the loan from the bank. After acceleration, the bank initiated foreclosure proceedings against both the commercial building and the motel owned by the mother. The mother timely objected to the foreclosure proceedings against the motel. The bank responded that it had the right to include both the commercial building and the motel in the foreclosure proceedings.","q":"Who is correct?","ru":"Mortgagor need not be the debtor — third party can pledge their land.","options":[{"t":"The bank, because the motel was voluntarily mortgaged to secure the man's debt.","ok":true,"trap":false,"why":"As a person may mortgage their land to secure the debt of another person, the mortgagor need not necessarily be the debtor. Here, the bank has the right to foreclose on both properties because the man's mother granted the bank a mortgage on the motel she owned."},{"t":"The bank, because the mother is personally liable on any loan secured by the mortgage on the motel.","ok":false,"trap":false,"why":""},{"t":"The mother, because she did not sign a promissory note.","ok":false,"trap":false,"why":""},{"t":"The mother, because the bank does not hold an enforceable mortgage on the motel.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"You can mortgage your own land to secure someone else's debt, so the bank can foreclose on the mother's motel.","source":"adaptibar_import_filled.csv"},{"id":"CSV067","subj":"Evidence","sub":"Presentation of Evidence","title":"Should the court admit the investigator's testimony about the witness's out-of-court statement?","scenario":"A plaintiff sued a defendant for injuries she allegedly received when she slipped and fell while shopping in the defendant's grocery store. At trial, the plaintiff calls as a witness another shopper who testifies that she saw the plaintiff slip and fall on an oily substance on the floor of the store. On cross-examination, the defendant's attorney asks: \"Isn't it true that you told an investigator one week after the accident that you did not see [the plaintiff] fall?\" The witness denies making the statement. Later in the trial, the defendant's attorney calls the investigator, who offers to testify that the witness told him, \"I never saw [the plaintiff] fall.\" The plaintiff objects to admission of the investigator's testimony about the witness's out-of-court statement.","q":"Should the court admit the investigator's testimony about the witness's out-of-court statement?","ru":"Prior inconsistent statement: give chance to explain, then extrinsic evidence to impeach (613(b)).","options":[{"t":"No, because the statement is inadmissible hearsay not within any hearsay exception.","ok":false,"trap":false,"why":""},{"t":"No, because the witness denied making the statement.","ok":false,"trap":false,"why":""},{"t":"Yes, to prove that the plaintiff did not fall and to impeach the witness.","ok":false,"trap":false,"why":""},{"t":"Yes, but only for the limited purpose of impeaching the witness's trial testimony.","ok":true,"trap":false,"why":"The defense may offer extrinsic evidence of a witness's prior inconsistent statement for the limited nonhearsay purpose of impeaching the witness after the witness has been given an opportunity to explain or deny the statement. See Fed R. Evid. 613(b)."}],"_b":true,"plain":"After the witness had a chance to explain or deny, extrinsic evidence of a prior inconsistent statement comes in to impeach (not for truth).","source":"adaptibar_import_filled.csv"},{"id":"CSV068","subj":"Torts","sub":"Negligence","title":"Assuming that the store has raised an assumption-of-risk defense and that both sides have filed summary judgment motions based on the facts set out above, how should the trial court rule?","scenario":"A delivery driver backed her truck up to the loading dock of a large home improvement store. Although it was not her job to unload the truck, the driver would sometimes open the truck's rear doors after parking it in position. On this occasion, when the driver was about to open the rear doors, she observed through the doors' windows that some large boxes appeared to be pressed against the doors. At that point, she sought assistance. Two people who were on the loading dock responded to her request: the store's shipping manager and the manager's adult friend who was a former employee of the store and was visiting to catch up with the manager. The driver and the friend stood back as the manager opened the doors; no boxes fell out. With the doors open, all three observed a nylon rope that ran tightly across some of the boxes near the doors. As the manager began to cut through the rope, the driver, who with the friend remained at a distance, said, \"Are you sure you want to do that?\" A moment later, the friend noticed that the padlock from the truck's rear doors had fallen to the dock floor between him and the truck. Without saying anything to the manager or the driver, the friend took several steps forward to retrieve the lock. At that instant, the manager succeeded in cutting the rope, and the boxes that had been held in place by the rope fell and hit the friend's head, injuring him. The friend has sued the store for negligence. The jurisdiction has a system of modified comparative fault but also recognizes assumption of risk as a distinct and complete defense.","q":"Assuming that the store has raised an assumption-of-risk defense and that both sides have filed summary judgment motions based on the facts set out above, how should the trial court rule?","ru":"Assumption of risk vs. comparative fault = jury question -> no summary judgment either way.","options":[{"t":"The court should enter judgment as a matter of law for the friend.","ok":false,"trap":false,"why":""},{"t":"The court should deny both motions.","ok":true,"trap":false,"why":"The court should deny both motions because whether the friend's conduct amounts to an implied assumption of risk, which would defeat liability entirely, or comparative fault, which would potentially allow for partial recovery, is a jury question not suitable for determination by a summary judgment motion."},{"t":"The court should rule that the friend's action fails as a matter of law because he implicitly assumed the risk of the manager's carelessness.","ok":false,"trap":false,"why":""},{"t":"The court should rule that the friend's action fails as a matter of law because no reasonable jury would find him less at fault than the manager.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Whether the friend's conduct is implied assumption of risk (total bar) or just comparative fault is a jury question, so deny both motions.","source":"adaptibar_import_filled.csv"},{"id":"CSV069","subj":"Civil Procedure","sub":"Motions","title":"Which option best achieves the woman's goal?","scenario":"A woman brought a federal diversity action against a doctor and a hospital for medical malpractice. After both defendants answered, the doctor filed a motion for summary judgment, attaching numerous exhibits that contradicted the facts alleged in the complaint. The woman has decided that she is not ready to proceed with the action. She would like to dismiss the action, with the intent to refile at a later date.","q":"Which option best achieves the woman's goal?","ru":"After the answer, voluntary dismissal needs a 41(a)(2) motion (presumptively w/o prejudice).","options":[{"t":"File a motion for voluntary dismissal without prejudice.","ok":true,"trap":false,"why":"Voluntary dismissal in federal court is subject to Rule 41(a) of the Federal Rules of Civil Procedure (FRCP). Rule 41(a)(2) permits a plaintiff to obtain a voluntary dismissal by filing a motion with the court seeking dismissal by court order. A dismissal order under FRCP 41(a)(2) is presumptively without prejudice, consistent with the woman's goal of refiling the action at a later date."},{"t":"File a notice of dismissal without prejudice.","ok":false,"trap":false,"why":""},{"t":"Obtain a stipulation of dismissal without prejudice from the doctor.","ok":false,"trap":false,"why":""},{"t":"Submit an affidavit that she cannot yet present facts essential to her claim.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Because the defendant already answered, she can't use a notice of dismissal; she needs a court-ordered voluntary dismissal, which is presumptively without prejudice.","source":"adaptibar_import_filled.csv"},{"id":"CSV070","subj":"Constitutional Law","sub":"Individual Rights","title":"How should the court rule?","scenario":"For many years, a city owned and operated a reservoir that supplied the city's residents with water. Based on a finding that private entities were more efficient operators of such facilities than public entities, the city sold the reservoir to a privately owned company. The city council granted the company a non-exclusive franchise to supply water to residents of the city. After it had operated the water system for a year, the company determined that a city resident had fallen three months behind in the payment of his water bill. The company terminated the resident's water service on the basis of a company policy that provides for the summary termination of service to customers who fall more than two months behind in the payment of their bills. The policy does not provide customers an opportunity for a hearing before the termination of service. The resident sued the company in an appropriate court, asking for injunctive relief and damages. The resident claimed only that he had been deprived of property without due process of law in violation of the Fourteenth Amendment.","q":"How should the court rule?","ru":"Heavy regulation / public service alone =/= state action (need significant state involvement).","options":[{"t":"Dismiss the action, because the company is not a state actor for purposes of the Fourteenth Amendment.","ok":true,"trap":false,"why":"For the action of a private entity to satisfy the \"state action\" requirement, the state must be \"significantly involved\" in the private entity. The fact that the company supplies a very important good to the public and received a non-exclusive franchise from the city is insufficient to make it a state actor. See Jackson v. Metropolitan Edison Co., 419 U.S. 345 (1974)."},{"t":"Dismiss the action, because the resident has not proffered payment of any of his arrearage to the company and therefore has no right to continued water service.","ok":false,"trap":false,"why":""},{"t":"Order the company to give the resident an opportunity for a hearing, because the Fourteenth Amendment applies to private entities performing public functions.","ok":false,"trap":false,"why":""},{"t":"Order the company to give the resident an opportunity for a hearing, because the Fourteenth Amendment applies to private franchises granted by public entities.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Supplying an important public good under a non-exclusive city franchise doesn't make a company a state actor.","source":"adaptibar_import_filled.csv"},{"id":"CSV071","subj":"Contracts","sub":"Defenses to Enforceability","title":"Is the lender entitled to cancel disbursement of the funds and rescind the loan agreement?","scenario":"A man needed a loan to purchase a business. The man submitted to a lender a loan application that included a thenaccurate statement of his financial condition. The lender reviewed the application and concluded that the man was creditworthy without verifying any of his information. A week after the man submitted his application, however, his financial condition changed significantly for the worse. The man did not report this change to the lender. Two days later, the lender approved the loan, and the man and the lender signed a loan agreement. Before disbursing the loan funds, the lender learned of the change in the man's financial condition.","q":"Is the lender entitled to cancel disbursement of the funds and rescind the loan agreement?","ru":"Half-truth/changed circumstances = duty to disclose; silence then = misrepresentation.","options":[{"t":"No, because the lender failed to independently assess the man's financial condition before signing the loan agreement.","ok":false,"trap":false,"why":""},{"t":"No, because the man did not affirmatively misrepresent his financial condition at any time.","ok":false,"trap":false,"why":""},{"t":"Yes, because the man concealed the change in his financial condition.","ok":false,"trap":false,"why":""},{"t":"Yes, because after his financial situation changed, the man was obligated to disclose facts necessary to prevent his previous statement of his financial condition from being a misrepresentation.","ok":true,"trap":false,"why":"Nondisclosure of a fact is the equivalent of a misrepresentation when a person knows that disclosure of the fact is necessary to prevent some previous assertion from being a misrepresentation. Here, the man was obligated to disclose facts necessary to prevent his previous statements regarding his financial condition from being a misrepresentation."}],"_b":true,"plain":"Staying silent about new facts is a misrepresentation when disclosure is needed to keep an earlier statement from becoming false.","source":"adaptibar_import_filled.csv"},{"id":"CSV072","subj":"Evidence","sub":"Privileges and Other Policy Exclusions","title":"Can the lawyer be compelled to disclose the client's identity to the grand jury?","scenario":"A lawyer was called to testify before a grand jury that was investigating a hit-and-run accident. A security guard at the lawyer's office had testified earlier that on the date of the accident he had seen a person leave the lawyer's office at around 7 p.m., get into a car, and strike a pedestrian while driving out of the parking lot without stopping afterward. The lawyer was asked to disclose the identity of the person who left his office around 7 p.m. on the date of the accident. The lawyer stated that the person was a client but refused to disclose the client's identity, citing the attorneyclient privilege.","q":"Can the lawyer be compelled to disclose the client's identity to the grand jury?","ru":"Attorney-client privilege protects communications, not the bare fact of a client's identity.","options":[{"t":"No, because the identity of a lawyer's client is protected by the attorney-client privilege.","ok":false,"trap":false,"why":""},{"t":"No, because the lawyer's testimony would undermine the client's privilege against selfincrimination.","ok":false,"trap":false,"why":""},{"t":"Yes, because the identity of a lawyer's client is not privileged when disclosure would not reveal a confidential attorney-client communication.","ok":true,"trap":false,"why":"Disclosing the client's identity to the grand jury would not reveal anything about the communications between the client and the lawyer. Therefore, the attorney-client privilege does not apply, and the lawyer can be compelled to make the disclosure."},{"t":"Yes, because the rules of evidence do not apply at a grand jury proceeding.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Revealing just the client's identity doesn't expose any confidential communication, so the privilege doesn't shield the name.","source":"adaptibar_import_filled.csv"},{"id":"CSV073","subj":"Criminal Law","sub":"Constitutional Protection of Accused Persons","title":"Did the collection of the data violate the Fourth Amendment?","scenario":"Over the course of a year, police in a small town received complaints about vandalism in public parks. They connected the incidents because the vandal left specific graffiti at each site, and investigation provided the police with a reasonable suspicion that the perpetrator was a specific local resident. Using an online directory that the resident had joined, the police obtained the resident's cell-phone number. The police then subpoenaed the cell-phone provider to provide one year of historical cell-phone site-location data. The data showed that for each incident, the resident's cell phone had been in the vicinity of the vandalized property. The resident was charged with multiple counts of destruction of property. Defense counsel has moved to exclude the cell-phone site-location data, arguing that its collection violated the Fourth Amendment.","q":"Did the collection of the data violate the Fourth Amendment?","ru":"Extensive historical cell-site location = warrant required (Carpenter).","options":[{"t":"No, because a person has no reasonable expectation of privacy in information shared with a third party.","ok":false,"trap":false,"why":""},{"t":"No, because the subpoena was based on a cell-phone number that the resident had voluntarily placed in the public domain.","ok":false,"trap":false,"why":""},{"t":"Yes, because a subpoena must be based on probable cause.","ok":false,"trap":false,"why":""},{"t":"Yes, because a warrant is required to collect such extensive historical cell-phone sitelocation data.","ok":true,"trap":false,"why":"A warrant is required to collect extensive historical site-location data from a cell-phone provider. Carpenter v. United States, 138 S. Ct. 2206 (2018). Here, the data sought was one year's worth of site-location information, which clearly falls within the rule of Carpenter. In addition, Carpenter rejected the use of a subpoena to circumvent this warrant requirement. Thus, the police's collection of the extensive cell-phone data was a violation of the Fourth Amendment."}],"_b":true,"plain":"Pulling a year of cell-site location data needs a warrant; a subpoena won't do (Carpenter).","source":"adaptibar_import_filled.csv"},{"id":"CSV074","subj":"Real Property","sub":"Rights in Land","title":"Who will likely prevail?","scenario":"A man owned an oceanfront cottage. A woman owned land across the street that did not have direct ocean access. For $10,000, the man executed a deed titled \"Grant of Pedestrian Right-of-Way\" to the woman and \"her heirs and assigns\" over a designated strip of his land between the street and the ocean. The deed was never recorded. Several years later, the woman sold her land. The woman made no mention of the easement, and the buyer had no actual notice of it. After the buyer took possession of the land, neighbors informed her about the pedestrian easement over the man's land, but when the buyer attempted to use the easement, the man informed her that it was no longer available and constructed a chain-link fence to block the way. The buyer promptly sued the man to establish her right to use the easement.","q":"Who will likely prevail?","ru":"Easement appurtenant runs with the land; buyer's lack of notice is irrelevant.","options":[{"t":"The buyer, because the easement was appurtenant to her land.","ok":true,"trap":false,"why":"An easement appurtenant passes with the title to the dominant estate, and the new buyer of the dominant estate receives the benefit of the easement. Here, the man granted an express easement to the woman \"and her heirs and assigns.\" It is irrelevant that the buyer had no actual notice of the easement when she bought the land."},{"t":"The buyer, because the man received $10,000.","ok":false,"trap":false,"why":""},{"t":"The man, because the buyer purchased the land without notice.","ok":false,"trap":false,"why":""},{"t":"The man, because the easement was an easement in gross personal to the woman who previously owned the land.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"An easement appurtenant runs with the dominant land to a new owner, even one with no actual notice.","source":"adaptibar_import_filled.csv"},{"id":"CSV075","subj":"Torts","sub":"Intentional Torts","title":"Does the man have a claim against the bystander?","scenario":"An intoxicated man who was standing on a fifth-floor apartment balcony threatened to jump off the building. A bystander pulled the man back into the building, pushed him into a bedroom, and locked the bedroom door from the outside. When the man became sober, the bystander released him from the bedroom.","q":"Does the man have a claim against the bystander?","ru":"Reasonable force to prevent imminent self-harm is privileged — no battery/false imprisonment claim.","options":[{"t":"Yes, for battery, because the bystander pushed the man into the bedroom.","ok":false,"trap":false,"why":""},{"t":"Yes, for false imprisonment, because the bystander locked the man in the bedroom.","ok":false,"trap":false,"why":""},{"t":"Yes, for both battery and false imprisonment.","ok":false,"trap":false,"why":""},{"t":"No, because the bystander was privileged to act as he did.","ok":true,"trap":false,"why":"A person is privileged to use reasonable force to protect another against imminent harm. The privilege includes preventing self-inflicted harm. Here, the intoxicated man was on the verge of harming or killing himself. It was reasonable for the bystander to push the man and lock him in the bedroom until the danger had passed."}],"_b":true,"plain":"You may use reasonable force to stop someone from seriously harming himself, so pushing and confining the intoxicated man was privileged.","source":"adaptibar_import_filled.csv"},{"id":"CSV076","subj":"Civil Procedure","sub":"Verdicts and Judgments","title":"How should the court proceed?","scenario":"A homeowner brought a federal diversity action against a manufacturer of gas grills, asserting products liability claims and seeking damages for injuries she had suffered when her grill exploded as she was lighting it. The manufacturer timely demanded a jury trial, and the court informed the parties that it would seat a seven-person jury. The parties agreed to a non-unanimous jury verdict. The jury returned a verdict for the homeowner. The manufacturer asked the court to poll the jury, and the poll revealed a 4 to 3 vote in favor of the homeowner. The manufacturer objected to the verdict and has moved for a new trial.","q":"How should the court proceed?","ru":"Parties can stipulate to a non-unanimous civil jury verdict (FRCP 48).","options":[{"t":"Deny a new trial, because the manufacturer agreed to a non-unanimous verdict.","ok":true,"trap":false,"why":"Federal Rule of Civil Procedure (FRCP) 48 permits a non-unanimous jury verdict if stipulated to by the parties. Here, the manufacturer and the homeowner agreed to a non-unanimous verdict so the manufacturer's motion for a new trial should be denied."},{"t":"Direct the jury to deliberate further until it can return a verdict supported by at least six jurors.","ok":false,"trap":true,"why":"There is no need for the jury to deliberate further because both parties agreed to a non-unanimous verdict."},{"t":"Grant a new trial, because fewer than six jurors voted in favor of the homeowner.","ok":false,"trap":false,"why":""},{"t":"Grant a new trial, because the verdict was not unanimous.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"The parties stipulated to a non-unanimous verdict, which FRCP 48 allows, so deny the new-trial motion.","source":"adaptibar_import_filled.csv"},{"id":"CSV077","subj":"Evidence","sub":"Presentation of Evidence","title":"How should the judge rule on the prosecutor's objection?","scenario":"A defendant is charged with murder after allegedly shooting a victim during an argument in a crowded nightclub. At trial, the defendant claims self-defense, testifying that he shot the victim only after the victim lunged at him with a knife. In rebuttal, the prosecutor calls an eyewitness to testify that she observed the argument from a short distance away and that she heard a gunshot before the victim lunged at the defendant. Thereafter, the defendant seeks to call the bartender from the nightclub to testify that the eyewitness had consumed a large amount of alcohol before the shooting and that the music in the nightclub at the time of the shooting was extremely loud. The prosecutor objects that the bartender's testimony would be improper impeachment.","q":"How should the judge rule on the prosecutor's objection?","ru":"Impeaching perception/capacity = extrinsic evidence OK; that's not 608(b).","options":[{"t":"Allow the bartender's testimony about both the eyewitness's alcohol consumption and the music.","ok":true,"trap":false,"why":"Extrinsic evidence may be admitted to impeach testimony by raising questions about a witness's ability to perceive the events that transpired. Here, both the loud music and the witness's alcohol consumption at the time of the incident would undermine the eyewitness's ability to perceive and accurately recall the incident."},{"t":"Allow the bartender's testimony about the music but not about the eyewitness's alcohol consumption, because alcohol consumption is an improper basis for impeachment.","ok":false,"trap":false,"why":""},{"t":"Exclude the bartender's testimony about the music, because it does not impeach the eyewitness, but allow the testimony about the eyewitness's alcohol consumption.","ok":false,"trap":false,"why":""},{"t":"Exclude the bartender's testimony in its entirety, because extrinsic evidence is not admissible to impeach.","ok":false,"trap":true,"why":"Extrinsic evidence may be admitted to impeach a witness's ability to perceive. However, under Federal Rule of Evidence 608(b), such evidence is not admissible to prove a witness's prior acts of dishonesty. The evidence here relates to the eyewitness's ability to perceive accurately and not to any prior acts of dishonesty. Both items of extrinsic evidence should be admitted."}],"_b":true,"plain":"Loud music and the witness's drinking attack his ability to perceive, so extrinsic evidence is admissible (this isn't a 608(b) character-for-truthfulness issue).","source":"adaptibar_import_filled.csv"},{"id":"CSV078","subj":"Constitutional Law","sub":"Individual Rights","title":"Is the company likely to prevail?","scenario":"In order to ensure the high quality of tutors in state public schools, a state law requires public schools to hire only tutors licensed by the state. To obtain a license, a tutor is required to achieve a passing score on a state-administered exam in the tutor's area of specialty. On several occasions, an organization representing tutors licensed in the state has successfully lobbied against proposed legislation that would have eased the licensing requirement. An out-of-state tutoring company would like to conduct business in the state, but very few of its tutors are licensed by the state. The company has sued to challenge the law.","q":"Is the company likely to prevail?","ru":"No fundamental right + no suspect class = rational basis (deferential, almost always upheld).","options":[{"t":"No, because the law is rationally related to a legitimate state interest.","ok":true,"trap":false,"why":"The state licensing requirement should receive rational basis scrutiny because it neither burdens a fundamental individual right nor creates a constitutionally suspect classification. The licensing requirement is a rational means of protecting the state's legitimate interest in ensuring the competency of tutors. Therefore, the state law satisfies rational basis review and is constitutional."},{"t":"No, because the law is substantially related to an important state interest.","ok":false,"trap":true,"why":"This answer describes the more demanding standard of review, intermediate judicial scrutiny. The licensing requirement for tutors neither burdens a specially protected individual right nor creates a constitutionally sensitive classification and should receive rational basis review."},{"t":"Yes, because the law serves the special interests of licensed tutors rather than a legitimate government interest.","ok":false,"trap":false,"why":""},{"t":"Yes, because the law violates the privileges and immunities clause of Article IV.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"A tutor licensing rule burdens no fundamental right and no suspect class, so it gets rational basis and is constitutional.","source":"adaptibar_import_filled.csv"},{"id":"CSV079","subj":"Criminal Law","sub":"Homicide","title":"What is the most serious homicide offense, if any, of which the woman can properly be convicted?","scenario":"One evening, a woman was driving above the speed limit on a country road. As she rounded a sharp curve, she lost control of the car and crossed over to the shoulder on the other side of the road. Her car hit a truck that was parked on the shoulder with its hood up while its driver waited for a tow truck. The force of the collision threw the driver out of the truck and down an embankment. The driver died from his injuries. Driving above the speed limit and causing an accident can be charged as reckless driving, a misdemeanor in the jurisdiction.","q":"What is the most serious homicide offense, if any, of which the woman can properly be convicted?","ru":"No intent to kill + reckless/illegal act causing death = involuntary manslaughter.","options":[{"t":"Murder, based on malice aforethought.","ok":false,"trap":false,"why":""},{"t":"Voluntary manslaughter, based on reckless operation of a vehicle.","ok":false,"trap":true,"why":"Since the facts suggest the woman did not intend to kill the driver, she cannot be guilty of voluntary manslaughter."},{"t":"Involuntary manslaughter, based on the misdemeanor of reckless driving.","ok":true,"trap":false,"why":"On these facts, a jury may rationally find both that the woman was guilty of reckless driving and that her illegal conduct caused the truck driver's death. The woman's conduct constitutes involuntary manslaughter under a theory of \"misdemeanor-manslaughter.\""},{"t":"No homicide offense.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"She didn't intend to kill, so it's not voluntary manslaughter; reckless illegal driving causing death is involuntary (misdemeanor) manslaughter.","source":"adaptibar_import_filled.csv"},{"id":"CSV080","subj":"Contracts","sub":"Performance, Breach, and Discharge","title":"Is the owner likely to succeed in a breach of contract action?","scenario":"On March 1, an owner entered into a written contract to sell her car to a buyer for $15,000, with delivery and payment to occur on March 6. The buyer had previously declined to enter into an option contract to hold the owner's offer open until March 6. On March 3, the buyer emailed the owner to say that he might not have the $15,000 by March 6. The owner did not respond. On March 4, the owner sold the car to her neighbor for $13,000 and told the buyer that she planned to sue him for breach of contract to recover the difference in the purchase price.","q":"Is the owner likely to succeed in a breach of contract action?","ru":"Repudiation needs a CLEAR, unequivocal refusal — 'might not' isn't enough.","options":[{"t":"No, because the owner acted in bad faith by failing to respond to the buyer's email.","ok":false,"trap":false,"why":""},{"t":"No, because the owner anticipatorily repudiated her contract with the buyer.","ok":true,"trap":false,"why":"Anticipatory repudiation requires (1) an overt communication of an intention not to perform a contractual obligation or (2) an action that renders performance impossible or shows a party's determination not to perform. UCC § 2-610, cmt. 1. Here, the buyer did not anticipatorily repudiate because he merely said that he \"might not\" have the money to complete the transaction on March 6. Therefore, the owner anticipatorily repudiated by selling the car to the neighbor and will not succeed in a claim against the buyer for breach of contract."},{"t":"Yes, because the buyer anticipatorily repudiated his contract with the owner.","ok":false,"trap":false,"why":""},{"t":"Yes, because the buyer failed to protect himself when he did not accept the owner's offer to enter into an option contract.","ok":false,"trap":false,"why":""}],"_b":true,"plain":"Saying he 'might not' have the money isn't a clear refusal, so the buyer didn't repudiate; the seller repudiated by selling the car.","source":"adaptibar_import_filled.csv"},{"id":"CSV081","subj":"Civil Procedure","sub":"Motions","title":"How is the court likely to rule?","scenario":"A plaintiff domiciled in State A sued a defendant domiciled in State B, alleging that the defendant had failed to deliver products to the plaintiff under an ongoing contract. The plaintiff attached to the complaint an invoice for the products marked \"paid\" and a receipt for a wire transfer to the defendant in the amount of $80,000. The defendant answered the complaint, denying that the plaintiff had suffered any losses and asserting a counterclaim for nonpayment of $90,000 for an earlier delivery of products. In response to the counterclaim, the plaintiff has moved for judgment on the pleadings.","q":"How is the court likely to rule?","ru":"Judgment on the pleadings needs pleadings CLOSED — counterclaim means plaintiff must answer first (12(c)).","options":[{"t":"Deny the motion as premature, because the plaintiff has not yet answered the counterclaim.","ok":true,"trap":false,"why":"Under Federal Rule of Civil Procedure (FRCP) 12(c), a judgment on the pleadings may be made after the pleadings are closed. However, because the defendant in this case asserted a counterclaim in its answer, the plaintiff must file an answer to the counterclaim under FRCP 7(a)(3) before making any motions."},{"t":"Deny the motion, because a plaintiff that attaches items to the complaint cannot move for judgment on the pleadings.","ok":false,"trap":false,"why":""},{"t":"Grant the motion, because the defendant failed to cross-move.","ok":false,"trap":false,"why":""},{"t":"Grant the motion, because the defendant has not denied that it failed to deliver products after payment by the plaintiff.","ok":false,"trap":true,"why":"The fact that the defendant has not denied the alleged failure to deliver goods does not, in itself, support the grant of the motion. The plaintiff's motion for judgment on the pleadings seeks judgment not only on its primary claim for damages but also on the defendant's counterclaim for nonpayment. Because the plaintiff has not yet answered the counterclaim, the pleadings are not closed on that issue, and a judgment on the pleadings would be premature."}],"_b":true,"plain":"Because the defendant filed a counterclaim, the plaintiff must answer it before moving for judgment on the pleadings (pleadings aren't closed yet).","source":"adaptibar_import_filled.csv"},{"id":"CSV082","subj":"Real Property","sub":"Mortgages","title":"If the nephew sues the niece for contribution, who will likely prevail?","scenario":"A nephew and a niece inherited vacant land. The nephew soon discovered that the land was subject to a mortgage held by a local bank, which required monthly payments for the next 10 years. Without telling the niece or seeking her permission, the nephew paid the monthly mortgage payments for one year. The nephew then demanded immediate payment from the niece for half of the mortgage payments he had made. The niece refused.","q":"If the nephew sues the niece for contribution, who will likely prevail?","ru":"Cotenant who pays more than their share of the mortgage gets contribution.","options":[{"t":"The nephew, because of the doctrine of exoneration.","ok":false,"trap":false,"why":""},{"t":"The nephew, because without his payments, the bank could have foreclosed the mortgage and they could have lost the land.","ok":true,"trap":false
